 άλλους να σκεφτούν για μένα;"}, "en": {"t": "Have the courage to think", "tr": "Have the courage to use your own understanding!", "simple": "Kant wrote this sentence in a short essay on what “enlightenment” means. He said many people remain like children all their lives, not because they lack a mind, but because it is more comfortable to let others think for them. A book decides what we believe, the television what we fear, the neighbour what is right.\n\nThinking for ourselves takes courage, because we may be wrong or disagree with the many. It does not mean listening to no one. It means listening, asking “why?”, and deciding with our own judgement.", "life": "A woman kept receiving messages on her phone about “miracle” cures and frightening news, and forwarded them to everyone. Her grandson taught her to ask: “Who says so? Where is the proof?” Now she pauses before forwarding anything, and often discovers it was false. “I feel freer,” she says.", "am": "Say: “Today I will think with my own mind, calmly and with courage.”", "ex": "When you hear or read something striking today, stop and ask: “Who says so? Is it true? What do I think?”", "pm": "Where did I think for myself today? Where did I let others think for me?"}}, {"tag": ["🌍 Αν το έκαναν όλοι;", "🌍 What if everyone did it?"], "grc": "Handle nur nach derjenigen Maxime, durch die du zugleich wollen kannst, daß sie ein allgemeines Gesetz werde.", "src": ["Θεμελίωση της μεταφυσικής των ηθών (1785), AA IV 421", "Groundwork of the Metaphysics of Morals (1785), AA IV 421"], "el": {"t": "Το τεστ του «αν το έκαναν όλοι»", "tr": "Να ενεργείς μόνο σύμφωνα με έναν κανόνα που θα ήθελες να γίνει νόμος για όλους.", "simple": "Αυτή είναι η πιο γνωστή ιδέα του Καντ, και είναι πιο απλή απ’ ό,τι ακούγεται. Πριν κάνουμε κάτι, ρωτάμε: «Αν όλοι οι άνθρωποι έκαναν αυτό που κάνω τώρα, θα ήταν καλός ο κόσμος;» Αν όλοι πετούσαν σκουπίδια στον δρόμο, η πόλη θα γέμιζε βρωμιά. Αν όλοι έλεγαν ψέματα όποτε τους βόλευε, κανείς δεν θα εμπιστευόταν κανέναν.\n\nΤο τεστ αυτό μας προστατεύει από μια συνηθισμένη παγίδα: «Ένας είμαι, τι πειράζει;» Ο Καντ απαντά ότι κάθε πράξη μας είναι σαν μια ψήφος για το τι κόσμο θέλουμε.", "life": "Ένας νέος ήθελε να παρκάρει σε θέση για άτομα με αναπηρία, «μόνο για δύο λεπτά». Η μητέρα του τον ρώτησε: «Αν το έκαναν όλοι για δύο λεπτά, πού θα πάρκαρε ο κύριος με το αναπηρικό καροτσάκι;» Ο νέος έκανε άλλον έναν γύρο και βρήκε κανονική θέση.", "am": "Πείτε: «Σήμερα, πριν από κάθε μικρή απόφαση, θα ρωτήσω: “Αν το έκαναν όλοι;”»", "ex": "Εφαρμόστε σήμερα το τεστ σε τρεις μικρές αποφάσεις: πού πετάτε κάτι, πώς οδηγείτε, τι λέτε για κάποιον που λείπει.", "pm": "Ποια πράξη μου σήμερα θα έκανε τον κόσμο καλύτερο αν την έκαναν όλοι; Ποια όχι;"}, "en": {"t": "The “what if everyone did it” test", "tr": "Act only according to a rule that you could at the same time want to become a law for everyone.", "simple": "This is Kant’s best-known idea, and it is simpler than it sounds. Before doing something, we ask: “If everyone did what I am doing now, would the world be good?” If everyone threw litter in the street, the city would fill with filth. If everyone lied whenever it suited them, no one would trust anyone.\n\nThis test protects us from a common trap: “I’m only one person, what does it matter?” Kant answers that each of our acts is like a vote for the kind of world we want.", "life": "A young man wanted to park in a disabled space, “just for two minutes”. His mother asked him: “If everyone did it for two minutes, where would the gentleman in the wheelchair park?” He drove around once more and found an ordinary space.", "am": "Say: “Today, before every small decision, I will ask: ‘What if everyone did it?’”", "ex": "Apply the test today to three small decisions: where you throw something away, how you drive, what you say about someone who is not present.", "pm": "Which of my acts today would make the world better if everyone did it? Which would not?"}}, {"tag": ["🧑‍🤝‍🧑 Ο άνθρωπος ως σκοπός", "🧑‍🤝‍🧑 People as ends"], "grc": "Handle so, daß du die Menschheit, sowohl in deiner Person, als in der Person eines jeden andern, jederzeit zugleich als Zweck, niemals bloß als Mittel brauchest.", "src": ["Θεμελίωση της μεταφυσικής των ηθών (1785), AA IV 429", "Groundwork of the Metaphysics of Morals (1785), AA IV 429"], "el": {"t": "Κανείς δεν είναι απλό εργαλείο", "tr": "Να συμπεριφέρεσαι στον άνθρωπο, και στον εαυτό σου και σε κάθε άλλον, πάντα και ως σκοπό, ποτέ μόνο ως μέσο.", "simple": "Ο Καντ λέει ότι τα πράγματα τα χρησιμοποιούμε: ένα σφυρί, ένα αυτοκίνητο, ένα κινητό. Τους ανθρώπους όμως δεν πρέπει να τους χρησιμοποιούμε μόνο σαν εργαλεία για τους σκοπούς μας. Κάθε άνθρωπος έχει τους δικούς του σκοπούς, τα δικά του όνειρα, τη δική του αξία.\n\nΠροσέξτε τη λέξη «μόνο». Φυσικά χρειαζόμαστε ο ένας τον άλλον: ο υπάλληλος μάς εξυπηρετεί, ο γιατρός μάς φροντίζει. Το λάθος είναι να ξεχνάμε ότι πίσω από τον ρόλο υπάρχει ένας ολόκληρος άνθρωπος. Και ο Καντ προσθέτει: ούτε τον εαυτό μας πρέπει να τον βλέπουμε σαν μηχανή.", "life": "Ένας πελάτης φώναζε στην υπάλληλο του τηλεφωνικού κέντρου γιατί του είχαν χρεώσει λάθος λογαριασμό. Ξαφνικά σκέφτηκε: «Αυτή δεν φταίει, και είναι κάποιου κόρη, κάποιου μητέρα.» Ζήτησε συγγνώμη και συνέχισε ήρεμα. Η υπάλληλος τον βοήθησε με κάθε τρόπο και στο τέλος τού είπε: «Με κάνατε να χαμογελάσω σε μια πολύ δύσκολη μέρα.»", "am": "Πείτε: «Κάθε άνθρωπος που θα συναντήσω σήμερα είναι ολόκληρος κόσμος, όχι εργαλείο.»", "ex": "Σήμερα, σε κάθε άνθρωπο που σας εξυπηρετεί (στο ταμείο, στο τηλέφωνο, στον δρόμο), πείτε το όνομά του αν το ξέρετε, κοιτάξτε τον στα μάτια και πείτε ένα ζεστό «ευχαριστώ».", "pm": "Φέρθηκα σήμερα σε κάποιον σαν να ήταν μόνο ένα μέσο; Φέρθηκα έτσι και στον εαυτό μου;"}, "en": {"t": "No one is a mere tool", "tr": "Treat humanity, whether in yourself or in any other person, always also as an end, never merely as a means.", "simple": "Kant says we use things: a hammer, a car, a phone. But people must never be used merely as tools for our purposes. Every person has their own purposes, their own dreams, their own worth.\n\nNotice the word “merely”. Of course we need one another: the clerk serves us, the doctor cares for us. The mistake is to forget that behind the role is a whole human being. And Kant adds: we should not see ourselves as machines either.", "life": "A customer was shouting at a call-centre worker because his bill was wrong. Suddenly he thought: “It’s not her fault, and she is somebody’s daughter, somebody’s mother.” He apologised and carried on calmly. She helped him in every way and at the end said: “You made me smile on a very hard day.”", "am": "Say: “Every person I meet today is a whole world, not a tool.”", "ex": "Today, with every person who serves you (at the till, on the phone, in the street), use their name if you know it, look them in the eye and say a warm “thank you”.", "pm": "Did I treat someone today as if they were only a means? Did I treat myself that way?"}}, {"tag": ["💛 Η καλή θέληση", "💛 The good will"], "grc": "Es ist überall nichts in der Welt, ja überhaupt auch außer derselben zu denken möglich, was ohne Einschränkung für gut könnte gehalten werden, als allein ein guter Wille.", "src": ["Θεμελίωση της μεταφυσικής των ηθών (1785), AA IV 393", "Groundwork of the Metaphysics of Morals (1785), AA IV 393"], "el": {"t": "Το μόνο απόλυτα καλό", "tr": "Τίποτα σε όλο τον κόσμο, ούτε και έξω από αυτόν, δεν μπορούμε να το πούμε καλό χωρίς κανέναν περιορισμό, εκτός από μία καλή θέληση.", "simple": "Η εξυπνάδα, το θάρρος, ο πλούτος, ακόμη και η υγεία είναι καλά πράγματα. Ο Καντ όμως παρατηρεί ότι όλα αυτά μπορούν να γίνουν και κακά: ένας έξυπνος απατεώνας, ένας γενναίος κακοποιός, ένας πλούσιος σκληρός. Μόνο ένα πράγμα είναι καλό πάντα: η καλή θέληση, δηλαδή η ειλικρινής πρόθεση να κάνουμε το σωστό.\n\nΑυτό είναι πολύ παρήγορο. Δεν κρίνεται η αξία μας από το αν πέτυχαν πάντα οι προσπάθειές μας. Αν θελήσαμε αληθινά το καλό και κάναμε ό,τι μπορούσαμε, ακόμη κι αν τα πράγματα δεν πήγαν όπως ελπίζαμε, η καλή μας θέληση «λάμπει σαν κόσμημα», όπως λέει ο ίδιος.", "life": "Ένας νέος έτρεξε να βοηθήσει έναν ηλικιωμένο που λιποθύμησε στον δρόμο. Έκανε ό,τι μπορούσε μέχρι να έρθει το ασθενοφόρο, αλλά στενοχωριόταν ότι «δεν ήξερε αρκετά». Ο γιατρός τού είπε: «Ήσουν ο μόνος που σταμάτησε. Αυτό είναι το πιο σημαντικό από όλα.»", "am": "Πείτε: «Σήμερα θα κρατήσω καθαρή την πρόθεσή μου. Το αποτέλεσμα δεν είναι όλο στα χέρια μου.»", "ex": "Κάντε σήμερα μια καλή πράξη μόνο επειδή είναι σωστή, χωρίς να περιμένετε ευχαριστώ ή αναγνώριση. Μετά παρατηρήστε πώς νιώθετε.", "pm": "Ποια ήταν η πρόθεσή μου σε όσα έκανα σήμερα; Υπήρξε κάτι που, αν και δεν πέτυχε, το έκανα με καλή θέληση;"}, "en": {"t": "The only thing good without limit", "tr": "Nothing in the world, indeed nothing even beyond it, can be thought good without limitation, except a good will.", "simple": "Intelligence, courage, wealth, even health are good things. But Kant observes that all of them can also become bad: a clever swindler, a brave criminal, a cruel rich man. Only one thing is always good: a good will, that is, the sincere intention to do what is right.\n\nThis is very comforting. Our worth is not judged by whether our efforts always succeeded. If we truly willed the good and did what we could, even if things did not turn out as we hoped, our good will “shines like a jewel”, as he says himself.", "life": "A young man rushed to help an old man who had fainted in the street. He did all he could until the ambulance came, but was upset that he “didn’t know enough”. The doctor told him: “You were the only one who stopped. That is the most important thing of all.”", "am": "Say: “Today I will keep my intention pure. The result is not entirely in my hands.”", "ex": "Do a good deed today only because it is right, without expecting thanks or recognition. Then notice how you feel.", "pm": "What was my intention in what I did today? Was there something that, though it did not succeed, I did with good will?"}}, {"tag": ["💎 Αξιοπρέπεια", "💎 Dignity"], "grc": "Im Reiche der Zwecke hat alles entweder einen Preis, oder eine Würde.", "src": ["Θεμελίωση της μεταφυσικής των ηθών (1785), AA IV 434", "Groundwork of the Metaphysics of Morals (1785), AA IV 434"], "el": {"t": "Τιμή ή αξιοπρέπεια", "tr": "Τα πάντα έχουν είτε μια τιμή είτε μια αξιοπρέπεια.", "simple": "Ο Καντ εξηγεί: ό,τι έχει τιμή μπορεί να αντικατασταθεί με κάτι άλλο της ίδιας αξίας. Ένα τραπέζι, ένα αυτοκίνητο, ένα δαχτυλίδι. Ο άνθρωπος όμως δεν έχει τιμή. Έχει αξιοπρέπεια: είναι μοναδικός και αναντικατάστατος, και καμία ποσότητα χρημάτων δεν μπορεί να τον αγοράσει ή να τον αντικαταστήσει.\n\nΑυτό ισχύει για κάθε άνθρωπο: για τον άρρωστο, τον φτωχό, τον ηλικιωμένο, τον ξένο. Και ισχύει και για εμάς. Όταν νιώθουμε ότι «δεν αξίζουμε» επειδή γεράσαμε, αρρωστήσαμε ή δεν είμαστε πια παραγωγικοί, ο Καντ μάς θυμίζει: η αξία μας δεν μετριέται σε χρήματα ούτε σε παραγωγή.", "life": "Σε έναν οίκο ευγηρίας, μια νοσηλεύτρια μιλά σε κάθε ηλικιωμένο με το όνομά του, του ζητά τη γνώμη του για το τι θα φορέσει και τον ακούει όταν διηγείται τις ιστορίες του, ακόμη κι όταν τις έχει ακούσει δέκα φορές. Ένας κύριος 92 χρονών λέει: «Εδώ νιώθω ακόμη άνθρωπος.»", "am": "Πείτε: «Έχω αξιοπρέπεια που κανείς δεν μπορεί να μου πάρει. Το ίδιο και κάθε άνθρωπος.»", "ex": "Υπερασπιστείτε σήμερα την αξιοπρέπεια κάποιου: μην γελάσετε με ένα αστείο που ταπεινώνει, πείτε μια καλή κουβέντα για κάποιον που κατηγορούν, ή δείξτε σεβασμό σε κάποιον που οι άλλοι παραβλέπουν.", "pm": "Σεβάστηκα σήμερα την αξιοπρέπεια όλων; Σεβάστηκα και τη δική μου;"}, "en": {"t": "Price or dignity", "tr": "Everything has either a price or a dignity.", "simple": "Kant explains: whatever has a price can be replaced by something else of equal value. A table, a car, a ring. But a human being has no price. A person has dignity: unique and irreplaceable, and no amount of money can buy or replace them.\n\nThis is true of every person: the sick, the poor, the elderly, the stranger. And it is true of us. When we feel we are “worth nothing” because we have aged, fallen ill or are no longer productive, Kant reminds us: our worth is not measured in money or output.", "life": "In a care home, a nurse speaks to every resident by name, asks their opinion about what to wear and listens when they tell their stories, even when she has heard them ten times. A 92-year-old man says: “Here I still feel like a human being.”", "am": "Say: “I have a dignity no one can take from me. So does every person.”", "ex": "Defend someone’s dignity today: do not laugh at a humiliating joke, say a good word about someone being criticised, or show respect to someone others overlook.", "pm": "Did I respect everyone’s dignity today? Did I respect my own?"}}, {"tag": ["🌱 Μαθαίνουμε να είμαστε άνθρωποι", "🌱 Learning to be human"], "grc": "Der Mensch kann nur Mensch werden durch Erziehung.", "src": ["Περί παιδαγωγικής (1803), AA IX 443", "On Education (1803), AA IX 443"], "el": {"t": "Γινόμαστε άνθρωποι μαθαίνοντας", "tr": "Ο άνθρωπος μπορεί να γίνει άνθρωπος μόνο μέσα από την παιδεία.", "simple": "Ο Καντ ήταν δάσκαλος σε όλη του τη ζωή και πίστευε βαθιά στη δύναμη της μάθησης. Τα ζώα, έλεγε, γεννιούνται σχεδόν έτοιμα. Ο άνθρωπος γεννιέται με σπόρους: σπόρους καλοσύνης, σκέψης, δημιουργίας. Για να φυτρώσουν, χρειάζονται φροντίδα, παράδειγμα και άσκηση.\n\nΚαι αυτή η «παιδεία» δεν τελειώνει στο σχολείο. Κάθε μέρα μαθαίνουμε από τους άλλους και τους μαθαίνουμε κι εμείς, κυρίως με το παράδειγμά μας. Τα εγγόνια μας δεν θα θυμούνται τόσο τι τους είπαμε, όσο πώς ζήσαμε.", "life": "Ένας παππούς δεν έλεγε ποτέ στα εγγόνια του «να είστε ευγενικοί». Τον έβλεπαν όμως να βοηθά τη γειτόνισσα με τα ψώνια, να χαιρετά τον ταχυδρόμο και να ζητά συγγνώμη όταν έκανε λάθος. Χρόνια αργότερα, η εγγονή του, πια δασκάλα, είπε: «Ό,τι καλό έχω, το έμαθα κοιτάζοντας τον παππού μου.»", "am": "Πείτε: «Σήμερα θα μάθω κάτι, και θα δώσω ένα καλό παράδειγμα.»", "ex": "Σκεφτείτε έναν άνθρωπο που σας «έμαθε να είστε άνθρωπος» με το παράδειγμά του. Αν ζει, πείτε του ευχαριστώ. Και κάντε σήμερα κάτι καλό μπροστά σε ένα παιδί ή έναν νέο, χωρίς λόγια.", "pm": "Ποιος με δίδαξε σήμερα κάτι; Τι παράδειγμα έδωσα εγώ;"}, "en": {"t": "We become human by learning", "tr": "A human being can become human only through education.", "simple": "Kant was a teacher all his life and believed deeply in the power of learning. Animals, he said, are born almost complete. Humans are born with seeds: seeds of kindness, thought, creativity. For them to sprout, they need care, example and practice.\n\nAnd this “education” does not end at school. Every day we learn from others and teach them too, mostly by our example. Our grandchildren will not remember so much what we told them as how we lived.", "life": "A grandfather never told his grandchildren “be kind”. But they saw him help the neighbour with her shopping, greet the postman and apologise when he was wrong. Years later his granddaughter, now a teacher, said: “Whatever good I have, I learned by watching my grandfather.”", "am": "Say: “Today I will learn something, and I will set a good example.”", "ex": "Think of someone who “taught you to be human” by their example. If they are alive, thank them. And do something good today in front of a child or a young person, without words.", "pm": "Who taught me something today? What example did I give?"}}, {"tag": ["🌌 Ο έναστρος ουρανός", "🌌 The starry sky"], "grc": "Zwei Dinge erfüllen das Gemüt mit immer neuer und zunehmender Bewunderung und Ehrfurcht, je öfter und anhaltender sich das Nachdenken damit beschäftigt: der bestirnte Himmel über mir und das moralische Gesetz in mir.", "src": ["Κριτική του πρακτικού λόγου (1788), Επίλογος, AA V 161", "Critique of Practical Reason (1788), Conclusion, AA V 161"], "el": {"t": "Τα αστέρια πάνω μου, ο νόμος μέσα μου", "tr": "Δύο πράγματα γεμίζουν την ψυχή με όλο και καινούριο, όλο και μεγαλύτερο θαυμασμό και δέος, όσο πιο συχνά και πιο πολύ τα σκέφτεται κανείς: ο έναστρος ουρανός πάνω μου και ο ηθικός νόμος μέσα μου.", "simple": "Αυτά τα λόγια είναι τόσο αγαπημένα που χαράχτηκαν σε πλάκα δίπλα στον τάφο του Καντ. Όταν κοιτάζουμε τα αστέρια, νιώθουμε μικροί μπροστά στο απέραντο σύμπαν. Κι όμως, μέσα σε αυτόν τον μικρό άνθρωπο υπάρχει κάτι εξίσου θαυμαστό: η φωνή της συνείδησης, που μας λέει τι είναι σωστό ακόμη κι όταν κανείς δεν μας βλέπει.\n\nΟ ουρανός μάς διδάσκει ταπεινότητα. Η συνείδηση μάς δίνει αξία. Μαζί μάς θυμίζουν ότι είμαστε μικροί και μεγάλοι ταυτόχρονα: ένας κόκκος σκόνης στο σύμπαν, που όμως μπορεί να αγαπήσει, να σκεφτεί και να διαλέξει το καλό.", "life": "Μια οικογένεια έκλεισε μια καλοκαιρινή νύχτα όλα τα φώτα στο χωριό και ξάπλωσε στην αυλή για να δει τα αστέρια. Ο μικρός γιος ρώτησε: «Αφού είμαστε τόσο μικροί, έχει σημασία αν είμαι καλός;» Ο πατέρας του απάντησε: «Αυτό είναι το πιο θαυμαστό: τα αστέρια δεν μπορούν να διαλέξουν να είναι καλά. Εσύ μπορείς.»", "am": "Πείτε: «Πάνω μου ο ουρανός, μέσα μου η συνείδηση. Σήμερα θα τους τιμήσω και τους δύο.»", "ex": "Απόψε βγείτε για λίγα λεπτά έξω, ή σε ένα παράθυρο, και κοιτάξτε τον ουρανό. Μετά κλείστε τα μάτια και ακούστε τη φωνή της συνείδησής σας. Και διαλέξτε από τις 7 ημέρες την άσκηση που σας βοήθησε περισσότερο, για να τη συνεχίσετε έναν μήνα.", "pm": "Τι μου είπε απόψε ο ουρανός; Τι μου είπε η συνείδησή μου; Τι κρατώ από τις 7 ημέρες με τον Καντ;"}, "en": {"t": "The stars above me, the law within me", "tr": "Two things fill the mind with ever new and increasing admiration and awe, the more often and steadily we reflect on them: the starry heavens above me and the moral law within me.", "simple": "These words are so beloved that they were engraved on a plaque beside Kant’s tomb. When we look at the stars, we feel small before the endless universe. Yet within this small human being there is something just as wonderful: the voice of conscience, telling us what is right even when no one is watching.\n\nThe sky teaches us humility. Conscience gives us worth. Together they remind us that we are small and great at the same time: a speck of dust in the universe that can nonetheless love, think and choose the good.", "life": "One summer night a family switched off all the lights in the village house and lay in the yard to look at the stars. The little son asked: “If we are so small, does it matter whether I am good?” His father answered: “That is the most wonderful thing: the stars cannot choose to be good. You can.”", "am": "Say: “Above me the sky, within me my conscience. Today I will honour them both.”", "ex": "Tonight go outside for a few minutes, or to a window, and look at the sky. Then close your eyes and listen to the voice of your conscience. And from the 7 days choose the exercise that helped you most, to continue for a month.", "pm": "What did the sky tell me tonight? What did my conscience tell me? What do I keep from the 7 days with Kant?"}}]}

/* ===== 26-10-2026: 15 νέοι σοφοί ===== */
{"id":"di","emoji":"🏺","cls":"c-di","name":["Διογένης ο Κυνικός","Diogenes the Cynic"],"withName":["με τον Διογένη","with Diogenes"],"years":["Περίπου 412–323 π.Χ. · Ο φιλόσοφος του πιθαριού","c. 412–323 BC · The philosopher of the barrel"],"bio":["<p>Ο Διογένης γεννήθηκε στη <b>Σινώπη</b> του Ευξείνου Πόντου. Εξορίστηκε από την πατρίδα του και ήρθε στην Αθήνα χωρίς τίποτα. Εκεί αποφάσισε ότι δεν χρειάζεται σχεδόν τίποτα: κοιμόταν σε ένα μεγάλο πήλινο πιθάρι, είχε ένα ραβδί, έναν μανδύα και ένα σακίδιο.</p><p>Τον έλεγαν «Κυνικό» (από το «κύων», σκύλος), γιατί ζούσε ελεύθερα και χωρίς ντροπή για τα περιττά. Με αστεία και τολμηρές πράξεις ξυπνούσε τους ανθρώπους από τις ψεύτικες ανάγκες τους. Ο Μέγας Αλέξανδρος, λένε, τον θαύμαζε.</p><p>Τα λόγια του τα κατέγραψε αργότερα ο <b>Διογένης ο Λαέρτιος</b> στους «Βίους των Φιλοσόφων» (βιβλίο ΣΤ΄). Σήμερα, στην εποχή των καταναλωτικών αγορών και των ειδοποιήσεων, ο Διογένης είναι πιο επίκαιρος από ποτέ.</p>","<p>Diogenes was born in <b>Sinope</b> on the Black Sea. Exiled from home, he came to Athens with nothing. There he decided he needed almost nothing: he slept in a large clay jar, owned a staff, a cloak and a bag.</p><p>They called him a “Cynic” (from <i>kyon</i>, dog), because he lived freely and without shame about what was unnecessary. With jokes and bold acts he woke people from their false needs. Alexander the Great, it is said, admired him.</p><p>His sayings were recorded later by <b>Diogenes Laertius</b> in the “Lives of the Philosophers” (book VI). Today, in an age of shopping and notifications, Diogenes is more relevant than ever.</p>"],"cheer":["Ο Διογένης έλεγε ότι η άσκηση είναι διπλή: της ψυχής και του σώματος. Κάθε μέρα που ασκείστε, γίνεστε πιο ελεύθεροι.","Diogenes said training is twofold: of the soul and of the body. Every day you train, you become freer."],"fare":{"grc":"Ἐρωτηθεὶς τί αὐτῷ περιγέγονεν ἐκ φιλοσοφίας, ἔφη· «Εἰ καὶ μηδὲν ἄλλο, τὸ γοῦν πρὸς πᾶσαν τύχην παρεσκευάσθαι.»","src":["Διογένης Λαέρτιος, Βίοι Φιλοσόφων ΣΤ΄ 63","Diogenes Laertius, Lives VI 63"],"tr":["Τον ρώτησαν τι κέρδισε από τη φιλοσοφία. Απάντησε: «Αν όχι τίποτε άλλο, τουλάχιστον να είμαι έτοιμος για κάθε τύχη.»","Asked what he had gained from philosophy, he said: “If nothing else, at least to be ready for whatever fortune brings.”"]},"days":[{"tag":["🏺 Απλότητα","🏺 Simplicity"],"grc":"Θεασάμενός ποτε παιδίον ταῖς χερσὶ πῖνον ἐξέρριψε τῆς πήρας τὴν κοτύλην, εἰπών· «Παιδίον με νενίκηκεν εὐτελείᾳ.»","src":["Διογένης Λαέρτιος ΣΤ΄ 37","Diogenes Laertius VI 37"],"el":{"t":"Ένα παιδί με νίκησε στην απλότητα","tr":"Κάποτε είδε ένα παιδί να πίνει νερό με τις χούφτες του. Τότε πέταξε από το σακίδιό του το κύπελλο που είχε και είπε: «Ένα παιδί με νίκησε στην απλότητα.»","simple":"Ο Διογένης είχε ήδη ελάχιστα πράγματα. Κι όμως, όταν είδε ότι μπορεί να ζήσει και χωρίς το κύπελλο, το πέταξε με χαρά. Δεν το έκανε από φτώχεια, αλλά από ελευθερία.\n\nΚάθε πράγμα που έχουμε θέλει φροντίδα, χώρο, χρήματα και σκέψη. Όσο λιγότερα χρειαζόμαστε, τόσο πιο ελαφριά ζούμε. Δεν χρειάζεται να πετάξουμε τα πάντα· αρκεί να ρωτάμε: «Αυτό με εξυπηρετεί ή με κουράζει;»","life":"Ένας νέος παραγγέλνει κάθε εβδομάδα κάτι από το ίντερνετ: ρούχα, αξεσουάρ, gadgets. Η χαρά κρατά μία μέρα και μετά έρχεται η επόμενη επιθυμία. Όταν σταματά για έναν μήνα, ανακαλύπτει ότι δεν του έλειψε σχεδόν τίποτα — και ότι του έμειναν χρήματα για ένα ταξίδι με φίλους.","am":"Πείτε στον εαυτό σας: «Σήμερα θα προσέξω τι πραγματικά χρειάζομαι και τι απλώς θέλω.»","ex":"Διαλέξτε ένα συρτάρι, ένα ράφι ή τον φάκελο με τις φωτογραφίες στο κινητό σας. Βγάλτε πέντε πράγματα που δεν χρησιμοποιείτε: χαρίστε τα, ανακυκλώστε τα ή σβήστε τα. Προσέξτε πώς νιώθετε μετά.","pm":"Τι αγόρασα ή κράτησα σήμερα που δεν το χρειαζόμουν πραγματικά;"},"en":{"t":"A child beat me in simplicity","tr":"Once he saw a child drinking water from its cupped hands. He threw away the cup from his bag and said: “A child has beaten me in simplicity.”","simple":"Diogenes already owned very little. Yet when he saw he could live without the cup, he threw it away gladly. Not out of poverty, but out of freedom.\n\nEverything we own needs care, space, money and thought. The less we need, the lighter we live. We do not have to throw everything away; it is enough to ask: “Does this serve me or tire me?”","life":"A young man orders something online every week: clothes, accessories, gadgets. The joy lasts a day and then the next desire arrives. When he stops for a month, he discovers he missed almost nothing — and has money left for a trip with friends.","am":"Tell yourself: “Today I will notice what I really need and what I merely want.”","ex":"Choose a drawer, a shelf or the photo folder on your phone. Take out five things you do not use: give them away, recycle them or delete them. Notice how you feel afterwards.","pm":"What did I buy or keep today that I did not really need?"}},{"tag":["☀️ Ελευθερία","☀️ Freedom"],"grc":"Ἐν τῷ Κρανείῳ ἡλιουμένῳ αὐτῷ Ἀλέξανδρος ἐπιστάς φησιν, «Αἴτησόν με ὃ θέλεις.» Καὶ ὅς, «Ἀποσκότησόν μου», φησί.","src":["Διογένης Λαέρτιος ΣΤ΄ 38","Diogenes Laertius VI 38"],"el":{"t":"Φύγε λίγο από τον ήλιο μου","tr":"Ο Διογένης καθόταν στον ήλιο, στο Κράνειο της Κορίνθου. Ήρθε ο Μέγας Αλέξανδρος, στάθηκε μπροστά του και του είπε: «Ζήτα μου ό,τι θέλεις.» Κι εκείνος απάντησε: «Κάνε λίγο πιο πέρα, μου κρύβεις τον ήλιο.»","simple":"Ο πιο ισχυρός άνθρωπος του κόσμου προσφέρει στον Διογένη ό,τι θέλει: χρήματα, αξίωμα, δόξα. Κι εκείνος ζητά μόνο να μην του κρύβει τον ήλιο. Δεν είχε ανάγκη από τίποτα που μπορούσε να του δώσει ο βασιλιάς.\n\nΑυτή είναι η ελευθερία: να μη σε τυφλώνει η λάμψη των ισχυρών, των διάσημων ή των «likes». Όποιος χρειάζεται λίγα, δεν μπορεί να εξαγοραστεί εύκολα.","life":"Μια κοπέλα ακολουθεί στα social media ανθρώπους με τέλεια ζωή, ταξίδια και ακριβά ρούχα. Κάθε βράδυ νιώθει λίγη. Μια μέρα κάθεται στο μπαλκόνι με έναν καφέ στον πρωινό ήλιο και σκέφτεται: «Αυτή τη στιγμή δεν μου λείπει τίποτα.» Κάνει «unfollow» σε δέκα λογαριασμούς που τη στενοχωρούν.","am":"Βγείτε για δύο λεπτά στον ήλιο ή στο φως του παραθύρου και πείτε: «Τα καλύτερα πράγματα είναι δωρεάν.»","ex":"Γράψτε τρία δωρεάν πράγματα που σας δίνουν χαρά (ο ήλιος, μια βόλτα, ένα τηλεφώνημα σε φίλο). Κάντε σήμερα τουλάχιστον ένα από αυτά, χωρίς κινητό στο χέρι.","pm":"Πότε σήμερα ένιωσα ότι δεν μου λείπει τίποτα;"},"en":{"t":"Stand out of my sun","tr":"Diogenes was sitting in the sun at the Craneum in Corinth. Alexander the Great came, stood before him and said: “Ask me for whatever you want.” And he replied: “Stand a little aside — you are blocking my sun.”","simple":"The most powerful man in the world offers Diogenes anything: money, office, glory. He asks only not to have his sun blocked. He needed nothing a king could give.\n\nThis is freedom: not to be dazzled by the powerful, the famous or the “likes”. Whoever needs little cannot easily be bought.","life":"A young woman follows people on social media with perfect lives, trips and expensive clothes. Every evening she feels small. One day she sits on her balcony with a coffee in the morning sun and thinks: “Right now I lack nothing.” She unfollows ten accounts that make her feel bad.","am":"Step into the sun, or the light of a window, for two minutes and say: “The best things are free.”","ex":"Write down three free things that give you joy (the sun, a walk, a call to a friend). Do at least one of them today, without a phone in your hand.","pm":"When did I feel today that I lacked nothing?"}},{"tag":["🏮 Αυθεντικότητα","🏮 Authenticity"],"grc":"Λύχνον μεθ᾽ ἡμέραν ἅψας, «Ἄνθρωπον», φησί, «ζητῶ.»","src":["Διογένης Λαέρτιος ΣΤ΄ 41","Diogenes Laertius VI 41"],"el":{"t":"Ψάχνω άνθρωπο","tr":"Άναψε ένα λυχνάρι μέρα μεσημέρι και γύριζε στην αγορά λέγοντας: «Ψάχνω άνθρωπο.»","simple":"Η αγορά ήταν γεμάτη κόσμο. Ο Διογένης όμως εννοούσε κάτι άλλο: ψάχνω έναν αληθινό άνθρωπο — κάποιον που ζει σύμφωνα με τη λογική και την καρδιά του, όχι με τις μάσκες και τις συνήθειες των άλλων.\n\nΌλοι φοράμε λίγο μάσκες: στη δουλειά, στο σχολείο, στο διαδίκτυο. Το ερώτημα του Διογένη είναι απλό: πόσο από αυτό που δείχνω είμαι πραγματικά εγώ;","life":"Ένας φοιτητής γελά με αστεία που τον πληγώνουν, για να μη φανεί «ευαίσθητος» στην παρέα. Μια μέρα λέει ήρεμα: «Αυτό δεν μου αρέσει.» Κάποιοι ξαφνιάζονται, αλλά ένας φίλος του λέει μετά: «Κι εμένα με ενοχλούσε· ευχαριστώ που το είπες.»","am":"Πείτε: «Σήμερα θα είμαι λίγο περισσότερο ο εαυτός μου και λίγο λιγότερο ο ρόλος μου.»","ex":"Σε μια συζήτηση σήμερα, πείτε ειλικρινά τη γνώμη σας για κάτι μικρό, ευγενικά και χωρίς να προσβάλετε κανέναν — εκεί όπου συνήθως θα συμφωνούσατε απλώς για να μη χαλάσετε το κλίμα.","pm":"Σε ποια στιγμή σήμερα φόρεσα μάσκα; Και σε ποια ήμουν αληθινός;"},"en":{"t":"I am looking for a human being","tr":"He lit a lamp in broad daylight and walked through the market saying: “I am looking for a human being.”","simple":"The market was full of people. But Diogenes meant something else: I am looking for a real human being — someone who lives by reason and heart, not by masks and other people’s habits.\n\nWe all wear masks a little: at work, at school, online. Diogenes’ question is simple: how much of what I show is really me?","life":"A student laughs at jokes that hurt him so as not to seem “sensitive” to his group. One day he says calmly: “I don’t like that.” Some are surprised, but later a friend tells him: “It bothered me too — thanks for saying it.”","am":"Say: “Today I will be a little more myself and a little less my role.”","ex":"In a conversation today, honestly share your opinion on something small, politely and without offending anyone — where you would usually just agree to keep the peace.","pm":"When today did I wear a mask? And when was I real?"}},{"tag":["💪 Απόρριψη","💪 Rejection"],"grc":"Ἤιτει ποτὲ ἀνδριάντα· ἐρωτηθεὶς δὲ διὰ τί τοῦτο ποιεῖ, «Μελετῶ», εἶπεν, «ἀποτυγχάνειν.»","src":["Διογένης Λαέρτιος ΣΤ΄ 49","Diogenes Laertius VI 49"],"el":{"t":"Εξασκούμαι στο «όχι»","tr":"Κάποτε ζητιάνευε από ένα άγαλμα. Όταν τον ρώτησαν γιατί το κάνει, είπε: «Εξασκούμαι να παίρνω αρνητική απάντηση.»","simple":"Ένα άγαλμα δεν δίνει ποτέ τίποτα. Ο Διογένης το ήξερε. Ήθελε να συνηθίσει την απόρριψη, ώστε όταν του έλεγαν «όχι» οι άνθρωποι, να μην πληγώνεται.\n\nΟ φόβος του «όχι» μάς κρατά πίσω: δεν ζητάμε αύξηση, δεν στέλνουμε το βιογραφικό, δεν λέμε «μου αρέσεις». Όποιος συνηθίσει το «όχι» γίνεται ελεύθερος να δοκιμάζει.","life":"Μια νέα θέλει να δουλέψει σε ένα αρτοποιείο που αγαπά, αλλά φοβάται την απόρριψη. Βάζει στόχο να μαζέψει δέκα «όχι» μέσα στον μήνα. Στο έκτο αίτημα της λένε «ναι». Όταν σταμάτησε να φοβάται το «όχι», βρήκε το «ναι».","am":"Πείτε: «Ένα “όχι” δεν είναι καταστροφή. Είναι απλώς μια απάντηση.»","ex":"Ζητήστε σήμερα κάτι μικρό που συνήθως δεν θα ζητούσατε: μια έκπτωση, μια χάρη, μια πληροφορία. Αν σας πουν «όχι», χαμογελάστε και σημειώστε: «Ένα ακόμη μάθημα.»","pm":"Τι δεν ζήτησα ποτέ επειδή φοβόμουν το «όχι»;"},"en":{"t":"Practising the “no”","tr":"Once he was begging from a statue. Asked why he did this, he said: “I am practising being refused.”","simple":"A statue never gives anything. Diogenes knew it. He wanted to get used to rejection, so that when people said “no”, he would not be hurt.\n\nFear of “no” holds us back: we do not ask for a raise, do not send the CV, do not say “I like you”. Whoever gets used to “no” becomes free to try.","life":"A young woman wants to work at a bakery she loves, but fears rejection. She sets a goal to collect ten “no”s in a month. On the sixth request they say “yes”. When she stopped fearing the “no”, she found the “yes”.","am":"Say: “A ‘no’ is not a disaster. It is just an answer.”","ex":"Today ask for something small you normally would not: a discount, a favour, some information. If they say “no”, smile and note: “One more lesson.”","pm":"What have I never asked for because I feared the “no”?"}},{"tag":["🏃 Σώμα και ψυχή","🏃 Body and soul"],"grc":"Διττὴν δὲ ἔλεγεν εἶναι τὴν ἄσκησιν, τὴν μὲν ψυχικήν, τὴν δὲ σωματικήν.","src":["Διογένης Λαέρτιος ΣΤ΄ 70","Diogenes Laertius VI 70"],"el":{"t":"Η διπλή άσκηση","tr":"Έλεγε ότι η άσκηση είναι διπλή: η μία είναι της ψυχής και η άλλη του σώματος.","simple":"Ο Διογένης δεν ήταν μόνο στοχαστής. Περπατούσε ξυπόλυτος, άντεχε το κρύο και τη ζέστη, έτρωγε απλά. Πίστευε ότι το σώμα και η ψυχή βοηθούν το ένα το άλλο: ένα γυμνασμένο σώμα κάνει τον νου πιο σταθερό, και ένας σταθερός νους φροντίζει καλύτερα το σώμα.\n\nΔεν χρειάζεται γυμναστήριο. Ένας περίπατος, μερικές σκάλες, λίγη υπομονή μπροστά σε μια μικρή δυσκολία — όλα είναι άσκηση.","life":"Μια γυναίκα με άγχος δοκιμάζει να περπατά είκοσι λεπτά κάθε απόγευμα χωρίς ακουστικά. Στην αρχή βαριέται. Μετά από δύο εβδομάδες κοιμάται καλύτερα και οι σκέψεις της έχουν λιγότερο βάρος.","am":"Κάντε δέκα βαθιές αναπνοές και πέντε τεντώματα πριν πιάσετε το κινητό.","ex":"Διαλέξτε μία «σωματική» άσκηση (ένας περίπατος, σκάλες αντί για ασανσέρ) και μία «ψυχική» (πέντε λεπτά σιωπής χωρίς οθόνη). Κάντε και τις δύο σήμερα. Αν έχετε θέμα υγείας, ρωτήστε πρώτα τον γιατρό σας.","pm":"Τι έκανα σήμερα για το σώμα μου και τι για την ψυχή μου;"},"en":{"t":"The twofold training","tr":"He said training is twofold: one of the soul and one of the body.","simple":"Diogenes was not only a thinker. He walked barefoot, bore cold and heat, ate simply. He believed body and soul help each other: a trained body steadies the mind, and a steady mind cares better for the body.\n\nNo gym is needed. A walk, some stairs, a little patience before a small difficulty — all of it is training.","life":"A woman with anxiety tries walking twenty minutes every afternoon without headphones. At first she is bored. After two weeks she sleeps better and her thoughts weigh less.","am":"Take ten deep breaths and do five stretches before you pick up your phone.","ex":"Choose one “body” exercise (a walk, stairs instead of the lift) and one “soul” exercise (five minutes of silence without a screen). Do both today. If you have a health issue, ask your doctor first.","pm":"What did I do today for my body, and what for my soul?"}},{"tag":["🌍 Ανήκω στον κόσμο","🌍 Citizen of the world"],"grc":"Ἐρωτηθεὶς πόθεν εἴη, «Κοσμοπολίτης», ἔφη.","src":["Διογένης Λαέρτιος ΣΤ΄ 63","Diogenes Laertius VI 63"],"el":{"t":"Πολίτης του κόσμου","tr":"Όταν τον ρώτησαν από πού είναι, απάντησε: «Είμαι πολίτης του κόσμου.»","simple":"Ο Διογένης ήταν εξόριστος, χωρίς πατρίδα και χωρίς σπίτι. Αντί να νιώσει ότι δεν ανήκει πουθενά, ένιωσε ότι ανήκει παντού. Πρώτος αυτός είπε τη λέξη «κοσμοπολίτης».\n\nΑυτό δεν σημαίνει ότι ξεχνάμε την πατρίδα μας. Σημαίνει ότι πριν από χώρα, θρησκεία ή ομάδα, βλέπουμε στον άλλον έναν άνθρωπο σαν εμάς.","life":"Σε μια τάξη υπάρχει ένα παιδί από άλλη χώρα που κάθεται πάντα μόνο του. Ένας συμμαθητής του κάθεται δίπλα του στο διάλειμμα και τον ρωτά για το φαγητό της πατρίδας του. Σε λίγες εβδομάδες έχουν γίνει φίλοι — και η τάξη ολόκληρη έμαθε κάτι καινούργιο.","am":"Πείτε: «Κάθε άνθρωπος που θα συναντήσω σήμερα είναι συμπολίτης μου στον κόσμο.»","ex":"Χαιρετήστε σήμερα με χαμόγελο έναν άνθρωπο που συνήθως προσπερνάτε: τον καθαριστή, τον ταμία, έναν γείτονα από άλλη χώρα. Αν μπορείτε, μάθετε το όνομά του.","pm":"Ποιον αντιμετώπισα σήμερα ως «ξένο», ενώ ήταν απλώς άνθρωπος;"},"en":{"t":"A citizen of the world","tr":"Asked where he was from, he answered: “I am a citizen of the world.”","simple":"Diogenes was an exile, without a homeland or a home. Instead of feeling he belonged nowhere, he felt he belonged everywhere. He was the first to say the word “cosmopolitan”.\n\nThis does not mean forgetting our homeland. It means that before country, religion or group, we see in the other a human being like us.","life":"In a classroom there is a child from another country who always sits alone. A classmate sits beside him at break and asks about the food of his homeland. Within weeks they are friends — and the whole class has learned something new.","am":"Say: “Every person I meet today is my fellow citizen of the world.”","ex":"Today greet with a smile someone you usually pass by: the cleaner, the cashier, a neighbour from another country. If you can, learn their name.","pm":"Whom did I treat as a “stranger” today, though they were simply human?"}},{"tag":["🗣️ Ειλικρίνεια","🗣️ Frankness"],"grc":"Ἐρωτηθεὶς τί κάλλιστον ἐν ἀνθρώποις, ἔφη, «Παρρησία.»","src":["Διογένης Λαέρτιος ΣΤ΄ 69","Diogenes Laertius VI 69"],"el":{"t":"Το ωραιότερο: να λες την αλήθεια","tr":"Όταν τον ρώτησαν ποιο είναι το ωραιότερο πράγμα στους ανθρώπους, απάντησε: «Η ελευθερία να λες την αλήθεια.»","simple":"«Παρρησία» σημαίνει να λες ό,τι σκέφτεσαι, με θάρρος και ειλικρίνεια. Ο Διογένης το έκανε ακόμη και μπροστά σε βασιλιάδες. Για εκείνον, ένας άνθρωπος που δεν μπορεί να πει την αλήθεια του δεν είναι πραγματικά ελεύθερος.\n\nΗ παρρησία όμως δεν είναι σκληρότητα. Η αλήθεια λέγεται για να βοηθήσει, όχι για να πληγώσει. Το θάρρος και η καλοσύνη πάνε μαζί.","life":"Ένας πατέρας βλέπει τον γιο του να κάνει ένα λάθος στη δουλειά. Αντί να σωπάσει ή να φωνάξει, του λέει ήρεμα: «Σε αγαπώ, γι’ αυτό σου λέω την αλήθεια: εδώ κάνεις λάθος.» Ο γιος σκέφτεται, και την επόμενη μέρα τον ευχαριστεί.","am":"Πείτε: «Σήμερα θα πω την αλήθεια με καλοσύνη.»","ex":"Σκεφτείτε κάτι που θέλετε να πείτε εδώ και καιρό σε κάποιον, αλλά το αποφεύγετε. Γράψτε το πρώτα σε χαρτί με ήρεμα, ευγενικά λόγια. Αν νιώθετε έτοιμοι, πείτε το σήμερα ή κλείστε μια ώρα για να το πείτε.","pm":"Πού σήμερα είπα την αλήθεια μου; Και πού σώπασα από φόβο;"},"en":{"t":"The finest thing: frankness","tr":"Asked what was the finest thing among people, he answered: “Freedom of speech — to speak the truth.”","simple":"Parrhesia means saying what you think, with courage and honesty. Diogenes did it even before kings. For him, a person who cannot speak their truth is not truly free.\n\nBut frankness is not harshness. Truth is spoken to help, not to wound. Courage and kindness go together.","life":"A father sees his son making a mistake at work. Instead of keeping quiet or shouting, he says calmly: “I love you, that’s why I’m telling you the truth: you are wrong here.” The son thinks it over, and the next day thanks him.","am":"Say: “Today I will speak the truth with kindness.”","ex":"Think of something you have long wanted to tell someone but keep avoiding. First write it on paper in calm, kind words. If you feel ready, say it today, or set a time to say it.","pm":"Where today did I speak my truth? And where did I stay silent out of fear?"}}]},
{"id":"pr","emoji":"⚖️","cls":"c-pr","name":["Πρωταγόρας","Protagoras"],"withName":["με τον Πρωταγόρα","with Protagoras"],"years":["Περίπου 490–420 π.Χ. · Ο δάσκαλος της κρίσης","c. 490–420 BC · The teacher of judgement"],"bio":["<p>Ο Πρωταγόρας γεννήθηκε στα <b>Άβδηρα</b> της Θράκης. Λένε ότι στα νιάτα του ήταν αχθοφόρος και ότι ο φιλόσοφος Δημόκριτος τον πρόσεξε, όταν είδε με πόση εξυπνάδα έδενε τα ξύλα στην πλάτη του.</p><p>Έγινε ο πιο φημισμένος από τους <b>σοφιστές</b>, τους πρώτους δασκάλους που δίδασκαν στους νέους πώς να σκέφτονται, να μιλούν και να ζουν μέσα στην πόλη. Ο Περικλής τον εμπιστεύτηκε να γράψει νόμους για μια καινούργια πόλη, τους Θουρίους.</p><p>Από τα βιβλία του σώθηκαν μόνο λίγες φράσεις. Ο Πλάτων όμως έγραψε έναν ολόκληρο διάλογο με το όνομά του. Ο Πρωταγόρας μάς μαθαίνει να ακούμε και τις δύο πλευρές, να κρίνουμε μόνοι μας και να μαθαίνουμε σε βάθος.</p>","<p>Protagoras was born in <b>Abdera</b> in Thrace. It is said that as a young man he was a porter, and that the philosopher Democritus noticed him when he saw how cleverly he tied the bundles of wood on his back.</p><p>He became the most famous of the <b>sophists</b>, the first teachers who taught young people how to think, speak and live in the city. Pericles trusted him to write laws for a new city, Thurii.</p><p>Only a few sentences of his books survive. But Plato wrote a whole dialogue bearing his name. Protagoras teaches us to hear both sides, to judge for ourselves and to learn in depth.</p>"],"cheer":["Ο Πρωταγόρας έλεγε ότι καμία τέχνη δεν υπάρχει χωρίς εξάσκηση. Η σημερινή σας μέρα ήταν εξάσκηση.","Protagoras said no skill exists without practice. Today was practice."],"fare":{"grc":"Οὐ βλαστάνει παιδεία ἐν ψυχῇ, ἐὰν μή τις εἰς πολὺ βάθος ἵκηται.","src":["Πρωταγόρας, απόσπασμα DK 80 B11","Protagoras, fragment DK 80 B11"],"tr":["Η παιδεία δεν φυτρώνει στην ψυχή, αν δεν φτάσει κανείς πολύ βαθιά.","Education does not sprout in the soul unless one reaches great depth."]},"days":[{"tag":["📏 Η δική μου ματιά","📏 My own view"],"grc":"Πάντων χρημάτων μέτρον ἐστὶν ἄνθρωπος, τῶν μὲν ὄντων ὡς ἔστιν, τῶν δὲ οὐκ ὄντων ὡς οὐκ ἔστιν.","src":["Απόσπασμα DK 80 B1 · Πλάτων, Θεαίτητος 152a","Fragment DK 80 B1 · Plato, Theaetetus 152a"],"el":{"t":"Ο άνθρωπος είναι το μέτρο","tr":"Ο άνθρωπος είναι το μέτρο όλων των πραγμάτων: για όσα υπάρχουν, ότι υπάρχουν, και για όσα δεν υπάρχουν, ότι δεν υπάρχουν.","simple":"Ο Πρωταγόρας παρατήρησε ότι ο καθένας βλέπει τον κόσμο από τη δική του θέση. Ο ίδιος άνεμος είναι κρύος για τον έναν και δροσερός για τον άλλον. Ο καθένας μας έχει ένα δικό του «μέτρο».\n\nΑυτό μας διδάσκει δύο πράγματα. Πρώτον, να μη μετράμε τη ζωή μας με το μέτρο των άλλων — με τα likes, τους μισθούς ή τα σπίτια τους. Δεύτερον, να σεβόμαστε ότι και ο άλλος βλέπει από τη δική του θέση.","life":"Μια φοιτήτρια συγκρίνει συνέχεια τους βαθμούς της με των συμφοιτητών της και νιώθει αποτυχημένη. Μια μέρα ρωτά τον εαυτό της: «Με το δικό μου μέτρο, έμαθα περισσότερα από πέρσι;» Η απάντηση είναι «ναι» — και για πρώτη φορά νιώθει περήφανη.","am":"Πείτε: «Σήμερα θα μετρήσω τη μέρα μου με το δικό μου μέτρο, όχι με των άλλων.»","ex":"Γράψτε τρία πράγματα στα οποία είστε καλύτεροι σήμερα από ό,τι πριν από έναν χρόνο. Μη συγκρίνετε με κανέναν άλλον — μόνο με τον παλιό εαυτό σας.","pm":"Πού σήμερα μέτρησα τον εαυτό μου με το μέτρο κάποιου άλλου;"},"en":{"t":"Man is the measure","tr":"Man is the measure of all things: of things that are, that they are, and of things that are not, that they are not.","simple":"Protagoras noticed that each person sees the world from their own position. The same wind is cold for one and refreshing for another. Each of us has our own “measure”.\n\nThis teaches us two things. First, not to measure our life by others’ measure — by their likes, salaries or houses. Second, to respect that the other person also sees from their own position.","life":"A student constantly compares her grades with her classmates’ and feels a failure. One day she asks herself: “By my own measure, have I learned more than last year?” The answer is “yes” — and for the first time she feels proud.","am":"Say: “Today I will measure my day by my own measure, not by others’.”","ex":"Write three things you are better at today than a year ago. Do not compare with anyone else — only with your former self.","pm":"Where today did I measure myself by someone else’s measure?"}},{"tag":["👂 Δύο πλευρές","👂 Two sides"],"grc":"Δύο λόγους εἶναι περὶ παντὸς πράγματος ἀντικειμένους ἀλλήλοις.","src":["Απόσπασμα DK 80 B6a · Διογένης Λαέρτιος Θ΄ 51","Fragment DK 80 B6a · Diogenes Laertius IX 51"],"el":{"t":"Κάθε θέμα έχει δύο πλευρές","tr":"Για κάθε πράγμα υπάρχουν δύο λόγοι, αντίθετοι ο ένας στον άλλον.","simple":"Ο Πρωταγόρας μάθαινε στους μαθητές του να υποστηρίζουν πρώτα τη μία πλευρά και μετά την αντίθετη. Όχι για να μπερδευτούν, αλλά για να καταλάβουν ότι η αλήθεια σπάνια είναι μόνο σε ένα μέρος.\n\nΣήμερα που οι ειδήσεις και τα βίντεο μάς σπρώχνουν να θυμώνουμε γρήγορα, αυτή η άσκηση είναι πολύτιμη: πριν κρίνω, ακούω και τον άλλον.","life":"Δύο αδέλφια μαλώνουν για την κληρονομιά και δεν μιλιούνται. Ο ένας δοκιμάζει να γράψει σε χαρτί τα επιχειρήματα του άλλου, σαν να ήταν δικά του. Ξαφνικά καταλαβαίνει γιατί ο αδελφός του νιώθει αδικημένος. Τον παίρνει τηλέφωνο.","am":"Πείτε: «Σήμερα, πριν κρίνω, θα ακούσω και την άλλη πλευρά.»","ex":"Διαλέξτε ένα θέμα όπου έχετε έντονη γνώμη. Γράψτε τα τρία καλύτερα επιχειρήματα της αντίθετης πλευράς, όσο πιο τίμια μπορείτε. Δεν χρειάζεται να αλλάξετε γνώμη — μόνο να καταλάβετε.","pm":"Ποια γνώμη άκουσα σήμερα χωρίς να τη διακόψω;"},"en":{"t":"Every matter has two sides","tr":"On every matter there are two arguments, opposed to each other.","simple":"Protagoras taught his students to argue first one side and then the opposite. Not to confuse them, but so they would understand that truth is rarely in one place only.\n\nToday, when news and videos push us to anger quickly, this exercise is precious: before I judge, I listen to the other side too.","life":"Two brothers quarrel over an inheritance and stop speaking. One tries writing down the other’s arguments as if they were his own. Suddenly he understands why his brother feels wronged. He picks up the phone.","am":"Say: “Today, before I judge, I will hear the other side.”","ex":"Choose a subject where you hold a strong opinion. Write the three best arguments of the opposite side, as honestly as you can. You need not change your mind — only understand.","pm":"Which opinion did I hear today without interrupting it?"}},{"tag":["🌱 Ταλέντο και κόπος","🌱 Talent and effort"],"grc":"Φύσεως καὶ ἀσκήσεως διδασκαλία δεῖται· ἀπὸ νεότητος δὲ ἀρξαμένους δεῖ μανθάνειν.","src":["Απόσπασμα DK 80 B3","Fragment DK 80 B3"],"el":{"t":"Χρειάζεται και φύση και εξάσκηση","tr":"Η μάθηση χρειάζεται και φυσική κλίση και εξάσκηση. Και πρέπει να αρχίζουμε να μαθαίνουμε από νωρίς.","simple":"Πολλοί λένε «δεν έχω ταλέντο» και τα παρατούν. Ο Πρωταγόρας λέει ότι το ταλέντο μόνο του δεν φτάνει· χρειάζεται και εξάσκηση. Και η εξάσκηση μπορεί να καλύψει πολλά από όσα δεν μας δόθηκαν από τη φύση.\n\nΤο «από νωρίς» δεν σημαίνει ότι αργήσαμε. Σημαίνει: ξεκίνα σήμερα, την πιο νέα μέρα της υπόλοιπης ζωής σου.","life":"Ένας παππούς 70 ετών θέλει να μάθει κιθάρα, αλλά λέει «δεν έχω αυτί». Παίζει δέκα λεπτά κάθε μέρα. Σε έξι μήνες παίζει στα εγγόνια του τρία τραγούδια. Δεν έγινε δεξιοτέχνης — έγινε χαρούμενος.","am":"Πείτε: «Δεν ρωτάω αν έχω ταλέντο. Ρωτάω αν εξασκήθηκα σήμερα.»","ex":"Διαλέξτε μία δεξιότητα που θα θέλατε να έχετε. Αφιερώστε της σήμερα δέκα λεπτά — με ένα βίντεο, ένα βιβλίο ή απλή δοκιμή. Σημειώστε την ημερομηνία: είναι η πρώτη μέρα.","pm":"Σε τι εξασκήθηκα σήμερα, έστω και λίγο;"},"en":{"t":"It takes both nature and practice","tr":"Learning needs both natural ability and practice. And we must begin to learn early.","simple":"Many say “I have no talent” and give up. Protagoras says talent alone is not enough; practice is needed too. And practice can make up for much that nature did not give us.\n\n“Early” does not mean we are too late. It means: begin today, the youngest day of the rest of your life.","life":"A 70-year-old grandfather wants to learn guitar but says “I have no ear”. He plays ten minutes a day. In six months he plays three songs for his grandchildren. He did not become a virtuoso — he became happy.","am":"Say: “I don’t ask whether I have talent. I ask whether I practised today.”","ex":"Choose one skill you would like to have. Give it ten minutes today — with a video, a book or simply trying. Write down the date: it is day one.","pm":"What did I practise today, even a little?"}},{"tag":["🕊️ Πένθος","🕊️ Grief"],"grc":"Νεηνιέων γὰρ υἱέων καλῶν ἐόντων ἐν ὀκτὼ ταῖς πάσῃσιν ἡμέρῃσι ἀποθανόντων νηπενθέως ἀνέτλη.","src":["Απόσπασμα DK 80 B9 · Πλούταρχος, Παραμυθητικός προς Απολλώνιον 118e","Fragment DK 80 B9 · Plutarch, Consolation to Apollonius 118e"],"el":{"t":"Όταν χάνουμε όσους αγαπάμε","tr":"Όταν πέθαναν μέσα σε οκτώ μόνο ημέρες οι δύο νέοι και ωραίοι γιοι του, το άντεξε με γαλήνη.","simple":"Αυτά τα λόγια λέχθηκαν για τον Περικλή, τον φίλο του Πρωταγόρα, όταν έχασε τα παιδιά του από την επιδημία. Ο Πρωταγόρας θαύμαζε τη δύναμή του να συνεχίσει να στέκεται.\n\nΗ γαλήνη στο πένθος δεν σημαίνει ότι δεν πονάμε ή ότι ξεχνάμε. Σημαίνει ότι κρατάμε την αγάπη χωρίς να αφήνουμε τον πόνο να γκρεμίσει όλη μας τη ζωή. Το πένθος θέλει χρόνο, δάκρυα και ανθρώπους δίπλα μας.","life":"Μια γιαγιά έχασε τον άντρα της. Τους πρώτους μήνες κλαίει συχνά. Μια μέρα αποφασίζει να μαγειρέψει το φαγητό που του άρεσε και να καλέσει τα εγγόνια. Γελούν θυμούμενοι ιστορίες του. Ο πόνος δεν έφυγε, αλλά τώρα κουβαλά και αγάπη.","am":"Πείτε: «Ο πόνος μου δείχνει πόσο αγάπησα. Σήμερα θα φροντίσω και τον εαυτό μου.»","ex":"Αν έχετε χάσει κάποιον, γράψτε του ένα μικρό γράμμα: τι σας έδωσε, τι θα θέλατε να του πείτε. Ή τηλεφωνήστε σε κάποιον που πενθεί και απλώς ακούστε τον. Αν ο πόνος σας είναι πολύ βαρύς, μιλήστε με τον γιατρό σας.","pm":"Ποια όμορφη ανάμνηση κράτησα σήμερα από κάποιον που λείπει;"},"en":{"t":"When we lose those we love","tr":"When his two young and fine sons died within only eight days, he bore it with serenity.","simple":"These words were spoken about Pericles, Protagoras’ friend, when he lost his sons to the epidemic. Protagoras admired his strength to keep standing.\n\nSerenity in grief does not mean we do not hurt or that we forget. It means we hold on to love without letting the pain bring down our whole life. Grief needs time, tears and people beside us.","life":"A grandmother has lost her husband. In the first months she often cries. One day she decides to cook the dish he loved and invite the grandchildren. They laugh remembering his stories. The pain did not leave, but now it also carries love.","am":"Say: “My pain shows how much I loved. Today I will look after myself too.”","ex":"If you have lost someone, write them a short letter: what they gave you, what you would like to tell them. Or call someone who is grieving and simply listen. If your pain is very heavy, speak with your doctor.","pm":"Which beautiful memory did I keep today of someone who is gone?"}},{"tag":["🔨 Εξάσκηση","🔨 Practice"],"grc":"Μηδὲν εἶναι μήτε τέχνην ἄνευ μελέτης μήτε μελέτην ἄνευ τέχνης.","src":["Απόσπασμα DK 80 B10","Fragment DK 80 B10"],"el":{"t":"Ούτε τέχνη χωρίς μελέτη","tr":"Δεν υπάρχει ούτε τέχνη χωρίς εξάσκηση ούτε εξάσκηση χωρίς τέχνη.","simple":"Η θεωρία χωρίς πράξη μένει στο χαρτί. Η πράξη χωρίς γνώση γίνεται τυφλή επανάληψη. Ο Πρωταγόρας ζητά και τα δύο μαζί: να ξέρω τι κάνω και να το κάνω ξανά και ξανά.\n\nΑυτό ισχύει και για την καλοσύνη, την υπομονή, την ηρεμία. Δεν φτάνει να τα διαβάσουμε· πρέπει να τα εξασκήσουμε, όπως ένας μουσικός τη ζυγαριά του.","life":"Ένας νέος διαβάζει δεκάδες βιβλία για την αυτοπεποίθηση, αλλά δεν μιλά ποτέ στην τάξη. Η καθηγήτριά του τού προτείνει: «Κάνε μία ερώτηση την εβδομάδα.» Μέσα σε έναν μήνα μιλά πιο άνετα από όσο του έμαθαν όλα τα βιβλία μαζί.","am":"Πείτε: «Σήμερα θα κάνω πράξη ένα πράγμα που ήδη ξέρω.»","ex":"Θυμηθείτε μια καλή συμβουλή που έχετε διαβάσει ή ακούσει (ίσως σε αυτή την εφαρμογή). Εφαρμόστε την σήμερα μία φορά, συγκεκριμένα. Σημειώστε τι έγινε.","pm":"Ποια γνώση έκανα σήμερα πράξη;"},"en":{"t":"No skill without practice","tr":"There is neither skill without practice nor practice without skill.","simple":"Theory without action stays on paper. Action without knowledge becomes blind repetition. Protagoras asks for both together: to know what I do and to do it again and again.\n\nThis applies to kindness, patience and calm too. Reading about them is not enough; we must practise them, like a musician practises scales.","life":"A young man reads dozens of books on self-confidence but never speaks in class. His teacher suggests: “Ask one question a week.” Within a month he speaks more easily than all the books together had taught him.","am":"Say: “Today I will put into practice one thing I already know.”","ex":"Remember one good piece of advice you have read or heard (perhaps in this app). Apply it once today, concretely. Note what happened.","pm":"What knowledge did I put into action today?"}},{"tag":["🤝 Ζούμε μαζί","🤝 Living together"],"grc":"Ζεὺς οὖν δείσας περὶ τῷ γένει ἡμῶν μὴ ἀπόλοιτο πᾶν, Ἑρμῆν πέμπει ἄγοντα εἰς ἀνθρώπους αἰδῶ τε καὶ δίκην, ἵν᾽ εἶεν πόλεων κόσμοι τε καὶ δεσμοὶ φιλίας συναγωγοί.","src":["Ο μύθος του Πρωταγόρα · Πλάτων, Πρωταγόρας 322c","The myth of Protagoras · Plato, Protagoras 322c"],"el":{"t":"Σεβασμός και δικαιοσύνη για όλους","tr":"Ο Δίας φοβήθηκε μήπως χαθεί ολόκληρο το ανθρώπινο γένος. Έστειλε λοιπόν τον Ερμή να φέρει στους ανθρώπους τον σεβασμό και τη δικαιοσύνη, για να υπάρχει τάξη στις πόλεις και δεσμοί φιλίας που ενώνουν.","simple":"Στον μύθο του Πρωταγόρα, οι άνθρωποι είχαν φωτιά και τέχνες, αλλά μάλωναν και χάνονταν. Τους έλειπε κάτι: η «αιδώς» — ο σεβασμός και η ντροπή να κάνεις κακό — και η «δίκη», η αίσθηση του δίκαιου. Και ο Δίας είπε: αυτά να τα πάρουν όλοι, όχι μόνο λίγοι.\n\nΧωρίς σεβασμό, καμία τεχνολογία δεν μας κάνει ευτυχισμένους. Μια γειτονιά, μια οικογένεια, μια ομάδα στο διαδίκτυο ζει μόνο όταν όλοι μοιράζονται λίγο σεβασμό.","life":"Σε μια ομάδα μηνυμάτων της πολυκατοικίας, οι ένοικοι βρίζονται για το πάρκινγκ. Μια κυρία γράφει: «Ας μιλήσουμε σαν γείτονες· ελάτε για καφέ στην αυλή την Κυριακή.» Έρχονται οι μισοί. Το πρόβλημα λύνεται σε δέκα λεπτά.","am":"Πείτε: «Σήμερα θα φέρω λίγο σεβασμό σε κάθε συζήτηση.»","ex":"Πριν στείλετε σήμερα ένα μήνυμα ή ένα σχόλιο σε θυμό, περιμένετε δέκα λεπτά και ξαναγράψτε το με σεβασμό. Ή γράψτε ένα καλό σχόλιο σε κάποιον που το αξίζει.","pm":"Πού σήμερα πρόσθεσα σεβασμό; Και πού έλειψε;"},"en":{"t":"Respect and justice for all","tr":"Zeus feared that the whole human race might perish. So he sent Hermes to bring people respect and justice, so that there would be order in cities and bonds of friendship to unite them.","simple":"In Protagoras’ myth, people had fire and skills, yet they quarrelled and perished. Something was missing: aidos — respect and the shame of doing wrong — and dike, the sense of justice. And Zeus said: let everyone have these, not just a few.\n\nWithout respect, no technology makes us happy. A neighbourhood, a family, an online group lives only when all share a little respect.","life":"In the message group of an apartment block, residents insult each other over parking. One lady writes: “Let’s talk as neighbours — come for coffee in the yard on Sunday.” Half of them come. The problem is solved in ten minutes.","am":"Say: “Today I will bring a little respect to every conversation.”","ex":"Before sending an angry message or comment today, wait ten minutes and rewrite it with respect. Or write a kind comment to someone who deserves it.","pm":"Where did I add respect today? And where was it missing?"}},{"tag":["⏳ Ταπεινότητα","⏳ Humility"],"grc":"Πολλὰ γὰρ τὰ κωλύοντα εἰδέναι, ἥ τ᾽ ἀδηλότης καὶ βραχὺς ὢν ὁ βίος τοῦ ἀνθρώπου.","src":["Απόσπασμα DK 80 B4","Fragment DK 80 B4"],"el":{"t":"Η ζωή είναι σύντομη, η γνώση μεγάλη","tr":"Πολλά είναι αυτά που μας εμποδίζουν να γνωρίζουμε: η ασάφεια των πραγμάτων και το ότι η ζωή του ανθρώπου είναι σύντομη.","simple":"Ο Πρωταγόρας ήταν ο μεγαλύτερος δάσκαλος της εποχής του. Κι όμως παραδεχόταν ότι υπάρχουν μεγάλα ερωτήματα στα οποία δεν μπορεί να δώσει σίγουρη απάντηση — γιατί τα πράγματα είναι σκοτεινά και η ζωή σύντομη.\n\nΑυτή η ταπεινότητα δεν είναι αδυναμία. Μας κάνει πιο ανοιχτούς, πιο ήπιους με όσους σκέφτονται αλλιώς, και μας θυμίζει να μη χάνουμε τη σύντομη ζωή μας σε άσκοπους καβγάδες.","life":"Σε ένα οικογενειακό τραπέζι ο θείος και ο ανιψιός μαλώνουν για την πολιτική. Η γιαγιά λέει: «Παιδιά, κανείς μας δεν τα ξέρει όλα, και η ζωή είναι μικρή. Φάτε, που κρυώνει το φαγητό.» Γελούν. Το υπόλοιπο βράδυ είναι όμορφο.","am":"Πείτε: «Δεν τα ξέρω όλα. Και η ζωή είναι πολύ μικρή για να τη χαλάσω σε καβγάδες.»","ex":"Σε μια διαφωνία σήμερα, πείτε τουλάχιστον μία φορά: «Μπορεί να έχεις δίκιο σε αυτό.» Παρατηρήστε τι αλλάζει στη συζήτηση.","pm":"Σε ποιο θέμα ήμουν σήμερα πολύ σίγουρος;"},"en":{"t":"Life is short, knowledge is vast","tr":"Many things prevent us from knowing: the obscurity of the subject and the shortness of human life.","simple":"Protagoras was the greatest teacher of his age. Yet he admitted there are great questions to which he could give no certain answer — because things are obscure and life is short.\n\nThis humility is not weakness. It makes us more open, gentler with those who think differently, and reminds us not to waste our short life on pointless quarrels.","life":"At a family table, uncle and nephew argue about politics. Grandmother says: “Children, none of us knows everything, and life is short. Eat, the food is getting cold.” They laugh. The rest of the evening is lovely.","am":"Say: “I don’t know everything. And life is too short to spoil it with quarrels.”","ex":"In a disagreement today, say at least once: “You may be right about that.” Notice what changes in the conversation.","pm":"On what subject was I too sure of myself today?"}}]},
{"id":"he","emoji":"🔥","cls":"c-he","name":["Ηράκλειτος","Heraclitus"],"withName":["με τον Ηράκλειτο","with Heraclitus"],"years":["Περίπου 535–475 π.Χ. · Ο φιλόσοφος της αλλαγής","c. 535–475 BC · The philosopher of change"],"bio":["<p>Ο Ηράκλειτος γεννήθηκε στην <b>Έφεσο</b> της Μικράς Ασίας, σε αριστοκρατική οικογένεια. Παραχώρησε τη θέση του βασιλιά-ιερέα στον αδελφό του και προτίμησε να ζει μοναχικά, στοχαζόμενος. Τον έλεγαν «σκοτεινό», γιατί μιλούσε με σύντομα, βαθιά αινίγματα.</p><p>Πίστευε ότι ο κόσμος είναι σαν μια αιώνια φωτιά που αλλάζει συνέχεια, και ότι πίσω από όλες τις αλλαγές υπάρχει μια κρυφή τάξη, ο <b>Λόγος</b>. Τα αντίθετα — μέρα και νύχτα, αρρώστια και υγεία, πόλεμος και ειρήνη — είναι δεμένα μεταξύ τους.</p><p>Από το βιβλίο του σώθηκαν περίπου εκατό μικρές φράσεις. Μας βοηθούν να δεχτούμε τις αλλαγές της ζωής — έναν χωρισμό, μια μετακόμιση, τα γηρατειά — και να ψάξουμε βαθιά μέσα μας.</p>","<p>Heraclitus was born in <b>Ephesus</b> in Asia Minor, to an aristocratic family. He gave up the title of king-priest to his brother and preferred to live alone, in contemplation. They called him “the obscure”, because he spoke in short, deep riddles.</p><p>He believed the world is like an everlasting fire, always changing, and that behind all change there is a hidden order, the <b>Logos</b>. Opposites — day and night, sickness and health, war and peace — are bound together.</p><p>About a hundred short sentences survive from his book. They help us accept life’s changes — a separation, a move, old age — and search deep within.</p>"],"cheer":["Ο Ηράκλειτος έλεγε ότι η ψυχή έχει έναν λόγο που μεγαλώνει από μόνος του. Σήμερα μεγάλωσε λίγο ακόμη.","Heraclitus said the soul has a logos that increases itself. Today it grew a little more."],"fare":{"grc":"Ἀνθρώποισι πᾶσι μέτεστι γινώσκειν ἑωυτοὺς καὶ σωφρονεῖν.","src":["Ηράκλειτος, απόσπασμα DK 22 B116","Heraclitus, fragment DK 22 B116"],"tr":["Σε όλους τους ανθρώπους δόθηκε η δυνατότητα να γνωρίσουν τον εαυτό τους και να σκέφτονται σωστά.","All people have a share in knowing themselves and thinking soundly."]},"days":[{"tag":["🌊 Αλλαγή","🌊 Change"],"grc":"Ποταμοῖσι τοῖσιν αὐτοῖσιν ἐμβαίνουσιν ἕτερα καὶ ἕτερα ὕδατα ἐπιρρεῖ.","src":["Απόσπασμα DK 22 B12","Fragment DK 22 B12"],"el":{"t":"Δεν μπαίνεις δύο φορές στο ίδιο ποτάμι","tr":"Σε όσους μπαίνουν στα ίδια ποτάμια, κυλούν πάντα άλλα και άλλα νερά.","simple":"Το ποτάμι έχει το ίδιο όνομα, αλλά το νερό του δεν είναι ποτέ το ίδιο. Κι εμείς δεν είμαστε ίδιοι: κάθε μέρα αλλάζουμε λίγο. Γι’ αυτό λέμε «τα πάντα ρει» — όλα κυλούν.\n\nΑυτό μπορεί να μας φοβίζει, αλλά είναι και παρηγοριά. Ο πόνος του σήμερα δεν θα μείνει για πάντα ίδιος. Και κάθε μέρα μάς δίνεται μια καινούργια ευκαιρία.","life":"Μια γυναίκα χώρισε και πιστεύει ότι «τίποτα δεν θα ξαναγίνει όπως πριν». Έχει δίκιο — αλλά έναν χρόνο μετά, έχει βρει καινούργιους φίλους, μια ζωγραφική που αγαπά και μια ηρεμία που δεν ήξερε. Το ποτάμι κύλησε· και κουβάλησε και καινούργια νερά.","am":"Πείτε: «Σήμερα είναι μια καινούργια μέρα. Ούτε εγώ είμαι ακριβώς ο χθεσινός.»","ex":"Γράψτε μια αλλαγή στη ζωή σας που φοβάστε ή που σας πονά. Από κάτω, γράψτε μια αλλαγή του παρελθόντος που φοβηθήκατε αλλά τελικά σας έφερε κάτι καλό. Τι σας διδάσκει;","pm":"Τι άλλαξε σήμερα, έστω και λίγο, μέσα μου;"},"en":{"t":"You cannot step twice into the same river","tr":"Upon those who step into the same rivers, different and ever different waters flow.","simple":"The river has the same name, but its water is never the same. Nor are we the same: each day we change a little. That is why we say “everything flows”.\n\nThis can frighten us, but it is also a comfort. Today’s pain will not stay the same forever. And each day we are given a new chance.","life":"A woman has separated and believes “nothing will ever be as before”. She is right — but a year later she has new friends, a painting hobby she loves and a calm she never knew. The river flowed on, and brought new waters too.","am":"Say: “Today is a new day. Not even I am quite yesterday’s self.”","ex":"Write a change in your life that you fear or that hurts you. Below it, write a past change you feared but which in the end brought you something good. What does it teach you?","pm":"What changed in me today, even a little?"}},{"tag":["🧭 Χαρακτήρας","🧭 Character"],"grc":"Ἦθος ἀνθρώπῳ δαίμων.","src":["Απόσπασμα DK 22 B119","Fragment DK 22 B119"],"el":{"t":"Ο χαρακτήρας είναι η μοίρα μας","tr":"Ο χαρακτήρας του ανθρώπου είναι η μοίρα του.","simple":"Τρεις λέξεις μόνο, αλλά τεράστια σοφία. Οι αρχαίοι πίστευαν ότι η τύχη μας κρίνεται από έναν «δαίμονα», μια εξωτερική δύναμη. Ο Ηράκλειτος λέει: όχι, η μοίρα σου είναι κυρίως ο χαρακτήρας σου — οι συνήθειες, οι επιλογές, ο τρόπος που αντιδράς.\n\nΑυτό είναι καλό νέο: τον χαρακτήρα μας μπορούμε να τον αλλάξουμε, λίγο-λίγο, κάθε μέρα.","life":"Δύο συνάδελφοι χάνουν τη δουλειά τους την ίδια μέρα. Ο ένας θυμώνει με όλους και κλείνεται στο σπίτι. Ο άλλος τηλεφωνεί σε παλιούς γνωστούς, μαθαίνει κάτι καινούργιο, βοηθά έναν φίλο. Ίδια «τύχη», διαφορετική μοίρα.","am":"Πείτε: «Σήμερα χτίζω τη μοίρα μου με τις μικρές μου επιλογές.»","ex":"Διαλέξτε ένα μικρό χαρακτηριστικό που θα θέλατε να έχετε (π.χ. να είμαι συνεπής, να ακούω περισσότερο). Κάντε σήμερα μία μικρή πράξη που ταιριάζει σε αυτόν τον χαρακτήρα.","pm":"Ποια επιλογή μου σήμερα έδειξε τον χαρακτήρα που θέλω να έχω;"},"en":{"t":"Character is destiny","tr":"A person’s character is their destiny.","simple":"Only a few words, but great wisdom. The ancients believed our fortune was decided by a daimon, an outside power. Heraclitus says: no, your destiny is mostly your character — your habits, your choices, the way you react.\n\nThis is good news: our character can be changed, little by little, every day.","life":"Two colleagues lose their jobs on the same day. One gets angry with everyone and shuts himself in at home. The other calls old acquaintances, learns something new, helps a friend. Same “luck”, different destiny.","am":"Say: “Today I build my destiny with my small choices.”","ex":"Choose one small trait you would like to have (e.g. being reliable, listening more). Today do one small act that fits that character.","pm":"Which choice of mine today showed the character I want to have?"}},{"tag":["🔍 Αυτογνωσία","🔍 Self-knowledge"],"grc":"Ἐδιζησάμην ἐμεωυτόν.","src":["Απόσπασμα DK 22 B101","Fragment DK 22 B101"],"el":{"t":"Έψαξα τον εαυτό μου","tr":"Αναζήτησα τον εαυτό μου.","simple":"Ο Ηράκλειτος δεν είχε δάσκαλο. Λέει ότι όλα όσα έμαθε τα βρήκε ψάχνοντας μέσα του. Δεν εννοεί ότι κλείνεται στον εαυτό του, αλλά ότι παρατηρεί τι σκέφτεται, τι νιώθει, γιατί κάνει ό,τι κάνει.\n\nΣήμερα ψάχνουμε τα πάντα στο διαδίκτυο. Το πιο σημαντικό όμως ερώτημα — «ποιος είμαι, τι θέλω πραγματικά;» — δεν έχει απάντηση στο Google.","life":"Ένας φοιτητής σπουδάζει νομική επειδή το ήθελαν οι γονείς του. Αρχίζει να γράφει κάθε βράδυ τι τον ενθουσίασε μέσα στη μέρα. Μετά από δύο μήνες βλέπει ότι σχεδόν πάντα γράφει για παιδιά και για διδασκαλία. Μιλά με τους γονείς του για μια αλλαγή.","am":"Ρωτήστε τον εαυτό σας: «Τι νιώθω αυτή τη στιγμή;» και δώστε μια ειλικρινή απάντηση μιας λέξης.","ex":"Γράψτε σήμερα πέντε λεπτά, χωρίς να σταματήσετε, με θέμα: «Τι θέλω πραγματικά από τη ζωή μου;» Μη διορθώνετε, μην κρίνετε. Μετά υπογραμμίστε μία φράση που σας ξάφνιασε.","pm":"Τι ανακάλυψα σήμερα για τον εαυτό μου;"},"en":{"t":"I searched myself","tr":"I searched out myself.","simple":"Heraclitus had no teacher. He says everything he learned he found by searching within. He does not mean shutting himself away, but observing what he thinks, feels, and why he does what he does.\n\nToday we search everything online. But the most important question — “who am I, what do I truly want?” — has no answer on Google.","life":"A student studies law because his parents wanted it. He begins writing every evening what excited him during the day. After two months he sees he almost always writes about children and teaching. He talks with his parents about a change.","am":"Ask yourself: “What do I feel right now?” and give an honest one-word answer.","ex":"Write for five minutes today, without stopping, on: “What do I truly want from my life?” Do not correct, do not judge. Then underline one sentence that surprised you.","pm":"What did I discover about myself today?"}},{"tag":["☯️ Τα αντίθετα","☯️ Opposites"],"grc":"Νοῦσος ὑγιείην ἐποίησεν ἡδὺ καὶ ἀγαθόν, λιμὸς κόρον, κάματος ἀνάπαυσιν.","src":["Απόσπασμα DK 22 B111","Fragment DK 22 B111"],"el":{"t":"Η αρρώστια κάνει γλυκιά την υγεία","tr":"Η αρρώστια κάνει την υγεία γλυκιά και καλή· η πείνα, τον χορτασμό· η κούραση, την ξεκούραση.","simple":"Δεν καταλαβαίνουμε πόσο πολύτιμη είναι η υγεία, μέχρι να αρρωστήσουμε. Το νερό είναι πιο νόστιμο όταν διψάμε. Ο ύπνος πιο γλυκός μετά από κόπο.\n\nΟ Ηράκλειτος δεν λέει ότι ο πόνος είναι καλός. Λέει ότι τα αντίθετα είναι δεμένα: οι δύσκολες στιγμές μάς μαθαίνουν να εκτιμούμε τις καλές. Και όταν περνάμε μια δυσκολία, ξέρουμε ότι το αντίθετό της υπάρχει κάπου μπροστά.","life":"Ένας άντρας περνά δύο εβδομάδες στο κρεβάτι με σπασμένο πόδι. Όταν βγαίνει ξανά για περίπατο στη γειτονιά, κλαίει από χαρά βλέποντας τα δέντρα. «Περπατούσα εδώ χρόνια και δεν τα είχα δει ποτέ.»","am":"Πείτε «ευχαριστώ» για τρία απλά πράγματα που συνήθως θεωρείτε δεδομένα: ανάσα, νερό, ένα κρεβάτι.","ex":"Θυμηθείτε μια δύσκολη περίοδο του παρελθόντος. Γράψτε τι σας έμαθε να εκτιμάτε. Αν περνάτε τώρα μια δυσκολία, γράψτε ποιο είναι το «αντίθετό» της που περιμένετε — και ένα βήμα προς αυτό.","pm":"Ποιο απλό αγαθό εκτίμησα σήμερα περισσότερο από ό,τι συνήθως;"},"en":{"t":"Sickness makes health sweet","tr":"Sickness makes health sweet and good; hunger, fullness; weariness, rest.","simple":"We do not realise how precious health is until we fall ill. Water tastes better when we are thirsty. Sleep is sweeter after effort.\n\nHeraclitus does not say pain is good. He says opposites are bound together: hard times teach us to value good ones. And when we go through a difficulty, we know its opposite exists somewhere ahead.","life":"A man spends two weeks in bed with a broken leg. When he first goes out for a walk in the neighbourhood again, he weeps with joy seeing the trees. “I walked here for years and never saw them.”","am":"Say “thank you” for three simple things you usually take for granted: breath, water, a bed.","ex":"Recall a hard period in your past. Write what it taught you to value. If you are going through a difficulty now, write what its “opposite” is that you are waiting for — and one step towards it.","pm":"Which simple good did I value more today than usual?"}},{"tag":["😠 Θυμός","😠 Anger"],"grc":"Θυμῷ μάχεσθαι χαλεπόν· ὃ γὰρ ἂν θέλῃ, ψυχῆς ὠνεῖται.","src":["Απόσπασμα DK 22 B85","Fragment DK 22 B85"],"el":{"t":"Ο θυμός πληρώνεται με ψυχή","tr":"Είναι δύσκολο να παλέψεις με τον θυμό· γιατί ό,τι κι αν θέλει, το αγοράζει πληρώνοντας με την ψυχή.","simple":"Ο Ηράκλειτος παραδέχεται ότι ο θυμός είναι δυνατός αντίπαλος. Αλλά μας προειδοποιεί: κάθε φορά που τον αφήνουμε να κάνει αυτό που θέλει — να φωνάξουμε, να βρίσουμε, να σπάσουμε — πληρώνουμε. Και το νόμισμα είναι η ψυχή μας: η ηρεμία μας, οι σχέσεις μας, η υγεία μας.\n\nΔεν χρειάζεται να μη θυμώνουμε ποτέ. Χρειάζεται να μην αφήνουμε τον θυμό να πληρώνει με τα δικά μας χρήματα.","life":"Ένας οδηγός θυμώνει με έναν άλλον στο φανάρι και τον κυνηγά με το αυτοκίνητο. Κερδίζει δέκα δευτερόλεπτα «νίκης» — και χάνει όλη τη μέρα του σε ένταση, πονοκέφαλο και μια κλήση από την Τροχαία. Ακριβό τίμημα για λίγο θυμό.","am":"Πείτε: «Ο θυμός σήμερα δεν θα ψωνίσει με τη δική μου ψυχή.»","ex":"Όταν νιώσετε θυμό σήμερα, ρωτήστε: «Τι θα μου κοστίσει αν τον αφήσω να αποφασίσει;» Μετρήστε αργά ως το δέκα ή απομακρυνθείτε για λίγα λεπτά. Αποφασίστε μόνο όταν ηρεμήσετε.","pm":"Πόσο πλήρωσα σήμερα στον θυμό; Πόσο γλίτωσα;"},"en":{"t":"Anger is paid for with the soul","tr":"It is hard to fight against anger; for whatever it wants, it buys at the price of the soul.","simple":"Heraclitus admits that anger is a strong opponent. But he warns us: each time we let it do what it wants — shout, insult, smash — we pay. And the currency is our soul: our calm, our relationships, our health.\n\nWe need not never be angry. We need not let anger pay with our money.","life":"A driver gets angry with another at a traffic light and chases him. He wins ten seconds of “victory” — and loses his whole day to tension, a headache and a traffic fine. A high price for a little anger.","am":"Say: “Today anger will not shop with my soul.”","ex":"When you feel angry today, ask: “What will it cost me if I let it decide?” Count slowly to ten or step away for a few minutes. Decide only when you are calm.","pm":"How much did I pay anger today? How much did I save?"}},{"tag":["🌟 Ελπίδα","🌟 Hope"],"grc":"Ἐὰν μὴ ἔλπηται, ἀνέλπιστον οὐκ ἐξευρήσει, ἀνεξερεύνητον ἐὸν καὶ ἄπορον.","src":["Απόσπασμα DK 22 B18","Fragment DK 22 B18"],"el":{"t":"Αν δεν ελπίζεις, δεν θα βρεις το ανέλπιστο","tr":"Αν δεν ελπίζει κανείς, δεν θα βρει το ανέλπιστο, γιατί αυτό είναι δυσεύρετο και δύσβατο.","simple":"Κάποια καλά πράγματα στη ζωή φαίνονται αδύνατα — ανέλπιστα. Ο Ηράκλειτος λέει: για να τα βρεις, πρέπει πρώτα να ελπίζεις. Η ελπίδα είναι αυτή που μας κάνει να ψάχνουμε, να δοκιμάζουμε, να μη σταματάμε.\n\nΟ απελπισμένος δεν ψάχνει πια. Και έτσι, ακόμη κι αν η λύση ήταν δίπλα του, δεν τη βλέπει.","life":"Ένα ζευγάρι ψάχνει για χρόνια να υιοθετήσει παιδί και όλα πάνε στραβά. Κάποιοι τους λένε να τα παρατήσουν. Εκείνοι συνεχίζουν να ελπίζουν, να ρωτούν, να γράφουν αιτήσεις. Ένα πρωί χτυπά το τηλέφωνο. Το ανέλπιστο ήρθε.","am":"Πείτε: «Σήμερα αφήνω μια μικρή πόρτα ανοιχτή για κάτι καλό που δεν περιμένω.»","ex":"Γράψτε κάτι για το οποίο έχετε χάσει την ελπίδα. Από κάτω, γράψτε ένα μικρό, νέο βήμα που δεν έχετε δοκιμάσει ακόμη. Κάντε το μέσα στην εβδομάδα. Αν νιώθετε ότι έχετε χάσει την ελπίδα για όλα, μιλήστε σήμερα με τον γιατρό σας ή με έναν άνθρωπο που εμπιστεύεστε.","pm":"Πού σήμερα είδα, έστω και λίγο, ελπίδα;"},"en":{"t":"Without hope you won’t find the unhoped-for","tr":"If one does not hope, one will not find the unhoped-for, since it is hard to find and hard to reach.","simple":"Some good things in life seem impossible — beyond hope. Heraclitus says: to find them, you must first hope. Hope is what makes us search, try, and keep going.\n\nThe one in despair no longer searches. And so, even if the solution was right beside them, they do not see it.","life":"A couple tries for years to adopt a child and everything goes wrong. Some tell them to give up. They keep hoping, asking, filling in forms. One morning the phone rings. The unhoped-for has come.","am":"Say: “Today I leave a small door open for something good I don’t expect.”","ex":"Write something you have lost hope about. Below it, write one small new step you have not tried yet. Do it this week. If you feel you have lost hope in everything, speak today with your doctor or someone you trust.","pm":"Where did I see a little hope today?"}},{"tag":["🌌 Το βάθος της ψυχής","🌌 Depth of the soul"],"grc":"Ψυχῆς πείρατα ἰὼν οὐκ ἂν ἐξεύροιο, πᾶσαν ἐπιπορευόμενος ὁδόν· οὕτω βαθὺν λόγον ἔχει.","src":["Απόσπασμα DK 22 B45","Fragment DK 22 B45"],"el":{"t":"Η ψυχή δεν έχει σύνορα","tr":"Τα όρια της ψυχής δεν θα τα βρεις, όσο κι αν προχωρήσεις, όποιον δρόμο κι αν πάρεις· τόσο βαθύ λόγο έχει.","simple":"Μπορούμε να ταξιδέψουμε σε όλο τον κόσμο. Μπορούμε να μετρήσουμε την απόσταση ως τα αστέρια. Την ψυχή όμως δεν μπορούμε να τη μετρήσουμε· είναι πιο βαθιά από κάθε ωκεανό.\n\nΑυτό σημαίνει ότι κανένας άνθρωπος δεν είναι «λίγος». Μέσα σε κάθε μας μέρα, ακόμη και στην πιο απλή, υπάρχει ένα βάθος που δεν έχουμε εξερευνήσει. Και ότι υπάρχει πάντα κάτι ακόμη να μάθουμε για τον εαυτό μας και για τους άλλους.","life":"Μια εγγονή ηχογραφεί τη γιαγιά της να διηγείται τη ζωή της. Νόμιζε ότι την ήξερε καλά. Ακούει ιστορίες για πόλεμο, έρωτα, θάρρος και πόνο που δεν είχε φανταστεί. «Γιαγιά, είσαι ολόκληρος κόσμος», της λέει.","am":"Πείτε: «Μέσα μου, και μέσα σε κάθε άνθρωπο που θα δω σήμερα, υπάρχει ένα βάθος που δεν ξέρω.»","ex":"Κάντε σήμερα σε κάποιον που νομίζετε ότι ξέρετε καλά μια βαθιά ερώτηση: «Ποια ήταν η πιο ευτυχισμένη μέρα της ζωής σου;» ή «Τι σε έκανε αυτό που είσαι;» Ακούστε χωρίς να διακόψετε.","pm":"Τι καινούργιο ανακάλυψα σήμερα σε έναν άνθρωπο ή στον εαυτό μου;"},"en":{"t":"The soul has no borders","tr":"You would not find the limits of the soul, however far you went, travelling every road; so deep is its logos.","simple":"We can travel the whole world. We can measure the distance to the stars. But the soul we cannot measure; it is deeper than any ocean.\n\nThis means no person is “small”. Within every day, even the simplest, there is a depth we have not explored. And there is always something more to learn about ourselves and others.","life":"A granddaughter records her grandmother telling her life story. She thought she knew her well. She hears stories of war, love, courage and pain she had never imagined. “Grandma, you are a whole world,” she says.","am":"Say: “In me, and in every person I see today, there is a depth I do not know.”","ex":"Today ask someone you think you know well a deep question: “What was the happiest day of your life?” or “What made you who you are?” Listen without interrupting.","pm":"What new thing did I discover today in a person or in myself?"}}]},
{"id":"pl","emoji":"🕳️","cls":"c-pl","name":["Πλάτων","Plato"],"withName":["με τον Πλάτωνα","with Plato"],"years":["427–347 π.Χ. · Ο φιλόσοφος της σπηλιάς","427–347 BC · The philosopher of the cave"],"bio":["<p>Ο Πλάτων γεννήθηκε στην <b>Αθήνα</b>, σε αριστοκρατική οικογένεια. Στα νιάτα του ήταν παλαιστής — λένε ότι το όνομά του σημαίνει «ο πλατύς», για τους ώμους του — και ήθελε να γίνει ποιητής και πολιτικός. Όταν όμως γνώρισε τον <b>Σωκράτη</b>, έκαψε τα ποιήματά του και αφοσιώθηκε στη φιλοσοφία.</p><p>Όταν η Αθήνα καταδίκασε τον δάσκαλό του σε θάνατο, ο Πλάτων συγκλονίστηκε. Ταξίδεψε για χρόνια και, γυρνώντας, ίδρυσε την <b>Ακαδημία</b>, το πρώτο «πανεπιστήμιο» της Ευρώπης, που λειτούργησε σχεδόν 900 χρόνια.</p><p>Έγραψε τους «Διαλόγους», όπου ο Σωκράτης συζητά με νέους και σοφούς για τη δικαιοσύνη, την αγάπη, την ψυχή. Ένας φιλόσοφος είπε κάποτε ότι όλη η δυτική φιλοσοφία είναι «υποσημειώσεις στον Πλάτωνα». Μας μαθαίνει να βλέπουμε πίσω από τις σκιές.</p>","<p>Plato was born in <b>Athens</b> to an aristocratic family. As a young man he was a wrestler — some say his name, “the broad one”, came from his shoulders — and wanted to be a poet and politician. But when he met <b>Socrates</b>, he burned his poems and devoted himself to philosophy.</p><p>When Athens condemned his teacher to death, Plato was shaken. He travelled for years and, on returning, founded the <b>Academy</b>, Europe’s first “university”, which lasted almost 900 years.</p><p>He wrote the “Dialogues”, in which Socrates discusses justice, love and the soul with young people and sages. A philosopher once said that all of Western philosophy is “footnotes to Plato”. He teaches us to see behind the shadows.</p>"],"cheer":["Ο Πλάτων έλεγε ότι η φιλοσοφία ξεκινά από το θαύμα. Σήμερα θαυμάσατε κάτι.","Plato said philosophy begins in wonder. Today you wondered at something."],"fare":{"grc":"Ἀλλ᾽ ἂν ἐμοὶ πειθώμεθα, τῆς ἄνω ὁδοῦ ἀεὶ ἑξόμεθα καὶ δικαιοσύνην μετὰ φρονήσεως παντὶ τρόπῳ ἐπιτηδεύσομεν.","src":["Πλάτων, Πολιτεία 621c","Plato, Republic 621c"],"tr":["Αν με ακούσουμε, θα κρατάμε πάντα τον δρόμο που ανεβαίνει, και θα ασκούμε με κάθε τρόπο τη δικαιοσύνη μαζί με τη σοφία.","If we listen to me, we shall always keep to the upward path, and practise justice with wisdom in every way."]},"days":[{"tag":["✨ Το θαύμα","✨ Wonder"],"grc":"Μάλα γὰρ φιλοσόφου τοῦτο τὸ πάθος, τὸ θαυμάζειν· οὐ γὰρ ἄλλη ἀρχὴ φιλοσοφίας ἢ αὕτη.","src":["Θεαίτητος 155d","Theaetetus 155d"],"el":{"t":"Η φιλοσοφία ξεκινά από το θαύμα","tr":"Αυτό είναι το κατεξοχήν συναίσθημα του φιλοσόφου: το να θαυμάζει. Γιατί η φιλοσοφία δεν έχει άλλη αρχή από αυτή.","simple":"Τα μικρά παιδιά ρωτούν συνέχεια «γιατί;»: γιατί ο ουρανός είναι γαλάζιος, γιατί πεθαίνουν τα λουλούδια, γιατί είμαι εγώ εγώ. Μεγαλώνοντας, συχνά χάνουμε αυτή την απορία. Όλα μάς φαίνονται συνηθισμένα.\n\nΟ Πλάτων λέει ότι η σοφία αρχίζει όταν ξαναβρίσκουμε το θαύμα: όταν κοιτάμε ένα ηλιοβασίλεμα, ένα μωρό, τα αστέρια, και λέμε «πόσο παράξενο και υπέροχο είναι αυτό!».","life":"Ένας παππούς βγαίνει με την εγγονή του να δουν το φεγγάρι με ένα μικρό τηλεσκόπιο. Η μικρή φωνάζει: «Έχει βουνά!» Ο παππούς, που είχε δει το φεγγάρι χιλιάδες φορές, νιώθει για πρώτη φορά μετά από χρόνια το ίδιο δέος.","am":"Κοιτάξτε έξω από το παράθυρο και βρείτε ένα πράγμα που σας φαίνεται, αν το σκεφτείτε, θαυμαστό.","ex":"Κάντε σήμερα μια ερώτηση «γιατί;» για κάτι καθημερινό (γιατί πέφτουν τα φύλλα; γιατί χασμουριόμαστε;) και ψάξτε την απάντηση — σε ένα βιβλίο, στο διαδίκτυο ή ρωτώντας κάποιον. Χαρείτε την απορία.","pm":"Τι με έκανε σήμερα να θαυμάσω;"},"en":{"t":"Philosophy begins in wonder","tr":"This is above all the feeling of a philosopher: wonder. For philosophy has no other beginning than this.","simple":"Small children constantly ask “why?”: why is the sky blue, why do flowers die, why am I me. Growing up, we often lose that wonder. Everything seems ordinary.\n\nPlato says wisdom begins when we rediscover wonder: when we look at a sunset, a baby, the stars, and say “how strange and wonderful this is!”.","life":"A grandfather goes out with his granddaughter to look at the moon through a small telescope. The girl cries out: “It has mountains!” The grandfather, who had seen the moon thousands of times, feels for the first time in years the same awe.","am":"Look out of the window and find one thing that, if you think about it, seems marvellous.","ex":"Ask a “why?” question today about something everyday (why do leaves fall? why do we yawn?) and look for the answer — in a book, online or by asking someone. Enjoy the wondering.","pm":"What made me wonder today?"}},{"tag":["🐎 Ο ηνίοχος","🐎 The charioteer"],"grc":"Ἐοικέτω δὴ συμφύτῳ δυνάμει ὑποπτέρου ζεύγους τε καὶ ἡνιόχου.","src":["Φαίδρος 246a","Phaedrus 246a"],"el":{"t":"Η ψυχή σαν άρμα με δύο άλογα","tr":"Ας παρομοιάσουμε την ψυχή με τη δύναμη που ενώνει ένα φτερωτό ζευγάρι αλόγων και τον ηνίοχό τους.","simple":"Ο Πλάτων φαντάζεται την ψυχή σαν ένα άρμα. Το ένα άλογο είναι ευγενικό και θέλει να πάει ψηλά: είναι το καλό μας θάρρος, η τιμή. Το άλλο είναι ατίθασο και τραβά προς τις επιθυμίες της στιγμής. Και ο ηνίοχος είναι ο νους, που κρατά τα γκέμια.\n\nΤο ζητούμενο δεν είναι να σκοτώσουμε το ατίθασο άλογο, αλλά να μάθουμε να το οδηγούμε. Όταν ο νους, η καρδιά και οι επιθυμίες τρέχουν μαζί, το άρμα πετά.","life":"Μια φοιτήτρια θέλει να διαβάσει για τις εξετάσεις (ο νους), αλλά και να βγει με φίλους (η επιθυμία). Αντί να παλεύει ή να υποχωρεί ολοκληρωτικά, κανονίζει: τρεις ώρες διάβασμα και μετά έξοδο. Και τα δύο «άλογα» είναι ικανοποιημένα· το άρμα προχωρά.","am":"Ρωτήστε: «Ποιο άλογο θα τραβήξει σήμερα πιο δυνατά; Και πώς θα το οδηγήσω;»","ex":"Γράψτε μια κατάσταση όπου νιώθετε «διχασμένοι» (θέλω το ένα, αλλά και το άλλο). Γράψτε τι λέει ο νους, τι λέει η καρδιά, τι λέει η επιθυμία. Βρείτε μια λύση που τα παίρνει υπόψη και τα τρία.","pm":"Ποιο άλογο κράτησε σήμερα τα γκέμια — και ποιο έπρεπε;"},"en":{"t":"The soul as a chariot with two horses","tr":"Let us liken the soul to
