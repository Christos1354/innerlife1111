ουλειά, στις παρέες, γνέφουμε σαν να καταλάβαμε, ενώ δεν καταλάβαμε τίποτα. Έτσι δεν μαθαίνουμε ποτέ.\n\nΤο «δεν ξέρω» δεν είναι ντροπή· είναι η πόρτα της μάθησης. Και σήμερα, που κυκλοφορούν τόσες ψεύτικες ειδήσεις, είναι και σοφία: να μη λέμε σίγουρα αυτό που απλώς ακούσαμε.","life":"Ένας νέος γιατρός δεν είναι σίγουρος για μια διάγνωση. Αντί να προσποιηθεί, λέει στον ασθενή: «Δεν είμαι βέβαιος· θα ρωτήσω έναν πιο έμπειρο συνάδελφο.» Ο έμπειρος γιατρός βρίσκει κάτι σημαντικό. Το ειλικρινές «δεν ξέρω» βοήθησε τον ασθενή.","am":"Πείτε: «Σήμερα δεν θα ντραπώ να πω “δεν ξέρω”.»","ex":"Σήμερα, τουλάχιστον μία φορά, πείτε «δεν το ξέρω, εξήγησέ μου» σε μια κουβέντα. Και πριν προωθήσετε μια είδηση, ρωτήστε: «Το ξέρω σίγουρα ή απλώς το διάβασα κάπου;»","pm":"Πού σήμερα προσποιήθηκα ότι ξέρω; Πού είπα τίμια «δεν ξέρω»;"},"en":{"t":"Know what you don’t know","tr":"When you know something, say that you know it; when you do not know it, say that you do not know it. That is knowledge.","simple":"Many pretend to know, out of shame or ego. At school, at work, among friends, we nod as if we understood, when we did not. So we never learn.\n\n“I don’t know” is not shameful; it is the door to learning. And today, with so much fake news around, it is also wisdom: not to state as certain what we merely heard.","life":"A young doctor is unsure of a diagnosis. Instead of pretending, he tells the patient: “I’m not certain; I’ll ask a more experienced colleague.” The experienced doctor finds something important. The honest “I don’t know” helped the patient.","am":"Say: “Today I won’t be ashamed to say ‘I don’t know’.”","ex":"Today, at least once, say “I don’t know, explain it to me” in a conversation. And before forwarding a news story, ask: “Do I know this for sure, or did I just read it somewhere?”","pm":"Where did I pretend to know today? Where did I honestly say “I don’t know”?"}},{"tag":["👥 Δάσκαλοι παντού","👥 Teachers everywhere"],"grc":"三人行，必有我師焉。擇其善者而從之，其不善者而改之。","src":["Συνομιλίες 7.22","Analects 7.22"],"el":{"t":"Ανάμεσα σε τρεις, βρίσκω δάσκαλο","tr":"Όταν περπατώ με δύο άλλους, σίγουρα ένας θα μου γίνει δάσκαλος. Διαλέγω τα καλά τους και τα ακολουθώ· βλέπω τα κακά τους και τα διορθώνω στον εαυτό μου.","simple":"Κάθε άνθρωπος που συναντάμε μπορεί να μας διδάξει κάτι. Ο καλός άνθρωπος μάς δείχνει τι να μιμηθούμε. Ο δύσκολος άνθρωπος μάς δείχνει τι να διορθώσουμε στον εαυτό μας — γιατί συχνά αυτό που μας ενοχλεί στους άλλους το έχουμε κι εμείς.\n\nΈτσι, καμία συνάντηση δεν πάει χαμένη. Ακόμη και ο πιο εκνευριστικός συνάδελφος γίνεται δάσκαλος.","life":"Μια γυναίκα εκνευρίζεται με μια φίλη της που διακόπτει συνέχεια. Ένα βράδυ προσέχει τον εαυτό της και ανακαλύπτει ότι κι εκείνη διακόπτει συχνά. Από τότε προσπαθεί να ακούει ως το τέλος. Ευχαριστεί μέσα της τη φίλη της για το μάθημα.","am":"Πείτε: «Κάθε άνθρωπος που θα συναντήσω σήμερα είναι και δάσκαλός μου.»","ex":"Σκεφτείτε δύο ανθρώπους που θα δείτε σήμερα. Για τον έναν, γράψτε μια καλή συνήθεια που θα θέλατε να μιμηθείτε. Για τον άλλο, μια συνήθεια που σας ενοχλεί — και ρωτήστε τίμια: «Μήπως την έχω κι εγώ;»","pm":"Ποιος ήταν σήμερα ο δάσκαλός μου, και τι μου έμαθε;"},"en":{"t":"Among three, I find a teacher","tr":"When I walk with two others, one of them will surely be my teacher. I choose their good qualities and follow them; I see their faults and correct them in myself.","simple":"Every person we meet can teach us something. A good person shows us what to imitate. A difficult person shows us what to correct in ourselves — because what bothers us in others is often in us too.\n\nSo no encounter is wasted. Even the most annoying colleague becomes a teacher.","life":"A woman is irritated by a friend who keeps interrupting. One evening she watches herself and discovers that she too interrupts often. From then on she tries to listen to the end. Inwardly she thanks her friend for the lesson.","am":"Say: “Every person I meet today is also my teacher.”","ex":"Think of two people you will see today. For one, write a good habit you would like to imitate. For the other, a habit that bothers you — and ask honestly: “Do I have it too?”","pm":"Who was my teacher today, and what did they teach me?"}},{"tag":["🔧 Λάθη","🔧 Mistakes"],"grc":"過而不改，是謂過矣。","src":["Συνομιλίες 15.30","Analects 15.30"],"el":{"t":"Το πραγματικό λάθος","tr":"Να κάνεις ένα λάθος και να μην το διορθώνεις — αυτό είναι το πραγματικό λάθος.","simple":"Όλοι κάνουμε λάθη. Αυτό είναι ανθρώπινο και φυσικό. Ο Κομφούκιος λέει ότι το λάθος δεν είναι το πρόβλημα· πρόβλημα είναι όταν το κρύβουμε, το δικαιολογούμε ή το επαναλαμβάνουμε.\n\nΚάθε λάθος που διορθώνουμε γίνεται μάθημα. Κάθε λάθος που αρνούμαστε γίνεται συνήθεια.","life":"Ένας πατέρας φώναξε άδικα στην κόρη του. Το βράδυ πηγαίνει στο δωμάτιό της και της λέει: «Έκανα λάθος. Συγγνώμη.» Η μικρή τον αγκαλιάζει. Εκείνο το βράδυ της έμαθε κάτι πιο σημαντικό από χίλιες συμβουλές: πώς διορθώνει κανείς ένα λάθος.","am":"Πείτε: «Σήμερα δεν θα φοβηθώ τα λάθη μου. Θα τα διορθώσω.»","ex":"Σκεφτείτε ένα πρόσφατο λάθος σας που δεν έχετε διορθώσει (μια απότομη κουβέντα, μια ξεχασμένη υπόσχεση). Κάντε σήμερα ένα βήμα διόρθωσης: μια συγγνώμη, ένα τηλεφώνημα, μια πράξη.","pm":"Ποιο λάθος μου διόρθωσα σήμερα;"},"en":{"t":"The real mistake","tr":"To make a mistake and not correct it — that is the real mistake.","simple":"We all make mistakes. That is human and natural. Confucius says the mistake is not the problem; the problem is when we hide it, excuse it or repeat it.\n\nEvery mistake we correct becomes a lesson. Every mistake we deny becomes a habit.","life":"A father shouted unfairly at his daughter. In the evening he goes to her room and says: “I was wrong. I’m sorry.” The little girl hugs him. That evening he taught her something more important than a thousand pieces of advice: how to correct a mistake.","am":"Say: “Today I won’t fear my mistakes. I will correct them.”","ex":"Think of a recent mistake you have not corrected (a sharp word, a forgotten promise). Take one step to correct it today: an apology, a call, an action.","pm":"Which mistake of mine did I correct today?"}},{"tag":["🌙 Τρεις ερωτήσεις","🌙 Three questions"],"grc":"曾子曰：「吾日三省吾身：為人謀而不忠乎？與朋友交而不信乎？傳不習乎？」","src":["Συνομιλίες 1.4 (λόγια του μαθητή του Τσενγκ Τσε)","Analects 1.4 (words of his student Zengzi)"],"el":{"t":"Η καθημερινή εξέταση","tr":"Ο μαθητής Τσενγκ Τσε είπε: «Κάθε μέρα εξετάζω τον εαυτό μου σε τρία πράγματα: Όταν βοήθησα κάποιον, ήμουν πιστός; Με τους φίλους μου, ήμουν αξιόπιστος; Όσα έμαθα, τα εφάρμοσα;»","simple":"Τρεις ερωτήσεις για κάθε βράδυ: Για τη δουλειά και τη βοήθεια προς τους άλλους — έδωσα τον καλύτερο εαυτό μου; Για τις σχέσεις — κράτησα τον λόγο μου; Για τη μάθηση — έκανα πράξη αυτό που ξέρω;\n\nΟ Πυθαγόρας, στην άλλη άκρη του κόσμου, πρότεινε σχεδόν το ίδιο. Όταν δύο σοφοί που δεν γνωρίστηκαν ποτέ λένε το ίδιο πράγμα, αξίζει να το προσέξουμε.","life":"Μια νοσηλεύτρια, πριν κοιμηθεί, κάνει στον εαυτό της τις τρεις ερωτήσεις. Ένα βράδυ θυμάται ότι υποσχέθηκε σε μια ασθενή να της φέρει ένα περιοδικό και το ξέχασε. Το επόμενο πρωί το φέρνει πρώτο πράγμα. Η ασθενής δακρύζει από χαρά.","am":"Γράψτε τις τρεις ερωτήσεις σε ένα χαρτάκι δίπλα στο κρεβάτι σας.","ex":"Απόψε, πριν κοιμηθείτε, απαντήστε γραπτά στις τρεις ερωτήσεις: 1) Ήμουν πιστός σε ό,τι έκανα για άλλους; 2) Ήμουν αξιόπιστος με τους φίλους μου; 3) Εφάρμοσα όσα έμαθα; Χωρίς αυστηρότητα — με ειλικρίνεια και καλοσύνη.","pm":"Τι απαντώ σήμερα στις τρεις ερωτήσεις του Τσενγκ Τσε;"},"en":{"t":"The daily examination","tr":"The student Zengzi said: “Each day I examine myself on three points: In helping others, was I faithful? With my friends, was I trustworthy? What I have learned, have I practised?”","simple":"Three questions for every evening: About work and helping others — did I give my best? About relationships — did I keep my word? About learning — did I put into practice what I know?\n\nPythagoras, at the other end of the world, proposed almost the same. When two sages who never met say the same thing, it is worth noticing.","life":"A nurse, before sleeping, asks herself the three questions. One evening she remembers she promised a patient a magazine and forgot. The next morning she brings it first thing. The patient is moved to tears.","am":"Write the three questions on a slip of paper beside your bed.","ex":"Tonight, before sleeping, answer the three questions in writing: 1) Was I faithful in what I did for others? 2) Was I trustworthy with my friends? 3) Did I practise what I learned? Not harshly — honestly and kindly.","pm":"How do I answer Zengzi’s three questions today?"}}]},
{"id":"sp","emoji":"🔭","cls":"c-sp","origLbl":["Το λατινικό κείμενο:","The original Latin:"],"name":["Μπαρούχ Σπινόζα","Baruch Spinoza"],"withName":["με τον Σπινόζα","with Spinoza"],"years":["1632–1677 · Ο φιλόσοφος που κατάλαβε τα συναισθήματα","1632–1677 · The philosopher who understood the emotions"],"bio":["<p>Ο Σπινόζα γεννήθηκε στο <b>Άμστερνταμ</b>, σε οικογένεια Πορτογάλων Εβραίων προσφύγων. Ήταν ο πιο λαμπρός μαθητής της κοινότητάς του, αλλά οι ελεύθερες ιδέες του για τον Θεό και τη φύση έκαναν την κοινότητα να τον αποβάλει όταν ήταν μόλις 23 ετών.</p><p>Έζησε απλά, κερδίζοντας το ψωμί του <b>λειαίνοντας φακούς</b> για γυαλιά, μικροσκόπια και τηλεσκόπια. Αρνήθηκε μια θέση καθηγητή στο Πανεπιστήμιο της Χαϊδελβέργης για να μείνει ελεύθερος να σκέφτεται. Πέθανε νέος, στα 44, πιθανότατα από τη σκόνη του γυαλιού.</p><p>Το μεγάλο του έργο, η <b>«Ηθική»</b>, είναι γραμμένο σαν βιβλίο γεωμετρίας. Εξηγεί με ψυχραιμία πώς λειτουργούν ο φόβος, ο θυμός, η ζήλια και η χαρά — πολύ πριν από την ψυχολογία. Το μήνυμά του: όταν καταλαβαίνουμε ένα συναίσθημα, παύει να μας κυβερνά.</p>","<p>Spinoza was born in <b>Amsterdam</b> to a family of Portuguese Jewish refugees. He was the brightest student of his community, but his free ideas about God and nature led the community to expel him when he was only 23.</p><p>He lived simply, earning his bread by <b>grinding lenses</b> for spectacles, microscopes and telescopes. He refused a professorship at the University of Heidelberg to stay free to think. He died young, at 44, probably from the glass dust.</p><p>His great work, the <b>“Ethics”</b>, is written like a geometry book. It explains calmly how fear, anger, jealousy and joy work — long before psychology. His message: when we understand an emotion, it stops ruling us.</p>"],"cheer":["Ο Σπινόζα έλεγε ότι η χαρά είναι το πέρασμα σε κάτι καλύτερο. Σήμερα κάνατε ένα τέτοιο πέρασμα.","Spinoza said joy is the passage to something greater. Today you made such a passage."],"fare":{"grc":"Sed omnia praeclara tam difficilia quam rara sunt.","src":["Σπινόζα, Ηθική, μέρος Ε΄, πρόταση 42, σχόλιο (η τελευταία φράση του βιβλίου)","Spinoza, Ethics V, proposition 42, scholium (the book’s last sentence)"],"tr":["Όλα τα υπέροχα πράγματα είναι τόσο δύσκολα όσο και σπάνια.","All things excellent are as difficult as they are rare."]},"days":[{"tag":["🔎 Κατανόηση","🔎 Understanding"],"grc":"Sedulo curavi humanas actiones non ridere, non lugere, neque detestari, sed intelligere.","src":["Πολιτική Πραγματεία Α΄ 4","Political Treatise I 4"],"el":{"t":"Ούτε γέλιο, ούτε κλάμα, αλλά κατανόηση","tr":"Φρόντισα με επιμέλεια να μη γελώ με τις ανθρώπινες πράξεις, να μην κλαίω γι’ αυτές, ούτε να τις μισώ, αλλά να τις καταλαβαίνω.","simple":"Όταν κάποιος κάνει κάτι που δεν μας αρέσει, συνήθως αντιδρούμε με τρεις τρόπους: τον κοροϊδεύουμε, λυπόμαστε ή θυμώνουμε. Ο Σπινόζα προτείνει έναν τέταρτο δρόμο: να καταλάβουμε γιατί το έκανε.\n\nΚατανόηση δεν σημαίνει ότι συμφωνούμε ή ότι δικαιολογούμε το κακό. Σημαίνει ότι βλέπουμε τις αιτίες. Και όποιος βλέπει τις αιτίες, μπορεί να βοηθήσει να αλλάξουν.","life":"Ένας δάσκαλος έχει έναν μαθητή που φέρεται επιθετικά. Αντί να τον τιμωρεί συνέχεια, ψάχνει να καταλάβει. Μαθαίνει ότι στο σπίτι του γίνονται καβγάδες κάθε βράδυ. Του δίνει μια ευθύνη στην τάξη και του μιλά ήρεμα. Σε δύο μήνες το παιδί είναι άλλο.","am":"Πείτε: «Σήμερα, όταν κάποιος με ενοχλήσει, θα ρωτήσω πρώτα “γιατί;”.»","ex":"Σκεφτείτε κάποιον του οποίου η συμπεριφορά σας ενοχλεί. Γράψτε τρεις πιθανές αιτίες που μπορεί να τον κάνουν να φέρεται έτσι (κούραση, φόβος, παλιές πληγές...). Παρατηρήστε αν αλλάζει κάτι στο πώς νιώθετε.","pm":"Ποιον κατάλαβα σήμερα λίγο καλύτερα;"},"en":{"t":"Neither laughter nor tears, but understanding","tr":"I have taken great care not to laugh at human actions, not to weep over them, nor to hate them, but to understand them.","simple":"When someone does something we dislike, we usually react in three ways: we mock them, we grieve, or we get angry. Spinoza proposes a fourth way: to understand why they did it.\n\nUnderstanding does not mean agreeing or excusing wrong. It means seeing the causes. And whoever sees the causes can help them change.","life":"A teacher has a pupil who behaves aggressively. Instead of punishing him constantly, he tries to understand. He learns there are fights at home every night. He gives the boy a responsibility in class and speaks to him calmly. In two months the child is different.","am":"Say: “Today, when someone bothers me, I will first ask ‘why?’.”","ex":"Think of someone whose behaviour bothers you. Write three possible causes that may make them act that way (tiredness, fear, old wounds...). Notice whether anything changes in how you feel.","pm":"Whom did I understand a little better today?"}},{"tag":["💡 Καθαρή ματιά","💡 Clear sight"],"grc":"Affectus, qui passio est, desinit esse passio, simulatque eius claram et distinctam formamus ideam.","src":["Ηθική Ε΄, πρόταση 3","Ethics V, proposition 3"],"el":{"t":"Όταν καταλαβαίνεις ένα συναίσθημα","tr":"Ένα συναίσθημα που μας κυριεύει παύει να μας κυριεύει, μόλις σχηματίσουμε μια καθαρή και ξεκάθαρη ιδέα γι’ αυτό.","simple":"Αυτή είναι ίσως η πιο σημαντική ανακάλυψη του Σπινόζα. Όταν ένα συναίσθημα (φόβος, θυμός, ζήλια) μάς «πλημμυρίζει», είμαστε σαν θύματά του. Όταν όμως σταματάμε και το ονομάζουμε καθαρά — «νιώθω ζήλια, επειδή φοβάμαι ότι θα με αφήσουν» — αρχίζει να χάνει τη δύναμή του.\n\nΣήμερα οι ψυχολόγοι λένε κάτι παρόμοιο: «Ονόμασέ το για να το ημερέψεις.»","life":"Μια νέα νιώθει ένα βαρύ, ακαθόριστο άγχος κάθε Κυριακή βράδυ. Μια φορά κάθεται και γράφει: «Τι ακριβώς φοβάμαι;» Ανακαλύπτει ότι είναι μια συγκεκριμένη συνάντηση της Δευτέρας. Ετοιμάζεται γι’ αυτήν μισή ώρα. Το άγχος γίνεται πολύ μικρότερο.","am":"Ρωτήστε: «Τι ακριβώς νιώθω τώρα;» και δώστε στο συναίσθημα ένα όνομα.","ex":"Όταν σήμερα σας κυριεύσει ένα δυνατό συναίσθημα, γράψτε δύο προτάσεις: «Νιώθω …» και «Το νιώθω επειδή …». Πείτε το ήρεμα στον εαυτό σας. Παρατηρήστε πώς αλλάζει η ένταση.","pm":"Ποιο συναίσθημα κατάλαβα σήμερα πιο καθαρά;"},"en":{"t":"When you understand an emotion","tr":"An emotion which is a passion ceases to be a passion as soon as we form a clear and distinct idea of it.","simple":"This is perhaps Spinoza’s most important discovery. When an emotion (fear, anger, jealousy) “floods” us, we are like its victims. But when we stop and name it clearly — “I feel jealous because I’m afraid of being left” — it begins to lose its power.\n\nToday psychologists say something similar: “Name it to tame it.”","life":"A young woman feels a heavy, vague anxiety every Sunday evening. Once she sits down and writes: “What exactly am I afraid of?” She discovers it is a particular Monday meeting. She prepares for it for half an hour. The anxiety becomes much smaller.","am":"Ask: “What exactly am I feeling now?” and give the emotion a name.","ex":"When a strong emotion takes hold of you today, write two sentences: “I feel …” and “I feel it because …”. Say it calmly to yourself. Notice how the intensity changes.","pm":"Which emotion did I understand more clearly today?"}},{"tag":["❤️ Μίσος και αγάπη","❤️ Hate and love"],"grc":"Odium reciproco odio augetur, et amore contra deleri potest.","src":["Ηθική Γ΄, πρόταση 43","Ethics III, proposition 43"],"el":{"t":"Η αγάπη σβήνει το μίσος","tr":"Το μίσος μεγαλώνει όταν απαντάμε με μίσος, ενώ με την αγάπη μπορεί να σβηστεί.","simple":"Ο Σπινόζα το αποδεικνύει σαν γεωμετρικό θεώρημα: αν κάποιος με μισεί και τον μισήσω κι εγώ, εκείνος βλέπει ότι είχε δίκιο να με φοβάται — και με μισεί περισσότερο. Ένας φαύλος κύκλος.\n\nΑν όμως απαντήσω με καλοσύνη, ο άλλος μπερδεύεται. Το μίσος του δεν βρίσκει «τροφή». Σιγά-σιγά μπορεί να μετατραπεί σε κάτι άλλο. Ο Βούδας, στην άλλη άκρη του κόσμου, είπε σχεδόν το ίδιο.","life":"Δύο γειτόνισσες δεν μιλιούνται χρόνια. Όταν η μία αρρωσταίνει, η άλλη της αφήνει ένα φαγητό στην πόρτα με ένα σημείωμα: «Περαστικά.» Μια εβδομάδα μετά, το πιάτο επιστρέφει πλυμένο, γεμάτο κουλουράκια.","am":"Πείτε: «Σήμερα δεν θα ταΐσω κανένα μίσος.»","ex":"Σκεφτείτε μια σχέση με ψυχρότητα ή έχθρα. Κάντε σήμερα μία μικρή, ασφαλή χειρονομία καλοσύνης: έναν χαιρετισμό, μια ευχή, ένα καλό λόγο για εκείνον σε τρίτους. Αν η σχέση είναι επικίνδυνη για εσάς, η καλοσύνη μπορεί να είναι απλώς να μην τον μισείτε μέσα σας.","pm":"Πού σήμερα απάντησα με καλοσύνη αντί για εχθρότητα;"},"en":{"t":"Love dissolves hate","tr":"Hatred is increased by being returned, and can on the other hand be destroyed by love.","simple":"Spinoza proves it like a geometric theorem: if someone hates me and I hate them back, they see they were right to fear me — and hate me more. A vicious circle.\n\nBut if I answer with kindness, the other is confused. Their hatred finds no “food”. Little by little it may turn into something else. The Buddha, at the other end of the world, said almost the same.","life":"Two neighbours have not spoken for years. When one falls ill, the other leaves food at her door with a note: “Get well soon.” A week later the plate comes back washed, full of biscuits.","am":"Say: “Today I will feed no hatred.”","ex":"Think of a relationship marked by coldness or hostility. Make one small, safe gesture of kindness today: a greeting, a good wish, a kind word about them to others. If the relationship is dangerous for you, kindness may simply mean not hating them inwardly.","pm":"Where today did I answer with kindness instead of hostility?"}},{"tag":["🤝 Ο ένας τον άλλον","🤝 Each other"],"grc":"Homini nihil homine utilius.","src":["Ηθική Δ΄, πρόταση 18, σχόλιο","Ethics IV, proposition 18, scholium"],"el":{"t":"Τίποτα πιο χρήσιμο από τον άνθρωπο","tr":"Για τον άνθρωπο, τίποτα δεν είναι πιο χρήσιμο από τον άνθρωπο.","simple":"Ο Σπινόζα ζούσε μοναχικά, κι όμως έγραψε αυτή τη φράση. Είχε καταλάβει ότι κανείς δεν μπορεί να ευτυχήσει μόνος του. Χρειαζόμαστε ο ένας τον άλλον: για να μάθουμε, να δουλέψουμε, να παρηγορηθούμε, να γελάσουμε.\n\nΣτην εποχή μας, πολλοί νιώθουν μοναξιά ακόμη και με εκατοντάδες «φίλους» στο διαδίκτυο. Η πραγματική ανθρώπινη επαφή — μια κουβέντα, ένα χέρι στον ώμο — δεν αντικαθίσταται.","life":"Ένας ηλικιωμένος χήρος ζει μόνος και μιλά μόνο με την τηλεόραση. Ο νεαρός γείτονας του ζητά να του μάθει να φτιάχνει ένα ποδήλατο. Τώρα συναντιούνται κάθε Σάββατο. Ο ένας μαθαίνει τεχνική, ο άλλος βρήκε ξανά τη χαρά του.","am":"Σκεφτείτε έναν άνθρωπο που θα συναντήσετε σήμερα και πείτε: «Μαζί είμαστε πιο δυνατοί.»","ex":"Ζητήστε σήμερα βοήθεια για κάτι μικρό — ή προσφέρετέ τη. Και κάντε μια πραγματική συνάντηση ή ένα τηλεφώνημα (όχι μόνο μήνυμα) με κάποιον που έχετε καιρό να ακούσετε τη φωνή του.","pm":"Ποιος άνθρωπος μού ήταν σήμερα πολύτιμος; Σε ποιον ήμουν εγώ πολύτιμος;"},"en":{"t":"Nothing more useful than a human being","tr":"To man, nothing is more useful than man.","simple":"Spinoza lived alone, yet he wrote this sentence. He had understood that no one can be happy alone. We need one another: to learn, to work, to be comforted, to laugh.\n\nIn our time, many feel lonely even with hundreds of online “friends”. Real human contact — a conversation, a hand on the shoulder — cannot be replaced.","life":"An elderly widower lives alone and talks only to the television. The young neighbour asks him to teach him how to fix a bicycle. Now they meet every Saturday. One learns a skill, the other has found his joy again.","am":"Think of someone you will meet today and say: “Together we are stronger.”","ex":"Ask for help with something small today — or offer it. And have a real meeting or phone call (not just a message) with someone whose voice you haven’t heard for a while.","pm":"Who was precious to me today? To whom was I precious?"}},{"tag":["😊 Χαρά","😊 Joy"],"grc":"Laetitia est hominis transitio a minore ad maiorem perfectionem.","src":["Ηθική Γ΄, ορισμοί των συναισθημάτων 2","Ethics III, definitions of the emotions 2"],"el":{"t":"Η χαρά είναι ένα πέρασμα","tr":"Η χαρά είναι το πέρασμα του ανθρώπου από μια μικρότερη σε μια μεγαλύτερη τελειότητα.","simple":"Για τον Σπινόζα, η χαρά δεν είναι κάτι επιφανειακό. Είναι η αίσθηση ότι μεγαλώνουμε, ότι γινόμαστε περισσότερο ο εαυτός μας, ότι η δύναμή μας να ζούμε αυξάνεται. Η λύπη είναι το αντίθετο: η αίσθηση ότι μικραίνουμε.\n\nΓι’ αυτό, λέει, δεν είναι αμαρτία να χαιρόμαστε· είναι σημάδι ότι ζούμε σωστά. Και αξίζει να ψάχνουμε ό,τι μας κάνει να «μεγαλώνουμε».","life":"Μια γυναίκα που ένιωθε «άχρηστη» μετά τη σύνταξη, αρχίζει εθελοντισμό σε ένα σχολείο, διαβάζοντας παραμύθια στα παιδιά. Νιώθει μια χαρά που είχε ξεχάσει: την αίσθηση ότι είναι ξανά ολόκληρη. Αυτό είναι το «πέρασμα» του Σπινόζα.","am":"Ρωτήστε: «Τι θα με κάνει σήμερα να νιώσω λίγο μεγαλύτερος, λίγο πιο ζωντανός;»","ex":"Γράψτε τρεις δραστηριότητες που σας κάνουν να νιώθετε ότι «μεγαλώνετε» (όχι απλώς ότι περνά η ώρα). Κάντε μία από αυτές σήμερα, έστω για λίγα λεπτά.","pm":"Πότε ένιωσα σήμερα ότι η ζωή μέσα μου μεγάλωσε;"},"en":{"t":"Joy is a passage","tr":"Joy is a person’s passage from a lesser to a greater perfection.","simple":"For Spinoza, joy is not something superficial. It is the feeling that we are growing, becoming more ourselves, that our power to live is increasing. Sadness is the opposite: the feeling that we are shrinking.\n\nSo, he says, it is no sin to rejoice; it is a sign that we are living rightly. And it is worth seeking whatever makes us “grow”.","life":"A woman who felt “useless” after retiring starts volunteering at a school, reading stories to children. She feels a joy she had forgotten: the sense of being whole again. That is Spinoza’s “passage”.","am":"Ask: “What will make me feel a little bigger, a little more alive today?”","ex":"Write three activities that make you feel you are “growing” (not just passing time). Do one of them today, even for a few minutes.","pm":"When did I feel today that the life in me grew?"}},{"tag":["🌷 Μικρές απολαύσεις","🌷 Small pleasures"],"grc":"Viri sapientis est moderato et suavi cibo et potu se reficere et recreare, ut et odoribus, plantarum virentium amoenitate, ornatu, musica, ludis exercitatoriis, theatris.","src":["Ηθική Δ΄, πρόταση 45, σχόλιο","Ethics IV, proposition 45, scholium"],"el":{"t":"Ο σοφός ξέρει να απολαμβάνει","tr":"Είναι γνώρισμα του σοφού να αναζωογονείται και να ξεκουράζεται με μέτριο και ευχάριστο φαγητό και ποτό, με αρώματα, με την ομορφιά των πράσινων φυτών, με στολίδια, με μουσική, με αθλήματα και με θέατρο.","simple":"Πολλοί νομίζουν ότι οι φιλόσοφοι ζουν σκυθρωποί και αυστηροί. Ο Σπινόζα λέει το αντίθετο: η σοφία δεν απαγορεύει τη χαρά. Ο σοφός απολαμβάνει τα καλά της ζωής — με μέτρο.\n\nΚαι προσέξτε τη λίστα του: φαγητό, αρώματα, φυτά, μουσική, παιχνίδι, θέατρο. Σχεδόν όλα απλά και φθηνά. Η ευτυχία βρίσκεται συχνά στα μικρά.","life":"Ένας φοιτητής με πολύ διάβασμα νιώθει ότι «δεν έχει χρόνο να ζήσει». Αρχίζει να βάζει ένα φυτό στο γραφείο του, να ακούει ένα αγαπημένο τραγούδι στο διάλειμμα και να παίζει μπάσκετ μία φορά την εβδομάδα. Διαβάζει καλύτερα, επειδή ζει καλύτερα.","am":"Ακούστε ένα τραγούδι που αγαπάτε ή μυρίστε κάτι όμορφο (ένα λουλούδι, έναν καφέ) με όλη σας την προσοχή.","ex":"Διαλέξτε σήμερα δύο από τη λίστα του Σπινόζα: ένα νόστιμο απλό φαγητό, ένα άρωμα, πράσινα φυτά, μουσική, παιχνίδι ή κίνηση, μια παράσταση ή μια ταινία. Απολαύστε τα συνειδητά, με μέτρο.","pm":"Ποια μικρή απόλαυση με ξεκούρασε σήμερα;"},"en":{"t":"The wise know how to enjoy","tr":"It is the part of a wise man to refresh and restore himself with moderate and pleasant food and drink, with scents, with the beauty of green plants, with ornament, music, sports and the theatre.","simple":"Many think philosophers live gloomy, strict lives. Spinoza says the opposite: wisdom does not forbid joy. The wise person enjoys life’s good things — in moderation.\n\nAnd notice his list: food, scents, plants, music, play, theatre. Almost all simple and cheap. Happiness is often found in small things.","life":"A student with heavy studies feels he “has no time to live”. He puts a plant on his desk, listens to a favourite song in his break and plays basketball once a week. He studies better, because he lives better.","am":"Listen to a song you love or smell something lovely (a flower, a coffee) with full attention.","ex":"Choose two things from Spinoza’s list today: a tasty simple meal, a scent, green plants, music, play or movement, a play or a film. Enjoy them consciously, in moderation.","pm":"Which small pleasure refreshed me today?"}},{"tag":["🌿 Στοχασμός της ζωής","🌿 Meditation on life"],"grc":"Homo liber de nulla re minus quam de morte cogitat, et eius sapientia non mortis, sed vitae meditatio est.","src":["Ηθική Δ΄, πρόταση 67","Ethics IV, proposition 67"],"el":{"t":"Η σοφία είναι στοχασμός της ζωής","tr":"Ο ελεύθερος άνθρωπος για τίποτα δεν σκέφτεται λιγότερο από ό,τι για τον θάνατο· και η σοφία του δεν είναι στοχασμός του θανάτου, αλλά της ζωής.","simple":"Πολλοί άνθρωποι ζουν με φόβο: για την αρρώστια, τα γηρατειά, τον θάνατο. Ο φόβος τούς κλέβει τη ζωή που έχουν τώρα. Ο Σπινόζα λέει ότι ο ελεύθερος άνθρωπος στρέφει την προσοχή του στη ζωή: τι μπορώ να κάνω σήμερα, πώς μπορώ να ζήσω καλά, ποιον μπορώ να αγαπήσω.\n\nΑυτό δεν σημαίνει ότι αγνοούμε την υγεία μας — τη φροντίζουμε. Σημαίνει ότι δεν αφήνουμε τον φόβο να γίνει ο αρχηγός.","life":"Ένας άνθρωπος μετά από μια σοβαρή διάγνωση περνά μήνες βυθισμένος στον φόβο. Ακολουθεί τη θεραπεία του γιατρού του, και μια μέρα αποφασίζει: «Όσο ζω, θα ζω.» Αρχίζει να κάνει πράγματα που ανέβαλλε: ένα ταξίδι, μια συμφιλίωση, μαθήματα ζωγραφικής.","am":"Πείτε: «Σήμερα θα σκεφτώ τη ζωή, όχι τον φόβο.»","ex":"Γράψτε τρία πράγματα που θα θέλατε να ζήσετε ή να κάνετε, και που αναβάλλετε από φόβο ή συνήθεια. Κάντε ένα μικρό βήμα για ένα από αυτά σήμερα. Αν σας βαραίνει ένα θέμα υγείας, μιλήστε για αυτό με τον γιατρό σας.","pm":"Πόσο από τη σημερινή μέρα το έζησα και πόσο το φοβήθηκα;"},"en":{"t":"Wisdom is a meditation on life","tr":"A free person thinks of nothing less than of death, and their wisdom is a meditation not on death but on life.","simple":"Many people live in fear: of illness, old age, death. Fear steals the life they have now. Spinoza says the free person turns their attention to life: what can I do today, how can I live well, whom can I love.\n\nThis does not mean ignoring our health — we care for it. It means not letting fear become the leader.","life":"A man, after a serious diagnosis, spends months sunk in fear. He follows his doctor’s treatment, and one day decides: “As long as I live, I will live.” He starts doing things he kept postponing: a trip, a reconciliation, painting lessons.","am":"Say: “Today I will think of life, not fear.”","ex":"Write three things you would like to live or do that you keep postponing out of fear or habit. Take one small step towards one of them today. If a health worry weighs on you, talk about it with your doctor.","pm":"How much of today did I live, and how much did I fear?"}}]},
{"id":"vi","emoji":"🕉️","cls":"c-vi","origEn":true,"origLbl":["Τα λόγια του στα αγγλικά:","His words in English:"],"name":["Σουάμι Βιβεκανάντα","Swami Vivekananda"],"withName":["με τον Βιβεκανάντα","with Vivekananda"],"years":["1863–1902 · Η δύναμη του νου","1863–1902 · The strength of the mind"],"bio":["<p>Ο Βιβεκανάντα γεννήθηκε στην <b>Καλκούτα</b> της Ινδίας με το όνομα Νάρεντρα. Ήταν έξυπνος, αθλητικός και γεμάτος αμφιβολίες. Ρωτούσε τους σοφούς: «Έχετε δει τον Θεό;» Μόνο ο δάσκαλός του, ο Ραμακρίσνα, του απάντησε «ναι» — και του άλλαξε τη ζωή.</p><p>Το <b>1893</b>, στο Παγκόσμιο Συνέδριο Θρησκειών στο Σικάγο, ξεκίνησε την ομιλία του με τα λόγια «Αδελφές και αδελφοί της Αμερικής» — και το κοινό σηκώθηκε και τον χειροκροτούσε για δύο λεπτά. Μίλησε για σεβασμό σε όλες τις θρησκείες.</p><p>Πέθανε μόλις 39 ετών, αλλά άφησε πίσω του μια τεράστια κληρονομιά: τη <b>δύναμη του νου</b>, την αυτοπεποίθηση και την προσφορά στους φτωχούς ως τον πιο αληθινό τρόπο λατρείας. Η ημέρα των γενεθλίων του (12 Ιανουαρίου) γιορτάζεται στην Ινδία ως Ημέρα της Νεολαίας.</p>","<p>Vivekananda was born in <b>Calcutta</b>, India, named Narendra. He was clever, athletic and full of doubts. He asked holy men: “Have you seen God?” Only his teacher, Ramakrishna, answered “yes” — and changed his life.</p><p>In <b>1893</b>, at the World’s Parliament of Religions in Chicago, he began his speech with the words “Sisters and Brothers of America” — and the audience rose and applauded for two minutes. He spoke of respect for all religions.</p><p>He died aged only 39, yet left a vast legacy: the <b>strength of the mind</b>, self-confidence, and service to the poor as the truest worship. His birthday (12 January) is celebrated in India as National Youth Day.</p>"],"cheer":["Ο Βιβεκανάντα έλεγε: «Σήκω, ξύπνα και μη σταματάς ώσπου να φτάσεις στον στόχο.» Ένα βήμα ακόμη έγινε σήμερα.","Vivekananda said: “Arise, awake, and stop not till the goal is reached.” One more step was taken today."],"fare":{"grc":"Strength is life, weakness is death. Expansion is life, contraction is death. Love is life, hatred is death.","src":["Βιβεκανάντα, Άπαντα (Complete Works)","Vivekananda, Complete Works"],"tr":["Η δύναμη είναι ζωή, η αδυναμία θάνατος. Το άνοιγμα είναι ζωή, το κλείσιμο θάνατος. Η αγάπη είναι ζωή, το μίσος θάνατος.","Strength is life, weakness is death. Expansion is life, contraction is death. Love is life, hatred is death."]},"days":[{"tag":["🔥 Ξεκίνημα","🔥 Getting started"],"grc":"Arise! Awake! and stop not till the goal is reached.","src":["Το σύνθημά του, από την Κάθα Ουπανισάδ","His motto, from the Katha Upanishad"],"el":{"t":"Σήκω, ξύπνα, μη σταματάς","tr":"Σήκω! Ξύπνα! Και μη σταματάς μέχρι να φτάσεις στον στόχο.","simple":"Ο Βιβεκανάντα πήρε αυτά τα λόγια από ένα αρχαίο ινδικό κείμενο και τα έκανε σύνθημα για τους νέους της Ινδίας. «Σήκω» σημαίνει: σταμάτα να περιμένεις. «Ξύπνα» σημαίνει: δες καθαρά τι θέλεις. «Μη σταματάς» σημαίνει: συνέχισε κι όταν κουραστείς.\n\nΔεν μιλά για βιασύνη, αλλά για επιμονή. Πολλοί ξεκινούν· λίγοι συνεχίζουν. Η διαφορά βρίσκεται στο «μη σταματάς».","life":"Ένας άνεργος νέος περνά τις μέρες του στο κρεβάτι με το κινητό, περιμένοντας «την κατάλληλη στιγμή». Ένα πρωί βάζει ξυπνητήρι στις 8, ντύνεται σαν να πηγαίνει δουλειά και στέλνει δύο βιογραφικά. Το κάνει κάθε μέρα. Μετά από πέντε εβδομάδες, τον καλούν για δουλειά.","am":"Μόλις ανοίξετε τα μάτια σας, μην πιάσετε το κινητό. Σηκωθείτε αμέσως και πείτε: «Σήκω, ξύπνα, μη σταματάς.»","ex":"Γράψτε έναν στόχο που αναβάλλετε. Από κάτω γράψτε το πιο μικρό βήμα που μπορείτε να κάνετε σήμερα, σε λιγότερο από 15 λεπτά. Κάντε το πριν το βράδυ.","pm":"Ποιο βήμα έκανα σήμερα προς τον στόχο μου;"},"en":{"t":"Arise, awake, stop not","tr":"Arise! Awake! and stop not till the goal is reached.","simple":"Vivekananda took these words from an ancient Indian text and made them a motto for India’s youth. “Arise” means: stop waiting. “Awake” means: see clearly what you want. “Stop not” means: keep going even when you are tired.\n\nHe speaks not of hurry but of persistence. Many begin; few continue. The difference lies in “stop not”.","life":"An unemployed young man spends his days in bed with his phone, waiting for “the right moment”. One morning he sets an alarm for 8, dresses as if going to work and sends two CVs. He does it every day. After five weeks, he is called for a job.","am":"As soon as you open your eyes, do not pick up the phone. Get up at once and say: “Arise, awake, stop not.”","ex":"Write a goal you keep postponing. Below it, write the smallest step you can take today, in under 15 minutes. Do it before evening.","pm":"What step did I take today towards my goal?"}},{"tag":["💎 Αυτοπεποίθηση","💎 Self-belief"],"grc":"The old religions said that he was an atheist who did not believe in God. The new religion says that he is the atheist who does not believe in himself.","src":["Ομιλία «Πρακτική Βεντάντα», Λονδίνο 1896","Lecture “Practical Vedanta”, London 1896"],"el":{"t":"Πίστεψε στον εαυτό σου","tr":"Οι παλιές θρησκείες έλεγαν ότι άθεος είναι όποιος δεν πιστεύει στον Θεό. Η νέα θρησκεία λέει ότι άθεος είναι όποιος δεν πιστεύει στον εαυτό του.","simple":"Ο Βιβεκανάντα πίστευε ότι μέσα σε κάθε άνθρωπο υπάρχει μια θεϊκή σπίθα, μια τεράστια δύναμη. Όταν λέμε συνέχεια «δεν μπορώ», «δεν αξίζω», «είμαι αποτυχημένος», είναι σαν να αρνούμαστε αυτή τη σπίθα.\n\nΗ αυτοπεποίθηση δεν είναι υπεροψία. Δεν σημαίνει «είμαι καλύτερος από τους άλλους». Σημαίνει «έχω κι εγώ μέσα μου κάτι πολύτιμο, όπως και κάθε άλλος άνθρωπος».","life":"Μια κοπέλα πιστεύει ότι «δεν είναι για σπουδές», γιατί κάποτε ένας δάσκαλος την είπε αργή. Στα 35 της γράφεται σε ένα βραδινό πρόγραμμα. Δυσκολεύεται, αλλά περνά. Στην τελετή αποφοίτησης κλαίει: «Τελικά δεν ήμουν αργή. Απλώς δεν πίστευα.»","am":"Κοιταχτείτε στον καθρέφτη και πείτε, έστω κι αν νιώθετε αμήχανα: «Μέσα μου υπάρχει δύναμη.»","ex":"Γράψτε μια φράση που λέτε συχνά στον εαυτό σας και σας μικραίνει (π.χ. «δεν τα καταφέρνω ποτέ»). Ξαναγράψτε τη με αλήθεια και καλοσύνη (π.χ. «κάποια τα καταφέρνω, κάποια τα μαθαίνω»). Διαβάστε τη νέα φράση τρεις φορές σήμερα.","pm":"Πότε σήμερα πίστεψα στον εαυτό μου, έστω και λίγο;"},"en":{"t":"Believe in yourself","tr":"The old religions said that he was an atheist who did not believe in God. The new religion says that he is the atheist who does not believe in himself.","simple":"Vivekananda believed that in every person there is a divine spark, a vast strength. When we keep saying “I can’t”, “I’m not worth it”, “I’m a failure”, it is as if we deny that spark.\n\nSelf-confidence is not arrogance. It does not mean “I am better than others”. It means “I too have something precious inside me, like every other person”.","life":"A young woman believes she is “not made for study”, because a teacher once called her slow. At 35 she enrols in an evening programme. She struggles, but she passes. At the graduation she cries: “I wasn’t slow after all. I just didn’t believe.”","am":"Look in the mirror and say, even if you feel awkward: “There is strength in me.”","ex":"Write a phrase you often tell yourself that makes you small (e.g. “I never manage”). Rewrite it truthfully and kindly (e.g. “some things I manage, some I learn”). Read the new phrase three times today.","pm":"When today did I believe in myself, even a little?"}},{"tag":["👐 Μην κρύβεις το φως","👐 Uncover the light"],"grc":"All the powers in the universe are already ours. It is we who have put our hands before our eyes and cry that it is dark.","src":["Βιβεκανάντα, Άπαντα (Complete Works)","Vivekananda, Complete Works"],"el":{"t":"Βάλαμε τα χέρια στα μάτια μας","tr":"Όλες οι δυνάμεις του σύμπαντος είναι ήδη δικές μας. Εμείς οι ίδιοι βάλαμε τα χέρια μπροστά στα μάτια μας και φωνάζουμε ότι είναι σκοτάδι.","simple":"Φανταστείτε κάποιον που κλείνει τα μάτια του με τις παλάμες και παραπονιέται ότι δεν βλέπει. Η λύση δεν είναι να ανάψει περισσότερα φώτα· είναι να κατεβάσει τα χέρια του.\n\nΠολλές φορές το «σκοτάδι» μας είναι μια συνήθεια σκέψης: «πάντα σε μένα τυχαίνουν», «δεν αλλάζει τίποτα». Όταν κατεβάζουμε αυτά τα χέρια, βλέπουμε δρόμους που υπήρχαν ήδη.","life":"Ένας μεσήλικας έχασε τη δουλειά του και λέει σε όλους ότι «η ζωή του τελείωσε». Ο γείτονας του ζητά βοήθεια να φτιάξει τον φράχτη. Εκεί θυμάται πόσο καλός είναι στις ξυλουργικές. Σε έναν χρόνο έχει ένα μικρό εργαστήριο. Η ικανότητα ήταν πάντα εκεί.","am":"Πείτε: «Σήμερα θα κατεβάσω τα χέρια από τα μάτια μου.»","ex":"Γράψτε ένα πρόβλημα που σας φαίνεται «σκοτεινό». Από κάτω γράψτε τρεις ικανότητες ή ανθρώπους που ήδη έχετε και θα μπορούσαν να βοηθήσουν. Διαλέξτε έναν και κάντε κάτι σήμερα.","pm":"Ποια δύναμη ανακάλυψα σήμερα ότι ήδη είχα;"},"en":{"t":"Hands before our eyes","tr":"All the powers in the universe are already ours. It is we who have put our hands before our eyes and cry that it is dark.","simple":"Imagine someone covering their eyes with their palms and complaining that they cannot see. The answer is not to switch on more lights; it is to lower their hands.\n\nOften our “darkness” is a habit of thought: “it always happens to me”, “nothing changes”. When we lower those hands, we see paths that were already there.","life":"A middle-aged man has lost his job and tells everyone that “his life is over”. His neighbour asks for help fixing a fence. There he remembers how good he is at woodwork. Within a year he has a small workshop. The skill was always there.","am":"Say: “Today I will lower my hands from my eyes.”","ex":"Write a problem that seems “dark”. Below it, write three abilities or people you already have that could help. Choose one and do something today.","pm":"What strength did I discover today that I already had?"}},{"tag":["🧠 Σκέψεις","🧠 Thoughts"],"grc":"We are what our thoughts have made us; so take care about what you think. Words are secondary. Thoughts live; they travel far.","src":["Βιβεκανάντα, Άπαντα (Complete Works)","Vivekananda, Complete Works"],"el":{"t":"Γινόμαστε ό,τι σκεφτόμαστε","tr":"Είμαστε αυτό που μας έκαναν οι σκέψεις μας. Γι’ αυτό πρόσεχε τι σκέφτεσαι. Τα λόγια έρχονται δεύτερα. Οι σκέψεις ζουν· ταξιδεύουν μακριά.","simple":"Κάθε σκέψη που επαναλαμβάνουμε είναι σαν ένα μονοπάτι στο χορτάρι: όσο περισσότερο το περπατάμε, τόσο πιο βαθύ γίνεται. Αν κάθε μέρα σκεφτόμαστε φόβο, γινόμαστε φοβισμένοι. Αν σκεφτόμαστε ευγνωμοσύνη, γινόμαστε ευγνώμονες.\n\nΚαι οι σκέψεις μας «ταξιδεύουν»: φαίνονται στο πρόσωπο, στη φωνή, στον τρόπο που φερόμαστε. Αυτό που καλλιεργούμε μέσα μας, το νιώθουν και οι γύρω μας.","life":"Μια μητέρα παρατηρεί ότι κάθε πρωί σκέφτεται «πάλι δύσκολη μέρα». Αποφασίζει να λέει αντί γι’ αυτό «τι καλό μπορεί να γίνει σήμερα;». Μετά από μερικές εβδομάδες, τα παιδιά της τη ρωτούν γιατί χαμογελά περισσότερο.","am":"Πριν σηκωθείτε, σκεφτείτε ένα πράγμα για το οποίο είστε ευγνώμονες σήμερα.","ex":"Τρεις φορές σήμερα (π.χ. στο πρωινό, στο μεσημεριανό, στο βραδινό), σταματήστε και ρωτήστε: «Τι σκεφτόμουν μόλις τώρα;» Αν ήταν μια σκέψη που σας βαραίνει, αντικαταστήστε τη με μια πιο ήρεμη και αληθινή.","pm":"Ποια σκέψη θέλω να «περπατήσω» περισσότερο αύριο;"},"en":{"t":"We become what we think","tr":"We are what our thoughts have made us; so take care about what you think. Words are secondary. Thoughts live; they travel far.","simple":"Every thought we repeat is like a path in the grass: the more we walk it, the deeper it gets. If every day we think fear, we become fearful. If we think gratitude, we become grateful.\n\nAnd our thoughts “travel”: they show in our face, voice and behaviour. What we cultivate inside, those around us feel too.","life":"A mother notices that every morning she thinks “another hard day”. She decides to say instead “what good might happen today?”. After a few weeks, her children ask why she smiles more.","am":"Before you get up, think of one thing you are grateful for today.","ex":"Three times today (say at breakfast, lunch and dinner), stop and ask: “What was I just thinking?” If it was a heavy thought, replace it with a calmer, truer one.","pm":"Which thought do I want to “walk” more tomorrow?"}},{"tag":["🎯 Συγκέντρωση","🎯 Focus"],"grc":"Take up one idea. Make that one idea your life — think of it, dream of it, live on that idea. Let the brain, muscles, nerves, every part of your body, be full of that idea, and just leave every other idea alone. This is the way to success.","src":["Ράτζα Γιόγκα (1896)","Raja Yoga (1896)"],"el":{"t":"Μία ιδέα τη φορά","tr":"Πάρε μία ιδέα. Κάνε αυτή την ιδέα ζωή σου — σκέψου την, ονειρέψου την, ζήσε μ’ αυτή. Άφησε τον νου, τους μυς, τα νεύρα, κάθε κομμάτι του σώματός σου να γεμίσει μ’ αυτή την ιδέα, και άφησε στην άκρη κάθε άλλη. Αυτός είναι ο δρόμος της επιτυχίας.","simple":"Ο Βιβεκανάντα έγραψε αυτά τα λόγια πολύ πριν από τα κινητά τηλέφωνα. Σήμερα είναι πιο επίκαιρα από ποτέ: ο νους μας πηδά από ειδοποίηση σε ειδοποίηση, από βίντεο σε βίντεο, και στο τέλος της μέρας δεν έχουμε τελειώσει τίποτα.\n\nΗ συγκέντρωση είναι σαν τον φακό: σκορπισμένο, το φως δεν καίει τίποτα· μαζεμένο σε ένα σημείο, ανάβει φωτιά.","life":"Ένας μαθητής διαβάζει με το κινητό δίπλα του και κάθε πέντε λεπτά κοιτάζει τα μηνύματα. Τρεις ώρες «διάβασμα», ελάχιστη μάθηση. Δοκιμάζει να αφήσει το κινητό σε άλλο δωμάτιο για 45 λεπτά. Τελειώνει το κεφάλαιο και του μένει χρόνος για ποδόσφαιρο.","am":"Διαλέξτε τη μία πιο σημαντική δουλειά της ημέρας και γράψτε τη σε ένα χαρτάκι.","ex":"Βάλτε το κινητό σε αθόρυβο, σε άλλο δωμάτιο, και δουλέψτε 25 λεπτά μόνο σε εκείνη τη μία δουλειά. Όταν ο νους φεύγει, φέρτε τον πίσω χωρίς θυμό. Μετά, πέντε λεπτά ξεκούραση.","pm":"Πόσες φορές σήμερα με τράβηξε μακριά το κινητό; Τι θα κάνω διαφορετικά αύριο;"},"en":{"t":"One idea at a time","tr":"Take up one idea. Make that one idea your life — think of it, dream of it, live on that idea. Let the brain, muscles, nerves, every part of your body, be full of that idea, and just leave every other idea alone. This is the way to success.","simple":"Vivekananda wrote these words long before mobile phones. Today they are more relevant than ever: our mind jumps from notification to notification, from video to video, and at the end of the day we have finished nothing.\n\nFocus is like a magnifying glass: scattered, light burns nothing; gathered in one spot, it lights a fire.","life":"A student studies with his phone beside him and checks messages every five minutes. Three hours of “study”, very little learning. He tries leaving the phone in another room for 45 minutes. He finishes the chapter and still has time for football.","am":"Choose the single most important task of the day and write it on a slip of paper.","ex":"Put your phone on silent, in another room, and work 25 minutes only on that one task. When the mind wanders, bring it back without anger. Then rest for five minutes.","pm":"How many times did the phone pull me away today? What will I do differently tomorrow?"}},{"tag":["🛡️ Κριτική","🛡️ Criticism"],"grc":"Each work has to pass through these stages — ridicule, opposition, and then acceptance.","src":["Από επιστολή του Βιβεκανάντα","From a letter by Vivekananda"],"el":{"t":"Πρώτα γελούν, μετά αντιδρούν, μετά δέχονται","tr":"Κάθε έργο πρέπει να περάσει από τρία στάδια: την κοροϊδία, την αντίδραση και, στο τέλος, την αποδοχή.","simple":"Όταν κάνουμε κάτι καινούργιο, συχνά οι άλλοι πρώτα γελούν. Μετά, αν επιμείνουμε, μας πολεμούν. Και αν συνεχίσουμε με καλή καρδιά, στο τέλος το δέχονται — μερικές φορές λένε και ότι «το ήξεραν από την αρχή».\n\nΑυτό δεν σημαίνει ότι κάθε κριτική είναι λάθος. Ακούμε, κρατάμε ό,τι μας βελτιώνει, αλλά δεν σταματάμε ένα καλό έργο επειδή κάποιοι γέλασαν.","life":"Μια συνταξιούχος ανεβάζει στο διαδίκτυο βίντεο με παραδοσιακές συνταγές. Οι συγγενείς τη σχολιάζουν: «Σε αυτή την ηλικία;» Εκείνη συνεχίζει. Σε έναν χρόνο, χιλιάδες νέοι μαγειρεύουν τις συνταγές της — και οι ίδιοι συγγενείς τής ζητούν να τους μάθει.","am":"Πείτε: «Αν σήμερα γελάσουν με κάτι καλό που κάνω, είναι απλώς το πρώτο στάδιο.»","ex":"Θυμηθείτε κάτι καλό που σταματήσατε επειδή φοβηθήκατε τη γνώμη των άλλων. Κάντε σήμερα ένα μικρό βήμα για να το ξαναρχίσετε. Αν δεχτείτε κριτική, ρωτήστε: «Έχει κάτι χρήσιμο μέσα;» Κρατήστε το χρήσιμο, αφήστε τα υπόλοιπα.","pm":"Ποια κριτική με βοήθησε σήμερα και ποια απλώς με πλήγωσε;"},"en":{"t":"First ridicule, then opposition, then acceptance","tr":"Each work has to pass through these stages — ridicule, opposition, and then acceptance.","simple":"When we do something new, others often laugh first. Then, if we persist, they oppose us. And if we keep going with a good heart, in the end they accept it — sometimes even saying they “knew it all along”.\n\nThis does not mean all criticism is wrong. We listen, keep what improves us, but we do not stop a good work because some people laughed.","life":"A retired woman posts videos of traditional recipes online. Relatives comment: “At your age?” She continues. In a year, thousands of young people cook her recipes — and the same relatives ask her to teach them.","am":"Say: “If someone laughs today at something good I do, it is only the first stage.”","ex":"Recall something good you stopped because you feared others’ opinion. Take one small step today to restart it. If you receive criticism, ask: “Is there something useful in it?” Keep the useful part, let the rest go.","pm":"Which criticism helped me today and which only hurt me?"}},{"tag":["🌊 Σεβασμός","🌊 Respect"],"grc":"As the different streams having their sources in different places all mingle their water in the sea, so, O Lord, the different paths which men take through different tendencies, various though they appear, crooked or straight, all lead to Thee.","src":["Ομιλία στο Παγκόσμιο Συνέδριο Θρησκειών, Σικάγο, 11 Σεπτεμβρίου 1893","Address at the World’s Parliament of Religions, Chicago, 11 September 1893"],"el":{"t":"Όλα τα ποτάμια πάνε στη θάλασσα","tr":"Όπως τα διάφορα ρυάκια, που πηγάζουν από διαφορετικούς τόπους, ενώνουν όλα τα νερά τους στη θάλασσα, έτσι, Κύριε, και οι διαφορετικοί δρόμοι που παίρνουν οι άνθρωποι — όσο διαφορετικοί κι αν φαίνονται, στραβοί ή ίσιοι — όλοι οδηγούν σε Σένα.","simple":"Αυτά τα λόγια, από έναν αρχαίο ύμνο, τα είπε ο Βιβεκανάντα στην πιο διάσημη ομιλία του. Μπροστά σε ανθρώπους κάθε θρησκείας, είπε ότι δεν χρειάζεται να μισούμε όσους πιστεύουν διαφορετικά. Ο καθένας ανεβαίνει το ίδιο βουνό από άλλο μονοπάτι.\n\nΤο ίδιο ισχύει και πέρα από τη θρησκεία: στις πολιτικές απόψεις, στις συνήθειες, στους τρόπους ζωής. Ο σεβασμός δεν σημαίνει ότι συμφωνώ σε όλα — σημαίνει ότι βλέπω τον άλλον ως αδελφό.","life":"Σε μια παρέα φοιτητών υπάρχουν ένας Ορθόδοξος, μια μουσουλμάνα, ένας άθεος και μια βουδίστρια. Αντί να μαλώνουν, κάθε μήνα ο ένας μαγειρεύει ένα φαγητό από τη γιορτή του και εξηγεί τι σημαίνει. Γίνονται φίλοι για μια ζωή.","am":"Πείτε: «Ο δρόμος του άλλου μπορεί να είναι διαφορετικός από τον δικό μου, αλλά η θάλασσα είναι μία.»","ex":"Μάθετε σήμερα ένα καινούργιο πράγμα για μια θρησκεία, μια χώρα ή έναν τρόπο ζωής διαφορετικό από τον δικό σας — από ένα βίντεο, ένα άρθρο ή, ακόμη καλύτερα, ρωτώντας έναν άνθρωπο με ενδιαφέρον και σεβασμό.","pm":"Ποιον άνθρωπο, διαφορετικό από μένα, κατάλαβα λίγο καλύτερα σήμερα;"},"en":{"t":"All rivers flow to the sea","tr":"As the different streams having their sources in different places all mingle their water in the sea, so, O Lord, the different paths which men take through different tendencies, various though they appear, crooked or straight, all lead to Thee.","simple":"Vivekananda quoted these words, from an ancient hymn, in his most famous speech. Before people of every faith, he said there is no need to hate those who believe differently. Each climbs the same mountain by another path.\n\nThe same holds beyond religion: in political views, habits, ways of life. Respect does not mean agreeing with everything — it means seeing the other as a brother or sister.","life":"A group of students includes an Orthodox Christian, a Muslim woman, an atheist and a Buddhist. Instead of quarrelling, each month one of them cooks a dish from their festivals and explains its meaning. They become lifelong friends.","am":"Say: “The other person’s path may differ from mine, but the sea is one.”","ex":"Today learn one new thing about a religion, country or way of life different from yours — from a video, an article, or better still by asking a person with interest and respect.","pm":"Which person, different from me, did I understand a little better today?"}}]},
{"id":"ra","emoji":"🌬️","cls":"c-ra","name":["Γιόγκι Ραματσαράκα","Yogi Ramacharaka"],"withName":["με τον Ραματσαράκα","with Ramacharaka"],"years":["Βιβλία 1903–1909 · Η αναπνοή είναι ζωή","Books 1903–1909 · Breath is life"],"bio":["<p>«Γιόγκι Ραματσαράκα» είναι το όνομα με το οποίο υπέγραψε τα βιβλία του για τη γιόγκα ο Αμερικανός συγγραφέας <b>Γουίλιαμ Γουόκερ Άτκινσον</b> (1862–1932). Ήταν δικηγόρος, που έπαθε μεγάλη εξάντληση από το άγχος της δουλειάς. Ψάχνοντας τρόπο να γίνει καλά, μελέτησε την ινδική σοφία και την πρακτική της αναπνοής.</p><p>Τα βιβλία του — «Η Επιστήμη της Αναπνοής», «Χάθα Γιόγκα», «Δεκατέσσερα μαθήματα γιόγκι φιλοσοφίας» — μεταφράστηκαν σε πολλές γλώσσες και διαβάστηκαν από εκατομμύρια ανθρώπους. Έγραψε με απλά λόγια για την αναπνοή, το φαγητό, το νερό, τη χαλάρωση και τον ήλιο.</p><p>Σε αυτές τις 7 ημέρες δίνουμε τις βασικές του ιδέες σε ελεύθερη απόδοση. Είναι απλές ασκήσεις για ηρεμία και ενέργεια. ⚠️ <b>Αν ζαλιστείτε ή νιώσετε δυσφορία, σταματήστε και αναπνεύστε κανονικά. Αν έχετε πρόβλημα υγείας (καρδιά, πίεση, πνεύμονες, εγκυμοσύνη), ρωτήστε πρώτα τον γιατρό σας.</b></p>","<p>“Yogi Ramacharaka” is the name under which the American writer <b>William Walker Atkinson</b> (1862–1932) signed his books on yoga. He was a lawyer who suffered great exhaustion from the stress of his work. Searching for a way to recover, he studied Indian wisdom and the practice of breathing.</p><p>His books — “The Science of Breath”, “Hatha Yoga”, “Fourteen Lessons in Yogi Philosophy” — were translated into many languages and read by millions. He wrote in plain words about breath, food, water, relaxation and sunlight.</p><p>In these 7 days we give his main ideas in free rendering. They are simple exercises for calm and energy. ⚠️ <b>If you feel dizzy or uncomfortable, stop and breathe normally. If you have a health condition (heart, blood pressure, lungs, pregnancy), ask your doctor first.</b></p>"],"cheer":["Κάθε ανάσα που παίρνετε με προσοχή είναι ένα δώρο στο σώμα και στον νου σας.","Every breath taken with attention is a gift to your body and mind."],"fare":{"grc":"","src":["Ελεύθερη απόδοση από το «Η Επιστήμη της Αναπνοής» (1904)","Free rendering from “The Science of Breath” (1904)"],"tr":["Η ζωή εξαρτάται ολόκληρη από την αναπνοή. Όποιος μαθαίνει να αναπνέει σωστά, μαθαίνει να ζει πιο ήρεμα, πιο υγιεινά και πιο δυνατά.","Life depends entirely on breathing. Whoever learns to breathe properly learns to live more calmly, more healthily and more strongly."]},"days":[{"tag":["🌬️ Αναπνοή","🌬️ Breath"],"grc":"","src":["«Η Επιστήμη της Αναπνοής» · Η πλήρης αναπνοή","“The Science of Breath” · The Complete Breath"],"el":{"t":"Η πλήρης αναπνοή","tr":"Η ζωή εξαρτάται από την αναπνοή. Οι περισσότεροι άνθρωποι αναπνέουν ρηχά, μόνο με το πάνω μέρος του στήθους. Η «πλήρης αναπνοή» γεμίζει όλους τους πνεύμονες: πρώτα την κοιλιά, μετά τα πλευρά, και στο τέλος το πάνω στήθος.","simple":"Όταν έχουμε άγχος, η ανάσα μας γίνεται μικρή και γρήγορη, σαν να βρισκόμαστε σε κίνδυνο. Το σώμα τότε πιστεύει ότι πράγματι κινδυνεύει. Μια αργή, βαθιά ανάσα στέλνει το αντίθετο μήνυμα: «Είσαι ασφαλής.»\n\nΗ πλήρης αναπνοή μοιάζει με ένα ποτήρι που γεμίζει: το νερό πρώτα πιάνει τον πάτο, μετά τη μέση, μετά την κορυφή. Έτσι και ο αέρας: κοιλιά, πλευρά, στήθος.","life":"Ένας οδηγός λεωφορείου νιώθει την καρδιά του να χτυπά δυνατά στην κίνηση. Στα κόκκινα φανάρια παίρνει τρεις πλήρεις αναπνοές. Στο τέλος της βάρδιας είναι λιγότερο κουρασμένος από ποτέ.","am":"Πριν σηκωθείτε, βάλτε το ένα χέρι στην κοιλιά και το άλλο στο στήθος. Πάρτε πέντε αργές ανάσες και νιώστε πρώτα την κοιλιά να φουσκώνει.","ex":"Τρεις φορές σήμερα, καθίστε ίσια και κάντε πέντε πλήρεις αναπνοές: εισπνοή από τη μύτη γεμίζοντας κοιλιά, πλευρά, στήθος· κρατήστε λίγο· εκπνοή αργά, αδειάζοντας από πάνω προς τα κάτω. Χωρίς ζόρι. Αν ζαλιστείτε, σταματήστε.","pm":"Πότε σήμερα κατάλαβα ότι αναπνέω ρηχά; Τι άλλαξε όταν ανέπνευσα βαθιά;"},"en":{"t":"The complete breath","tr":"Life depends on breathing. Most people breathe shallowly, only with the upper chest. The “complete breath” fills the whole lungs: first the belly, then the ribs, and finally the upper chest.","simple":"When we are anxious, our breath becomes small and fast, as if we were in danger. The body then believes it truly is in danger. A slow, deep breath sends the opposite message: “You are safe.”\n\nThe complete breath is like a glass being filled: the water first reaches the bottom, then the middle, then the top. So with air: belly, ribs, chest.","life":"A bus driver feels his heart pounding in traffic. At red lights he takes three complete breaths. At the end of his shift he is less tired than ever.","am":"Before getting up, put one hand on your belly and the other on your chest. Take five slow breaths and feel the belly rise first.","ex":"Three times today, sit upright and take five complete breaths: inhale through the nose, filling belly, ribs, chest; hold briefly; exhale slowly, emptying from top to bottom. No strain. If you feel dizzy, stop.","pm":"When today did I notice I was breathing shallowly? What changed when I breathed deeply?"}},{"tag":["👃 Από τη μύτη","👃 Through the nose"],"grc":"","src":["«Η Επιστήμη της Αναπνοής» · Αναπνοή από τη μύτη ή από το στόμα","“The Science of Breath” · Nostril vs. mouth breathing"],"el":{"t":"Ανάσα από τη μύτη","tr":"Η μύτη είναι το φίλτρο και το «καλοριφέρ» του αέρα. Καθαρίζει, ζεσταίνει και υγραίνει τον αέρα πριν φτάσει στους πνεύμονες. Γι’ αυτό, όσο μπορούμε, να αναπνέουμε από τη μύτη και όχι από το στόμα.","simple":"Ο Ραματσαράκα παρατήρησε ότι πολλοί άνθρωποι, και ειδικά τα παιδιά, αναπνέουν με ανοιχτό στόμα. Ο αέρας τότε φτάνει κρύος, ξερός και γεμάτος σκόνη. Η μύτη όμως είναι φτιαγμένη για αυτή τη δουλειά.\n\nΗ ανάσα από τη μύτη είναι επίσης πιο αργή — κι έτσι ηρεμεί από μόνη της τον νου.","life":"Μια δρομέας ερασιτέχνις κουραζόταν γρήγορα και λαχάνιαζε με ανοιχτό στόμα. Δοκίμασε να τρέχει πιο αργά, αναπνέοντας μόνο από τη μύτη. Στην αρχή της φάνηκε δύσκολο· σε έναν μήνα έτρεχε πιο πολύ και πιο ήρεμα.","am":"Κλείστε απαλά το στόμα και πάρτε δέκα ήσυχες ανάσες μόνο από τη μύτη.","ex":"Παρατηρήστε σήμερα, κάθε φορά που θυμάστε (στον υπολογιστή, στο περπάτημα, μπροστά στην τηλεόραση): αναπνέω από το στόμα ή από τη μύτη; Αν είναι από το στόμα, κλείστε το απαλά. Αν η μύτη σας είναι συχνά βουλωμένη, ρωτήστε τον γιατρό σας.","pm":"Πόσες φορές σήμερα έπιασα τον εαυτό μου να αναπνέει από το στόμα;"},"en":{"t":"Breathe through the nose","tr":"The nose is the filter and “heater” of the air. It cleans, warms and moistens the air before it reaches the lungs. So, as far as we can, we should breathe through the nose and not the mouth.","simple":"Ramacharaka noticed that many people, especially children, breathe with their mouth open. The air then arrives cold, dry and dusty. But the nose is built for this job.\n\nNose breathing is also slower — and so it calms the mind by itself.","life":"An amateur runner tired quickly and panted with her mouth open. She tried running more slowly, breathing only through the nose. At first it seemed hard; within a month she ran longer and more calmly.","am":"Close your mouth gently and take ten quiet breaths through the nose only.","ex":"Today, whenever you remember (at the computer, walking, watching TV), notice: am I breathing through my mouth or my nose? If through the mouth, close it gently. If your nose is often blocked, ask your doctor.","pm":"How many times today did I catch myself breathing through my mouth?"}},{"tag":["🎵 Ρυθμός","🎵 Rhythm"],"grc":"","src":["«Η Επιστήμη της Αναπνοής» · Ρυθμική αναπνοή","“The Science of Breath” · Rhythmic breathing"],"el":{"t":"Η ρυθμική αναπνοή","tr":"Όλα στη φύση έχουν ρυθμό: η καρδιά, τα κύματα, οι εποχές. Όταν αναπνέουμε με σταθερό ρυθμό, ο νους και το σώμα συντονίζονται και ηρεμούν.","simple":"Ο Ραματσαράκα πρότεινε να μετράμε την ανάσα με βάση τον χτύπο της καρδιάς: για παράδειγμα, εισπνοή σε έξι χτύπους, κράτημα σε τρεις, εκπνοή σε έξι, παύση σε τρεις. Δεν χρειάζεται να είναι ακριβώς έτσι· το σημαντικό είναι ο σταθερός, ήρεμος ρυθμός.\n\nΌπως ένα παιδί ηρεμεί όταν το λικνίζουμε ρυθμικά, έτσι ηρεμεί και ο νους μας με μια ρυθμική ανάσα.","life":"Πριν από μια σημαντική εξέταση, μια φοιτήτρια τρέμει. Κάθεται στον διάδρομο και μετρά: «εισπνοή 1-2-3-4, εκπνοή 1-2-3-4». Μετά από δύο λεπτά τα χέρια της σταματούν να τρέμουν. Μπαίνει στην αίθουσα πιο ήρεμη.","am":"Κάντε δέκα ανάσες μετρώντας: εισπνοή στο τέσσερα, εκπνοή στο τέσσερα.","ex":"Όταν νιώσετε άγχος σήμερα, κάντε δύο λεπτά ρυθμική αναπνοή: εισπνοή στο τέσσερα, κράτημα στο δύο, εκπνοή στο τέσσερα, παύση στο δύο. Αν σας ζορίζει το κράτημα, παραλείψτε το. Η αναπνοή πρέπει να είναι άνετη.","pm":"Σε ποια στιγμή σήμερα με βοήθησε ένας ήρεμος ρυθμός;"},"en":{"t":"Rhythmic breathing","tr":"Everything in nature has rhythm: the heart, the waves, the seasons. When we breathe in a steady rhythm, mind and body come into tune and calm down.","simple":"Ramacharaka suggested counting the breath by the heartbeat: for example, inhale for six beats, hold for three, exhale for six, pause for three. It need not be exactly so; what matters is a steady, calm rhythm.\n\nJust as a child calms when rocked rhythmically, so our mind calms with rhythmic breath.","life":"Before an important exam, a student is trembling. She sits in the corridor and counts: “in 1-2-3-4, out 1-2-3-4”. After two minutes her hands stop shaking. She enters the room calmer.","am":"Take ten breaths counting: in for four, out for four.","ex":"When you feel anxious today, do two minutes of rhythmic breathing: in for four, hold for two, out for four, pause for two. If holding is uncomfortable, skip it. Breathing should be easy.","pm":"At what moment today did a calm rhythm help me?"}},{"tag":["🍽️ Φαγητό","🍽️ Food"],"grc":"","src":["«Χάθα Γιόγκα» · Η πείνα και η όρεξη","“Hatha Yoga” · Hunger and appetite"],"el":{"t":"Τρώγε αργά","tr":"Να μασάς καλά την τροφή σου και να τρως με προσοχή. Η αληθινή πείνα είναι διαφορετική από την όρεξη της συνήθειας. Όποιος τρώει αργά, χορταίνει με λιγότερα και χωνεύει καλύτερα.","simple":"Ο Ραματσαράκα έγραφε ότι πολλοί άνθρωποι τρώνε βιαστικά, χωρίς να σκέφτονται, και έτσι τρώνε περισσότερο απ’ όσο χρειάζονται. Πρότεινε να μασάμε κάθε μπουκιά αργά, να απολαμβάνουμε τη γεύση και να σταματάμε πριν «σκάσουμε».\n\nΣήμερα το λέμε «συνειδητή διατροφή». Το φαγητό μπροστά σε οθόνη κάνει το αντίθετο: τρώμε χωρίς να το καταλάβουμε.","life":"Μια οικογένεια τρώει πάντα με την τηλεόραση ανοιχτή και κανείς δεν μιλά. Αποφασίζουν μία φορά την εβδομάδα να τρώνε χωρίς οθόνες. Τρώνε πιο αργά, συζητούν, γελούν — και ο μικρός λέει ότι το φαγητό «είναι πιο νόστιμο».","am":"Στο πρώτο φαγητό ή τον πρώτο καφέ της ημέρας, κάντε τις τρεις πρώτες γουλιές ή μπουκιές πολύ αργά, προσέχοντας τη γεύση.","ex":"Φάτε ένα γεύμα σήμερα χωρίς οθόνη. Ακουμπήστε το πιρούνι στο τραπέζι ανάμεσα στις μπουκιές και μασήστε αργά. Πριν πάρετε δεύτερη μερίδα, περιμένετε πέντε λεπτά και ρωτήστε: «Πεινάω ακόμη;» Αν ακολουθείτε ειδική διατροφή, τηρήστε τις οδηγίες του γιατρού σας.","pm":"Πώς ένιωσε το σώμα μου όταν έφαγα αργά;"},"en":{"t":"Eat slowly","tr":"Chew your food well and eat with attention. True hunger is different from the appetite of habit. Whoever eats slowly is satisfied with less and digests better.","simple":"Ramacharaka wrote that many people eat hurriedly, without thinking, and so eat more than they need. He suggested chewing each bite slowly, enjoying the taste and stopping before we are “stuffed”.\n\nToday we call it “mindful eating”. Eating in front of a screen does the opposite: we eat without noticing.","life":"A family always eats with the TV on and nobody talks. They decide that once a week they will eat without screens. They eat more slowly, talk, laugh — and the youngest says the food “tastes better”.","am":"With your first meal or coffee of the day, take the first three sips or bites very slowly, noticing the taste.","ex":"Eat one meal today without a screen. Put your fork down between bites and chew slowly. Before a second helping, wait five minutes and ask: “Am I still hungry?” If you follow a special diet, keep to your doctor’s advice.","pm":"How did my body feel when I ate slowly?"}},{"tag":["💧 Νερό και αέρας","💧 Water and air"],"grc":"","src":["«Χάθα Γιόγκα» · Νερό, ήλιος και καθαρός αέρας","“Hatha Yoga” · Water, sunshine and fresh air"],"el":{"t":"Νερό, ήλιος, καθαρός αέρας","tr":"Το σώμα είναι σαν ένας κήπος: χρειάζεται νερό, φως και καθαρό αέρα. Πολλοί άνθρωποι πίνουν πολύ λίγο νερό και μένουν όλη μέρα σε κλειστά δωμάτια, και μετά απορούν γιατί είναι κουρασμένοι.","simple":"Ο Ραματσαράκα θύμιζε τα πιο απλά: να πίνουμε νερό μέσα στη μέρα, να ανοίγουμε τα παράθυρα, να βγαίνουμε στον ήλιο και στη φύση. Πράγματα δωρεάν, που όμως ξεχνάμε.\n\nΠριν ψάξουμε περίπλοκες λύσεις για την κούραση, αξίζει να ρωτήσουμε: ήπια νερό; είδα φως σήμερα; ανέπνευσα καθαρό αέρα;","life":"Ένας υπάλληλος γραφείου έχει πονοκεφάλους κάθε απόγευμα. Βάζει ένα μπουκάλι νερό στο γραφείο του και κάνει δέκα λεπτά βόλτα έξω στο μεσημεριανό διάλειμμα. Μετά από λίγες μέρες οι πονοκέφαλοι λιγοστεύουν. (Αν ένας πόνος συνεχίζεται, χρειάζεται πάντα γιατρός.)","am":"Πιείτε ένα ποτήρι νερό και ανοίξτε το παράθυρο για πέντε λεπτά, παίρνοντας μερικές βαθιές ανάσες.","ex":"Σήμερα: γεμίστε ένα μπουκάλι νερό και κρατήστε το κοντά σας. Βγείτε έξω, στο φως της ημέρας, για τουλάχιστον 15 λεπτά. Αν έχετε περιορισμό στα υγρά από τον γιατρό σας, ακολουθήστε τον.","pm":"Πόσο νερό ήπια σήμερα; Πόση ώρα είδα το φως της ημέρας;"},"en":{"t":"Water, sun, fresh air","tr":"The body is like a garden: it needs water, light and fresh air. Many people drink very little water and stay all day in closed rooms, and then wonder why they are tired.","simple":"Ramacharaka reminded us of the simplest things: to drink water during the day, to open windows, to go out into the sun and nature. Free things that we nevertheless forget.\n\nBefore seeking complicated solutions for tiredness, it is worth asking: did I drink water? did I see daylight today? did I breathe fresh air?","life":"An office worker has headaches every afternoon. He puts a bottle of water on his desk and takes a ten-minute walk outside at lunch. After a few days the headaches lessen. (If pain continues, a doctor is always needed.)","am":"Drink a glass of water and open the window for five minutes, taking a few deep breaths.","ex":"Today: fill a water bottle and keep it near you. Go outside, into daylight, for at least 15 minutes. If your doctor has limited your fluids, follow that advice.","pm":"How much water did I drink today? How long did I see daylight?"}},{"tag":["😌 Χαλάρωση","😌 Relaxation"],"grc":"","src":["«Χάθα Γιόγκα» · Η τέχνη της χαλάρωσης","“Hatha Yoga” · The art of relaxation"],"el":{"t":"Η τέχνη της χαλάρωσης","tr":"Οι άνθρωποι σπαταλούν τεράστια ενέργεια κρατώντας τους μυς τους σφιγμένους χωρίς λόγο. Μάθε να χαλαρώνεις το σώμα σου κομμάτι-κομμάτι, όπως μια γάτα που ξαπλώνει στον ήλιο.","simple":"Κοιτάξτε τώρα τους ώμους σας: μήπως είναι ανεβασμένοι; Το σαγόνι σας είναι σφιγμένο; Συχνά κρατάμε ένταση στο σώμα όλη τη μέρα, χωρίς να το καταλαβαίνουμε, και το βράδυ είμαστε εξαντλημένοι.\n\nΟ Ραματσαράκα έδινε ως παράδειγμα τη γάτα: όταν ξεκουράζεται, ξεκουράζεται ολόκληρη. Όταν χρειάζεται, πετάγεται αμέσως με όλη της τη δύναμη.","life":"Μια νοσηλεύτρια δεν μπορεί να κοιμηθεί μετά τη νυχτερινή βάρδια. Ξαπλώνει και χαλαρώνει ένα-ένα τα μέλη της: πόδια, κοιλιά, χέρια, ώμους, πρόσωπο. Τις περισσότερες φορές κοιμάται πριν φτάσει στο πρόσωπο.","am":"Ελέγξτε τρία σημεία: ώμοι, σαγόνι, μέτωπο. Αφήστε τα να χαλαρώσουν με μια βαθιά εκπνοή.","ex":"Απόψε στο κρεβάτι, κάντε το «ταξίδι στο σώμα»: σφίξτε τα δάχτυλα των ποδιών για πέντε δευτερόλεπτα και αφήστε τα. Μετά γάμπες, μηροί, κοιλιά, χέρια, ώμοι, πρόσωπο. Σε κάθε σημείο, πείτε μέσα σας «χαλαρώνω». Αν πονάει κάποιο σημείο, μην το σφίξετε — απλώς χαλαρώστε το.","pm":"Πού κρατάω συνήθως την ένταση στο σώμα μου;"},"en":{"t":"The art of relaxation","tr":"People waste enormous energy keeping their muscles tense for no reason. Learn to relax your body piece by piece, like a cat stretching out in the sun.","simple":"Look at your shoulders now: are they raised? Is your jaw clenched? We often hold tension in the body all day without noticing, and by evening we are exhausted.\n\nRamacharaka gave the cat as an example: when it rests, it rests completely. When needed, it springs up at once with all its strength.","life":"A nurse cannot sleep after the night shift. She lies down and relaxes her limbs one by one: feet, belly, hands, shoulders, face. Most times she falls asleep before reaching her face.","am":"Check three places: shoulders, jaw, forehead. Let them relax with a deep exhale.","ex":"Tonight in bed, take a “journey through the body”: tense your toes for five seconds and release. Then calves, thighs, belly, hands, shoulders, face. At each place, say inwardly “I relax”. If a spot is painful, do not tense it — just relax it.","pm":"Where do I usually hold tension in my body?"}},{"tag":["🔋 Ενέργεια","🔋 Energy"],"grc":"","src":["«Η Επιστήμη της Αναπνοής» · Η καθαριστική αναπνοή","“The Science of Breath” · The cleansing breath"],"el":{"t":"Η καθαριστική αναπνοή","tr":"Όταν νιώθεις κουρασμένος ή βαρύς, πάρε μια βαθιά ανάσα, κράτησέ τη λίγο, και μετά βγάλε τον αέρα από τα χείλη σε μικρές, δυνατές εκπνοές, σαν να σφυρίζεις χωρίς ήχο. Αυτή η ανάσα καθαρίζει, ξυπνά και δίνει ζωντάνια.","simple":"Οι προηγούμενες ασκήσεις ήταν για ηρεμία. Αυτή είναι για ενέργεια — για τις στιγμές που νιώθουμε νωθροί, βαρετοί ή «θολοί». Ο Ραματσαράκα την πρότεινε στους ομιλητές και τους τραγουδιστές πριν βγουν στη σκηνή.\n\nΗ σωστή αναπνοή είναι σαν διακόπτης: με αργή ανάσα ηρεμούμε, με ζωηρή ανάσα ξυπνάμε. Εμείς διαλέγουμε.","life":"Ένας φοιτητής νυστάζει στις τρεις το μεσημέρι πάνω από τα βιβλία. Αντί για τρίτο καφέ, σηκώνεται, ανοίγει το παράθυρο και κάνει τρεις καθαριστικές αναπνοές. Νιώθει το κεφάλι του να καθαρίζει και συνεχίζει.","am":"Σταθείτε όρθιοι, τεντώστε τα χέρια ψηλά με μια βαθιά εισπνοή, και κατεβάστε τα αργά εκπνέοντας.","ex":"Όταν νιώσετε κούραση σήμερα, κάντε τρεις καθαριστικές αναπνοές: βαθιά εισπνοή από τη μύτη, μικρό κράτημα, και εκπνοή από τα σουφρωμένα χείλη σε μικρά, δυνατά «φφ-φφ-φφ», ώσπου να αδειάσουν οι πνεύμονες. Ξεκουραστείτε ανάμεσα. Αν ζαλιστείτε, σταματήστε.","pm":"Ποιες ώρες της μέρας χρειάζομαι ηρεμία και ποιες ενέργεια;"},"en":{"t":"The cleansing breath","tr":"When you feel tired or heavy, take a deep breath, hold it briefly, then let the air out through the lips in short, strong puffs, as if whistling without sound. This breath cleanses, awakens and brings vitality.","simple":"The earlier exercises were for calm. This one is for energy — for the moments when we feel sluggish, dull or “foggy”. Ramacharaka recommended it to speakers and singers before going on stage.\n\nRight breathing is like a switch: with slow breath we calm, with lively breath we wake. We choose.","life":"A student grows sleepy at three in the afternoon over his books. Instead of a third coffee, he gets up, opens the window and does three cleansing breaths. He feels his head clear and carries on.","am":"Stand up, stretch your arms high with a deep inhale, and lower them slowly as you exhale.","ex":"When you feel tired today, do three cleansing breaths: deep inhale through the nose, brief hold, and exhale through pursed lips in short, strong “ff-ff-ff” puffs until the lungs are empty. Rest in between. If you feel dizzy, stop.","pm":"At what hours of the day do I need calm, and at what hours energy?"}}]},
{"id":"gi","emoji":"🌹","cls":"c-gi","origEn":true,"origLbl":["Το αγγλικό κείμενο:","The original English:"],"name":["Χαλίλ Γκιμπράν","Kahlil Gibran"],"withName":["με τον Χαλίλ Γκιμπράν","with Kahlil Gibran"],"years":["1883–1931 · Ο ποιητής του «Προφήτη»","1883–1931 · The poet of “The Prophet”"],"bio":["<p>Ο Χαλίλ Γκιμπράν γεννήθηκε σε ένα ορεινό χωριό του <b>Λιβάνου</b>, το Μπσαρί, κοντά στους αρχαίους κέδρους. Η οικογένειά του ήταν φτωχή. Όταν ήταν 12 ετών, η μητέρα του τον πήρε μαζί με τα αδέλφια του και μετανάστευσαν στη Βοστώνη της Αμερικής.</p><p>Εκεί έμαθε ζωγραφική και ποίηση. Μέσα σε λίγα χρόνια έχασε τη μητέρα του, τον αδελφό του και τη μικρή του αδελφή. Ο πόνος αυτός βάθυνε την ψυχή του. Έγραφε στα αραβικά και στα αγγλικά, και ζωγράφιζε μυστικιστικές εικόνες.</p><p>Το 1923 εξέδωσε <b>«Ο Προφήτης»</b>: ένας σοφός, πριν φύγει με το πλοίο από την πόλη όπου έζησε χρόνια, απαντά στους κατοίκους για την αγάπη, τον γάμο, τα παιδιά, τη δουλειά, τη χαρά και τη λύπη. Έχει μεταφραστεί σε πάνω από εκατό γλώσσες και διαβάζεται ακόμη σε γάμους, βαφτίσια και κηδείες σε όλο τον κόσμο.</p>","<p>Kahlil Gibran was born in a mountain village of <b>Lebanon</b>, Bsharri, near the ancient cedars. His family was poor. When he was 12, his mother took him and his siblings and they emigrated to Boston in America.</p><p>There he learned painting and poetry. Within a few years he lost his mother, his brother and his little sister. This pain deepened his soul. He wrote in Arabic and English and painted mystical images.</p><p>In 1923 he published <b>“The Prophet”</b>: a sage, before sailing from the city where he had lived for years, answers the townspeople about love, marriage, children, work, joy and sorrow. It has been translated into more than a hundred languages and is still read at weddings, christenings and funerals all over the world.</p>"],"cheer":["Ο Γκιμπράν έλεγε ότι η δουλειά είναι αγάπη που γίνεται ορατή. Σήμερα η αγάπη σας έγινε λίγο πιο ορατή.","Gibran said work is love made visible. Today your love became a little more visible."],"fare":{"grc":"Say not, “I have found the truth,” but rather, “I have found a truth.”","src":["Χαλίλ Γκιμπράν, «Ο Προφήτης» · Για την αυτογνωσία","Kahlil Gibran, “The Prophet” · On Self-Knowledge"],"tr":["Μη λες «βρήκα την αλήθεια», αλλά «βρήκα μια αλήθεια».","Say not, “I have found the truth,” but rather, “I have found a truth.”"]},"days":[{"tag":["👶 Παιδιά","👶 Children"],"grc":"Your children are not your children. They are the sons and daughters of Life’s longing for itself. They come through you but not from you, and though they are with you yet they belong not to you.","src":["«Ο Προφήτης» · Για τα παιδιά","“The Prophet” · On Children"],"el":{"t":"Τα παιδιά σας δεν είναι δικά σας","tr":"Τα παιδιά σας δεν είναι παιδιά σας. Είναι οι γιοι και οι κόρες του πόθου της Ζωής για τον εαυτό της. Έρχονται μέσα από εσάς, αλλά όχι από εσάς· και μολονότι είναι μαζί σας, δεν σας ανήκουν.","simple":"Ο Γκιμπράν συνεχίζει: «Μπορείτε να τους δώσετε την αγάπη σας, όχι όμως τις σκέψεις σας· γιατί έχουν τις δικές τους σκέψεις.» Και τους γονείς τούς παρομοιάζει με τόξα, από τα οποία τα παιδιά φεύγουν σαν ζωντανά βέλη προς το μέλλον.\n\nΑυτό δεν σημαίνει ότι αγαπάμε λιγότερο. Σημαίνει ότι αγαπάμε πιο ελεύθερα: βοηθάμε το παιδί να γίνει ο εαυτός του, όχι αντίγραφό μας.","life":"Ένας πατέρας ονειρευόταν ο γιος του να γίνει γιατρός, όπως εκείνος. Ο γιος αγαπά τη μουσική. Μετά από πολλούς καβγάδες, ο πατέρας πηγαίνει στην πρώτη του συναυλία. Βλέπει τον γιο του να λάμπει. Το βράδυ του λέει: «Είμαι περήφανος για σένα — για αυτό που είσαι εσύ.»","am":"Αν έχετε παιδιά, εγγόνια ή μαθητές, σκεφτείτε: «Τι αγαπά πραγματικά αυτό το παιδί;» Αν όχι, σκεφτείτε το παιδί που ήσασταν κάποτε.","ex":"Ρωτήστε σήμερα ένα παιδί ή έναν νέο της οικογένειάς σας για ένα όνειρό του ή κάτι που αγαπά — και ακούστε χωρίς να το διορθώσετε ή να το κρίνετε. Ή γράψτε ένα γράμμα στο παιδί που ήσασταν: τι θα θέλατε να ακούσει;","pm":"Πώς άφησα σήμερα κάποιον να είναι ο εαυτός του;"},"en":{"t":"Your children are not your children","tr":"Your children are not your children. They are the sons and daughters of Life’s longing for itself. They come through you but not from you, and though they are with you yet they belong not to you.","simple":"Gibran continues: “You may give them your love but not your thoughts, for they have their own thoughts.” And he likens parents to bows, from which children are sent forth as living arrows into the future.\n\nThis does not mean loving less. It means loving more freely: helping the child become themselves, not a copy of us.","life":"A father dreamed his son would become a doctor like him. The son loves music. After many quarrels, the father goes to his first concert. He sees his son glowing. That evening he tells him: “I’m proud of you — of who you are.”","am":"If you have children, grandchildren or pupils, think: “What does this child truly love?” If not, think of the child you once were.","ex":"Ask a child or young person in your family today about a dream of theirs or something they love — and listen without correcting or judging. Or write a letter to the child you were: what would you want them to hear?","pm":"How did I let someone be themselves today?"}},{"tag":["💑 Ζευγάρι","💑 Couples"],"grc":"But let there be spaces in your togetherness, and let the winds of the heavens dance between you.","src":["«Ο Προφήτης» · Για τον γάμο","“The Prophet” · On Marriage"],"el":{"t":"Αφήστε χώρο ανάμεσά σας","tr":"Αφήστε όμως να υπάρχουν διάκενα μέσα στο να είστε μαζί, και αφήστε τους ανέμους των ουρανών να χορεύουν ανάμεσά σας.","simple":"Ο Γκιμπράν λέει στα ζευγάρια: αγαπηθείτε, αλλά μην κάνετε την αγάπη δεσμά. Δώστε ο ένας στον άλλον το ψωμί σας, αλλά μην τρώτε από την ίδια φέτα. Τραγουδήστε και χορέψτε μαζί, αλλά αφήστε τον καθένα να είναι μόνος, όπως οι χορδές της λύρας είναι χωριστές κι ας δονούνται με την ίδια μουσική.\n\nΚαι καταλήγει: οι κολόνες του ναού στέκονται χωριστά, και η βελανιδιά και το κυπαρίσσι δεν μεγαλώνουν το ένα στη σκιά του άλλου.","life":"Ένα ζευγάρι μετά τη σύνταξη περνά όλη τη μέρα μαζί και αρχίζει να μαλώνει συνέχεια. Αποφασίζουν: εκείνος πηγαίνει δύο πρωινά την εβδομάδα στον σύλλογο του χωριού, εκείνη σε μια χορωδία. Το βράδυ έχουν πολλά να πουν ο ένας στον άλλον. Οι καβγάδες λιγοστεύουν.","am":"Σκεφτείτε έναν άνθρωπο που αγαπάτε και πείτε: «Σε αγαπώ, και σε αφήνω ελεύθερο.»","ex":"Αν ζείτε με κάποιον, δώστε του σήμερα λίγο «χώρο» για κάτι δικό του, και πάρτε κι εσείς λίγο για κάτι δικό σας. Το βράδυ, πείτε ο ένας στον άλλον κάτι που ζήσατε. Αν είστε μόνοι, σκεφτείτε μια σχέση όπου κρατήσατε ή δεν κρατήσατε αυτή την ισορροπία.","pm":"Πού σήμερα η αγάπη μου έδωσε ελευθερία και όχι δεσμά;"},"en":{"t":"Let there be spaces","tr":"But let there be spaces in your togetherness, and let the winds of the heavens dance between you.","simple":"Gibran tells couples: love one another, but make not a bond of love. Give one another of your bread, but eat not from the same loaf. Sing and dance together, but let each one be alone, as the strings of a lute are alone though they quiver with the same music.\n\nAnd he concludes: the pillars of the temple stand apart, and the oak tree and the cypress grow not in each other’s shadow.","life":"A couple after retirement spend all day together and start quarrelling constantly. They decide: he goes two mornings a week to the village club, she to a choir. In the evening they have much to tell each other. The quarrels lessen.","am":"Think of someone you love and say: “I love you, and I leave you free.”","ex":"If you live with someone, give them a little “space” today for something of their own, and take some for yourself. In the evening, tell each other something you lived. If you live alone, think of a relationship where you did or did not keep this balance.","pm":"Where today did my love give freedom and not chains?"}},{"tag":["🔨 Δουλειά","🔨 Work"],"grc":"Work is love made visible.","src":["«Ο Προφήτης» · Για τη δουλειά","“The Prophet” · On Work"],"el":{"t":"Η δουλειά είναι αγάπη που φαίνεται","tr":"Η δουλειά είναι αγάπη που έγινε ορατή.","simple":"Ο Γκιμπράν λέει ότι όταν δουλεύουμε με αγάπη, είναι σαν να υφαίνουμε ένα ρούχο με νήματα από την καρδιά μας, σαν να το φοράει ο αγαπημένος μας. Σαν να χτίζουμε ένα σπίτι όπου θα κατοικήσει ο αγαπημένος μας.\n\nΚάθε δουλειά — μαγείρεμα, καθάρισμα, διδασκαλία, ένα έγγραφο στο γραφείο — μπορεί να γίνει με βαρεμάρα ή με αγάπη. Το αποτέλεσμα φαίνεται, και το νιώθουν οι άλλοι.","life":"Ένας οδοκαθαριστής σε ένα μικρό χωριό φυτεύει λουλούδια στις άκρες του δρόμου που καθαρίζει, χωρίς να του το ζητήσει κανείς. Οι κάτοικοι αρχίζουν να τον χαιρετούν με το όνομά του. Ο δρόμος του γίνεται ο πιο όμορφος της περιοχής.","am":"Πείτε: «Σήμερα θα βάλω λίγη αγάπη σε μία δουλειά που κάνω από συνήθεια.»","ex":"Διαλέξτε σήμερα μία καθημερινή δουλειά (το φαγητό, το στρώσιμο του κρεβατιού, ένα email) και κάντε τη σαν να ήταν για τον πιο αγαπημένο σας άνθρωπο. Προσέξτε τη διαφορά στο πώς νιώθετε.","pm":"Σε ποια δουλειά μου σήμερα φάνηκε η αγάπη;"},"en":{"t":"Work is love made visible","tr":"Work is love made visible.","simple":"Gibran says that when we work with love, it is like weaving a cloth with threads drawn from our heart, as if our beloved were to wear it. Like building a house as if our beloved were to dwell in it.\n\nAny work — cooking, cleaning, teaching, a document at the office — can be done with boredom or with love. The result shows, and others feel it.","life":"A street sweeper in a small village plants flowers along the edges of the road he cleans, without anyone asking. The villagers start greeting him by name. His road becomes the most beautiful in the area.","am":"Say: “Today I will put a little love into one task I do out of habit.”","ex":"Choose one everyday task today (the cooking, making the bed, an email) and do it as if it were for the person you love most. Notice the difference in how you feel.","pm":"In which task today did love become visible?"}},{"tag":["🌗 Χαρά και λύπη","🌗 Joy and sorrow"],"grc":"Your joy is your sorrow unmasked. The deeper that sorrow carves into your being, the more joy you can contain.","src":["«Ο Προφήτης» · Για τη χαρά και τη λύπη","“The Prophet” · On Joy and Sorrow"],"el":{"t":"Η λύπη σκάβει χώρο για τη χαρά","tr":"Η χαρά σας είναι η λύπη σας χωρίς μάσκα. Όσο πιο βαθιά σκάβει η λύπη μέσα σας, τόσο περισσότερη χαρά μπορείτε να χωρέσετε.","simple":"Ο Γκιμπράν δίνει ένα όμορφο παράδειγμα: το φλιτζάνι που κρατά το κρασί σας δεν είναι το ίδιο που κάηκε στο καμίνι του αγγειοπλάστη; Και η λύρα που μας ευφραίνει δεν είναι το ίδιο ξύλο που σκάφτηκε με μαχαίρι;\n\nΗ λύπη και η χαρά δεν είναι εχθροί· έρχονται μαζί. Όποιος έχει πονέσει βαθιά, μπορεί και να χαρεί βαθιά — και να καταλάβει τον πόνο των άλλων.","life":"Μια γυναίκα πέρασε δύσκολα χρόνια με μια βαριά αρρώστια. Όταν γίνεται καλά, κάθε απλό πράγμα — ένας καφές στο μπαλκόνι, το γέλιο του εγγονού της — της φαίνεται θαύμα. «Πριν ζούσα στην επιφάνεια», λέει. «Τώρα ζω στο βάθος.»","am":"Πείτε: «Ό,τι κι αν νιώσω σήμερα, χαρά ή λύπη, θα το δεχτώ ως μέρος της ζωής.»","ex":"Γράψτε μια λύπη του παρελθόντος σας. Από κάτω, γράψτε μια χαρά που ζήσατε πιο βαθιά εξαιτίας της. Αν τώρα περνάτε λύπη, γράψτε απλώς: «Αυτή η λύπη σκάβει χώρο. Θα έρθει και χαρά.» Αν η λύπη κρατά πολύ ή είναι πολύ βαριά, μιλήστε με τον γιατρό σας.","pm":"Τι λύπη και τι χαρά συνάντησα σήμερα;"},"en":{"t":"Sorrow carves room for joy","tr":"Your joy is your sorrow unmasked. The deeper that sorrow carves into your being, the more joy you can contain.","simple":"Gibran gives a beautiful example: is not the cup that holds your wine the very cup that was burned in the potter’s oven? And is not the lute that soothes your spirit the very wood that was hollowed with knives?\n\nSorrow and joy are not enemies; they come together. Whoever has hurt deeply can also rejoice deeply — and understand the pain of others.","life":"A woman went through hard years with a se
