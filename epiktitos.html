function fillNotes(){
  var box=$('dlist');if(!box)return;
  var q=norm(($('q')||{}).value||'').trim(),cf=($('qc')||{}).value||'';
  var all=allNotes();
  var items=all.filter(function(x){
    if(cf&&x.c.id!==cf)return false;
    if(!q)return true;
    return norm(x.n.t+' '+x.c.days[x.i][LANG].t+' '+T(x.c.name)).indexOf(q)>=0;
  });
  var f=$('found');
  if(f)f.textContent=all.length?(q||cf?L('Βρέθηκαν ','Found ')+items.length+L(' από ',' of ')+all.length:L('Έχετε ','You have ')+all.length+L(' σημειώσεις',' notes')):'';
  if(!all.length){box.innerHTML='<div class="empty">'+L('Δεν έχετε γράψει ακόμη σημειώσεις.<br>Θα εμφανιστούν εδώ μόλις γράψετε στη «βραδινή εξέταση» κάποιας ημέρας.','You have not written any notes yet.<br>They will appear here once you write in the “evening review” of a day.')+'</div>';return}
  if(!items.length){box.innerHTML='<div class="empty">'+L('Δεν βρέθηκε τίποτα. Δοκιμάστε άλλη λέξη.','Nothing found. Try another word.')+'</div>';return}
  box.innerHTML=items.map(function(x){var d=x.c.days[x.i],k=x.c.id+'-'+x.i;
    return '<div class="card entry"><div class="eh">'+x.c.emoji+' '+esc(T(x.c.name))+' · '+L('Ημέρα ','Day ')+(x.i+1)+' — '+esc(d[LANG].t)+'</div>'+
     '<div class="ed">🌙 '+esc(d[LANG].pm)+(x.n.d?'<br>✏️ '+L('Τελευταία αλλαγή: ','Last changed: ')+fmtDate(x.n.d):'')+'</div>'+
     '<textarea oninput="EP.note(\''+x.c.id+'\','+x.i+',this,true)">'+esc(x.n.t)+'</textarea><div class="saved"></div>'+
     '<div class="row"><button class="big ghost small" onclick="EP.go(\''+x.c.id+'-'+(x.i+1)+'\')">➜ '+L('Η ημέρα','The day')+'</button>'+
     '<button class="big ghost small" id="del-'+k+'" onclick="EP.del(\''+x.c.id+'\','+x.i+')">🗑️ '+L('Σβήσιμο','Delete')+'</button></div></div>'}).join('');
  Array.prototype.forEach.call(box.querySelectorAll('textarea'),grow);
}
function grow(el){if(!el)return;el.style.height='auto';el.style.height=Math.max(120,el.scrollHeight+4)+'px'}
function notesAsText(){
  var out=[L('7 ημέρες με τους Σοφούς — Οι σημειώσεις μου','7 days with the Sages — My notes'),fmtDate(Date.now()),''];
  allNotes().forEach(function(x){var d=x.c.days[x.i];
    out.push('==============================');
    out.push(T(x.c.name)+' · '+L('Ημέρα ','Day ')+(x.i+1)+' — '+d[LANG].t);
    out.push(d[LANG].pm);
    if(x.n.d)out.push('('+fmtDate(x.n.d)+')');
    out.push('');out.push(x.n.t.trim());out.push('');
  });
  return out.join('\n');
}

/* ---------------- ΕΝΕΡΓΕΙΕΣ ---------------- */
var noteTimer=null,armed={};
function arm(key,btn,text){
  if(armed[key]){armed[key]=false;return true}
  armed[key]=true;if(btn){btn._old=btn.innerHTML;btn.innerHTML='⚠️ '+text;btn.classList.add('red')}
  setTimeout(function(){armed[key]=false;if(btn&&document.body.contains(btn)){btn.innerHTML=btn._old;btn.classList.remove('red')}},5000);
  return false;
}
var EP={
 go:function(h){location.hash=h?'#'+h:'#start'},
 back:function(){
   var r=route();
   if(r.v==='day'||r.v==='end'){EP.go(r.c.id);return}
   if(r.v!=='home'){EP.go('');return}
   try{if(window.parent!==window&&typeof window.parent.ep7Close==='function'){window.parent.ep7Close();return}}catch(e){}
   try{if(history.length>1&&document.referrer&&new URL(document.referrer).origin===location.origin){history.back();return}}catch(e){}
   location.href='./';
 },
 lang:function(){LANG=LANG==='el'?'en':'el';try{localStorage.setItem('sofoi7-lang',LANG)}catch(e){}render()},
 note:function(id,i,el,quiet){
   var s=st(id);s.notes[i]={t:el.value,d:Date.now()};grow(el);
   var m=el.nextElementSibling;clearTimeout(noteTimer);
   noteTimer=setTimeout(function(){save();if(m)m.textContent='✓ '+L('Αποθηκεύτηκε στη συσκευή σας','Saved on your device')},500);
 },
 del:function(id,i){
   if(!arm('del-'+id+'-'+i,$('del-'+id+'-'+i),L('Πατήστε ξανά για σβήσιμο','Tap again to delete')))return;
   delete st(id).notes[i];save();fillNotes();
 },
 delAll:function(){
   if(!arm('all',$('delAllBtn'),L('Σίγουρα; Πατήστε ξανά — θα σβηστούν ΟΛΕΣ','Sure? Tap again — ALL will be deleted')))return;
   COURSES.forEach(function(c){st(c.id).notes={}});save();fillNotes();
 },
 exportTxt:function(){
   if(!allNotes().length){sheet('<h2>📔</h2><p>'+L('Δεν υπάρχουν ακόμη σημειώσεις για αποθήκευση.','There are no notes to save yet.')+'</p><button class="big gold" onclick="EP.close()">👍 OK</button>');return}
   var dt=new Date(),stamp=dt.getDate()+'-'+(dt.getMonth()+1)+'-'+dt.getFullYear();
   try{var blob=new Blob(['﻿'+notesAsText()],{type:'text/plain;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=L('Οι-σημειώσεις-μου_','My-notes_')+stamp+'.txt';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}
   catch(e){EP.copyAll()}
 },
 copyAll:function(){
   var t=notesAsText();
   function ok(){sheet('<h2>📋 '+L('Αντιγράφηκαν','Copied')+'</h2><p>'+L('Επικολλήστε τις όπου θέλετε — σε ένα email προς τον εαυτό σας ή στις Σημειώσεις του κινητού.','Paste them wherever you like — in an email to yourself or in your phone’s Notes.')+'</p><button class="big gold" onclick="EP.close()">👍 OK</button>')}
   try{navigator.clipboard.writeText(t).then(ok,function(){fallback()})}catch(e){fallback()}
   function fallback(){sheet('<h2>📋 '+L('Αντιγράψτε από εδώ','Copy from here')+'</h2><textarea style="min-height:260px">'+esc(t)+'</textarea><button class="big gold" onclick="EP.close()">👍 OK</button>')}
 },
 dfill:function(){fillNotes()},
 done:function(id,i){var c=course(id),s=st(id);if(!isDone(id,i))s.done.push(i);save();
   if(i<6){render();sheet('<h2>🌟 '+L('Μπράβο!','Well done!')+'</h2><p style="font-size:19px">'+L('Ολοκληρώσατε την ημέρα ','You completed day ')+(i+1)+'. '+L('Αύριο σας περιμένει η επόμενη: ','Tomorrow the next one awaits: ')+'<b>«'+esc(c.days[i+1][LANG].t)+'»</b>.</p><p style="font-size:17px;color:#7a6a4a">'+esc(T(c.cheer))+'</p><button class="big gold" onclick="EP.close();EP.go(\''+id+'\')">👍 '+L('Εντάξει','OK')+'</button>')}
   else EP.go(id+'-end');
 },
 undone:function(id,i){var s=st(id);s.done=s.done.filter(function(x){return x!==i});save();render()},
 restart:function(id){
   if(!arm('restart',$('restartBtn'),L('Πατήστε ξανά για επιβεβαίωση — θα σβηστούν και οι σημειώσεις αυτού του σοφού','Tap again to confirm — this sage’s notes will be erased too')))return;
   S.c[id]={done:[],notes:{}};save();EP.go(id);
 },
 remind:function(){
   sheet('<h2>⏰ '+L('Βάλτε μια καθημερινή υπενθύμιση','Set a daily reminder')+'</h2>'+
   L('<p>Η πιο σίγουρη υπενθύμιση είναι ένα <b>ξυπνητήρι στο κινητό</b>, κάθε πρωί:</p><p><b>📱 iPhone:</b> ανοίξτε την εφαρμογή <b>Ρολόι</b> → <b>Ξυπνητήρι</b> → <b>+</b> → διαλέξτε ώρα → <b>Επανάληψη: Κάθε μέρα</b> → στην <b>Ετικέτα</b> γράψτε «Σοφοί» → <b>Αποθήκευση</b>.</p><p><b>📱 Android:</b> ανοίξτε την εφαρμογή <b>Ρολόι</b> → <b>Ξυπνητήρι</b> → <b>+</b> → διαλέξτε ώρα → πατήστε όλες τις μέρες → στην <b>Ετικέτα</b> γράψτε «Σοφοί».</p><p>💡 Βάλτε τη σελίδα και στην αρχική οθόνη του κινητού: στο πρόγραμμα περιήγησης πατήστε <b>Κοινοποίηση</b> (iPhone) ή <b>⋮</b> (Android) → <b>Προσθήκη στην οθόνη Αφετηρίας</b>.</p>',
     '<p>The most reliable reminder is a <b>phone alarm</b> every morning:</p><p><b>📱 iPhone:</b> open <b>Clock</b> → <b>Alarm</b> → <b>+</b> → choose a time → <b>Repeat: Every day</b> → <b>Label</b> “Sages” → <b>Save</b>.</p><p><b>📱 Android:</b> open <b>Clock</b> → <b>Alarm</b> → <b>+</b> → choose a time → tap every day → <b>Label</b> “Sages”.</p><p>💡 Also add this page to your home screen: in the browser tap <b>Share</b> (iPhone) or <b>⋮</b> (Android) → <b>Add to Home Screen</b>.</p>')+
   '<button class="big gold" onclick="EP.close()">👍 '+L('Εντάξει','OK')+'</button>')
 },
 share:function(){
   var url=location.href.split('#')[0];var txt=L('7 ημέρες με τους Σοφούς — Επίκτητος, Σωκράτης, Ζήνων. Ένα λόγιο σε απλά λόγια και μία άσκηση την ημέρα, για μια πιο ήρεμη ζωή.','7 days with the Sages — Epictetus, Socrates, Zeno. One saying in plain words and one exercise a day, for a calmer life.');
   if(navigator.share){navigator.share({title:L('7 ημέρες με τους Σοφούς','7 days with the Sages'),text:txt,url:url}).catch(function(){});return}
   try{navigator.clipboard.writeText(txt+' '+url);sheet('<h2>📋 '+L('Ο σύνδεσμος αντιγράφηκε','Link copied')+'</h2><p>'+L('Επικολλήστε τον σε ένα μήνυμα προς τον φίλο σας.','Paste it into a message to your friend.')+'</p><button class="big gold" onclick="EP.close()">👍 OK</button>')}catch(e){}
 },
 speak:function(id,i){
   var b=$('ttsBtn');if(!('speechSynthesis' in window)){if(b)b.textContent=L('Η ανάγνωση δεν υποστηρίζεται σε αυτή τη συσκευή','Reading aloud is not supported on this device');return}
   if(speechSynthesis.speaking){speechSynthesis.cancel();if(b){b.classList.remove('on');b.textContent='🔊 '+L('Ακούστε το','Listen')}return}
   var D=course(id).days[i][LANG];
   var text=[D.t,D.tr,L('Με απλά λόγια. ','In plain words. ')+D.simple.replace(/\n\n/g,' '),L('Ένα παράδειγμα από τη ζωή. ','An example from life. ')+D.life,L('Η άσκηση της ημέρας. ','Today’s exercise. ')+D.ex].join('. ');
   var u=new SpeechSynthesisUtterance(text);u.lang=LANG==='el'?'el-GR':'en-GB';u.rate=0.9;
   var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.toLowerCase().indexOf(LANG)===0})[0];if(v)u.voice=v;
   u.onend=u.onerror=function(){var bb=$('ttsBtn');if(bb){bb.classList.remove('on');bb.textContent='🔊 '+L('Ακούστε το','Listen')}};
   speechSynthesis.speak(u);if(b){b.classList.add('on');b.textContent='⏹ '+L('Σταματήστε την ανάγνωση','Stop reading')}
 },
 close:function(){var s=$('sheet');if(s)s.remove()}
};
function sheet(html){EP.close();var d=document.createElement('div');d.className='sheet';d.id='sheet';d.innerHTML='<div class="box">'+html+'</div>';d.onclick=function(e){if(e.target===d)EP.close()};document.body.appendChild(d)}
window.EP=EP;

/* ---------------- ΔΡΟΜΟΛΟΓΗΣΗ ----------------
   #start = οι σοφοί · #notes = σημειώσεις · #ep = Επίκτητος
   #ep-3 = ημέρα 3 · #ep-end = τέλος. (Παλιοί σύνδεσμοι #day3 → Επίκτητος) */
function route(){
  var h=decodeURIComponent(location.hash.replace('#',''));
  var m;
  if(h==='notes')return {v:'notes'};
  if((m=/^day([1-7])$/.exec(h)))return {v:'day',c:course('ep'),i:+m[1]-1};
  if(h==='end')return {v:'end',c:course('ep')};
  if((m=/^([a-z]+)-([1-7])$/.exec(h))&&course(m[1]))return {v:'day',c:course(m[1]),i:+m[2]-1};
  if((m=/^([a-z]+)-end$/.exec(h))&&course(m[1]))return {v:'end',c:course(m[1])};
  if(course(h))return {v:'course',c:course(h)};
  return {v:'home'};
}
function render(){
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  armed={};EP.close();
  var r=route();
  document.documentElement.lang=LANG;
  document.title=r.c&&r.v!=='home'?L('7 ημέρες ','7 days ')+T(r.c.withName):L('7 ημέρες με τους Σοφούς','7 days with the Sages');
  $('app').innerHTML = r.v==='day'?vDay(r.c,r.i):r.v==='end'?vEnd(r.c):r.v==='course'?vCourse(r.c):r.v==='notes'?vNotes():vHome();
  if(r.v==='notes')fillNotes();
  Array.prototype.forEach.call(document.querySelectorAll('#app textarea'),grow);
  window.scrollTo(0,0);
}
/* ?c=ep στη διεύθυνση ανοίγει κατευθείαν έναν σοφό */
(function(){try{var c=new URLSearchParams(location.search).get('c');if(c&&course(c)&&!location.hash)history.replaceState(null,'','#'+c)}catch(e){}})();
window.addEventListener('hashchange',render);
render();
})();
