", "Kant wrote: “Out of the crooked timber of humanity no straight thing was ever made” (Idea for a Universal History, 1784). We need not be perfect; it is enough to keep trying."], "fare": {"grc": "Was kann ich wissen? Was soll ich tun? Was darf ich hoffen?", "src": ["Καντ, Κριτική του καθαρού λόγου, A 805 / B 833", "Kant, Critique of Pure Reason, A 805 / B 833"], "tr": ["Τι μπορώ να γνωρίζω; Τι οφείλω να κάνω; Τι μου επιτρέπεται να ελπίζω;", "What can I know? What ought I to do? What may I hope?"]}, "days": [{"tag": ["💡 Τόλμα να σκεφτείς", "💡 Dare to think"], "grc": "Habe Mut, dich deines eigenen Verstandes zu bedienen!", "src": ["Απάντηση στο ερώτημα: Τι είναι Διαφωτισμός; (1784)", "An Answer to the Question: What is Enlightenment? (1784)"], "el": {"t": "Έχε το θάρρος να σκέφτεσαι", "tr": "Να έχεις το θάρρος να χρησιμοποιείς το δικό σου μυαλό!", "simple": "Ο Καντ έγραψε αυτή τη φράση σε ένα σύντομο άρθρο για το τι σημαίνει «διαφωτισμός». Έλεγε ότι πολλοί άνθρωποι μένουν σαν παιδιά όλη τους τη ζωή, όχι επειδή δεν έχουν μυαλό, αλλά επειδή είναι πιο βολικό να σκέφτονται άλλοι γι’ αυτούς. Ένα βιβλίο αποφασίζει τι πιστεύουμε, η τηλεόραση τι φοβόμαστε, ο γείτονας τι είναι σωστό.\n\nΤο να σκεφτόμαστε μόνοι μας θέλει θάρρος, γιατί μπορεί να κάνουμε λάθος ή να διαφωνήσουμε με τους πολλούς. Δεν σημαίνει να μην ακούμε κανέναν. Σημαίνει να ακούμε, να ρωτάμε «γιατί;» και να αποφασίζουμε με τη δική μας κρίση.", "life": "Μια κυρία λάμβανε συνέχεια μηνύματα στο κινητό με «θαυματουργές» θεραπείες και τρομακτικές ειδήσεις, και τα προωθούσε σε όλους. Ο εγγονός της τής έμαθε να ρωτά: «Ποιος το λέει; Πού είναι η απόδειξη;» Τώρα σταματά πριν προωθήσει κάτι, και συχνά ανακαλύπτει ότι ήταν ψέμα. «Νιώθω πιο ελεύθερη», λέει.", "am": "Πείτε: «Σήμερα θα σκεφτώ με το δικό μου μυαλό, ήρεμα και με θάρρος.»", "ex": "Όταν ακούσετε ή διαβάσετε σήμερα κάτι που σας εντυπωσιάζει, σταματήστε και ρωτήστε: «Ποιος το λέει; Είναι αλήθεια; Τι πιστεύω εγώ;»", "pm": "Πού σκέφτηκα σήμερα μόνος μου; Πού άφησα άλλους να σκεφτούν για μένα;"}, "en": {"t": "Have the courage to think", "tr": "Have the courage to use your own understanding!", "simple": "Kant wrote this sentence in a short essay on what “enlightenment” means. He said many people remain like children all their lives, not because they lack a mind, but because it is more comfortable to let others think for them. A book decides what we believe, the television what we fear, the neighbour what is right.\n\nThinking for ourselves takes courage, because we may be wrong or disagree with the many. It does not mean listening to no one. It means listening, asking “why?”, and deciding with our own judgement.", "life": "A woman kept receiving messages on her phone about “miracle” cures and frightening news, and forwarded them to everyone. Her grandson taught her to ask: “Who says so? Where is the proof?” Now she pauses before forwarding anything, and often discovers it was false. “I feel freer,” she says.", "am": "Say: “Today I will think with my own mind, calmly and with courage.”", "ex": "When you hear or read something striking today, stop and ask: “Who says so? Is it true? What do I think?”", "pm": "Where did I think for myself today? Where did I let others think for me?"}}, {"tag": ["🌍 Αν το έκαναν όλοι;", "🌍 What if everyone did it?"], "grc": "Handle nur nach derjenigen Maxime, durch die du zugleich wollen kannst, daß sie ein allgemeines Gesetz werde.", "src": ["Θεμελίωση της μεταφυσικής των ηθών (1785), AA IV 421", "Groundwork of the Metaphysics of Morals (1785), AA IV 421"], "el": {"t": "Το τεστ του «αν το έκαναν όλοι»", "tr": "Να ενεργείς μόνο σύμφωνα με έναν κανόνα που θα ήθελες να γίνει νόμος για όλους.", "simple": "Αυτή είναι η πιο γνωστή ιδέα του Καντ, και είναι πιο απλή απ’ ό,τι ακούγεται. Πριν κάνουμε κάτι, ρωτάμε: «Αν όλοι οι άνθρωποι έκαναν αυτό που κάνω τώρα, θα ήταν καλός ο κόσμος;» Αν όλοι πετούσαν σκουπίδια στον δρόμο, η πόλη θα γέμιζε βρωμιά. Αν όλοι έλεγαν ψέματα όποτε τους βόλευε, κανείς δεν θα εμπιστευόταν κανέναν.\n\nΤο τεστ αυτό μας προστατεύει από μια συνηθισμένη παγίδα: «Ένας είμαι, τι πειράζει;» Ο Καντ απαντά ότι κάθε πράξη μας είναι σαν μια ψήφος για το τι κόσμο θέλουμε.", "life": "Ένας νέος ήθελε να παρκάρει σε θέση για άτομα με αναπηρία, «μόνο για δύο λεπτά». Η μητέρα του τον ρώτησε: «Αν το έκαναν όλοι για δύο λεπτά, πού θα πάρκαρε ο κύριος με το αναπηρικό καροτσάκι;» Ο νέος έκανε άλλον έναν γύρο και βρήκε κανονική θέση.", "am": "Πείτε: «Σήμερα, πριν από κάθε μικρή απόφαση, θα ρωτήσω: “Αν το έκαναν όλοι;”»", "ex": "Εφαρμόστε σήμερα το τεστ σε τρεις μικρές αποφάσεις: πού πετάτε κάτι, πώς οδηγείτε, τι λέτε για κάποιον που λείπει.", "pm": "Ποια πράξη μου σήμερα θα έκανε τον κόσμο καλύτερο αν την έκαναν όλοι; Ποια όχι;"}, "en": {"t": "The “what if everyone did it” test", "tr": "Act only according to a rule that you could at the same time want to become a law for everyone.", "simple": "This is Kant’s best-known idea, and it is simpler than it sounds. Before doing something, we ask: “If everyone did what I am doing now, would the world be good?” If everyone threw litter in the street, the city would fill with filth. If everyone lied whenever it suited them, no one would trust anyone.\n\nThis test protects us from a common trap: “I’m only one person, what does it matter?” Kant answers that each of our acts is like a vote for the kind of world we want.", "life": "A young man wanted to park in a disabled space, “just for two minutes”. His mother asked him: “If everyone did it for two minutes, where would the gentleman in the wheelchair park?” He drove around once more and found an ordinary space.", "am": "Say: “Today, before every small decision, I will ask: ‘What if everyone did it?’”", "ex": "Apply the test today to three small decisions: where you throw something away, how you drive, what you say about someone who is not present.", "pm": "Which of my acts today would make the world better if everyone did it? Which would not?"}}, {"tag": ["🧑‍🤝‍🧑 Ο άνθρωπος ως σκοπός", "🧑‍🤝‍🧑 People as ends"], "grc": "Handle so, daß du die Menschheit, sowohl in deiner Person, als in der Person eines jeden andern, jederzeit zugleich als Zweck, niemals bloß als Mittel brauchest.", "src": ["Θεμελίωση της μεταφυσικής των ηθών (1785), AA IV 429", "Groundwork of the Metaphysics of Morals (1785), AA IV 429"], "el": {"t": "Κανείς δεν είναι απλό εργαλείο", "tr": "Να συμπεριφέρεσαι στον άνθρωπο, και στον εαυτό σου και σε κάθε άλλον, πάντα και ως σκοπό, ποτέ μόνο ως μέσο.", "simple": "Ο Καντ λέει ότι τα πράγματα τα χρησιμοποιούμε: ένα σφυρί, ένα αυτοκίνητο, ένα κινητό. Τους ανθρώπους όμως δεν πρέπει να τους χρησιμοποιούμε μόνο σαν εργαλεία για τους σκοπούς μας. Κάθε άνθρωπος έχει τους δικούς του σκοπούς, τα δικά του όνειρα, τη δική του αξία.\n\nΠροσέξτε τη λέξη «μόνο». Φυσικά χρειαζόμαστε ο ένας τον άλλον: ο υπάλληλος μάς εξυπηρετεί, ο γιατρός μάς φροντίζει. Το λάθος είναι να ξεχνάμε ότι πίσω από τον ρόλο υπάρχει ένας ολόκληρος άνθρωπος. Και ο Καντ προσθέτει: ούτε τον εαυτό μας πρέπει να τον βλέπουμε σαν μηχανή.", "life": "Ένας πελάτης φώναζε στην υπάλληλο του τηλεφωνικού κέντρου γιατί του είχαν χρεώσει λάθος λογαριασμό. Ξαφνικά σκέφτηκε: «Αυτή δεν φταίει, και είναι κάποιου κόρη, κάποιου μητέρα.» Ζήτησε συγγνώμη και συνέχισε ήρεμα. Η υπάλληλος τον βοήθησε με κάθε τρόπο και στο τέλος τού είπε: «Με κάνατε να χαμογελάσω σε μια πολύ δύσκολη μέρα.»", "am": "Πείτε: «Κάθε άνθρωπος που θα συναντήσω σήμερα είναι ολόκληρος κόσμος, όχι εργαλείο.»", "ex": "Σήμερα, σε κάθε άνθρωπο που σας εξυπηρετεί (στο ταμείο, στο τηλέφωνο, στον δρόμο), πείτε το όνομά του αν το ξέρετε, κοιτάξτε τον στα μάτια και πείτε ένα ζεστό «ευχαριστώ».", "pm": "Φέρθηκα σήμερα σε κάποιον σαν να ήταν μόνο ένα μέσο; Φέρθηκα έτσι και στον εαυτό μου;"}, "en": {"t": "No one is a mere tool", "tr": "Treat humanity, whether in yourself or in any other person, always also as an end, never merely as a means.", "simple": "Kant says we use things: a hammer, a car, a phone. But people must never be used merely as tools for our purposes. Every person has their own purposes, their own dreams, their own worth.\n\nNotice the word “merely”. Of course we need one another: the clerk serves us, the doctor cares for us. The mistake is to forget that behind the role is a whole human being. And Kant adds: we should not see ourselves as machines either.", "life": "A customer was shouting at a call-centre worker because his bill was wrong. Suddenly he thought: “It’s not her fault, and she is somebody’s daughter, somebody’s mother.” He apologised and carried on calmly. She helped him in every way and at the end said: “You made me smile on a very hard day.”", "am": "Say: “Every person I meet today is a whole world, not a tool.”", "ex": "Today, with every person who serves you (at the till, on the phone, in the street), use their name if you know it, look them in the eye and say a warm “thank you”.", "pm": "Did I treat someone today as if they were only a means? Did I treat myself that way?"}}, {"tag": ["💛 Η καλή θέληση", "💛 The good will"], "grc": "Es ist überall nichts in der Welt, ja überhaupt auch außer derselben zu denken möglich, was ohne Einschränkung für gut könnte gehalten werden, als allein ein guter Wille.", "src": ["Θεμελίωση της μεταφυσικής των ηθών (1785), AA IV 393", "Groundwork of the Metaphysics of Morals (1785), AA IV 393"], "el": {"t": "Το μόνο απόλυτα καλό", "tr": "Τίποτα σε όλο τον κόσμο, ούτε και έξω από αυτόν, δεν μπορούμε να το πούμε καλό χωρίς κανέναν περιορισμό, εκτός από μία καλή θέληση.", "simple": "Η εξυπνάδα, το θάρρος, ο πλούτος, ακόμη και η υγεία είναι καλά πράγματα. Ο Καντ όμως παρατηρεί ότι όλα αυτά μπορούν να γίνουν και κακά: ένας έξυπνος απατεώνας, ένας γενναίος κακοποιός, ένας πλούσιος σκληρός. Μόνο ένα πράγμα είναι καλό πάντα: η καλή θέληση, δηλαδή η ειλικρινής πρόθεση να κάνουμε το σωστό.\n\nΑυτό είναι πολύ παρήγορο. Δεν κρίνεται η αξία μας από το αν πέτυχαν πάντα οι προσπάθειές μας. Αν θελήσαμε αληθινά το καλό και κάναμε ό,τι μπορούσαμε, ακόμη κι αν τα πράγματα δεν πήγαν όπως ελπίζαμε, η καλή μας θέληση «λάμπει σαν κόσμημα», όπως λέει ο ίδιος.", "life": "Ένας νέος έτρεξε να βοηθήσει έναν ηλικιωμένο που λιποθύμησε στον δρόμο. Έκανε ό,τι μπορούσε μέχρι να έρθει το ασθενοφόρο, αλλά στενοχωριόταν ότι «δεν ήξερε αρκετά». Ο γιατρός τού είπε: «Ήσουν ο μόνος που σταμάτησε. Αυτό είναι το πιο σημαντικό από όλα.»", "am": "Πείτε: «Σήμερα θα κρατήσω καθαρή την πρόθεσή μου. Το αποτέλεσμα δεν είναι όλο στα χέρια μου.»", "ex": "Κάντε σήμερα μια καλή πράξη μόνο επειδή είναι σωστή, χωρίς να περιμένετε ευχαριστώ ή αναγνώριση. Μετά παρατηρήστε πώς νιώθετε.", "pm": "Ποια ήταν η πρόθεσή μου σε όσα έκανα σήμερα; Υπήρξε κάτι που, αν και δεν πέτυχε, το έκανα με καλή θέληση;"}, "en": {"t": "The only thing good without limit", "tr": "Nothing in the world, indeed nothing even beyond it, can be thought good without limitation, except a good will.", "simple": "Intelligence, courage, wealth, even health are good things. But Kant observes that all of them can also become bad: a clever swindler, a brave criminal, a cruel rich man. Only one thing is always good: a good will, that is, the sincere intention to do what is right.\n\nThis is very comforting. Our worth is not judged by whether our efforts always succeeded. If we truly willed the good and did what we could, even if things did not turn out as we hoped, our good will “shines like a jewel”, as he says himself.", "life": "A young man rushed to help an old man who had fainted in the street. He did all he could until the ambulance came, but was upset that he “didn’t know enough”. The doctor told him: “You were the only one who stopped. That is the most important thing of all.”", "am": "Say: “Today I will keep my intention pure. The result is not entirely in my hands.”", "ex": "Do a good deed today only because it is right, without expecting thanks or recognition. Then notice how you feel.", "pm": "What was my intention in what I did today? Was there something that, though it did not succeed, I did with good will?"}}, {"tag": ["💎 Αξιοπρέπεια", "💎 Dignity"], "grc": "Im Reiche der Zwecke hat alles entweder einen Preis, oder eine Würde.", "src": ["Θεμελίωση της μεταφυσικής των ηθών (1785), AA IV 434", "Groundwork of the Metaphysics of Morals (1785), AA IV 434"], "el": {"t": "Τιμή ή αξιοπρέπεια", "tr": "Τα πάντα έχουν είτε μια τιμή είτε μια αξιοπρέπεια.", "simple": "Ο Καντ εξηγεί: ό,τι έχει τιμή μπορεί να αντικατασταθεί με κάτι άλλο της ίδιας αξίας. Ένα τραπέζι, ένα αυτοκίνητο, ένα δαχτυλίδι. Ο άνθρωπος όμως δεν έχει τιμή. Έχει αξιοπρέπεια: είναι μοναδικός και αναντικατάστατος, και καμία ποσότητα χρημάτων δεν μπορεί να τον αγοράσει ή να τον αντικαταστήσει.\n\nΑυτό ισχύει για κάθε άνθρωπο: για τον άρρωστο, τον φτωχό, τον ηλικιωμένο, τον ξένο. Και ισχύει και για εμάς. Όταν νιώθουμε ότι «δεν αξίζουμε» επειδή γεράσαμε, αρρωστήσαμε ή δεν είμαστε πια παραγωγικοί, ο Καντ μάς θυμίζει: η αξία μας δεν μετριέται σε χρήματα ούτε σε παραγωγή.", "life": "Σε έναν οίκο ευγηρίας, μια νοσηλεύτρια μιλά σε κάθε ηλικιωμένο με το όνομά του, του ζητά τη γνώμη του για το τι θα φορέσει και τον ακούει όταν διηγείται τις ιστορίες του, ακόμη κι όταν τις έχει ακούσει δέκα φορές. Ένας κύριος 92 χρονών λέει: «Εδώ νιώθω ακόμη άνθρωπος.»", "am": "Πείτε: «Έχω αξιοπρέπεια που κανείς δεν μπορεί να μου πάρει. Το ίδιο και κάθε άνθρωπος.»", "ex": "Υπερασπιστείτε σήμερα την αξιοπρέπεια κάποιου: μην γελάσετε με ένα αστείο που ταπεινώνει, πείτε μια καλή κουβέντα για κάποιον που κατηγορούν, ή δείξτε σεβασμό σε κάποιον που οι άλλοι παραβλέπουν.", "pm": "Σεβάστηκα σήμερα την αξιοπρέπεια όλων; Σεβάστηκα και τη δική μου;"}, "en": {"t": "Price or dignity", "tr": "Everything has either a price or a dignity.", "simple": "Kant explains: whatever has a price can be replaced by something else of equal value. A table, a car, a ring. But a human being has no price. A person has dignity: unique and irreplaceable, and no amount of money can buy or replace them.\n\nThis is true of every person: the sick, the poor, the elderly, the stranger. And it is true of us. When we feel we are “worth nothing” because we have aged, fallen ill or are no longer productive, Kant reminds us: our worth is not measured in money or output.", "life": "In a care home, a nurse speaks to every resident by name, asks their opinion about what to wear and listens when they tell their stories, even when she has heard them ten times. A 92-year-old man says: “Here I still feel like a human being.”", "am": "Say: “I have a dignity no one can take from me. So does every person.”", "ex": "Defend someone’s dignity today: do not laugh at a humiliating joke, say a good word about someone being criticised, or show respect to someone others overlook.", "pm": "Did I respect everyone’s dignity today? Did I respect my own?"}}, {"tag": ["🌱 Μαθαίνουμε να είμαστε άνθρωποι", "🌱 Learning to be human"], "grc": "Der Mensch kann nur Mensch werden durch Erziehung.", "src": ["Περί παιδαγωγικής (1803), AA IX 443", "On Education (1803), AA IX 443"], "el": {"t": "Γινόμαστε άνθρωποι μαθαίνοντας", "tr": "Ο άνθρωπος μπορεί να γίνει άνθρωπος μόνο μέσα από την παιδεία.", "simple": "Ο Καντ ήταν δάσκαλος σε όλη του τη ζωή και πίστευε βαθιά στη δύναμη της μάθησης. Τα ζώα, έλεγε, γεννιούνται σχεδόν έτοιμα. Ο άνθρωπος γεννιέται με σπόρους: σπόρους καλοσύνης, σκέψης, δημιουργίας. Για να φυτρώσουν, χρειάζονται φροντίδα, παράδειγμα και άσκηση.\n\nΚαι αυτή η «παιδεία» δεν τελειώνει στο σχολείο. Κάθε μέρα μαθαίνουμε από τους άλλους και τους μαθαίνουμε κι εμείς, κυρίως με το παράδειγμά μας. Τα εγγόνια μας δεν θα θυμούνται τόσο τι τους είπαμε, όσο πώς ζήσαμε.", "life": "Ένας παππούς δεν έλεγε ποτέ στα εγγόνια του «να είστε ευγενικοί». Τον έβλεπαν όμως να βοηθά τη γειτόνισσα με τα ψώνια, να χαιρετά τον ταχυδρόμο και να ζητά συγγνώμη όταν έκανε λάθος. Χρόνια αργότερα, η εγγονή του, πια δασκάλα, είπε: «Ό,τι καλό έχω, το έμαθα κοιτάζοντας τον παππού μου.»", "am": "Πείτε: «Σήμερα θα μάθω κάτι, και θα δώσω ένα καλό παράδειγμα.»", "ex": "Σκεφτείτε έναν άνθρωπο που σας «έμαθε να είστε άνθρωπος» με το παράδειγμά του. Αν ζει, πείτε του ευχαριστώ. Και κάντε σήμερα κάτι καλό μπροστά σε ένα παιδί ή έναν νέο, χωρίς λόγια.", "pm": "Ποιος με δίδαξε σήμερα κάτι; Τι παράδειγμα έδωσα εγώ;"}, "en": {"t": "We become human by learning", "tr": "A human being can become human only through education.", "simple": "Kant was a teacher all his life and believed deeply in the power of learning. Animals, he said, are born almost complete. Humans are born with seeds: seeds of kindness, thought, creativity. For them to sprout, they need care, example and practice.\n\nAnd this “education” does not end at school. Every day we learn from others and teach them too, mostly by our example. Our grandchildren will not remember so much what we told them as how we lived.", "life": "A grandfather never told his grandchildren “be kind”. But they saw him help the neighbour with her shopping, greet the postman and apologise when he was wrong. Years later his granddaughter, now a teacher, said: “Whatever good I have, I learned by watching my grandfather.”", "am": "Say: “Today I will learn something, and I will set a good example.”", "ex": "Think of someone who “taught you to be human” by their example. If they are alive, thank them. And do something good today in front of a child or a young person, without words.", "pm": "Who taught me something today? What example did I give?"}}, {"tag": ["🌌 Ο έναστρος ουρανός", "🌌 The starry sky"], "grc": "Zwei Dinge erfüllen das Gemüt mit immer neuer und zunehmender Bewunderung und Ehrfurcht, je öfter und anhaltender sich das Nachdenken damit beschäftigt: der bestirnte Himmel über mir und das moralische Gesetz in mir.", "src": ["Κριτική του πρακτικού λόγου (1788), Επίλογος, AA V 161", "Critique of Practical Reason (1788), Conclusion, AA V 161"], "el": {"t": "Τα αστέρια πάνω μου, ο νόμος μέσα μου", "tr": "Δύο πράγματα γεμίζουν την ψυχή με όλο και καινούριο, όλο και μεγαλύτερο θαυμασμό και δέος, όσο πιο συχνά και πιο πολύ τα σκέφτεται κανείς: ο έναστρος ουρανός πάνω μου και ο ηθικός νόμος μέσα μου.", "simple": "Αυτά τα λόγια είναι τόσο αγαπημένα που χαράχτηκαν σε πλάκα δίπλα στον τάφο του Καντ. Όταν κοιτάζουμε τα αστέρια, νιώθουμε μικροί μπροστά στο απέραντο σύμπαν. Κι όμως, μέσα σε αυτόν τον μικρό άνθρωπο υπάρχει κάτι εξίσου θαυμαστό: η φωνή της συνείδησης, που μας λέει τι είναι σωστό ακόμη κι όταν κανείς δεν μας βλέπει.\n\nΟ ουρανός μάς διδάσκει ταπεινότητα. Η συνείδηση μάς δίνει αξία. Μαζί μάς θυμίζουν ότι είμαστε μικροί και μεγάλοι ταυτόχρονα: ένας κόκκος σκόνης στο σύμπαν, που όμως μπορεί να αγαπήσει, να σκεφτεί και να διαλέξει το καλό.", "life": "Μια οικογένεια έκλεισε μια καλοκαιρινή νύχτα όλα τα φώτα στο χωριό και ξάπλωσε στην αυλή για να δει τα αστέρια. Ο μικρός γιος ρώτησε: «Αφού είμαστε τόσο μικροί, έχει σημασία αν είμαι καλός;» Ο πατέρας του απάντησε: «Αυτό είναι το πιο θαυμαστό: τα αστέρια δεν μπορούν να διαλέξουν να είναι καλά. Εσύ μπορείς.»", "am": "Πείτε: «Πάνω μου ο ουρανός, μέσα μου η συνείδηση. Σήμερα θα τους τιμήσω και τους δύο.»", "ex": "Απόψε βγείτε για λίγα λεπτά έξω, ή σε ένα παράθυρο, και κοιτάξτε τον ουρανό. Μετά κλείστε τα μάτια και ακούστε τη φωνή της συνείδησής σας. Και διαλέξτε από τις 7 ημέρες την άσκηση που σας βοήθησε περισσότερο, για να τη συνεχίσετε έναν μήνα.", "pm": "Τι μου είπε απόψε ο ουρανός; Τι μου είπε η συνείδησή μου; Τι κρατώ από τις 7 ημέρες με τον Καντ;"}, "en": {"t": "The stars above me, the law within me", "tr": "Two things fill the mind with ever new and increasing admiration and awe, the more often and steadily we reflect on them: the starry heavens above me and the moral law within me.", "simple": "These words are so beloved that they were engraved on a plaque beside Kant’s tomb. When we look at the stars, we feel small before the endless universe. Yet within this small human being there is something just as wonderful: the voice of conscience, telling us what is right even when no one is watching.\n\nThe sky teaches us humility. Conscience gives us worth. Together they remind us that we are small and great at the same time: a speck of dust in the universe that can nonetheless love, think and choose the good.", "life": "One summer night a family switched off all the lights in the village house and lay in the yard to look at the stars. The little son asked: “If we are so small, does it matter whether I am good?” His father answered: “That is the most wonderful thing: the stars cannot choose to be good. You can.”", "am": "Say: “Above me the sky, within me my conscience. Today I will honour them both.”", "ex": "Tonight go outside for a few minutes, or to a window, and look at the sky. Then close your eyes and listen to the voice of your conscience. And from the 7 days choose the exercise that helped you most, to continue for a month.", "pm": "What did the sky tell me tonight? What did my conscience tell me? What do I keep from the 7 days with Kant?"}}]}
];
function course(id){for(var i=0;i<COURSES.length;i++)if(COURSES[i].id===id)return COURSES[i];return null}

/* ---------------- ΑΠΟΘΗΚΕΥΣΗ (μόνο στη συσκευή) ---------------- */
var KEY='sofoi7-v1';
function load(){
  var v=null;try{v=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(!v||typeof v!=='object')v={};if(!v.c||typeof v.c!=='object')v.c={};
  if(!v.migrated){ /* μεταφορά από την παλιά έκδοση «7 ημέρες με τον Επίκτητο» */
    try{var o=JSON.parse(localStorage.getItem('ep7-v1')||'null');
      if(o&&typeof o==='object'){var ep=v.c.ep||(v.c.ep={done:[],notes:{}});if(!ep.notes)ep.notes={};if(!Array.isArray(ep.done))ep.done=[];
        (o.done||[]).forEach(function(i){if(ep.done.indexOf(i)<0)ep.done.push(i)});
        var on=o.notes||{};for(var k in on){if(on[k]&&!ep.notes[k])ep.notes[k]={t:String(on[k]),d:Date.now()}}}
    }catch(e){}
    v.migrated=true;
  }
  return v;
}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
save();
function st(id){var x=S.c[id]||(S.c[id]={done:[],notes:{}});if(!Array.isArray(x.done))x.done=[];if(!x.notes||typeof x.notes!=='object')x.notes={};return x}
function noteOf(id,i){var n=st(id).notes[i];if(!n)return null;if(typeof n==='string')n=st(id).notes[i]={t:n,d:Date.now()};return n}
function noteText(id,i){var n=noteOf(id,i);return n?n.t:''}
function isDone(id,i){return st(id).done.indexOf(i)>=0}
function doneCount(id){return st(id).done.filter(function(i){return i>=0&&i<7}).length}
function nextDay(id){for(var i=0;i<7;i++)if(!isDone(id,i))return i;return -1}
function allNotes(){var a=[];COURSES.forEach(function(c){for(var i=0;i<7;i++){var n=noteOf(c.id,i);if(n&&n.t&&n.t.trim())a.push({c:c,i:i,n:n})}});return a}
function fmtDate(ts){if(!ts)return '';try{return new Date(ts).toLocaleDateString(LANG==='el'?'el-GR':'en-GB',{day:'numeric',month:'long',year:'numeric'})}catch(e){return ''}}
/* αναζήτηση χωρίς τόνους και κεφαλαία: «σωκρατης» βρίσκει «Σωκράτη» */
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/ς/g,'σ')}

/* ---------------- ΚΟΙΝΑ ΚΟΜΜΑΤΙΑ ---------------- */
function topbar(title){
  return '<div class="top"><button class="back" onclick="EP.back()" aria-label="'+L('Πίσω','Back')+'">← '+L('Πίσω','Back')+'</button>'+
   '<div class="ttl">'+esc(title)+'</div>'+
   '<button class="lang" onclick="EP.lang()" aria-label="Language">'+(LANG==='el'?'EN':'ΕΛ')+'</button></div>';
}
function safeLine(){
  return '<div class="safe">💜 '+L('Αν περνάτε πολύ δύσκολα ή σκέφτεστε να κάνετε κακό στον εαυτό σας, τα λόγια δεν αρκούν — μιλήστε <b>σήμερα</b> με τον γιατρό σας.','If you are going through a very hard time or thinking of harming yourself, words are not enough — speak <b>today</b> with your doctor.')+
   ' 📞 <a href="tel:112">112</a> · 🇨🇾 '+L('Σαμαρείτες','Samaritans')+' <a href="tel:80007773">8000 7773</a> · 🇬🇷 <a href="tel:1018">1018</a></div>';
}
function foot(){return '<div class="foot">'+L('Τα αρχαία, λατινικά και γερμανικά κείμενα δίνονται σε ελεύθερη απόδοση στα απλά νέα ελληνικά.','Ancient, Latin and German texts are given in free, plain translation.')+'<br>Christos S Magides · '+L('Έκδοση','Version')+' 25-10-2026</div>'}
function notesBtn(){var n=allNotes().length;return '<button class="big blue" onclick="EP.go(\'notes\')">📔 '+L('Οι σημειώσεις μου','My notes')+(n?' ('+n+')':'')+'</button>'}
function para(t){return t.split('\n\n').map(function(p){return '<p>'+esc(p)+'</p>'}).join('')}

/* ---------------- ΑΡΧΙΚΗ: ΟΙ ΣΟΦΟΙ ---------------- */
function vHome(){
  return topbar(L('7 ημέρες με τους Σοφούς','7 days with the Sages'))+
  '<div class="hero"><div class="bust">🏛️</div><h1>'+L('7 ημέρες με τους Σοφούς','7 days with the Sages')+'</h1>'+
  '<p class="sub">'+L('Διαλέξτε έναν σοφό. Για 7 ημέρες: ένα λόγιο σε απλά λόγια, ένα παράδειγμα από τη ζωή και μία μικρή άσκηση.','Choose a sage. For 7 days: one saying in plain words, one example from life and one small exercise.')+'</p></div>'+
  COURSES.map(function(c){var n=doneCount(c.id);

function fillNotes(){
  var box=$('dlist');if(!box)return;
  var q=norm(($('q')||{}).value||'').trim(),cf=($('qc')||{}).value||'';
  var all=allNotes();
  var items=all.filter(function(x){
    if(cf&&x.c.id!==cf)return false;
    if(!q)return true;
    return norm(x.n.t+' '+x.c.days[x.i][LANG].t+' '+T(x.c.name)).indexOf(q)>=0;
  });
  var f=$('found');
  if(f)f.textContent=all.length?(q||cf?L('Βρέθηκαν ','Found ')+items.length+L(' από ',' of ')+all.length:L('Έχετε ','You have ')+all.length+L(' σημειώσεις',' notes')):'';
  if(!all.length){box.innerHTML='<div class="empty">'+L('Δεν έχετε γράψει ακόμη σημειώσεις.<br>Θα εμφανιστούν εδώ μόλις γράψετε στη «βραδινή εξέταση» κάποιας ημέρας.','You have not written any notes yet.<br>They will appear here once you write in the “evening review” of a day.')+'</div>';return}
  if(!items.length){box.innerHTML='<div class="empty">'+L('Δεν βρέθηκε τίποτα. Δοκιμάστε άλλη λέξη.','Nothing found. Try another word.')+'</div>';return}
  box.innerHTML=items.map(function(x){var d=x.c.days[x.i],k=x.c.id+'-'+x.i;
    return '<div class="card entry"><div class="eh">'+x.c.emoji+' '+esc(T(x.c.name))+' · '+L('Ημέρα ','Day ')+(x.i+1)+' — '+esc(d[LANG].t)+'</div>'+
     '<div class="ed">🌙 '+esc(d[LANG].pm)+(x.n.d?'<br>✏️ '+L('Τελευταία αλλαγή: ','Last changed: ')+fmtDate(x.n.d):'')+'</div>'+
     '<textarea oninput="EP.note(\''+x.c.id+'\','+x.i+',this,true)">'+esc(x.n.t)+'</textarea><div class="saved"></div>'+
     '<div class="row"><button class="big ghost small" onclick="EP.go(\''+x.c.id+'-'+(x.i+1)+'\')">➜ '+L('Η ημέρα','The day')+'</button>'+
     '<button class="big ghost small" id="del-'+k+'" onclick="EP.del(\''+x.c.id+'\','+x.i+')">🗑️ '+L('Σβήσιμο','Delete')+'</button></div></div>'}).join('');
  Array.prototype.forEach.call(box.querySelectorAll('textarea'),grow);
}
function grow(el){if(!el)return;el.style.height='auto';el.style.height=Math.max(120,el.scrollHeight+4)+'px'}
function notesAsText(){
  var out=[L('7 ημέρες με τους Σοφούς — Οι σημειώσεις μου','7 days with the Sages — My notes'),fmtDate(Date.now()),''];
  allNotes().forEach(function(x){var d=x.c.days[x.i];
    out.push('==============================');
    out.push(T(x.c.name)+' · '+L('Ημέρα ','Day ')+(x.i+1)+' — '+d[LANG].t);
    out.push(d[LANG].pm);
    if(x.n.d)out.push('('+fmtDate(x.n.d)+')');
    out.push('');out.push(x.n.t.trim());out.push('');
  });
  return out.join('\n');
}

/* ---------------- ΕΝΕΡΓΕΙΕΣ ---------------- */
var noteTimer=null,armed={};
function arm(key,btn,text){
  if(armed[key]){armed[key]=false;return true}
  armed[key]=true;if(btn){btn._old=btn.innerHTML;btn.innerHTML='⚠️ '+text;btn.classList.add('red')}
  setTimeout(function(){armed[key]=false;if(btn&&document.body.contains(btn)){btn.innerHTML=btn._old;btn.classList.remove('red')}},5000);
  return false;
}
var EP={
 go:function(h){location.hash=h?'#'+h:'#start'},
 back:function(){
   var r=route();
   if(r.v==='day'||r.v==='end'){EP.go(r.c.id);return}
   if(r.v!=='home'){EP.go('');return}
   try{if(window.parent!==window&&typeof window.parent.ep7Close==='function'){window.parent.ep7Close();return}}catch(e){}
   try{if(history.length>1&&document.referrer&&new URL(document.referrer).origin===location.origin){history.back();return}}catch(e){}
   location.href='./';
 },
 lang:function(){LANG=LANG==='el'?'en':'el';try{localStorage.setItem('sofoi7-lang',LANG)}catch(e){}render()},
 note:function(id,i,el,quiet){
   var s=st(id);s.notes[i]={t:el.value,d:Date.now()};grow(el);
   var m=el.nextElementSibling;clearTimeout(noteTimer);
   noteTimer=setTimeout(function(){save();if(m)m.textContent='✓ '+L('Αποθηκεύτηκε στη συσκευή σας','Saved on your device')},500);
 },
 del:function(id,i){
   if(!arm('del-'+id+'-'+i,$('del-'+id+'-'+i),L('Πατήστε ξανά για σβήσιμο','Tap again to delete')))return;
   delete st(id).notes[i];save();fillNotes();
 },
 delAll:function(){
   if(!arm('all',$('delAllBtn'),L('Σίγουρα; Πατήστε ξανά — θα σβηστούν ΟΛΕΣ','Sure? Tap again — ALL will be deleted')))return;
   COURSES.forEach(function(c){st(c.id).notes={}});save();fillNotes();
 },
 exportTxt:function(){
   if(!allNotes().length){sheet('<h2>📔</h2><p>'+L('Δεν υπάρχουν ακόμη σημειώσεις για αποθήκευση.','There are no notes to save yet.')+'</p><button class="big gold" onclick="EP.close()">👍 OK</button>');return}
   var dt=new Date(),stamp=dt.getDate()+'-'+(dt.getMonth()+1)+'-'+dt.getFullYear();
   try{var blob=new Blob(['﻿'+notesAsText()],{type:'text/plain;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=L('Οι-σημειώσεις-μου_','My-notes_')+stamp+'.txt';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}
   catch(e){EP.copyAll()}
 },
 copyAll:function(){
   var t=notesAsText();
   function ok(){sheet('<h2>📋 '+L('Αντιγράφηκαν','Copied')+'</h2><p>'+L('Επικολλήστε τις όπου θέλετε — σε ένα email προς τον εαυτό σας ή στις Σημειώσεις του κινητού.','Paste them wherever you like — in an email to yourself or in your phone’s Notes.')+'</p><button class="big gold" onclick="EP.close()">👍 OK</button>')}
   try{navigator.clipboard.writeText(t).then(ok,function(){fallback()})}catch(e){fallback()}
   function fallback(){sheet('<h2>📋 '+L('Αντιγράψτε από εδώ','Copy from here')+'</h2><textarea style="min-height:260px">'+esc(t)+'</textarea><button class="big gold" onclick="EP.close()">👍 OK</button>')}
 },
 dfill:function(){fillNotes()},
 done:function(id,i){var c=course(id),s=st(id);if(!isDone(id,i))s.done.push(i);save();
   if(i<6){render();sheet('<h2>🌟 '+L('Μπράβο!','Well done!')+'</h2><p style="font-size:19px">'+L('Ολοκληρώσατε την ημέρα ','You completed day ')+(i+1)+'. '+L('Αύριο σας περιμένει η επόμενη: ','Tomorrow the next one awaits: ')+'<b>«'+esc(c.days[i+1][LANG].t)+'»</b>.</p><p style="font-size:17px;color:#7a6a4a">'+esc(T(c.cheer))+'</p><button class="big gold" onclick="EP.close();EP.go(\''+id+'\')">👍 '+L('Εντάξει','OK')+'</button>')}
   else EP.go(id+'-end');
 },
 undone:function(id,i){var s=st(id);s.done=s.done.filter(function(x){return x!==i});save();render()},
 restart:function(id){
   if(!arm('restart',$('restartBtn'),L('Πατήστε ξανά για επιβεβαίωση — θα σβηστούν και οι σημειώσεις αυτού του σοφού','Tap again to confirm — this sage’s notes will be erased too')))return;
   S.c[id]={done:[],notes:{}};save();EP.go(id);
 },

 share:function(){
   var url=location.href.split('#')[0];var txt=L('7 ημέρες με τους Σοφούς — Επίκτητος, Σωκράτης, Ζήνων, Πυθαγόρας, Αριστοτέλης, Σενέκας, Επίκουρος, Καντ. Ένα λόγιο σε απλά λόγια και μία άσκηση την ημέρα, για μια πιο ήρεμη ζωή.','7 days with the Sages — Epictetus, Socrates, Zeno, Pythagoras, Aristotle, Seneca, Epicurus, Kant. One saying in plain words and one exercise a day, for a calmer life.');

   try{navigator.clipboard.writeText(txt+' '+url);sheet('<h2>📋 '+L('Ο σύνδεσμος αντιγράφηκε','Link copied')+'</h2><p>'+L('Επικολλήστε τον σε ένα μήνυμα προς τον φίλο σας.','Paste it into a message to your friend.')+'</p><button class="big gold" onclick="EP.close()">👍 OK</button>')}catch(e){}
 },
 speak:function(id,i){
   var b=$('ttsBtn');if(!('speechSynthesis' in window)){if(b)b.textContent=L('Η ανάγνωση δεν υποστηρίζεται σε αυτή τη συσκευή','Reading aloud is not supported on this device');return}
   if(speechSynthesis.speaking){speechSynthesis.cancel();if(b){b.classList.remove('on');b.textContent='🔊 '+L('Ακούστε το','Listen')}return}
   var D=course(id).days[i][LANG];
   var text=[D.t,D.tr,L('Με απλά λόγια. ','In plain words. ')+D.simple.replace(/\n\n/g,' '),L('Ένα παράδειγμα από τη ζωή. ','An example from life. ')+D.life,L('Η άσκηση της ημέρας. ','Today’s exercise. ')+D.ex].join('. ');
   var u=new SpeechSynthesisUtterance(text);u.lang=LANG==='el'?'el-GR':'en-GB';u.rate=0.9;
   var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.toLowerCase().indexOf(LANG)===0})[0];if(v)u.voice=v;
   u.onend=u.onerror=function(){var bb=$('ttsBtn');if(bb){bb.classList.remove('on');bb.textContent='🔊 '+L('Ακούστε το','Listen')}};
   speechSynthesis.speak(u);if(b){b.classList.add('on');b.textContent='⏹ '+L('Σταματήστε την ανάγνωση','Stop reading')}
 },
 close:function(){var s=$('sheet');if(s)s.remove()}
};
function sheet(html){EP.close();var d=document.createElement('div');d.className='sheet';d.id='sheet';d.innerHTML='<div class="box">'+html+'</div>';d.onclick=function(e){if(e.target===d)EP.close()};document.body.appendChild(d)}
window.EP=EP;

/* ---------------- ΔΡΟΜΟΛΟΓΗΣΗ ----------------
   #start = οι σοφοί · #notes = σημειώσεις · #ep = Επίκτητος
   #ep-3 = ημέρα 3 · #ep-end = τέλος. (Παλιοί σύνδεσμοι #day3 → Επίκτητος) */
function route(){
  var h=decodeURIComponent(location.hash.replace('#',''));
  var m;
  if(h==='notes')return {v:'notes'};
  if((m=/^day([1-7])$/.exec(h)))return {v:'day',c:course('ep'),i:+m[1]-1};
  if(h==='end')return {v:'end',c:course('ep')};
  if((m=/^([a-z]+)-([1-7])$/.exec(h))&&course(m[1]))return {v:'day',c:course(m[1]),i:+m[2]-1};
  if((m=/^([a-z]+)-end$/.exec(h))&&course(m[1]))return {v:'end',c:course(m[1])};
  if(course(h))return {v:'course',c:course(h)};
  return {v:'home'};
}
function render(){
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  armed={};EP.close();
  var r=route();
  document.documentElement.lang=LANG;
  document.title=r.c&&r.v!=='home'?L('7 ημέρες ','7 days ')+T(r.c.withName):L('7 ημέρες με τους Σοφούς','7 days with the Sages');
  $('app').innerHTML = r.v==='day'?vDay(r.c,r.i):r.v==='end'?vEnd(r.c):r.v==='course'?vCourse(r.c):r.v==='notes'?vNotes():vHome();
  if(r.v==='notes')fillNotes();
  Array.prototype.forEach.call(document.querySelectorAll('#app textarea'),grow);
  window.scrollTo(0,0);
}
/* ?c=ep στη διεύθυνση ανοίγει κατευθείαν έναν σοφό */
(function(){try{var c=new URLSearchParams(location.search).get('c');if(c&&course(c)&&!location.hash)history.replaceState(null,'','#'+c)}catch(e){}})();
window.addEventListener('hashchange',render);
render();
})();
