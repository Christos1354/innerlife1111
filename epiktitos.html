rious illness. When she recovers, every simple thing — a coffee on the balcony, her grandson’s laughter — seems a miracle. “Before, I lived on the surface,” she says. “Now I live in the depths.”","am":"Say: “Whatever I feel today, joy or sorrow, I will accept it as part of life.”","ex":"Write down a sorrow from your past. Below it, write a joy you lived more deeply because of it. If you are in sorrow now, simply write: “This sorrow is carving room. Joy will come too.” If sorrow lasts long or is very heavy, speak with your doctor.","pm":"What sorrow and what joy did I meet today?"}},{"tag":["🥚 Πόνος","🥚 Pain"],"grc":"Your pain is the breaking of the shell that encloses your understanding.","src":["«Ο Προφήτης» · Για τον πόνο","“The Prophet” · On Pain"],"el":{"t":"Ο πόνος σπάει το κέλυφος","tr":"Ο πόνος σας είναι το σπάσιμο του κελύφους που κλείνει μέσα του την κατανόησή σας.","simple":"Ένα πουλάκι, για να βγει στον κόσμο, πρέπει να σπάσει το αυγό. Ο Γκιμπράν λέει ότι κάτι παρόμοιο κάνει και ο πόνος: σπάει το κέλυφος όπου ήμασταν κλεισμένοι και μας αναγκάζει να δούμε και να καταλάβουμε πράγματα που πριν δεν βλέπαμε.\n\nΣυνεχίζει: «Όπως το κουκούτσι του φρούτου πρέπει να σπάσει για να φανεί η καρδιά του στον ήλιο, έτσι κι εσείς πρέπει να γνωρίσετε τον πόνο.» Δεν τον ζητάμε — αλλά όταν έρθει, μπορεί να μας μεγαλώσει.","life":"Ένας νέος απολύεται από τη δουλειά που μισούσε αλλά δεν τολμούσε να αφήσει. Οι πρώτες εβδομάδες είναι πολύ δύσκολες. Μετά ανακαλύπτει ότι μπορεί επιτέλους να κάνει αυτό που πάντα ήθελε. «Η απόλυση ήταν το κέλυφος που έσπασε», λέει.","am":"Πείτε: «Αν σήμερα πονέσω, ίσως σπάει ένα κέλυφος για να βγει κάτι καινούργιο.»","ex":"Θυμηθείτε μια δύσκολη εμπειρία που, όταν πέρασε, σας άνοιξε τα μάτια. Γράψτε: «Πριν δεν καταλάβαινα… Τώρα καταλαβαίνω…» Διαβάστε το όταν περνάτε κάτι δύσκολο. Ο σωματικός πόνος πάντα χρειάζεται και τον γιατρό σας.","pm":"Τι καταλαβαίνω σήμερα, που δεν καταλάβαινα πριν από έναν πόνο μου;"},"en":{"t":"Pain breaks the shell","tr":"Your pain is the breaking of the shell that encloses your understanding.","simple":"A chick, to come into the world, must break the egg. Gibran says pain does something similar: it breaks the shell we were enclosed in and forces us to see and understand things we did not see before.\n\nHe continues: “Even as the stone of the fruit must break, that its heart may stand in the sun, so must you know pain.” We do not ask for it — but when it comes, it can make us grow.","life":"A young man is fired from a job he hated but did not dare to leave. The first weeks are very hard. Then he discovers he can finally do what he always wanted. “Being fired was the shell that broke,” he says.","am":"Say: “If I hurt today, perhaps a shell is breaking so that something new can come out.”","ex":"Recall a hard experience that, once over, opened your eyes. Write: “Before, I did not understand… Now I understand…” Read it when you are going through something hard. Physical pain always needs your doctor too.","pm":"What do I understand today that I did not before a pain of mine?"}},{"tag":["👫 Φιλία","👫 Friendship"],"grc":"For what is your friend that you should seek him with hours to kill? Seek him always with hours to live.","src":["«Ο Προφήτης» · Για τη φιλία","“The Prophet” · On Friendship"],"el":{"t":"Ώρες για να ζήσεις","tr":"Τι είναι ο φίλος σας, για να τον αναζητάτε μόνο όταν θέλετε να «σκοτώσετε» την ώρα σας; Να τον αναζητάτε πάντα με ώρες για να ζήσετε.","simple":"Συχνά βλέπουμε τους φίλους μας μόνο όταν βαριόμαστε ή όταν δεν έχουμε κάτι καλύτερο να κάνουμε. Ο Γκιμπράν λέει: ο φίλος δεν είναι γέμισμα του κενού. Είναι η πιο ζωντανή ώρα της ζωής μας.\n\nΚαι λέει ακόμη: «Ο φίλος σας είναι η απάντηση στις ανάγκες σας. Είναι το χωράφι σας, που το σπέρνετε με αγάπη και το θερίζετε με ευγνωμοσύνη.»","life":"Δύο παλιοί φίλοι μιλούν μόνο με σύντομα μηνύματα «τι κάνεις; – καλά». Ο ένας προτείνει: «Ας κάνουμε μια μέρα εκδρομή, όπως παλιά.» Περπατούν στο βουνό, μιλούν για ώρες, γελούν. «Αυτή ήταν η πιο ζωντανή μέρα του χρόνου», γράφει ο ένας μετά.","am":"Σκεφτείτε έναν φίλο σας και πείτε μέσα σας: «Ευχαριστώ που υπάρχεις.»","ex":"Κλείστε σήμερα ένα πραγματικό ραντεβού με έναν φίλο — όχι «κάποια στιγμή», αλλά με ημερομηνία. Ή τηλεφωνήστε του και ρωτήστε τον κάτι ουσιαστικό: «Τι σε χαροποιεί αυτόν τον καιρό; Τι σε βαραίνει;»","pm":"Με ποιον φίλο έζησα σήμερα, και όχι απλώς πέρασα την ώρα;"},"en":{"t":"Hours to live","tr":"For what is your friend that you should seek him with hours to kill? Seek him always with hours to live.","simple":"We often see our friends only when we are bored or have nothing better to do. Gibran says: a friend is not a filler for emptiness. They are the most alive hour of our life.\n\nAnd he says too: “Your friend is your needs answered. He is your field which you sow with love and reap with thanksgiving.”","life":"Two old friends speak only in short messages: “how are you? – fine”. One suggests: “Let’s go on a day trip, like old times.” They walk in the mountains, talk for hours, laugh. “That was the most alive day of the year,” one writes afterwards.","am":"Think of a friend and say inwardly: “Thank you for being there.”","ex":"Make a real appointment with a friend today — not “sometime”, but with a date. Or call them and ask something meaningful: “What’s bringing you joy these days? What’s weighing on you?”","pm":"With which friend did I truly live today, and not just pass time?"}},{"tag":["🎁 Δίνω","🎁 Giving"],"grc":"You give but little when you give of your possessions. It is when you give of yourself that you truly give.","src":["«Ο Προφήτης» · Για το δόσιμο","“The Prophet” · On Giving"],"el":{"t":"Όταν δίνεις τον εαυτό σου","tr":"Δίνετε λίγο όταν δίνετε από τα υπάρχοντά σας. Μόνο όταν δίνετε από τον εαυτό σας, δίνετε πραγματικά.","simple":"Ένα δώρο που αγοράσαμε βιαστικά είναι ωραίο. Πιο πολύτιμος όμως είναι ο χρόνος μας, η προσοχή μας, η τρυφερότητά μας, η ικανότητά μας να βοηθήσουμε. Αυτά δεν αγοράζονται — και γι’ αυτό αξίζουν περισσότερο.\n\nΟ Γκιμπράν λέει ακόμη ότι υπάρχουν άνθρωποι που δίνουν με χαρά, και η χαρά είναι η ανταμοιβή τους. Δίνουν όπως η μυρτιά σκορπίζει το άρωμά της στην κοιλάδα.","life":"Μια γιαγιά δεν έχει χρήματα για ακριβά δώρα στα εγγόνια της. Τους μαθαίνει όμως να ζυμώνουν ψωμί, τους λέει ιστορίες από τα παλιά και τους πλέκει κασκόλ. Όταν μεγαλώνουν, αυτά είναι τα δώρα που θυμούνται περισσότερο.","am":"Ρωτήστε: «Τι μπορώ να δώσω σήμερα από τον εαυτό μου — χρόνο, προσοχή, βοήθεια;»","ex":"Δώστε σήμερα σε κάποιον κάτι από τον εαυτό σας: μισή ώρα από τον χρόνο σας, μια δεξιότητα (να του μάθετε κάτι, να τον βοηθήσετε με μια δουλειά), ένα γράμμα γραμμένο με το χέρι. Δώστε με χαρά, χωρίς να περιμένετε αντάλλαγμα.","pm":"Τι έδωσα σήμερα από τον εαυτό μου;"},"en":{"t":"When you give of yourself","tr":"You give but little when you give of your possessions. It is when you give of yourself that you truly give.","simple":"A gift bought in a hurry is nice. But more precious are our time, our attention, our tenderness, our ability to help. These cannot be bought — and that is why they are worth more.\n\nGibran also says there are those who give with joy, and that joy is their reward. They give as the myrtle breathes its fragrance into the valley.","life":"A grandmother has no money for expensive gifts for her grandchildren. But she teaches them to knead bread, tells them stories of the old days and knits them scarves. When they grow up, those are the gifts they remember most.","am":"Ask: “What can I give of myself today — time, attention, help?”","ex":"Give someone something of yourself today: half an hour of your time, a skill (teach them something, help with a task), a handwritten letter. Give with joy, expecting nothing in return.","pm":"What did I give of myself today?"}}]},
{"id":"kr","emoji":"🍂","cls":"c-kr","origEn":true,"origLbl":["Τα λόγια του στα αγγλικά:","His words in English:"],"name":["Τζίντου Κρισναμούρτι","Jiddu Krishnamurti"],"withName":["με τον Κρισναμούρτι","with Krishnamurti"],"years":["1895–1986 · Ο δάσκαλος της προσοχής","1895–1986 · The teacher of attention"],"bio":["<p>Ο Κρισναμούρτι γεννήθηκε σε ένα μικρό χωριό της νότιας <b>Ινδίας</b>. Όταν ήταν 14 ετών, η Θεοσοφική Εταιρεία τον «ανακάλυψε» και τον ανέθρεψε στην Αγγλία, πιστεύοντας ότι θα γίνει ένας νέος μεγάλος πνευματικός δάσκαλος. Του έφτιαξαν μια ολόκληρη οργάνωση με χιλιάδες μέλη.</p><p>Το <b>1929</b>, στα 34 του, έκανε κάτι πρωτοφανές: τη διέλυσε. Είπε ότι η αλήθεια δεν βρίσκεται μέσα από οργανώσεις, αρχηγούς ή οπαδούς, και ότι ο καθένας πρέπει να την ανακαλύψει μόνος του. Για τα επόμενα 57 χρόνια ταξίδεψε σε όλο τον κόσμο μιλώντας σε απλούς ανθρώπους, φοιτητές και επιστήμονες.</p><p>Ίδρυσε σχολεία στην Ινδία, την Αγγλία και την Αμερική. Μίλησε για τον φόβο, τη σύγκριση, τη μοναξιά, την προσοχή και τη σχέση με τη φύση. Εκτός από την πρώτη μέρα, εδώ δίνουμε τις ιδέες του σε <b>ελεύθερη απόδοση</b>, με απλά λόγια.</p>","<p>Krishnamurti was born in a small village in southern <b>India</b>. When he was 14, the Theosophical Society “discovered” him and raised him in England, believing he would become a great new spiritual teacher. They built a whole organisation around him with thousands of members.</p><p>In <b>1929</b>, at 34, he did something unheard of: he dissolved it. He said truth is not found through organisations, leaders or followers, and that each person must discover it for themselves. For the next 57 years he travelled the world, speaking to ordinary people, students and scientists.</p><p>He founded schools in India, England and America. He spoke about fear, comparison, loneliness, attention and our relationship with nature. Apart from the first day, we give his ideas here in <b>free rendering</b>, in plain words.</p>"],"cheer":["Ο Κρισναμούρτι έλεγε ότι η μάθηση δεν τελειώνει ποτέ — όλη η ζωή είναι ένα σχολείο. Σήμερα μάθατε κάτι.","Krishnamurti taught that learning never ends — all of life is a school. Today you learned something."],"fare":{"grc":"","src":["Ελεύθερη απόδοση της διδασκαλίας του Κρισναμούρτι","Free rendering of Krishnamurti’s teaching"],"tr":["Μην περιμένεις κάποιον άλλον να σε ελευθερώσει. Κοίτα με προσοχή τη ζωή σου, τις σκέψεις σου, τους φόβους σου, όπως κοιτάς ένα λουλούδι. Μέσα σε αυτή την ήσυχη προσοχή αρχίζει η ελευθερία.","Do not wait for someone else to set you free. Look attentively at your life, your thoughts, your fears, as you would look at a flower. In that quiet attention, freedom begins."]},"days":[{"tag":["🧭 Ο δικός σου δρόμος","🧭 Your own path"],"grc":"I maintain that Truth is a pathless land, and you cannot approach it by any path whatsoever, by any religion, by any sect.","src":["Ομιλία διάλυσης του Τάγματος του Αστέρα, Ολλανδία, 3 Αυγούστου 1929","Speech dissolving the Order of the Star, Netherlands, 3 August 1929"],"el":{"t":"Η αλήθεια είναι μια χώρα χωρίς δρόμους","tr":"Υποστηρίζω ότι η Αλήθεια είναι μια χώρα χωρίς δρόμους, και δεν μπορείς να την πλησιάσεις από κανένα μονοπάτι, από καμία θρησκεία, από καμία αίρεση.","simple":"Με αυτά τα λόγια ο Κρισναμούρτι αρνήθηκε να γίνει αρχηγός χιλιάδων οπαδών. Δεν ήθελε να του μοιάζουν, να τον ακολουθούν ή να τον λατρεύουν. Ήθελε ο καθένας να σκέφτεται, να παρατηρεί και να ανακαλύπτει μόνος του.\n\nΣήμερα πολλοί ακολουθούν τυφλά influencers, «γκουρού» ή ομάδες. Το μήνυμά του είναι απλό: άκου, μάθε, αλλά μην παραδώσεις ποτέ σε κανέναν την ευθύνη να σκέφτεσαι για σένα.","life":"Ένας νέος ακολουθεί έναν διάσημο «προπονητή ζωής» στο διαδίκτυο και αγοράζει όλα του τα σεμινάρια. Νιώθει όλο και πιο κενός. Μια μέρα σταματά και ρωτά: «Τι πιστεύω εγώ, με τη δική μου εμπειρία;» Αρχίζει να γράφει τις δικές του σκέψεις. Νιώθει, για πρώτη φορά, ότι ζει τη δική του ζωή.","am":"Πείτε: «Σήμερα θα ακούσω όλους, αλλά θα σκεφτώ μόνος μου.»","ex":"Γράψτε μια πεποίθηση που έχετε και ρωτήστε: «Πού την έμαθα; Την έχω ελέγξει με τη δική μου ζωή, ή απλώς την πήρα έτοιμη;» Δεν χρειάζεται να την αλλάξετε· μόνο να την κοιτάξετε με καθαρά μάτια.","pm":"Πού σήμερα σκέφτηκα πραγματικά μόνος μου;"},"en":{"t":"Truth is a pathless land","tr":"I maintain that Truth is a pathless land, and you cannot approach it by any path whatsoever, by any religion, by any sect.","simple":"With these words Krishnamurti refused to become the leader of thousands of followers. He did not want them to imitate, follow or worship him. He wanted each person to think, observe and discover for themselves.\n\nToday many blindly follow influencers, “gurus” or groups. His message is simple: listen, learn, but never hand anyone the responsibility to think for you.","life":"A young man follows a famous online “life coach” and buys all his seminars. He feels ever emptier. One day he stops and asks: “What do I believe, from my own experience?” He begins writing his own thoughts. For the first time he feels he is living his own life.","am":"Say: “Today I will listen to everyone, but think for myself.”","ex":"Write down a belief you hold and ask: “Where did I learn it? Have I tested it against my own life, or just taken it ready-made?” You need not change it; only look at it with clear eyes.","pm":"Where today did I truly think for myself?"}},{"tag":["⚖️ Σύγκριση","⚖️ Comparison"],"grc":"","src":["Ελεύθερη απόδοση · από τις ομιλίες του σε μαθητές («Σκέψου πάνω σε αυτά»)","Free rendering · from his talks to students (“Think on These Things”)"],"el":{"t":"Όταν συγκρίνεις, χάνεις τον εαυτό σου","tr":"Από μικροί μάς μαθαίνουν να συγκρινόμαστε: με τον αδελφό, με τον καλύτερο μαθητή, με τον γείτονα. Όμως όταν συγκρίνεις συνεχώς τον εαυτό σου με κάποιον άλλον, δεν βλέπεις ποτέ αυτό που πραγματικά είσαι. Ζεις τη ζωή σου στη σκιά κάποιου άλλου.","simple":"Ο Κρισναμούρτι μιλούσε συχνά στα παιδιά των σχολείων του για τη σύγκριση. Έλεγε ότι η σύγκριση γεννά ζήλια, φόβο και αίσθημα κατωτερότητας — ή υπεροψία, όταν βγαίνουμε «νικητές».\n\nΤα social media είναι μια τεράστια μηχανή σύγκρισης: βλέπουμε τις καλύτερες στιγμές των άλλων και τις συγκρίνουμε με τις συνηθισμένες δικές μας. Η απελευθέρωση ξεκινά όταν προσέχουμε τη στιγμή που αρχίζουμε να συγκρίνουμε.","life":"Μια μητέρα λέει συνέχεια στον γιο της: «Γιατί δεν είσαι σαν τον ξάδερφό σου;» Ο μικρός κλείνεται στον εαυτό του. Όταν εκείνη σταματά τη σύγκριση και αρχίζει να προσέχει τι αγαπά ο ίδιος — τα ζώα, τη ζωγραφική — το παιδί ανθίζει.","am":"Πείτε: «Σήμερα θα προσέξω κάθε φορά που συγκρίνω — τον εαυτό μου ή τους άλλους.»","ex":"Μετρήστε σήμερα πόσες φορές πιάνετε τον εαυτό σας να συγκρίνει (σε εμφάνιση, χρήματα, επιτυχίες, παιδιά). Κάθε φορά, απλώς παρατηρήστε: «Συγκρίνω τώρα.» Χωρίς να θυμώσετε με τον εαυτό σας. Η παρατήρηση από μόνη της αλλάζει πολλά.","pm":"Πόσες φορές συνέκρινα σήμερα; Τι ένιωσα κάθε φορά;"},"en":{"t":"When you compare, you lose yourself","tr":"From childhood we are taught to compare ourselves: with a brother, with the best pupil, with the neighbour. But when you constantly compare yourself with someone else, you never see what you actually are. You live your life in someone else’s shadow.","simple":"Krishnamurti often spoke to the children of his schools about comparison. He said comparison breeds envy, fear and a sense of inferiority — or arrogance, when we come out “winners”.\n\nSocial media is a vast comparison machine: we see others’ best moments and compare them with our ordinary ones. Freedom begins when we notice the moment we start comparing.","life":"A mother keeps telling her son: “Why aren’t you like your cousin?” The boy withdraws into himself. When she stops comparing and starts noticing what he himself loves — animals, drawing — the child blossoms.","am":"Say: “Today I will notice every time I compare — myself or others.”","ex":"Count today how many times you catch yourself comparing (looks, money, success, children). Each time, simply observe: “I am comparing now.” Without getting angry with yourself. Observation alone changes a lot.","pm":"How many times did I compare today? What did I feel each time?"}},{"tag":["😨 Φόβος","😨 Fear"],"grc":"","src":["Ελεύθερη απόδοση · από τις ομιλίες του για τον φόβο","Free rendering · from his talks on fear"],"el":{"t":"Κοίτα τον φόβο κατάματα","tr":"Συνήθως, όταν φοβόμαστε, προσπαθούμε να ξεφύγουμε: με θόρυβο, με διασκέδαση, με το κινητό, με το ποτό. Όμως ο φόβος που τον αποφεύγουμε μεγαλώνει. Αν σταθείς και τον κοιτάξεις ήσυχα, χωρίς να τρέξεις, χωρίς να τον κρίνεις, αρχίζεις να τον καταλαβαίνεις — και χάνει τη δύναμή του.","simple":"Ο Κρισναμούρτι παρατήρησε ότι ο φόβος σχεδόν πάντα αφορά κάτι που δεν έχει συμβεί ακόμη: «τι θα γίνει αν…». Ζει στη σκέψη για το αύριο. Όταν επιστρέφουμε στο τώρα και τον κοιτάμε με προσοχή, συχνά ανακαλύπτουμε ότι αυτή τη στιγμή είμαστε ασφαλείς.\n\nΔεν μιλάμε για τον χρήσιμο φόβο που μας προστατεύει από έναν πραγματικό κίνδυνο, αλλά για το άγχος που μας κυνηγά χωρίς λόγο.","life":"Μια γυναίκα φοβάται τόσο να οδηγήσει στην εθνική οδό, που αποφεύγει να επισκεφθεί την κόρη της. Αντί να το αποφεύγει, κάθεται ένα βράδυ και γράφει ακριβώς τι φοβάται. Μετά κάνει μαζί με έναν εκπαιδευτή μια μικρή διαδρομή. Ο φόβος δεν εξαφανίστηκε, αλλά δεν την κυβερνά πια.","am":"Πείτε: «Αν σήμερα έρθει ο φόβος, δεν θα τρέξω. Θα τον κοιτάξω.»","ex":"Όταν νιώσετε φόβο ή άγχος σήμερα, μείνετε ένα λεπτό ακίνητοι. Ρωτήστε: «Πού τον νιώθω στο σώμα μου; Τι ακριβώς φοβάμαι; Συμβαίνει τώρα ή είναι ένα “τι θα γίνει αν”;» Αν ο φόβος είναι πολύ έντονος ή συχνός, μιλήστε με τον γιατρό σας.","pm":"Τι κατάλαβα σήμερα για τον φόβο μου όταν τον κοίταξα;"},"en":{"t":"Look fear in the eye","tr":"Usually, when we are afraid, we try to escape: with noise, entertainment, the phone, drink. But fear we avoid grows. If you stand still and look at it quietly, without running, without judging, you begin to understand it — and it loses its power.","simple":"Krishnamurti noticed that fear almost always concerns something that has not happened yet: “what if…”. It lives in thought about tomorrow. When we return to now and look at it attentively, we often discover that in this moment we are safe.\n\nWe are not speaking of useful fear that protects us from real danger, but of the anxiety that chases us for no reason.","life":"A woman is so afraid of driving on the motorway that she avoids visiting her daughter. Instead of avoiding it, one evening she sits and writes exactly what she fears. Then she drives a short route with an instructor. The fear did not vanish, but it no longer rules her.","am":"Say: “If fear comes today, I won’t run. I will look at it.”","ex":"When you feel fear or anxiety today, stay still for one minute. Ask: “Where do I feel it in my body? What exactly am I afraid of? Is it happening now, or is it a ‘what if’?” If fear is very strong or frequent, speak with your doctor.","pm":"What did I understand about my fear today when I looked at it?"}},{"tag":["👂 Ακρόαση","👂 Listening"],"grc":"","src":["Ελεύθερη απόδοση · από τις ομιλίες του για την ακρόαση","Free rendering · from his talks on listening"],"el":{"t":"Η τέχνη του να ακούς","tr":"Οι περισσότεροι δεν ακούμε πραγματικά. Όσο ο άλλος μιλά, εμείς ετοιμάζουμε την απάντησή μας, κρίνουμε ή σκεφτόμαστε κάτι άλλο. Να ακούς σημαίνει να δίνεις όλη σου την προσοχή, χωρίς να συγκρίνεις και χωρίς να βιάζεσαι να απαντήσεις. Τότε ακούς όχι μόνο τα λόγια, αλλά και την καρδιά.","simple":"Ο Κρισναμούρτι ξεκινούσε συχνά τις ομιλίες του λέγοντας: «Ας ακούσουμε μαζί.» Πίστευε ότι η πραγματική ακρόαση είναι από μόνη της μια μορφή αγάπης και μια μορφή μάθησης.\n\nΚαι δεν αφορά μόνο τους ανθρώπους: μπορούμε να ακούμε έτσι τα πουλιά, τη βροχή, το ίδιο μας το σώμα.","life":"Ένας έφηβος λέει στον πατέρα του ότι έχει πρόβλημα στο σχολείο. Ο πατέρας θέλει αμέσως να δώσει συμβουλές, αλλά συγκρατείται και λέει μόνο: «Πες μου κι άλλο.» Ακούει δέκα λεπτά χωρίς να διακόψει. Στο τέλος ο γιος λέει: «Ευχαριστώ, μπαμπά. Κανείς δεν με είχε ακούσει έτσι.»","am":"Καθίστε ένα λεπτό και ακούστε όλους τους ήχους γύρω σας, χωρίς να τους ονομάζετε.","ex":"Σε μια κουβέντα σήμερα, ακούστε τον άλλον μέχρι το τέλος χωρίς να διακόψετε και χωρίς να ετοιμάζετε απάντηση. Όταν τελειώσει, πείτε με δικά σας λόγια τι καταλάβατε, πριν πείτε τη γνώμη σας.","pm":"Ποιον άκουσα σήμερα πραγματικά;"},"en":{"t":"The art of listening","tr":"Most of us do not really listen. While the other speaks, we prepare our answer, judge, or think of something else. To listen means giving all your attention, without comparing and without hurrying to reply. Then you hear not only the words but the heart.","simple":"Krishnamurti often began his talks by saying: “Let us listen together.” He believed true listening is in itself a form of love and a form of learning.\n\nAnd it is not only about people: we can listen like this to birds, to rain, to our own body.","life":"A teenager tells his father he has a problem at school. The father wants to give advice at once, but holds back and says only: “Tell me more.” He listens ten minutes without interrupting. At the end the son says: “Thanks, Dad. No one has ever listened to me like that.”","am":"Sit for one minute and listen to all the sounds around you, without naming them.","ex":"In a conversation today, listen to the other person to the end without interrupting and without preparing a reply. When they finish, say in your own words what you understood, before giving your opinion.","pm":"Whom did I truly listen to today?"}},{"tag":["🌳 Μόνος αλλά όχι μοναχικός","🌳 Alone, not lonely"],"grc":"","src":["Ελεύθερη απόδοση · από τις ομιλίες του για τη μοναξιά","Free rendering · from his talks on loneliness"],"el":{"t":"Η μοναξιά και η μοναχικότητα","tr":"Η μοναξιά είναι ένας πόνος: νιώθεις αποκομμένος, άδειος, και τρέχεις να τη γεμίσεις με ανθρώπους, θόρυβο και ασχολίες. Υπάρχει όμως και ένα άλλο, όμορφο «μόνος»: να μπορείς να είσαι με τον εαυτό σου ήρεμα, χωρίς φόβο. Αυτός που έχει μάθει να είναι μόνος, δεν νιώθει τόσο εύκολα μοναξιά.","simple":"Πολλοί άνθρωποι δεν αντέχουν ούτε πέντε λεπτά χωρίς οθόνη ή παρέα. Μόλις μείνουν μόνοι, νιώθουν ένα κενό. Ο Κρισναμούρτι πρότεινε να μην τρέχουμε αμέσως να το γεμίσουμε, αλλά να το κοιτάξουμε, να μείνουμε λίγο μαζί του.\n\nΗ ικανότητα να είσαι μόνος ήρεμα είναι μεγάλη δύναμη. Και όταν δεν φοβάσαι τη μοναχικότητα, διαλέγεις τους ανθρώπους από αγάπη, όχι από ανάγκη.","life":"Μια φοιτήτρια μετακομίζει σε άλλη πόλη και τα βράδια νιώθει φοβερή μοναξιά. Αρχίζει να κάνει μόνη της μικρούς περιπάτους στο ηλιοβασίλεμα, χωρίς ακουστικά. Σιγά-σιγά τους απολαμβάνει. Όταν αργότερα κάνει φίλους, τους διαλέγει πιο σοφά.","am":"Μείνετε πέντε λεπτά μόνοι, χωρίς οθόνη, χωρίς να κάνετε τίποτα. Παρατηρήστε τι νιώθετε.","ex":"Κάντε σήμερα έναν μικρό περίπατο ή καθίστε σε ένα παγκάκι μόνοι σας, για 15 λεπτά, χωρίς κινητό και μουσική. Και αν νιώθετε μοναξιά συχνά, κάντε σήμερα και ένα τηλεφώνημα σε κάποιον — η μοναξιά δεν είναι ντροπή. Αν η μοναξιά σάς βαραίνει πολύ, μιλήστε με τον γιατρό σας.","pm":"Πώς ένιωσα όταν έμεινα λίγο μόνος με τον εαυτό μου;"},"en":{"t":"Loneliness and aloneness","tr":"Loneliness is a pain: you feel cut off and empty, and rush to fill it with people, noise and activity. But there is another, beautiful “alone”: being able to be with yourself calmly, without fear. Whoever has learned to be alone does not feel lonely so easily.","simple":"Many people cannot bear even five minutes without a screen or company. As soon as they are alone, they feel a void. Krishnamurti suggested not rushing to fill it, but looking at it, staying with it a little.\n\nThe ability to be alone calmly is a great strength. And when you do not fear being alone, you choose people out of love, not need.","life":"A student moves to another city and feels terribly lonely in the evenings. She starts taking short walks alone at sunset, without headphones. Little by little she enjoys them. When she later makes friends, she chooses them more wisely.","am":"Stay five minutes alone, without a screen, doing nothing. Notice what you feel.","ex":"Take a short walk today or sit on a bench alone for 15 minutes, without phone or music. And if you often feel lonely, also call someone today — loneliness is nothing to be ashamed of. If loneliness weighs heavily on you, speak with your doctor.","pm":"How did I feel when I stayed a little alone with myself?"}},{"tag":["🍃 Φύση","🍃 Nature"],"grc":"","src":["Ελεύθερη απόδοση · από τα γραπτά και τις ομιλίες του για τη φύση","Free rendering · from his writings and talks on nature"],"el":{"t":"Κοίτα ένα δέντρο","tr":"Αν χάσεις τη σχέση σου με τη φύση — με το δέντρο, το πουλί, το ποτάμι, τον ουρανό — θα χάσεις σιγά-σιγά και τη σχέση σου με τους ανθρώπους. Κοίτα ένα δέντρο χωρίς να το ονομάσεις, χωρίς να σκεφτείς τι είναι. Απλώς κοίτα το. Μέσα σε αυτή την ήσυχη ματιά υπάρχει κάτι ιερό.","simple":"Ο Κρισναμούρτι αγαπούσε πολύ τη φύση. Περπατούσε κάθε μέρα στα βουνά και περιέγραφε στα ημερολόγιά του τα σύννεφα, τα πουλιά, το φως πάνω στα φύλλα. Έλεγε ότι όταν κοιτάμε τη φύση με προσοχή, ο νους ησυχάζει και η καρδιά ανοίγει.\n\nΣήμερα οι επιστήμονες επιβεβαιώνουν ότι ακόμη και λίγα λεπτά στη φύση μειώνουν το άγχος.","life":"Ένας υπάλληλος σε ένα γραφείο χωρίς παράθυρα νιώθει ότι «πνίγεται». Αρχίζει να τρώει το μεσημεριανό του σε ένα μικρό πάρκο, κοιτάζοντας ένα γέρικο πλάτανο. Λέει ότι αυτά τα δεκαπέντε λεπτά είναι το «φάρμακο» της ημέρας του.","am":"Κοιτάξτε από το παράθυρο τον ουρανό για ένα λεπτό, χωρίς να σκεφτείτε τίποτα.","ex":"Βρείτε σήμερα ένα δέντρο, ένα λουλούδι ή ένα κομμάτι ουρανού και κοιτάξτε το για τρία λεπτά, χωρίς να το ονομάσετε και χωρίς να το φωτογραφίσετε. Παρατηρήστε τα χρώματα, την κίνηση, το φως. Τι νιώθετε μετά;","pm":"Ποιο κομμάτι της φύσης «είδα» σήμερα πραγματικά;"},"en":{"t":"Look at a tree","tr":"If you lose your relationship with nature — with the tree, the bird, the river, the sky — you will slowly lose your relationship with people too. Look at a tree without naming it, without thinking what it is. Just look at it. In that quiet gaze there is something sacred.","simple":"Krishnamurti loved nature deeply. He walked in the mountains every day and described in his journals the clouds, the birds, the light on the leaves. He said that when we look at nature attentively, the mind grows quiet and the heart opens.\n\nToday scientists confirm that even a few minutes in nature reduce stress.","life":"An employee in a windowless office feels he is “suffocating”. He starts eating his lunch in a small park, looking at an old plane tree. He says those fifteen minutes are the “medicine” of his day.","am":"Look at the sky through the window for one minute, without thinking about anything.","ex":"Find a tree, a flower or a patch of sky today and look at it for three minutes, without naming it and without photographing it. Notice the colours, the movement, the light. How do you feel afterwards?","pm":"Which part of nature did I truly “see” today?"}},{"tag":["🎒 Μάθηση","🎒 Learning"],"grc":"","src":["Ελεύθερη απόδοση · από τις ομιλίες του για την εκπαίδευση","Free rendering · from his talks on education"],"el":{"t":"Η μάθηση δεν τελειώνει ποτέ","tr":"Η εκπαίδευση δεν τελειώνει όταν διαβάσεις ένα βιβλίο ή περάσεις μια εξέταση. Όλη η ζωή, από τη στιγμή που γεννιέσαι ως τη στιγμή που φεύγεις, είναι μια διαδικασία μάθησης. Όποιος πιστεύει ότι τα ξέρει όλα, έχει σταματήσει να ζει.","simple":"Ο Κρισναμούρτι ίδρυσε σχολεία όπου τα παιδιά δεν μάθαιναν μόνο μαθηματικά και γλώσσες, αλλά και πώς να παρατηρούν τον εαυτό τους, τη φύση και τις σχέσεις τους. Πίστευε ότι η πιο σημαντική μάθηση είναι να καταλαβαίνουμε τον ίδιο μας τον νου.\n\nΚαι αυτή η μάθηση δεν έχει ηλικία. Ένας 80χρονος μπορεί να μαθαίνει κάθε μέρα όσο κι ένα παιδί — αρκεί να μείνει περίεργος.","life":"Ένας συνταξιούχος δάσκαλος γράφεται σε μαθήματα ηλεκτρονικών υπολογιστών μαζί με εφήβους. Στην αρχή ντρέπεται. Μετά ανακαλύπτει ότι εκείνος τους μαθαίνει υπομονή κι εκείνοι του μαθαίνουν τεχνολογία. «Έγινα ξανά μαθητής», λέει, «και ξανάνιωσα.»","am":"Πείτε: «Σήμερα θα μάθω κάτι — για τον κόσμο ή για τον εαυτό μου.»","ex":"Μάθετε σήμερα κάτι καινούργιο που δεν ξέρατε χθες: ρωτήστε έναν νεότερο ή έναν μεγαλύτερο να σας μάθει κάτι, διαβάστε για ένα θέμα που δεν γνωρίζετε, ή παρατηρήστε μια δική σας αντίδραση και ρωτήστε «γιατί έγινε αυτό;».","pm":"Τι έμαθα σήμερα; Και από ποιον;"},"en":{"t":"Learning never ends","tr":"Education does not end when you read a book or pass an exam. The whole of life, from the moment you are born to the moment you go, is a process of learning. Whoever believes they know everything has stopped living.","simple":"Krishnamurti founded schools where children learned not only maths and languages but also how to observe themselves, nature and their relationships. He believed the most important learning is to understand our own mind.\n\nAnd this learning has no age. An 80-year-old can learn every day as much as a child — as long as they stay curious.","life":"A retired teacher signs up for computer classes alongside teenagers. At first he is embarrassed. Then he discovers that he teaches them patience and they teach him technology. “I became a pupil again,” he says, “and felt young again.”","am":"Say: “Today I will learn something — about the world or about myself.”","ex":"Learn something new today that you did not know yesterday: ask someone younger or older to teach you something, read about a subject you don’t know, or observe one of your own reactions and ask “why did that happen?”.","pm":"What did I learn today? And from whom?"}}]},
{"id":"fr","emoji":"🕯️","cls":"c-fr","origEn":true,"origLbl":["Από την αγγλική έκδοση του βιβλίου του:","From the English edition of his book:"],"name":["Βίκτορ Φρανκλ","Viktor Frankl"],"withName":["με τον Βίκτορ Φρανκλ","with Viktor Frankl"],"years":["1905–1997 · Ο γιατρός του νοήματος","1905–1997 · The doctor of meaning"],"bio":["<p>Ο Βίκτορ Φρανκλ ήταν <b>γιατρός ψυχίατρος</b> στη Βιέννη. Από νέος βοηθούσε ανθρώπους με κατάθλιψη και φοιτητές σε απόγνωση. Το 1942 οι ναζί τον έστειλαν μαζί με την οικογένειά του σε στρατόπεδα συγκέντρωσης. Πέρασε τρία χρόνια στο Τερεζίν, το Άουσβιτς και το Νταχάου.</p><p>Εκεί έχασε τη γυναίκα του, τους γονείς του και τον αδελφό του. Μέσα στη φρίκη, παρατήρησε κάτι συγκλονιστικό: πιο εύκολα άντεχαν όσοι είχαν ένα <b>νόημα</b> για να ζήσουν — έναν αγαπημένο να ξαναδούν, ένα έργο να τελειώσουν. Ο ίδιος κρατήθηκε ζωντανός ξαναγράφοντας στο μυαλό του το βιβλίο που του είχαν πάρει.</p><p>Μετά την απελευθέρωση έγραψε σε εννέα μέρες το βιβλίο <b>«Ο άνθρωπος αναζητά νόημα»</b>, που διαβάστηκε από πάνω από δέκα εκατομμύρια ανθρώπους. Δίδαξε ότι η ζωή έχει νόημα σε κάθε κατάσταση, ακόμη και στον πόνο. Έζησε ως τα 92, συνεχίζοντας να βοηθά.</p>","<p>Viktor Frankl was a <b>psychiatrist</b> in Vienna. From a young age he helped people with depression and students in despair. In 1942 the Nazis sent him and his family to concentration camps. He spent three years in Theresienstadt, Auschwitz and Dachau.</p><p>There he lost his wife, his parents and his brother. Amid the horror, he noticed something astonishing: those who had a <b>meaning</b> to live for — a loved one to see again, a work to finish — endured more easily. He kept himself alive by rewriting in his mind the book manuscript that had been taken from him.</p><p>After liberation he wrote, in nine days, <b>“Man’s Search for Meaning”</b>, read by more than ten million people. He taught that life has meaning in every situation, even in suffering. He lived to 92, still helping others.</p>"],"cheer":["Ο Φρανκλ έλεγε ότι η ζωή μάς ρωτά κάθε μέρα. Σήμερα δώσατε μια απάντηση.","Frankl said life questions us every day. Today you gave an answer."],"fare":{"grc":"Don’t aim at success — the more you aim at it and make it a target, the more you are going to miss it. For success, like happiness, cannot be pursued; it must ensue.","src":["Βίκτορ Φρανκλ, πρόλογος του «Ο άνθρωπος αναζητά νόημα»","Viktor Frankl, preface to “Man’s Search for Meaning”"],"tr":["Μη στοχεύεις στην επιτυχία — όσο περισσότερο τη στοχεύεις και την κάνεις σκοπό σου, τόσο περισσότερο θα την αστοχείς. Γιατί η επιτυχία, όπως και η ευτυχία, δεν μπορεί να κυνηγηθεί· πρέπει να έρθει ως συνέπεια.","Don’t aim at success — the more you aim at it and make it a target, the more you are going to miss it. For success, like happiness, cannot be pursued; it must ensue."]},"days":[{"tag":["🗝️ Η τελευταία ελευθερία","🗝️ The last freedom"],"grc":"Everything can be taken from a man but one thing: the last of the human freedoms — to choose one’s attitude in any given set of circumstances, to choose one’s own way.","src":["«Ο άνθρωπος αναζητά νόημα»","“Man’s Search for Meaning”"],"el":{"t":"Αυτό που κανείς δεν μπορεί να σου πάρει","tr":"Μπορούν να πάρουν από τον άνθρωπο τα πάντα, εκτός από ένα: την τελευταία από τις ανθρώπινες ελευθερίες — να διαλέγει τη στάση του σε οποιαδήποτε κατάσταση, να διαλέγει τον δικό του δρόμο.","simple":"Ο Φρανκλ τα έγραψε αυτά αφού του πήραν τα πάντα: την οικογένεια, το σπίτι, τα ρούχα, ακόμη και το όνομά του — έγινε ένας αριθμός. Κι όμως, είδε ανθρώπους στο στρατόπεδο να μοιράζονται το τελευταίο τους κομμάτι ψωμί και να παρηγορούν τους άλλους.\n\nΔεν διαλέγουμε πάντα τι μας συμβαίνει. Διαλέγουμε όμως πώς θα σταθούμε απέναντί του. Αυτή η ελευθερία μένει πάντα δική μας.","life":"Ένας νέος μένει παράλυτος μετά από ένα ατύχημα. Τους πρώτους μήνες θέλει να πεθάνει. Με βοήθεια, αρχίζει να ρωτά: «Τι μπορώ να κάνω από εδώ που βρίσκομαι;» Σήμερα επισκέπτεται νοσοκομεία και μιλά σε άλλους νέους με τραυματισμούς. «Δεν διάλεξα την αναπηρία· διάλεξα τι θα κάνω με αυτήν.»","am":"Πείτε: «Ό,τι κι αν συμβεί σήμερα, εγώ διαλέγω πώς θα σταθώ.»","ex":"Σκεφτείτε μια δύσκολη κατάσταση στη ζωή σας που δεν μπορείτε να αλλάξετε. Γράψτε: «Δεν μπορώ να αλλάξω … Μπορώ όμως να διαλέξω να …» Βρείτε μία στάση ή μία μικρή πράξη που είναι δική σας επιλογή.","pm":"Πού σήμερα διάλεξα τη στάση μου, αντί να με διαλέξει η κατάσταση;"},"en":{"t":"What no one can take from you","tr":"Everything can be taken from a man but one thing: the last of the human freedoms — to choose one’s attitude in any given set of circumstances, to choose one’s own way.","simple":"Frankl wrote this after everything had been taken from him: family, home, clothes, even his name — he became a number. And yet he saw people in the camp sharing their last piece of bread and comforting others.\n\nWe do not always choose what happens to us. But we do choose how we stand towards it. That freedom always remains ours.","life":"A young man is paralysed after an accident. In the first months he wants to die. With help, he begins to ask: “What can I do from where I am?” Today he visits hospitals and talks to other young people with injuries. “I didn’t choose the disability; I chose what to do with it.”","am":"Say: “Whatever happens today, I choose how I stand.”","ex":"Think of a hard situation in your life you cannot change. Write: “I cannot change … But I can choose to …” Find one attitude or one small action that is your own choice.","pm":"Where today did I choose my attitude, rather than letting the situation choose it?"}},{"tag":["❓ Το γιατί","❓ The why"],"grc":"He who has a why to live for can bear almost any how.","src":["«Ο άνθρωπος αναζητά νόημα» (ο Φρανκλ παραθέτει τον Νίτσε)","“Man’s Search for Meaning” (Frankl quoting Nietzsche)"],"el":{"t":"Όποιος έχει ένα «γιατί»","tr":"Όποιος έχει ένα «γιατί» για να ζει, μπορεί να αντέξει σχεδόν κάθε «πώς».","simple":"Ο Φρανκλ αγαπούσε αυτή τη φράση του Νίτσε, γιατί την είδε να επιβεβαιώνεται μέρα με τη μέρα στο στρατόπεδο. Οι άνθρωποι που είχαν έναν λόγο να ζήσουν — ένα παιδί που τους περίμενε, ένα έργο, μια πίστη — έβρισκαν δυνάμεις που δεν ήξεραν ότι είχαν.\n\nΣτη δική μας ζωή, το «πώς» μπορεί να είναι μια δύσκολη δουλειά, μια αρρώστια, ένας μακρύς δρόμος σπουδών. Όταν ξέρουμε το «γιατί», το «πώς» γίνεται πιο ελαφρύ.","life":"Μια μητέρα δουλεύει δύο δουλειές για να σπουδάσει την κόρη της. Είναι εξαντλημένη, αλλά κάθε βράδυ κοιτάζει μια φωτογραφία της μικρής. «Γι’ αυτήν το κάνω.» Το «γιατί» της τη σηκώνει κάθε πρωί.","am":"Ρωτήστε: «Ποιο είναι το “γιατί” μου σήμερα;» και απαντήστε με ένα όνομα ή μια λέξη.","ex":"Γράψτε τα τρία πιο σημαντικά «γιατί» της ζωής σας (ανθρώπους, έργα, αξίες). Διαλέξτε μια δύσκολη υποχρέωση της ημέρας και συνδέστε τη με ένα από αυτά: «Το κάνω αυτό, επειδή …»","pm":"Ποιο «γιατί» με κράτησε όρθιο σήμερα;"},"en":{"t":"Whoever has a “why”","tr":"He who has a why to live for can bear almost any how.","simple":"Frankl loved this phrase of Nietzsche’s, because he saw it confirmed day after day in the camp. People who had a reason to live — a child waiting for them, a work, a faith — found strength they did not know they had.\n\nIn our lives, the “how” may be a hard job, an illness, a long road of study. When we know the “why”, the “how” becomes lighter.","life":"A mother works two jobs to put her daughter through university. She is exhausted, but every evening she looks at a photo of her girl. “I do it for her.” Her “why” gets her up every morning.","am":"Ask: “What is my ‘why’ today?” and answer with a name or a word.","ex":"Write the three most important “whys” of your life (people, works, values). Choose a hard task of the day and link it to one of them: “I do this because …”","pm":"Which “why” kept me standing today?"}},{"tag":["🔄 Αλλάζω εγώ","🔄 Changing myself"],"grc":"When we are no longer able to change a situation, we are challenged to change ourselves.","src":["«Ο άνθρωπος αναζητά νόημα»","“Man’s Search for Meaning”"],"el":{"t":"Όταν δεν αλλάζει η κατάσταση","tr":"Όταν δεν μπορούμε πια να αλλάξουμε μια κατάσταση, καλούμαστε να αλλάξουμε τον εαυτό μας.","simple":"Κάποια πράγματα μπορούμε να τα αλλάξουμε — και πρέπει να προσπαθήσουμε. Κάποια όμως όχι: μια απώλεια, μια χρόνια αρρώστια, το παρελθόν. Εκεί, λέει ο Φρανκλ, η ζωή μάς καλεί σε μια άλλη αλλαγή: να μεγαλώσουμε εμείς μέσα μας.\n\nΘυμίζει τον Επίκτητο: τι εξαρτάται από εμάς και τι όχι. Και τον Ηράκλειτο: όλα αλλάζουν. Η αλλαγή του εαυτού είναι πάντα δυνατή.","life":"Ένας άνθρωπος με χρόνια ασθένεια θύμωνε χρόνια με το σώμα του. Μια μέρα αποφασίζει να το αντιμετωπίσει σαν σύντροφο που χρειάζεται φροντίδα και όχι σαν εχθρό. Η ασθένεια δεν έφυγε, αλλά ο ίδιος έγινε πιο ήρεμος, πιο υπομονετικός, πιο κοντά στην οικογένειά του.","am":"Πείτε: «Ό,τι μπορώ να αλλάξω, θα το αλλάξω. Ό,τι δεν μπορώ, θα με αλλάξει προς το καλύτερο.»","ex":"Χωρίστε ένα χαρτί σε δύο: «Μπορώ να το αλλάξω» και «Δεν μπορώ να το αλλάξω». Για το πρώτο, γράψτε ένα βήμα. Για το δεύτερο, γράψτε πώς θα μπορούσατε να μεγαλώσετε εσείς μέσα από αυτό (υπομονή, τρυφερότητα, σοφία).","pm":"Τι άλλαξε σήμερα μέσα μου, εκεί που δεν μπορούσε να αλλάξει τίποτα έξω;"},"en":{"t":"When the situation won’t change","tr":"When we are no longer able to change a situation, we are challenged to change ourselves.","simple":"Some things we can change — and we should try. But some we cannot: a loss, a chronic illness, the past. There, says Frankl, life calls us to another change: to grow inwardly.\n\nIt recalls Epictetus: what is up to us and what is not. And Heraclitus: everything changes. Changing oneself is always possible.","life":"A man with a chronic illness was angry at his body for years. One day he decides to treat it as a companion that needs care, not an enemy. The illness did not go away, but he became calmer, more patient, closer to his family.","am":"Say: “What I can change, I will change. What I cannot, will change me for the better.”","ex":"Divide a page in two: “I can change it” and “I cannot change it”. For the first, write one step. For the second, write how you might grow through it (patience, tenderness, wisdom).","pm":"What changed in me today, where nothing could change outside?"}},{"tag":["💔 Νόημα στον πόνο","💔 Meaning in suffering"],"grc":"In some ways suffering ceases to be suffering at the moment it finds a meaning, such as the meaning of a sacrifice.","src":["«Ο άνθρωπος αναζητά νόημα»","“Man’s Search for Meaning”"],"el":{"t":"Όταν ο πόνος βρίσκει νόημα","tr":"Κατά κάποιον τρόπο, ο πόνος παύει να είναι πόνος τη στιγμή που βρίσκει ένα νόημα — όπως το νόημα μιας θυσίας.","simple":"Ο Φρανκλ διηγείται για έναν ηλικιωμένο γιατρό που δεν μπορούσε να ξεπεράσει τον θάνατο της γυναίκας του. Τον ρώτησε: «Τι θα γινόταν αν είχατε πεθάνει εσείς πρώτος;» «Θα υπέφερε φοβερά», απάντησε. «Βλέπετε; Τη γλιτώσατε από αυτόν τον πόνο. Τον κουβαλάτε εσείς γι’ αυτήν.» Ο γιατρός σηκώθηκε, του έσφιξε το χέρι και έφυγε ήσυχος.\n\nΟ πόνος δεν εξαφανίζεται, αλλά όταν βρίσκει ένα νόημα, γίνεται υποφερτός.","life":"Μια γυναίκα έχασε τον γιο της σε τροχαίο. Μετά από μεγάλο πένθος, ιδρύει με άλλους γονείς μια ομάδα για την οδική ασφάλεια και μιλά σε σχολεία. «Δεν θα τον φέρω πίσω», λέει, «αλλά ίσως σώσω το παιδί κάποιου άλλου.»","am":"Πείτε: «Αν σήμερα πονέσω, θα ρωτήσω: τι μπορεί να σημαίνει αυτό; Τι μπορώ να κάνω με αυτό;»","ex":"Σκεφτείτε έναν πόνο του παρελθόντος σας. Γράψτε: τι σας έμαθε; Ποιον μπορείτε σήμερα να καταλάβετε καλύτερα εξαιτίας του; Αν ο πόνος σας είναι πολύ πρόσφατος ή πολύ βαρύς, δεν χρειάζεται να βρείτε νόημα τώρα — φροντίστε τον εαυτό σας και μιλήστε με τον γιατρό σας.","pm":"Ποιο νόημα, ακόμη και μικρό, βρήκα σήμερα σε κάτι δύσκολο;"},"en":{"t":"When suffering finds meaning","tr":"In some ways suffering ceases to be suffering at the moment it finds a meaning, such as the meaning of a sacrifice.","simple":"Frankl tells of an elderly doctor who could not overcome his wife’s death. Frankl asked him: “What would have happened if you had died first?” “She would have suffered terribly,” he replied. “You see? You spared her that suffering. You carry it for her.” The doctor stood up, shook his hand and left at peace.\n\nThe pain does not vanish, but when it finds a meaning, it becomes bearable.","life":"A woman lost her son in a road accident. After long grief, she founds a road-safety group with other parents and speaks in schools. “I won’t bring him back,” she says, “but perhaps I’ll save someone else’s child.”","am":"Say: “If I hurt today, I will ask: what might this mean? What can I do with it?”","ex":"Think of a pain from your past. Write: what did it teach you? Whom can you understand better today because of it? If your pain is very recent or very heavy, you need not find meaning now — look after yourself and speak with your doctor.","pm":"What meaning, even small, did I find today in something hard?"}},{"tag":["💞 Αγάπη","💞 Love"],"grc":"Love is the only way to grasp another human being in the innermost core of his personality.","src":["«Ο άνθρωπος αναζητά νόημα»","“Man’s Search for Meaning”"],"el":{"t":"Η αγάπη βλέπει τον πυρήνα","tr":"Η αγάπη είναι ο μόνος τρόπος να αγγίξεις έναν άλλον άνθρωπο στον πιο βαθύ πυρήνα της προσωπικότητάς του.","simple":"Μια παγωμένη μέρα, βαδίζοντας προς την καταναγκαστική εργασία, ο Φρανκλ σκεφτόταν τη γυναίκα του. Δεν ήξερε αν ζούσε. Κι όμως, ένιωσε την παρουσία της τόσο έντονα, που κατάλαβε: η αγάπη ξεπερνά ακόμη και την απόσταση και τον θάνατο.\n\nΗ αγάπη δεν βλέπει μόνο αυτό που είναι ο άλλος, αλλά και αυτό που μπορεί να γίνει. Βοηθά τον άλλον να ανθίσει.","life":"Ένας δάσκαλος έχει έναν «δύσκολο» μαθητή που όλοι έχουν ξεγράψει. Εκείνος βλέπει μέσα του ένα παιδί που ζωγραφίζει υπέροχα. Του δίνει να φτιάξει την αφίσα του σχολείου. Το παιδί, για πρώτη φορά, νιώθει ότι κάποιος το βλέπει. Αλλάζει.","am":"Σκεφτείτε έναν άνθρωπο που αγαπάτε και στείλτε του μέσα σας μια ευχή.","ex":"Διαλέξτε σήμερα έναν άνθρωπο — αγαπημένο ή δύσκολο. Γράψτε ένα καλό χαρακτηριστικό του που οι άλλοι ίσως δεν βλέπουν. Πείτε του το, ή κάντε κάτι που το αναγνωρίζει.","pm":"Ποιον είδα σήμερα με τα μάτια της αγάπης;"},"en":{"t":"Love sees the core","tr":"Love is the only way to grasp another human being in the innermost core of his personality.","simple":"One frozen day, marching to forced labour, Frankl was thinking of his wife. He did not know whether she was alive. Yet he felt her presence so strongly that he understood: love surpasses even distance and death.\n\nLove sees not only what the other is but what they can become. It helps the other to flourish.","life":"A teacher has a “difficult” pupil whom everyone has written off. He sees in him a child who draws beautifully. He asks him to make the school poster. For the first time, the child feels someone sees him. He changes.","am":"Think of someone you love and send them a silent good wish.","ex":"Choose one person today — loved or difficult. Write one good quality of theirs that others may not see. Tell them, or do something that recognises it.","pm":"Whom did I see today through the eyes of love?"}},{"tag":["📮 Η ζωή ρωτά","📮 Life asks"],"grc":"Ultimately, man should not ask what the meaning of his life is, but rather must recognize that it is he who is asked.","src":["«Ο άνθρωπος αναζητά νόημα»","“Man’s Search for Meaning”"],"el":{"t":"Δεν ρωτάς εσύ τη ζωή — σε ρωτά εκείνη","tr":"Τελικά, ο άνθρωπος δεν πρέπει να ρωτά ποιο είναι το νόημα της ζωής του, αλλά να καταλάβει ότι εκείνος είναι που ρωτιέται.","simple":"Πολλοί περιμένουμε να «βρούμε» το νόημα της ζωής, σαν ένα κρυμμένο θησαυρό. Ο Φρανκλ γυρίζει την ερώτηση ανάποδα: η ζωή σε ρωτά κάθε μέρα, μέσα από τις καταστάσεις της — «Τι θα κάνεις με αυτή τη μέρα; Με αυτόν τον άνθρωπο; Με αυτή τη δυσκολία;»\n\nΚαι εμείς απαντάμε όχι με λόγια, αλλά με πράξεις και με την ευθύνη μας. Το νόημα δεν το βρίσκουμε· το ζούμε.","life":"Ένας νέος λέει σε έναν ηλικιωμένο: «Δεν ξέρω ποιο είναι το νόημα της ζωής μου.» Ο ηλικιωμένος του δείχνει μια γυναίκα με βαριές σακούλες στο πεζοδρόμιο. «Αυτή τη στιγμή, η ζωή σε ρωτά αν θα τη βοηθήσεις.» Ο νέος γελά, αλλά πηγαίνει και τη βοηθά.","am":"Πείτε: «Τι θα με ρωτήσει σήμερα η ζωή; Θα είμαι έτοιμος να απαντήσω.»","ex":"Τρεις φορές σήμερα, σε μια καθημερινή κατάσταση, ρωτήστε: «Τι μου ζητά αυτή η στιγμή;» (ίσως υπομονή, βοήθεια, ένα χαμόγελο, μια σωστή απόφαση). Απαντήστε με μια πράξη.","pm":"Τι με ρώτησε σήμερα η ζωή, και τι της απάντησα;"},"en":{"t":"You don’t question life — it questions you","tr":"Ultimately, man should not ask what the meaning of his life is, but rather must recognize that it is he who is asked.","simple":"Many of us wait to “find” the meaning of life, like a hidden treasure. Frankl turns the question around: life asks you every day, through its situations — “What will you do with this day? With this person? With this difficulty?”\n\nAnd we answer not with words, but with deeds and responsibility. Meaning is not found; it is lived.","life":"A young man tells an old man: “I don’t know what the meaning of my life is.” The old man points to a woman with heavy bags on the pavement. “Right now, life is asking you whether you will help her.” The young man laughs, but goes and helps her.","am":"Say: “What will life ask me today? I will be ready to answer.”","ex":"Three times today, in an everyday situation, ask: “What does this moment ask of me?” (perhaps patience, help, a smile, a right decision). Answer with an action.","pm":"What did life ask me today, and how did I answer?"}},{"tag":["⏪ Σαν δεύτερη φορά","⏪ As if a second time"],"grc":"Live as if you were living already for the second time and as if you had acted the first time as wrongly as you are about to act now!","src":["«Ο άνθρωπος αναζητά νόημα»","“Man’s Search for Meaning”"],"el":{"t":"Ζήσε σαν να ζεις για δεύτερη φορά","tr":"Ζήσε σαν να ζεις ήδη για δεύτερη φορά, και σαν την πρώτη φορά να είχες κάνει το ίδιο λάθος που ετοιμάζεσαι να κάνεις τώρα!","simple":"Αυτός ήταν ο «χρυσός κανόνας» του Φρανκλ για την ευθύνη. Φανταστείτε ότι έχετε ήδη ζήσει αυτή τη μέρα μία φορά, και τότε μιλήσατε απότομα, αναβάλατε, χάσατε την ευκαιρία. Τώρα σας δίνεται μια δεύτερη ευκαιρία. Τι θα κάνετε διαφορετικά;\n\nΑυτή η φαντασία μάς ξυπνά. Μας κάνει να βλέπουμε κάθε στιγμή ως πολύτιμη και κάθε επιλογή ως σημαντική.","life":"Ένας πατέρας ετοιμάζεται να πει «όχι, είμαι κουρασμένος» στον γιο του που θέλει να παίξουν. Θυμάται τον κανόνα του Φρανκλ: «Αν την πρώτη φορά είχα πει όχι, και ο γιος μου μεγάλωσε…» Σηκώνεται και παίζουν μισή ώρα. Ήταν η πιο όμορφη μισή ώρα της εβδομάδας.","am":"Πείτε: «Σήμερα ζω για δεύτερη φορά. Αυτή τη φορά θα διαλέξω πιο σοφά.»","ex":"Πριν από μια σημαντική επιλογή σήμερα — μια απάντηση, μια αναβολή, μια κουβέντα — σταματήστε και φανταστείτε: «Την πρώτη φορά το έκανα λάθος. Τι θα έκανα αν μου δινόταν μια δεύτερη ευκαιρία;» Κάντε αυτό.","pm":"Πού σήμερα έκανα τη «δεύτερη», καλύτερη επιλογή;"},"en":{"t":"Live as if for the second time","tr":"Live as if you were living already for the second time and as if you had acted the first time as wrongly as you are about to act now!","simple":"This was Frankl’s “golden rule” of responsibility. Imagine you have already lived this day once, and back then you spoke harshly, put things off, missed the chance. Now you are given a second chance. What will you do differently?\n\nThis act of imagination wakes us up. It makes us see every moment as precious and every choice as important.","life":"A father is about to say “no, I’m tired” to his son who wants to play. He remembers Frankl’s rule: “What if the first time I had said no, and my son grew up…” He gets up and they play for half an hour. It was the loveliest half-hour of the week.","am":"Say: “Today I live for the second time. This time I will choose more wisely.”","ex":"Before an important choice today — a reply, a postponement, a conversation — stop and imagine: “The first time I got it wrong. What would I do if given a second chance?” Do that.","pm":"Where today did I make the “second”, better choice?"}}]},
{"id":"ur","emoji":"🌌","cls":"c-ur","origEn":true,"origLbl":["Το αγγλικό κείμενο:","The original English:"],"name":["Το Βιβλίο της Ουράντια","The Urantia Book"],"withName":["με το Βιβλίο της Ουράντια","with The Urantia Book"],"years":["Βιβλίο · Σικάγο 1955 · Μπόνους","Book · Chicago 1955 · Bonus"],"bio":["<p>Το <b>Βιβλίο της Ουράντια</b> εκδόθηκε το 1955 στο Σικάγο από το Ίδρυμα Ουράντια. Είναι ένα πολύ μεγάλο βιβλίο, με 196 κεφάλαια («Εγγράφους») και πάνω από δύο χιλιάδες σελίδες. «Ουράντια» είναι το όνομα που δίνει το βιβλίο στον πλανήτη μας, τη Γη.</p><p>Μιλά για τον Θεό, το σύμπαν, την ιστορία της ανθρωπότητας και, στο τέταρτο μέρος του, για τη ζωή και τις διδασκαλίες του Ιησού. Οι συγγραφείς του δεν είναι γνωστοί ως συγκεκριμένα πρόσωπα· οι αναγνώστες του το θεωρούν αποκάλυψη, ενώ άλλοι το βλέπουν ως έργο πνευματικής φιλοσοφίας. Δεν ανήκει σε καμία εκκλησία και διαβάζεται από ανθρώπους κάθε θρησκείας.</p><p>Εδώ κρατάμε μόνο λίγες σύντομες, πρακτικές φράσεις του για την ανάπτυξη, την αγάπη, την αποτυχία και τον φόβο — με την παραπομπή τους (π.χ. 100:1.4 = Έγγραφο 100, ενότητα 1, παράγραφος 4), ώστε όποιος θέλει να τις βρει στο πρωτότυπο.</p>","<p><b>The Urantia Book</b> was published in 1955 in Chicago by the Urantia Foundation. It is a very large book, with 196 chapters (“Papers”) and over two thousand pages. “Urantia” is the name the book gives to our planet, Earth.</p><p>It speaks of God, the universe, the history of humanity and, in its fourth part, the life and teachings of Jesus. Its authors are not known as specific persons; its readers regard it as a revelation, while others see it as a work of spiritual philosophy. It belongs to no church and is read by people of every faith.</p><p>Here we keep only a few short, practical sentences about growth, love, failure and fear — with their reference (e.g. 100:1.4 = Paper 100, section 1, paragraph 4), so anyone can find them in the original.</p>"],"cheer":["Το βιβλίο λέει: «Ζήσε πιστά σήμερα — μεγάλωσε — και το αύριο θα φροντίσει τον εαυτό του.»","The book says: “Live loyally today — grow — and tomorrow will attend to itself.”"],"fare":{"grc":"Only those who face facts and adjust them to ideals can achieve wisdom.","src":["Το Βιβλίο της Ουράντια 160:4.8","The Urantia Book 160:4.8"],"tr":["Μόνο όσοι αντικρίζουν τα γεγονότα και τα εναρμονίζουν με τα ιδανικά τους μπορούν να φτάσουν στη σοφία.","Only those who face facts and adjust them to ideals can achieve wisdom."]},"days":[{"tag":["🌱 Ανάπτυξη","🌱 Growth"],"grc":"Live loyally today — grow — and tomorrow will attend to itself.","src":["Το Βιβλίο της Ουράντια 100:1.4","The Urantia Book 100:1.4"],"el":{"t":"Ζήσε πιστά σήμερα","tr":"Ζήσε πιστά σήμερα — μεγάλωσε — και το αύριο θα φροντίσει τον εαυτό του.","simple":"Ανησυχούμε τόσο πολύ για το αύριο, που ξεχνάμε να ζήσουμε καλά το σήμερα. Το βιβλίο προτείνει κάτι απλό: να είμαστε πιστοί στις αξίες μας σήμερα, να μεγαλώνουμε σήμερα — και το αύριο θα χτιστεί από μόνο του πάνω σε αυτό.\n\nΣτην ίδια παράγραφο δίνει ένα όμορφο παράδειγμα: ο γυρίνος δεν βιάζεται να γίνει βάτραχος· μεγαλώνει μέρα με τη μέρα, και η αλλαγή έρχεται φυσικά.","life":"Μια φοιτήτρια πανικοβάλλεται κάθε βράδυ για το «τι θα γίνει μετά τις σπουδές». Αποφασίζει να ρωτά κάθε μέρα μόνο: «Έμαθα κάτι σήμερα; Ήμουν καλός άνθρωπος σήμερα;» Το άγχος της μικραίνει. Τρία χρόνια αργότερα, το «μετά» ήρθε — και ήταν έτοιμη.","am":"Πείτε: «Σήμερα θα ζήσω πιστά και θα μεγαλώσω λίγο. Το αύριο θα έρθει.»","ex":"Όταν σήμερα έρθει μια ανησυχία για το μέλλον, γράψτε την και από κάτω γράψτε: «Τι μπορώ να κάνω σήμερα, πιστά και καλά;» Κάντε αυτό και αφήστε το υπόλοιπο για αύριο.","pm":"Σε τι ήμουν πιστός σήμερα; Πού μεγάλωσα λίγο;"},"en":{"t":"Live loyally today","tr":"Live loyally today — grow — and tomorrow will attend to itself.","simple":"We worry so much about tomorrow that we forget to live today well. The book suggests something simple: be loyal to our values today, grow today — and tomorrow will build itself on that.\n\nIn the same paragraph it gives a lovely example: the tadpole does not rush to become a frog; it grows day by day, and the change comes naturally.","life":"A student panics every night about “what happens after university”. She decides to ask each day only: “Did I learn something today? Was I a good person today?” Her anxiety shrinks. Three years later, the “after” came — and she was ready.","am":"Say: “Today I will live loyally and grow a little. Tomorrow will come.”","ex":"When a worry about the future comes today, write it down and below it write: “What can I do today, loyally and well?” Do that, and leave the rest for tomorrow.","pm":"What was I loyal to today? Where did I grow a little?"}},{"tag":["💗 Κατανόηση","💗 Understanding"],"grc":"You cannot truly love your fellows by a mere act of the will. … Love is only born of thoroughgoing understanding of your neighbor’s motives and sentiments.","src":["Το Βιβλίο της Ουράντια 100:4.6","The Urantia Book 100:4.6"],"el":{"t":"Η αγάπη γεννιέται από την κατανόηση","tr":"Δεν μπορείς να αγαπήσεις αληθινά τους συνανθρώπους σου μόνο με μια απόφαση της θέλησης. … Η αγάπη γεννιέται μόνο από τη βαθιά κατανόηση των κινήτρων και των συναισθημάτων του πλησίον σου.","simple":"Μας λένε «αγάπα τον πλησίον σου», αλλά πώς να αγαπήσεις κάποιον που σε εκνευρίζει; Το βιβλίο απαντά: όχι με το ζόρι. Η αγάπη έρχεται όταν καταλάβουμε τι κινεί τον άλλον, τι φοβάται, τι ελπίζει, τι πέρασε.\n\nΚαι στην ίδια παράγραφο προτείνει κάτι πρακτικό: είναι καλύτερο να προσπαθούμε να καταλάβουμε έναν άνθρωπο τη φορά, κάθε μέρα, παρά να προσπαθούμε να αγαπήσουμε «όλη την ανθρωπότητα» μαζί.","life":"Μια νύφη δεν τα πάει καλά με την πεθερά της, που επεμβαίνει σε όλα. Μια μέρα η πεθερά της διηγείται πώς μεγάλωσε ορφανή και πόσο φοβάται να μείνει μόνη. Η νύφη καταλαβαίνει: οι επεμβάσεις ήταν φόβος, όχι κακία. Από τότε η σχέση τους μαλακώνει.","am":"Διαλέξτε έναν άνθρωπο που θα δείτε σήμερα και πείτε: «Σήμερα θα προσπαθήσω να σε καταλάβω.»","ex":"Κάντε σήμερα σε έναν άνθρωπο, ιδιαίτερα σε κάποιον δύσκολο, μια ερώτηση που θα σας βοηθήσει να τον καταλάβετε: «Τι σε ανησυχεί αυτόν τον καιρό;» ή «Πώς ήταν για σένα όταν ήσουν μικρός;» Ακούστε με ενδιαφέρον.","pm":"Ποιον κατάλαβα σήμερα λίγο περισσότερο; Άλλαξε κάτι στο πώς νιώθω γι’ αυτόν;"},"en":{"t":"Love is born of understanding","tr":"You cannot truly love your fellows by a mere act of the will. … Love is only born of thoroughgoing understanding of your neighbor’s motives and sentiments.","simple":"We are told “love your neighbour”, but how can you love someone who irritates you? The book answers: not by force. Love comes when we understand what moves the other, what they fear, what they hope, what they have been through.\n\nAnd in the same paragraph it suggests something practical: it is better to try to understand one person at a time, each day, than to try to love “all humanity” at once.","life":"A daughter-in-law does not get on with her mother-in-law, who interferes in everything. One day the mother-in-law tells how she grew up an orphan and how afraid she is of being left alone. The daughter-in-law understands: the interfering was fear, not malice. From then on their relationship softens.","am":"Choose someone you will see today and say: “Today I will try to understand you.”","ex":"Today ask someone, especially a difficult person, a question that will help you understand them: “What’s worrying you these days?” or “What was it like for you as a child?” Listen with interest.","pm":"Whom did I understand a little more today? Did anything change in how I feel about them?"}},{"tag":["📚 Αποτυχία","📚 Failure"],"grc":"Failure is simply an educational episode — a cultural experiment in the acquirement of wisdom.","src":["Το Βιβλίο της Ουράντια 160:4.9","The Urantia Book 160:4.9"],"el":{"t":"Η αποτυχία είναι ένα μάθημα","tr":"Η αποτυχία είναι απλώς ένα εκπαιδευτικό επεισόδιο — ένα πείραμα καλλιέργειας για την απόκτηση της σοφίας.","simple":"Πολλοί βλέπουμε την αποτυχία σαν τέλος, σαν ντροπή, σαν απόδειξη ότι «δεν αξίζουμε». Το βιβλίο τη βλέπει διαφορετικά: σαν ένα μάθημα στο σχολείο της ζωής. Ένα πείραμα που δεν πέτυχε δεν είναι χαμένο· μας έμαθε τι δεν δουλεύει.\n\nΛίγο πιο πάνω, στην ίδια ενότητα, λέει: «Μη διστάζεις ποτέ να παραδεχτείς την αποτυχία» και «πρέπει να ξέρεις να χάνεις με κέφι».","life":"Ένας νέος άνοιξε ένα μικρό καφέ που έκλεισε σε έναν χρόνο. Ντρεπόταν να βγει από το σπίτι. Ένας παλιός επιχειρηματίας τον ρωτά: «Τι έμαθες;» Γράφουν μαζί δέκα μαθήματα. Τρία χρόνια μετά, το δεύτερο μαγαζί του πηγαίνει πολύ καλά — χάρη σε αυτά τα δέκα μαθήματα.","am":"Πείτε: «Αν σήμερα αποτύχω σε κάτι, θα ρωτήσω: τι μου έμαθε;»","ex":"Γράψτε μια αποτυχία σας (μεγάλη ή μικρή). Από κάτω γράψτε τρία πράγματα που σας έμαθε. Μετά γράψτε μια φράση καλοσύνης προς τον εαυτό σας, σαν να μιλούσατε σε έναν φίλο που απέτυχε.","pm":"Ποια μικρή αποτυχία μου έμαθε κάτι σήμερα;"},"en":{"t":"Failure is a lesson","tr":"Failure is simply an educational episode — a cultural experiment in the acquirement of wisdom.","simple":"Many of us see failure as an end, a disgrace, proof that we are “not worth it”. The book sees it differently: as a lesson in the school of life. An experiment that did not succeed is not wasted; it taught us what does not work.\n\nA little earlier in the same section it says: “Never hesitate to admit failure” and “you must know how to lose cheerfully”.","life":"A young man opened a small café that closed within a year. He was ashamed to leave the house. An old businessman asks him: “What did you learn?” Together they write ten lessons. Three years later his second shop is doing very well — thanks to those ten lessons.","am":"Say: “If I fail at something today, I will ask: what did it teach me?”","ex":"Write down a failure of yours (big or small). Below it, write three things it taught you. Then write a kind sentence to yourself, as if speaking to a friend who had failed.","pm":"Which small failure taught me something today?"}},{"tag":["🪞 Η ήττα ως καθρέφτης","🪞 Defeat as a mirror"],"grc":"Defeat is the true mirror in which you may honestly view your real self.","src":["Το Βιβλίο της Ουράντια 156:5.17","The Urantia Book 156:5.17"],"el":{"t":"Ο καθρέφτης της ήττας","tr":"Η ήττα είναι ο αληθινός καθρέφτης στον οποίο μπορείς να δεις τίμια τον πραγματικό σου εαυτό.","simple":"Όταν όλα πάνε καλά, είναι εύκολο να νομίζουμε ότι είμαστε υπομονετικοί, γενναίοι, καλοί. Η ήττα όμως μάς δείχνει την αλήθεια: θυμώνω; κατηγορώ τους άλλους; τα παρατάω; ή σηκώνομαι ξανά;\n\nΑυτός ο καθρέφτης μπορεί να πονά, αλλά είναι πολύτιμος. Μόνο όταν βλέπουμε τίμια τον εαυτό μας μπορούμε να τον βελτιώσουμε.","life":"Ένας προπονητής ποδοσφαίρου χάνει έναν τελικό. Το πρώτο του ένστικτο είναι να κατηγορήσει τον διαιτητή. Το βράδυ βλέπει ξανά τον αγώνα και παραδέχεται ότι έκανε λάθος αλλαγές. Την επόμενη μέρα το λέει στους παίκτες του. Ο σεβασμός τους γι’ αυτόν μεγαλώνει.","am":"Πείτε: «Σήμερα δεν θα φοβηθώ να κοιτάξω τον εαυτό μου τίμια.»","ex":"Θυμηθείτε μια πρόσφατη «ήττα» (μια διαφωνία που χάσατε, κάτι που δεν πέτυχε). Γράψτε: «Πώς αντέδρασα; Τι μου δείχνει αυτό για τον εαυτό μου; Τι θέλω να κάνω διαφορετικά την επόμενη φορά;» Χωρίς σκληρότητα — με τιμιότητα.","pm":"Τι μου έδειξε σήμερα ο καθρέφτης μιας δυσκολίας;"},"en":{"t":"The mirror of defeat","tr":"Defeat is the true mirror in which you may honestly view your real self.","simple":"When all goes well, it is easy to think we are patient, brave, kind. Defeat, however, shows us the truth: do I get angry? blame others? give up? or get up again?\n\nThis mirror may hurt, but it is precious. Only when we see ourselves honestly can we improve.","life":"A football coach loses a final. His first instinct is to blame the referee. That night he watches the match again and admits he made the wrong substitutions. The next day he tells his players. Their respect for him grows.","am":"Say: “Today I won’t be afraid to look at myself honestly.”","ex":"Recall a recent “defeat” (an argument you lost, something that did not work). Write: “How did I react? What does this show me about myself? What do I want to do differently next time?” Not harshly — honestly.","pm":"What did the mirror of a difficulty show me today?"}},{"tag":["⚔️ Καβγάδες και φόβος","⚔️ Fights and fear"],"grc":"Too often we engage in a fight merely to convince ourselves that we are not afraid.","src":["Το Βιβλίο της Ουράντια 160:3.4","The Urantia Book 160:3.4"],"el":{"t":"Μαλώνουμε για να μη φανεί ότι φοβόμαστε","tr":"Πολύ συχνά μπαίνουμε σε καβγά μόνο και μόνο για να πείσουμε τον εαυτό μας ότι δεν φοβόμαστε.","simple":"Πίσω από πολλούς καβγάδες κρύβεται ένας φόβος: να μη φανούμε αδύναμοι, να μη χάσουμε, να μη μας υποτιμήσουν. Έτσι φωνάζουμε, επιτιθέμεθα, θέλουμε να «κερδίσουμε» — ενώ μέσα μας φοβόμαστε.\n\nΌταν το καταλάβουμε αυτό, μπορούμε να ρωτήσουμε: «Χρειάζεται πραγματικά αυτός ο καβγάς; Ή φοβάμαι κάτι;» Το πραγματικό θάρρος είναι συχνά πιο ήσυχο από τον καβγά.","life":"Δύο έφηβοι στο σχολείο είναι έτοιμοι να πιαστούν στα χέρια, ενώ οι άλλοι φωνάζουν γύρω τους. Ο ένας λέει ξαφνικά: «Δεν θέλω να σε χτυπήσω. Ας το συζητήσουμε.» Κάποιοι γελούν. Αλλά ο άλλος, ανακουφισμένος, κατεβάζει τα χέρια. Και οι δύο φοβούνταν.","am":"Πείτε: «Σήμερα δεν χρειάζεται να αποδείξω σε κανέναν ότι δεν φοβάμαι.»","ex":"Όταν σήμερα νιώσετε την ανάγκη να «κερδίσετε» μια διαφωνία, σταματήστε και ρωτήστε: «Τι φοβάμαι αυτή τη στιγμή;» (να φανώ αδύναμος; να μη με σέβονται;). Αν μπορείτε, πείτε τη γνώμη σας ήρεμα, χωρίς επίθεση — ή αφήστε το να περάσει.","pm":"Ποιος καβγάς μου είχε σήμερα από πίσω έναν φόβο;"},"en":{"t":"We fight so as not to seem afraid","tr":"Too often we engage in a fight merely to convince ourselves that we are not afraid.","simple":"Behind many quarrels hides a fear: of seeming weak, of losing, of being looked down on. So we shout, attack, want to “win” — while inside we are afraid.\n\nWhen we understand this, we can ask: “Is this fight really necessary? Or am I afraid of something?” Real courage is often quieter than a fight.","life":"Two teenagers at school are about to come to blows while others shout around them. One suddenly says: “I don’t want to hit you. Let’s talk.” Some laugh. But the other, relieved, lowers his fists. Both were afraid.","am":"Say: “Today I don’t need to prove to anyone that I am not afraid.”","ex":"When you feel the need to “win” an argument today, stop and ask: “What am I afraid of right now?” (seeming weak? not being respected?). If you can, state your view calmly, without attacking — or let it pass.","pm":"Which of my quarrels today had a fear behind it?"}},{"tag":["😊 Ευτυχία","😊 Happiness"],"grc":"The highest happiness is indissolubly linked with spiritual progress.","src":["Το Βιβλίο της Ουράντια 100:4.3","The Urantia Book 100:4.3"],"el":{"t":"Η ανώτερη ευτυχία","tr":"Η ανώτερη ευτυχία είναι άρρηκτα δεμένη με την πνευματική πρόοδο.","simple":"Υπάρχει η ευτυχία της στιγμής: ένα ωραίο φαγητό, ένα δώρο, μια επιτυχία. Είναι καλή, αλλά περνά γρήγορα. Το βιβλίο μιλά για μια πιο βαθιά ευτυχία, που έρχεται όταν μεγαλώνουμε μέσα μας: όταν γινόμαστε πιο καλοί, πιο σοφοί, πιο ενωμένοι εσωτερικά.\n\nΣτην ίδια παράγραφο λέει ότι η ενότητα της προσωπικότητας γύρω από την αγάπη φέρνει υγεία, καθαρό νου και ευτυχία. Δεν είναι κάτι που αγοράζουμε, αλλά κάτι που καλλιεργούμε.","life":"Ένας άντρας είχε όλα όσα ονειρευόταν: σπίτι, αυτοκίνητο, καλό μισθό. Κι όμως ένιωθε κενός. Αρχίζει να βοηθά σε ένα κοινωνικό παντοπωλείο και να διαβάζει κάθε βράδυ κάτι που τον ανεβάζει. Μετά από μήνες λέει: «Δεν απέκτησα τίποτα καινούργιο. Κι όμως είμαι πιο ευτυχισμένος από ποτέ.»","am":"Ρωτήστε: «Πώς μπορώ σήμερα να γίνω λίγο καλύτερος άνθρωπος;»","ex":"Κάντε σήμερα τρία μικρά πράγματα για την «εσωτερική πρόοδο»: διαβάστε μια σελίδα που σας εμπνέει, κάντε μια καλή πράξη χωρίς να το πείτε, μείνετε πέντε λεπτά σε σιωπή ή προσευχή — με όποιον τρόπο ταιριάζει σε εσάς.","pm":"Ένιωσα σήμερα ότι μεγάλωσα λίγο μέσα μου;"},"en":{"t":"The highest happiness","tr":"The highest happiness is indissolubly linked with spiritual progress.","simple":"There is the happiness of the moment: a good meal, a gift, a success. It is good but passes quickly. The book speaks of a deeper happiness, which comes when we grow within: when we become kinder, wiser, more inwardly unified.\n\nIn the same paragraph it says that unifying the personality around love brings health, a clear mind and happiness. It is not something we buy but something we cultivate.","life":"A man had everything he dreamed of: house, car, good salary. Yet he felt empty. He starts helping at a community food bank and reading something uplifting every evening. After months he says: “I haven’t acquired anything new. Yet I am happier than ever.”","am":"Ask: “How can I become a slightly better person today?”","ex":"Do three small things for “inner progress” today: read a page that inspires you, do a good deed without telling anyone, spend five minutes in silence or prayer — in whatever way suits you.","pm":"Did I feel today that I grew a little inside?"}},{"tag":["🎁 Απογοητεύσεις","🎁 Disappointments"],"grc":"Sometimes your most disappointing disappointments have become your greatest blessings.","src":["Το Βιβλίο της Ουράντια 48:6.25","The Urantia Book 48:6.25"],"el":{"t":"Η απογοήτευση που έγινε ευλογία","tr":"Μερικές φορές οι πιο απογοητευτικές απογοητεύσεις σας έγιναν οι μεγαλύτερες ευλογίες σας.","simple":"Μια δουλειά που δεν πήραμε, μια σχέση που τελείωσε, ένα σχέδιο που χάλασε. Τη στιγμή που συμβαίνει, πονά. Χρόνια αργότερα, κοιτάζοντας πίσω, συχνά βλέπουμε ότι εκείνη η «πόρτα που έκλεισε» μάς οδήγησε σε κάτι πολύ καλύτερο.\n\nΔεν σημαίνει ότι κάθε πόνος έχει αμέσως εξήγηση. Σημαίνει ότι αξίζει να μένουμε ανοιχτοί: η ζωή μπορεί να μας εκπλήξει.","life":"Μια νέα κόπηκε στις εξετάσεις για την ιατρική και έκλαιγε για εβδομάδες. Γράφτηκε στη νοσηλευτική «προσωρινά». Εκεί ανακάλυψε ότι λατρεύει τη φροντίδα των ασθενών από κοντά. Σήμερα είναι προϊσταμένη και λέει: «Η αποτυχία μου ήταν το καλύτερο που μου συνέβη.»","am":"Πείτε: «Αν κάτι δεν γίνει σήμερα όπως το ήθελα, ίσως ανοίγει ένας άλλος δρόμος.»","ex":"Γράψτε μια μεγάλη απογοήτευση του παρελθόντος σας που αργότερα σας έφερε κάτι καλό. Αν έχετε τώρα μια απογοήτευση, γράψτε: «Τι καινούργιο θα μπορούσε να ανοίξει από εδώ;» και ένα μικρό βήμα για να το δείτε.","pm":"Ποια απογοήτευση της ζωής μου έγινε τελικά ευλογία;"},"en":{"t":"The disappointment that became a blessing","tr":"Sometimes your most disappointing disappointments have become your greatest blessings.","simple":"A job we did not get, a relationship that ended, a plan that fell through. When it happens, it hurts. Years later, looking back, we often see that this “closed door” led us to something much better.\n\nIt does not mean every pain has an immediate explanation. It means it is worth staying open: life may surprise us.","life":"A young woman failed the medical school exams and cried for weeks. She enrolled in nursing “for now”. There she discovered she loves caring for patients up close. Today she is a head nurse and says: “My failure was the best thing that ever happened to me.”","am":"Say: “If something doesn’t go as I wanted today, perhaps another road is opening.”","ex":"Write down a great disappointment from your past that later brought you something good. If you have a disappointment now, write: “What new thing might open from here?” and one small step to find out.","pm":"Which disappointment in my life became a blessing in the end?"}}],"who":["Τι είναι το Βιβλίο της Ουράντια","What is The Urantia Book"]}
];

var KEY='sofoi7-v1';
function load(){
  var v=null;try{v=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(!v||typeof v!=='object')v={};if(!v.c||typeof v.c!=='object')v.c={};
  if(!v.migrated){ /* μεταφορά από την παλιά έκδοση «7 ημέρες με τον Επίκτητο» */
    try{var o=JSON.parse(localStorage.getItem('ep7-v1')||'null');
      if(o&&typeof o==='object'){var ep=v.c.ep||(v.c.ep={done:[],notes:{}});if(!ep.notes)ep.notes={};if(!Array.isArray(ep.done))ep.done=[];
        (o.done||[]).forEach(function(i){if(ep.done.indexOf(i)<0)ep.done.push(i)});
        var on=o.notes||{};for(var k in on){if(on[k]&&!ep.notes[k])ep.notes[k]={t:String(on[k]),d:Date.now()}}}
    }catch(e){}
    v.migrated=true;
  }
  return v;
}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
save();
function st(id){var x=S.c[id]||(S.c[id]={done:[],notes:{}});if(!Array.isArray(x.done))x.done=[];if(!x.notes||typeof x.notes!=='object')x.notes={};return x}
function noteOf(id,i){var n=st(id).notes[i];if(!n)return null;if(typeof n==='string')n=st(id).notes[i]={t:n,d:Date.now()};return n}
function noteText(id,i){var n=noteOf(id,i);return n?n.t:''}
function isDone(id,i){return st(id).done.indexOf(i)>=0}
function doneCount(id){return st(id).done.filter(function(i){return i>=0&&i<7}).length}
function nextDay(id){for(var i=0;i<7;i++)if(!isDone(id,i))return i;return -1}
function allNotes(){var a=[];COURSES.forEach(function(c){for(var i=0;i<7;i++){var n=noteOf(c.id,i);if(n&&n.t&&n.t.trim())a.push({c:c,i:i,n:n})}});return a}
function fmtDate(ts){if(!ts)return '';try{return new Date(ts).toLocaleDateString(LANG==='el'?'el-GR':'en-GB',{day:'numeric',month:'long',year:'numeric'})}catch(e){return ''}}

function topicRefs(t){return t.r.map(function(s){var m=/^([a-z]+)-(\d)$/.exec(s);var c=m&&course(m[1]);return c&&c.days[+m[2]]?{c:c,i:+m[2]}:null}).filter(Boolean)}
function matchTopics(q){
  q=norm(q);if(!q.trim())return [];
  var sc=TOPICS.map(function(t){var s=0;t.k.forEach(function(k){if(q.indexOf(norm(k))>=0)s+=k.length>4?2:1});return {t:t,s:s}}).filter(function(x){return x.s>0});
  sc.sort(function(a,b){return b.s-a.s});return sc.map(function(x){return x.t});
}

function todayKey(d){d=d||new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function dayOfWisdom(){
  var all=[];COURSES.forEach(function(c){c.days.forEach(function(d,i){all.push({c:c,i:i})})});
  var n=Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000);
  return all[(n*37)%all.length];
}
function streak(){
  var log=Array.isArray(S.log)?S.log:[];if(!log.length)return 0;
  var set={};log.forEach(function(k){set[k]=1});
  var d=new Date();if(!set[todayKey(d)])d.setDate(d.getDate()-1);
  var n=0;while(set[todayKey(d)]){n++;d.setDate(d.getDate()-1)}return n;
}
function collected(){return COURSES.filter(function(c){return doneCount(c.id)===7}).length}
function vWisdom(){
  var x=dayOfWisdom(),D=x.c.days[x.i][LANG],s=streak(),cc=collected();
  return '<div class="card quote wisdom"><div class="lbl">🌅 '+L('Το λόγιο της ημέρας','Saying of the day')+'</div>'+

var SITE='sofoi-4all.pages.dev';
function wrapLines(ctx,text,maxW){var words=String(text).split(/\s+/),lines=[],cur='';words.forEach(function(w){var t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t});if(cur)lines.push(cur);return lines}
function makeCard(c,i){
  var D=c.days[i][LANG],W=1080,H=1920,cv=document.createElement('canvas');cv.width=W;cv.height=H;var x=cv.getContext('2d');
  var g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b2d5c');g.addColorStop(.55,'#0b1530');g.addColorStop(1,'#060c1a');x.fillStyle=g;x.fillRect(0,0,W,H);
  var seed=(c.id.charCodeAt(0)*31+i*7)%997+1;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
  for(var k=0;k<170;k++){var sx=rnd()*W,sy=rnd()*H*.9,sr=rnd()*2.6+.4;x.globalAlpha=.35+rnd()*.65;x.fillStyle='#fff8dc';x.beginPath();x.arc(sx,sy,sr,0,7);x.fill()}
  x.globalAlpha=1;
  x.textAlign='center';x.fillStyle='#f0d060';x.font='bold 44px Georgia, serif';x.fillText(L('7 ημέρες με τους Σοφούς','7 days with the Sages'),W/2,170);
  x.font='120px serif';x.fillText(c.emoji,W/2,330);
  var txt='«'+D.tr+'»',size=64,lines;
  do{x.font='bold '+size+'px Georgia, serif';lines=wrapLines(x,txt,W-170);size-=4}while(lines.length*size*1.38>980&&size>34);
  size+=4;var lh=size*1.38,bh=lines.length*lh,top=960-bh/2+lh*.72;
  x.fillStyle='rgba(255,248,220,.10)';x.beginPath();if(x.roundRect)x.roundRect(60,top-lh*.72-40,W-120,bh+80,36);else x.rect(60,top-lh*.72-40,W-120,bh+80);x.fill();
  x.fillStyle='#fff8dc';lines.forEach(function(l,j){x.fillText(l,W/2,top+j*lh)});
  x.fillStyle='#f0d060';x.font='bold 50px Georgia, serif';x.fillText('— '+T(c.name),W/2,1560);
  x.fillStyle='#e8dcb0';x.font='italic 34px Georgia, serif';wrapLines(x,T(c.days[i].src),W-200).slice(0,2).forEach(function(l,j){x.fillText(l,W/2,1620+j*44)});
  x.fillStyle='#f0d060';x.font='bold 40px Georgia, serif';x.fillText('🦉 '+SITE,W/2,1810);
  return cv;
}

function fillNotes(){
  var box=$('dlist');if(!box)return;
  var q=norm(($('q')||{}).value||'').trim(),cf=($('qc')||{}).value||'';
  var all=allNotes();
  var items=all.filter(function(x){
    if(cf&&x.c.id!==cf)return false;
    if(!q)return true;
    return norm(x.n.t+' '+x.c.days[x.i][LANG].t+' '+T(x.c.name)).indexOf(q)>=0;
  });
  var f=$('found');
  if(f)f.textContent=all.length?(q||cf?L('Βρέθηκαν ','Found ')+items.length+L(' από ',' of ')+all.length:L('Έχετε ','You have ')+all.length+L(' σημειώσεις',' notes')):'';
  if(!all.length){box.innerHTML='<div class="empty">'+L('Δεν έχετε γράψει ακόμη σημειώσεις.<br>Θα εμφανιστούν εδώ μόλις γράψετε στη «βραδινή εξέταση» κάποιας ημέρας.','You have not written any notes yet.<br>They will appear here once you write in the “evening review” of a day.')+'</div>';return}
  if(!items.length){box.innerHTML='<div class="empty">'+L('Δεν βρέθηκε τίποτα. Δοκιμάστε άλλη λέξη.','Nothing found. Try another word.')+'</div>';return}
  box.innerHTML=items.map(function(x){var d=x.c.days[x.i],k=x.c.id+'-'+x.i;
    return '<div class="card entry"><div class="eh">'+x.c.emoji+' '+esc(T(x.c.name))+' · '+L('Ημέρα ','Day ')+(x.i+1)+' — '+esc(d[LANG].t)+'</div>'+
     '<div class="ed">🌙 '+esc(d[LANG].pm)+(x.n.d?'<br>✏️ '+L('Τελευταία αλλαγή: ','Last changed: ')+fmtDate(x.n.d):'')+'</div>'+
     '<textarea oninput="EP.note(\''+x.c.id+'\','+x.i+',this,true)">'+esc(x.n.t)+'</textarea><div class="saved"></div>'+
     '<div class="row"><button class="big ghost small" onclick="EP.go(\''+x.c.id+'-'+(x.i+1)+'\')">➜ '+L('Η ημέρα','The day')+'</button>'+
     '<button class="big ghost small" id="del-'+k+'" onclick="EP.del(\''+x.c.id+'\','+x.i+')">🗑️ '+L('Σβήσιμο','Delete')+'</button></div></div>'}).join('');
  Array.prototype.forEach.call(box.querySelectorAll('textarea'),grow);
}
function grow(el){if(!el)return;el.style.height='auto';el.style.height=Math.max(120,el.scrollHeight+4)+'px'}
function notesAsText(){
  var out=[L('7 ημέρες με τους Σοφούς — Οι σημειώσεις μου','7 days with the Sages — My notes'),fmtDate(Date.now()),''];
  allNotes().forEach(function(x){var d=x.c.days[x.i];
    out.push('==============================');
    out.push(T(x.c.name)+' · '+L('Ημέρα ','Day ')+(x.i+1)+' — '+d[LANG].t);
    out.push(d[LANG].pm);
    if(x.n.d)out.push('('+fmtDate(x.n.d)+')');
    out.push('');out.push(x.n.t.trim());out.push('');
  });
  return out.join('\n');
}

function arm(key,btn,text){
  if(armed[key]){armed[key]=false;return true}
  armed[key]=true;if(btn){btn._old=btn.innerHTML;btn.innerHTML='⚠️ '+text;btn.classList.add('red')}
  setTimeout(function(){armed[key]=false;if(btn&&document.body.contains(btn)){btn.innerHTML=btn._old;btn.classList.remove('red')}},5000);
  return false;
}

window.EP=EP;

/* ---------------- ΔΡΟΜΟΛΟΓΗΣΗ ----------------
   #start = οι σοφοί · #notes = σημειώσεις · #ep = Επίκτητος
   #ep-3 = ημέρα 3 · #ep-end = τέλος. (Παλιοί σύνδεσμοι #day3 → Επίκτητος) */
function route(){
  var h=decodeURIComponent(location.hash.replace('#',''));
  var m;
  if(h==='notes')return {v:'notes'};
  if(h==='help')return {v:'help'};
  if((m=/^help-([a-z]+)$/.exec(h)))return {v:'help',t:m[1]};
  if((m=/^day([1-7])$/.exec(h)))return {v:'day',c:course('ep'),i:+m[1]-1};
  if(h==='end')return {v:'end',c:course('ep')};
  if((m=/^([a-z]+)-([1-7])$/.exec(h))&&course(m[1]))return {v:'day',c:course(m[1]),i:+m[2]-1};
  if((m=/^([a-z]+)-end$/.exec(h))&&course(m[1]))return {v:'end',c:course(m[1])};
  if(course(h))return {v:'course',c:course(h)};
  return {v:'home'};
}
function render(){
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  armed={};EP.close();
  var r=route();
  document.documentElement.lang=LANG;
  document.title=r.v==='help'?L('Τι σας απασχολεί; · Σοφοί','What is on your mind? · Sages'):r.c&&r.v!=='home'?L('7 ημέρες ','7 days ')+T(r.c.withName):L('7 ημέρες με τους Σοφούς','7 days with the Sages');
  $('app').innerHTML = r.v==='day'?vDay(r.c,r.i):r.v==='end'?vEnd(r.c):r.v==='course'?vCourse(r.c):r.v==='notes'?vNotes():r.v==='help'?vHelp():vHome();
  if(r.v==='notes')fillNotes();
  Array.prototype.forEach.call(document.querySelectorAll('#app textarea'),grow);
  window.scrollTo(0,0);
}
/* ?c=ep στη διεύθυνση ανοίγει κατευθείαν έναν σοφό */
(function(){try{var c=new URLSearchParams(location.search).get('c');if(c&&course(c)&&!location.hash)history.replaceState(null,'','#'+c)}catch(e){}})();
window.addEventListener('hashchange',render);
render();
})();
</script>
<script src="https://cdn.jsdelivr.net/gh/Christos1354/ypografi@main/ypografi.js" defer></script>
