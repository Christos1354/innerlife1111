the combined power of a winged pair of horses and their charioteer.","simple":"Plato imagines the soul as a chariot. One horse is noble and wants to fly high: our good courage, our sense of honour. The other is unruly and pulls towards the desires of the moment. And the charioteer is the mind, holding the reins.\n\nThe aim is not to kill the unruly horse, but to learn to drive it. When mind, heart and desires run together, the chariot flies.","life":"A student wants to study for exams (the mind) but also to go out with friends (the desire). Instead of fighting or giving in completely, she arranges: three hours of study and then going out. Both “horses” are satisfied; the chariot moves on.","am":"Ask: “Which horse will pull hardest today? And how will I drive it?”","ex":"Write a situation where you feel “torn” (I want one thing, but also the other). Write what the mind says, what the heart says, what desire says. Find a solution that takes all three into account.","pm":"Which horse held the reins today — and which should have?"}},{"tag":["🏆 Νίκη πάνω στον εαυτό","🏆 Victory over self"],"grc":"Τὸ νικᾶν αὐτὸν αὑτὸν πασῶν νικῶν πρώτη τε καὶ ἀρίστη.","src":["Νόμοι 626e","Laws 626e"],"el":{"t":"Η πρώτη και η καλύτερη νίκη","tr":"Το να νικάς τον εαυτό σου είναι η πρώτη και η καλύτερη από όλες τις νίκες.","simple":"Μπορούμε να κερδίσουμε αγώνες, διαγωνισμούς, διαφωνίες. Όμως η πιο δύσκολη μάχη είναι μέσα μας: με την τεμπελιά, τον θυμό, τη λαιμαργία, τον φόβο. Ο Πλάτων λέει ότι αυτή η νίκη είναι «πρώτη» — γιατί χωρίς αυτήν οι άλλες δεν κρατούν — και «καλύτερη» — γιατί κανείς δεν μπορεί να μας την πάρει.\n\nΚαι ο Λάο Τσε, στην Κίνα, έλεγε σχεδόν το ίδιο: όποιος νικά τον εαυτό του είναι ο πραγματικά δυνατός.","life":"Ένας πρωταθλητής κολύμβησης κερδίζει μετάλλια, αλλά δεν μπορεί να ελέγξει τον θυμό του και χαλάει τις σχέσεις του. Αρχίζει να δουλεύει με τον εαυτό του όπως με την προπόνηση: λίγο κάθε μέρα. Λέει αργότερα ότι η νίκη πάνω στον θυμό του ήταν το πιο δύσκολο μετάλλιο.","am":"Πείτε: «Σήμερα θα κερδίσω μία μικρή νίκη πάνω στον εαυτό μου.»","ex":"Διαλέξτε σήμερα μία «μάχη» με τον εαυτό σας, μικρή και συγκεκριμένη: να σηκωθείτε με το πρώτο ξυπνητήρι, να μην πείτε μια πικρή κουβέντα, να κάνετε κάτι που αναβάλλετε. Όταν την κερδίσετε, χαρείτε το.","pm":"Ποια νίκη πάνω στον εαυτό μου κέρδισα σήμερα;"},"en":{"t":"The first and best victory","tr":"To conquer oneself is the first and best of all victories.","simple":"We can win races, contests, arguments. But the hardest battle is within: against laziness, anger, greed, fear. Plato says this victory is “first” — because without it the others do not last — and “best” — because no one can take it from us.\n\nAnd Lao Tzu, in China, said almost the same: whoever conquers himself is truly strong.","life":"A swimming champion wins medals but cannot control his temper and spoils his relationships. He starts working on himself as he does in training: a little every day. He later says victory over his anger was the hardest medal.","am":"Say: “Today I will win one small victory over myself.”","ex":"Choose one “battle” with yourself today, small and concrete: getting up at the first alarm, not saying a bitter word, doing something you keep postponing. When you win it, enjoy it.","pm":"Which victory over myself did I win today?"}},{"tag":["🕳️ Η σπηλιά","🕳️ The cave"],"grc":"Ἄτοπον, ἔφη, λέγεις εἰκόνα καὶ δεσμώτας ἀτόπους. — Ὁμοίους ἡμῖν, ἦν δ᾽ ἐγώ.","src":["Πολιτεία 515a","Republic 515a"],"el":{"t":"Οι δεσμώτες που βλέπουν σκιές","tr":"«Παράξενη εικόνα περιγράφεις», είπε, «και παράξενους δεσμώτες.» «Μοιάζουν με εμάς», του απάντησα.","simple":"Ο Πλάτων περιγράφει ανθρώπους δεμένους από παιδιά μέσα σε μια σπηλιά. Βλέπουν μόνο σκιές στον τοίχο, που τις ρίχνει μια φωτιά πίσω τους, και πιστεύουν ότι οι σκιές είναι όλη η πραγματικότητα. Όταν ένας λύνεται και βγαίνει στο φως, στην αρχή τυφλώνεται — μετά βλέπει τον αληθινό κόσμο.\n\nΚαι προσθέτει: «Μοιάζουν με εμάς.» Σήμερα, οι οθόνες μας είναι συχνά ένας τέτοιος τοίχος: βλέπουμε εικόνες, φίλτρα, ειδήσεις, και ξεχνάμε τον αληθινό κόσμο έξω.","life":"Ένας νέος περνά οκτώ ώρες τη μέρα σε οθόνες και πιστεύει ότι όλοι οι άλλοι ζουν τέλεια. Πηγαίνει μια εβδομάδα σε εθελοντική κατασκήνωση χωρίς σήμα. Μιλά με ανθρώπους, βλέπει αστέρια, κουράζεται, γελά. Γυρίζοντας λέει: «Ήμουν σε σπηλιά και δεν το ήξερα.»","am":"Πριν ανοίξετε μια οθόνη, κοιτάξτε για ένα λεπτό τον αληθινό κόσμο γύρω σας: το φως, τα πρόσωπα, τον ουρανό.","ex":"Βγείτε σήμερα από τη «σπηλιά» για μία ώρα: χωρίς οθόνη, κάντε κάτι αληθινό — μια βόλτα, μια κουβέντα πρόσωπο με πρόσωπο, μια δουλειά με τα χέρια. Και σκεφτείτε μια πεποίθηση που ίσως είναι «σκιά»: την έχετε ελέγξει ή απλώς την είδατε πολλές φορές;","pm":"Τι είδα σήμερα «έξω από τη σπηλιά»;"},"en":{"t":"The prisoners who see shadows","tr":"“A strange image you describe,” he said, “and strange prisoners.” “They are like us,” I replied.","simple":"Plato describes people chained from childhood in a cave. They see only shadows on the wall, cast by a fire behind them, and believe the shadows are all of reality. When one is freed and goes out into the light, at first he is dazzled — then he sees the real world.\n\nAnd he adds: “They are like us.” Today our screens are often such a wall: we see images, filters, news, and forget the real world outside.","life":"A young man spends eight hours a day on screens and believes everyone else lives perfectly. He goes for a week to a volunteer camp with no signal. He talks with people, sees stars, gets tired, laughs. Back home he says: “I was in a cave and didn’t know it.”","am":"Before opening a screen, look for one minute at the real world around you: the light, faces, the sky.","ex":"Leave the “cave” for one hour today: without a screen, do something real — a walk, a face-to-face talk, a job with your hands. And think of a belief that may be a “shadow”: have you checked it, or just seen it many times?","pm":"What did I see today “outside the cave”?"}},{"tag":["🩺 Σώμα και ψυχή","🩺 Body and soul"],"grc":"Ὥσπερ ὀφθαλμοὺς ἄνευ κεφαλῆς οὐ δεῖ ἐπιχειρεῖν ἰᾶσθαι οὐδὲ κεφαλὴν ἄνευ σώματος, οὕτως οὐδὲ σῶμα ἄνευ ψυχῆς.","src":["Χαρμίδης 156e","Charmides 156e"],"el":{"t":"Δεν γιατρεύεις το σώμα χωρίς την ψυχή","tr":"Όπως δεν πρέπει να προσπαθείς να γιατρέψεις τα μάτια χωρίς το κεφάλι, ούτε το κεφάλι χωρίς το σώμα, έτσι δεν πρέπει να γιατρεύεις ούτε το σώμα χωρίς την ψυχή.","simple":"Πριν από 2.400 χρόνια, ο Πλάτων είπε αυτό που η σύγχρονη ιατρική ξαναανακαλύπτει: το σώμα και η ψυχή είναι ένα. Το άγχος φέρνει πονοκεφάλους και αϋπνίες. Η μοναξιά βλάπτει την καρδιά. Και αντίστροφα, η κίνηση, ο ύπνος και η καλή διατροφή βοηθούν τη διάθεση.\n\nΑυτό δεν σημαίνει ότι αντικαθιστούμε τον γιατρό με τη φιλοσοφία — σημαίνει ότι φροντίζουμε και τα δύο μαζί.","life":"Μια γυναίκα πηγαίνει συχνά στον γιατρό για πόνους στο στομάχι. Ο γιατρός, αφού κάνει τις εξετάσεις, τη ρωτά και για τη ζωή της. Μιλούν για το άγχος της δουλειάς. Μαζί με τη θεραπεία, αρχίζει περιπάτους και κουβέντες με μια φίλη. Νιώθει καλύτερα σε όλα.","am":"Ρωτήστε: «Πώς είναι σήμερα το σώμα μου; Πώς είναι η ψυχή μου;» Ακούστε και τα δύο.","ex":"Κάντε σήμερα κάτι για το σώμα που βοηθά και την ψυχή (περπάτημα στη φύση, χορός, κολύμπι) και κάτι για την ψυχή που βοηθά και το σώμα (ένα γέλιο με φίλους, μια συγχώρεση, λίγη σιωπή). Αν κάτι σας πονά συχνά, μιλήστε με τον γιατρό σας για το σώμα και την ψυχή μαζί.","pm":"Πώς βοήθησε σήμερα το σώμα μου την ψυχή μου — ή το αντίθετο;"},"en":{"t":"No healing the body without the soul","tr":"Just as one should not try to cure the eyes without the head, nor the head without the body, so one should not cure the body without the soul.","simple":"2,400 years ago Plato said what modern medicine is rediscovering: body and soul are one. Stress brings headaches and insomnia. Loneliness harms the heart. And conversely, movement, sleep and good food help our mood.\n\nThis does not mean replacing the doctor with philosophy — it means caring for both together.","life":"A woman often goes to the doctor with stomach pains. The doctor, after running the tests, also asks about her life. They talk about stress at work. Alongside the treatment, she starts walks and talks with a friend. She feels better in every way.","am":"Ask: “How is my body today? How is my soul?” Listen to both.","ex":"Do something for the body today that also helps the soul (a walk in nature, dancing, swimming) and something for the soul that also helps the body (a laugh with friends, a forgiveness, some silence). If something often hurts, talk with your doctor about body and soul together.","pm":"How did my body help my soul today — or the other way round?"}},{"tag":["🎶 Παιχνίδι","🎶 Play"],"grc":"Παίζοντά τινας δὴ παιδιὰς διαβιωτέον, θύοντα καὶ ᾄδοντα καὶ ὀρχούμενον.","src":["Νόμοι 803e","Laws 803e"],"el":{"t":"Να ζεις παίζοντας","tr":"Πρέπει να περνάμε τη ζωή μας παίζοντας κάποια παιχνίδια: προσφέροντας θυσίες, τραγουδώντας και χορεύοντας.","simple":"Ο αυστηρός Πλάτων, στο τελευταίο του βιβλίο, λέει κάτι αναπάντεχο: η ζωή δεν πρέπει να είναι μόνο σοβαρότητα. Χρειάζεται τραγούδι, χορό, γιορτή και παιχνίδι. Μέσα από αυτά η ψυχή ξεκουράζεται και βρίσκει χαρά, και οι άνθρωποι ενώνονται.\n\nΣήμερα πολλοί ενήλικες δεν παίζουν ποτέ. Κι όμως, το παιχνίδι δεν είναι μόνο για τα παιδιά — είναι φάρμακο για όλες τις ηλικίες.","life":"Σε ένα γηροκομείο, μια εθελόντρια φέρνει μουσική και ξεκινά έναν απλό χορό. Στην αρχή όλοι ντρέπονται. Σε λίγο, μια κυρία 88 ετών σηκώνεται και χορεύει έναν παλιό καλαματιανό. Όλοι γελούν και χειροκροτούν. «Ξαναζωντάνεψα», λέει.","am":"Βάλτε ένα τραγούδι που σας αρέσει και κουνηθείτε λίγο στον ρυθμό του — ακόμη κι αν σας βλέπει μόνο ο καθρέφτης.","ex":"Παίξτε σήμερα κάτι για τη χαρά του: ένα επιτραπέζιο με την οικογένεια, μπάλα με ένα παιδί, ένα τραγούδι δυνατά, ένα αστείο σε έναν φίλο. Χωρίς στόχο, χωρίς βαθμούς — μόνο για να χαρείτε.","pm":"Πότε σήμερα έπαιξα, τραγούδησα ή γέλασα;"},"en":{"t":"Live playing","tr":"We should spend our lives playing certain games: offering sacrifices, singing and dancing.","simple":"Strict Plato, in his last book, says something unexpected: life should not be all seriousness. It needs song, dance, festival and play. Through these the soul rests and finds joy, and people come together.\n\nToday many adults never play. Yet play is not only for children — it is medicine for every age.","life":"In a care home, a volunteer brings music and starts a simple dance. At first everyone is shy. Soon an 88-year-old lady stands up and dances an old folk dance. Everyone laughs and claps. “I came alive again,” she says.","am":"Put on a song you like and move a little to its rhythm — even if only the mirror is watching.","ex":"Play something today just for the joy of it: a board game with the family, ball with a child, a song out loud, a joke with a friend. No goal, no score — just for fun.","pm":"When did I play, sing or laugh today?"}},{"tag":["🎯 Ευθύνη","🎯 Responsibility"],"grc":"Ἀρετὴ δὲ ἀδέσποτον, ἣν τιμῶν καὶ ἀτιμάζων πλέον καὶ ἔλαττον αὐτῆς ἕκαστος ἕξει. Αἰτία ἑλομένου· θεὸς ἀναίτιος.","src":["Πολιτεία 617e (ο μύθος του Ηρός)","Republic 617e (the myth of Er)"],"el":{"t":"Ο καθένας διαλέγει","tr":"Η αρετή δεν έχει αφεντικό: όσο την τιμά κανείς ή την περιφρονεί, τόσο περισσότερη ή λιγότερη θα έχει. Η ευθύνη ανήκει σε αυτόν που διαλέγει· ο θεός δεν φταίει.","simple":"Στο τέλος της «Πολιτείας», ο Πλάτων διηγείται έναν μύθο: πριν γεννηθούν, οι ψυχές διαλέγουν τη ζωή που θα ζήσουν. Και ακούγεται μια φωνή: «Εσύ διαλέγεις. Δεν φταίει ο θεός.»\n\nΔεν διαλέγουμε όλα όσα μας συμβαίνουν. Αλλά κάθε μέρα διαλέγουμε πόση καλοσύνη, πόση αλήθεια, πόσο θάρρος θα βάλουμε στη ζωή μας. Αυτή η ελευθερία είναι και ευθύνη — και τιμή.","life":"Ένας νέος κατηγορεί πάντα τους άλλους: τους γονείς, το σχολείο, τη χώρα. Ένας παλιός προπονητής τού λέει: «Ίσως έχεις δίκιο για όλα. Τι θα διαλέξεις όμως εσύ από σήμερα;» Η ερώτηση τον ενοχλεί για μέρες. Μετά γράφεται σε μια σχολή.","am":"Πείτε: «Σήμερα αναλαμβάνω την ευθύνη για τις επιλογές μου.»","ex":"Γράψτε ένα πράγμα για το οποίο συνήθως κατηγορείτε άλλους ή την τύχη. Από κάτω, γράψτε: «Ποιο κομμάτι από αυτό είναι δική μου επιλογή;» Κάντε σήμερα μια επιλογή που σας κάνει περήφανους.","pm":"Ποια επιλογή μου σήμερα ήταν πραγματικά δική μου;"},"en":{"t":"Each one chooses","tr":"Virtue has no master: as each honours or dishonours her, so shall they have more or less of her. The responsibility lies with the one who chooses; God is blameless.","simple":"At the end of the “Republic”, Plato tells a myth: before being born, souls choose the life they will live. And a voice is heard: “You choose. God is not to blame.”\n\nWe do not choose all that happens to us. But every day we choose how much kindness, truth and courage we put into our life. That freedom is also responsibility — and honour.","life":"A young man always blames others: parents, school, country. An old coach tells him: “Maybe you’re right about all of it. But what will you choose from today?” The question bothers him for days. Then he enrols in a college.","am":"Say: “Today I take responsibility for my choices.”","ex":"Write one thing for which you usually blame others or luck. Below it, write: “Which part of this is my own choice?” Today make one choice that makes you proud.","pm":"Which choice of mine today was truly my own?"}}]},
{"id":"ma","emoji":"👑","cls":"c-ma","name":["Μάρκος Αυρήλιος","Marcus Aurelius"],"withName":["με τον Μάρκο Αυρήλιο","with Marcus Aurelius"],"years":["121–180 μ.Χ. · Ο αυτοκράτορας που έγραφε στον εαυτό του","121–180 AD · The emperor who wrote to himself"],"bio":["<p>Ο Μάρκος Αυρήλιος ήταν <b>αυτοκράτορας της Ρώμης</b>, ο πιο ισχυρός άνθρωπος του κόσμου της εποχής του. Κι όμως, κάθε βράδυ, στις σκηνές των στρατοπέδων στα σύνορα του Δούναβη, έγραφε σημειώσεις για τον εαυτό του — στα ελληνικά.</p><p>Η ζωή του δεν ήταν εύκολη: πόλεμοι, μια φοβερή επιδημία, η απώλεια πολλών παιδιών του, προδοσίες. Δεν έγραφε για να γίνει διάσημος· έγραφε για να θυμάται πώς να μένει ήρεμος, δίκαιος και καλός. Το μικρό του βιβλίο το λέμε σήμερα <b>«Τὰ εἰς ἑαυτόν»</b> — «Προς τον εαυτό του».</p><p>Ήταν μαθητής των Στωικών και θαύμαζε πολύ τον Επίκτητο. Σήμερα το βιβλίο του το διαβάζουν αθλητές, γιατροί, στρατιώτες, φοιτητές — όλοι όσοι ψάχνουν ψυχραιμία μέσα στις δυσκολίες.</p>","<p>Marcus Aurelius was <b>Emperor of Rome</b>, the most powerful man in the world of his time. Yet every evening, in army tents on the Danube frontier, he wrote notes to himself — in Greek.</p><p>His life was not easy: wars, a terrible epidemic, the loss of many of his children, betrayals. He did not write to become famous; he wrote to remind himself how to stay calm, just and kind. We know his little book today as the <b>“Meditations”</b> — literally “To Himself”.</p><p>He was a student of the Stoics and greatly admired Epictetus. Today his book is read by athletes, doctors, soldiers, students — everyone looking for composure amid difficulties.</p>"],"cheer":["Ο Μάρκος Αυρήλιος έγραφε για τον εαυτό του, βράδυ με βράδυ. Αυτό κάνετε κι εσείς.","Marcus Aurelius wrote to himself, evening after evening. So are you."],"fare":{"grc":"Μηκέθ᾽ ὅλως περὶ τοῦ οἷόν τινα εἶναι τὸν ἀγαθὸν ἄνδρα διαλέγεσθαι, ἀλλὰ εἶναι τοιοῦτον.","src":["Μάρκος Αυρήλιος, Τὰ εἰς ἑαυτόν Ι΄ 16","Marcus Aurelius, Meditations X 16"],"tr":["Σταμάτα πια να συζητάς πώς πρέπει να είναι ο καλός άνθρωπος. Γίνε ένας.","Stop arguing at all about what a good person should be. Be one."]},"days":[{"tag":["🌅 Το πρωί","🌅 Morning"],"grc":"Ὄρθρου, ὅταν δυσόκνως ἐξεγείρῃ, πρόχειρον ἔστω ὅτι ἐπὶ ἀνθρώπου ἔργον ἐγείρομαι.","src":["Τὰ εἰς ἑαυτόν Ε΄ 1","Meditations V 1"],"el":{"t":"Όταν δεν θέλεις να σηκωθείς","tr":"Το πρωί, όταν βαριέσαι να σηκωθείς, να έχεις έτοιμη αυτή τη σκέψη: «Σηκώνομαι για να κάνω τη δουλειά ενός ανθρώπου.»","simple":"Ναι, ακόμη και ο αυτοκράτορας της Ρώμης δεν ήθελε να βγει από το ζεστό κρεβάτι! Και μάλωνε τον εαυτό του: «Γεννήθηκες για να ξαπλώνεις κάτω από τα σκεπάσματα;» Τα πουλιά, οι μέλισσες, τα μυρμήγκια κάνουν τη δουλειά τους· εσύ γιατί όχι;\n\nΤο μυστικό του δεν ήταν η τιμωρία αλλά το νόημα: θυμόταν για ποιον λόγο σηκώνεται. Όταν ξέρουμε το «γιατί», το «σήκω» γίνεται πιο εύκολο.","life":"Μια μητέρα με μωρό ξυπνά κουρασμένη για πέμπτη φορά τη νύχτα. Αντί να σκεφτεί «δεν αντέχω άλλο», λέει: «Σηκώνομαι για το πιο σημαντικό έργο που έχω.» Η κούραση είναι ίδια, αλλά η καρδιά της πιο ελαφριά.","am":"Πριν σηκωθείτε, πείτε: «Σηκώνομαι για να κάνω τη δουλειά ενός ανθρώπου.» Και σκεφτείτε για ποιον ή για τι.","ex":"Γράψτε σε ένα χαρτάκι τον λόγο για τον οποίο αξίζει να σηκωθείτε αύριο (ένα πρόσωπο, μια δουλειά, ένα όνειρο). Κολλήστε το δίπλα στο ξυπνητήρι ή βάλτε το ως φόντο στο κινητό.","pm":"Για ποιον ή για τι σηκώθηκα σήμερα;"},"en":{"t":"When you don’t want to get up","tr":"At dawn, when you are reluctant to get up, have this thought ready: “I am rising to do the work of a human being.”","simple":"Yes, even the Emperor of Rome did not want to leave his warm bed! And he scolded himself: “Were you born to lie under the blankets?” Birds, bees and ants do their work; why not you?\n\nHis secret was not punishment but meaning: he remembered why he was getting up. When we know the “why”, the “get up” becomes easier.","life":"A mother with a baby wakes exhausted for the fifth time in the night. Instead of thinking “I can’t take any more”, she says: “I am rising for the most important work I have.” The tiredness is the same, but her heart is lighter.","am":"Before getting up, say: “I am rising to do the work of a human being.” And think for whom or for what.","ex":"Write on a slip of paper the reason it is worth getting up tomorrow (a person, a task, a dream). Stick it next to the alarm or make it your phone wallpaper.","pm":"For whom or for what did I get up today?"}},{"tag":["😤 Δύσκολοι άνθρωποι","😤 Difficult people"],"grc":"Ἕωθεν προλέγειν ἑαυτῷ· συντεύξομαι περιέργῳ, ἀχαρίστῳ, ὑβριστῇ, δολερῷ, βασκάνῳ, ἀκοινωνήτῳ.","src":["Τὰ εἰς ἑαυτόν Β΄ 1","Meditations II 1"],"el":{"t":"Σήμερα θα συναντήσω δύσκολους ανθρώπους","tr":"Από το πρωί, πες στον εαυτό σου: «Σήμερα θα συναντήσω ανθρώπους αδιάκριτους, αχάριστους, αγενείς, πονηρούς, ζηλιάρηδες και αντικοινωνικούς.»","simple":"Ακούγεται απαισιόδοξο, αλλά είναι πολύ σοφό. Ο Μάρκος προετοιμαζόταν. Όταν ξέρεις ότι θα βρέξει, παίρνεις ομπρέλα και δεν θυμώνεις με τη βροχή.\n\nΚαι συνέχιζε: «Αυτοί είναι έτσι επειδή δεν ξέρουν τι είναι καλό. Εγώ όμως το ξέρω. Και είναι συγγενείς μου, άνθρωποι σαν εμένα. Γεννηθήκαμε για να συνεργαζόμαστε, όπως τα δύο χέρια, τα δύο πόδια, τα δύο μάτια.»","life":"Μια ταμίας σε σούπερ μάρκετ συναντά κάθε μέρα βιαστικούς και αγενείς πελάτες. Κάθε πρωί λέει: «Σήμερα κάποιοι θα είναι αγενείς — ίσως έχουν δύσκολη μέρα.» Όταν συμβαίνει, δεν το παίρνει προσωπικά. Γυρίζει σπίτι πολύ λιγότερο θυμωμένη.","am":"Πείτε: «Σήμερα μπορεί να συναντήσω δύσκολους ανθρώπους. Δεν θα αφήσω τη δική τους κακή μέρα να γίνει δική μου.»","ex":"Όταν κάποιος σας ενοχλήσει σήμερα, σκεφτείτε: «Τι μπορεί να περνά αυτός ο άνθρωπος;» Πριν απαντήσετε, πάρτε μια ανάσα. Αν γίνεται, απαντήστε με ηρεμία ή απλώς απομακρυνθείτε.","pm":"Ποιος δύσκολος άνθρωπος με δοκίμασε σήμερα; Πώς αντέδρασα;"},"en":{"t":"Today I will meet difficult people","tr":"Say to yourself at dawn: “Today I shall meet people who are meddling, ungrateful, insolent, deceitful, envious and unsociable.”","simple":"It sounds pessimistic, but it is very wise. Marcus was preparing himself. When you know it will rain, you take an umbrella and do not get angry at the rain.\n\nAnd he continued: “They are like this because they do not know what is good. But I do. And they are my kin, human beings like me. We were born to work together, like two hands, two feet, two eyes.”","life":"A supermarket cashier meets hurried, rude customers every day. Each morning she says: “Today some will be rude — perhaps they’re having a hard day.” When it happens, she does not take it personally. She goes home far less angry.","am":"Say: “Today I may meet difficult people. I won’t let their bad day become mine.”","ex":"When someone annoys you today, think: “What might this person be going through?” Before answering, take a breath. If possible, answer calmly or simply step away.","pm":"Which difficult person tested me today? How did I respond?"}},{"tag":["🏡 Εσωτερικό καταφύγιο","🏡 Inner retreat"],"grc":"Οὐδαμοῦ γὰρ οὔτε ἡσυχιώτερον οὔτε ἀπραγμονέστερον ἄνθρωπος ἀναχωρεῖ ἢ εἰς τὴν ἑαυτοῦ ψυχήν.","src":["Τὰ εἰς ἑαυτόν Δ΄ 3","Meditations IV 3"],"el":{"t":"Το καταφύγιο μέσα σου","tr":"Οι άνθρωποι ψάχνουν να ξεφύγουν σε σπίτια στην εξοχή, σε ακρογιαλιές και βουνά. Όμως πουθενά δεν μπορεί να καταφύγει ο άνθρωπος πιο ήσυχα και πιο ξέγνοιαστα από ό,τι μέσα στην ίδια του την ψυχή.","simple":"Ο Μάρκος δεν μπορούσε να πάει διακοπές· ήταν στον πόλεμο. Ανακάλυψε όμως ότι μπορεί να κάνει «διακοπές» μέσα του, για λίγα λεπτά, όποτε θέλει.\n\nΑυτό το εσωτερικό καταφύγιο χτίζεται με λίγη σιωπή, μερικές καλές σκέψεις, μια ανάμνηση που μας ηρεμεί. Όσο πιο συχνά πηγαίνουμε εκεί, τόσο πιο εύκολα το βρίσκουμε.","life":"Ένας νεαρός στρατιώτης νιώθει άγχος στη σκοπιά. Κλείνει τα μάτια για ένα λεπτό και φαντάζεται την παραλία του χωριού του: τον ήχο των κυμάτων, τη μυρωδιά της θάλασσας. Ανοίγει τα μάτια πιο ήρεμος.","am":"Κλείστε τα μάτια για ένα λεπτό και επισκεφθείτε ένα μέρος που σας ηρεμεί — πραγματικό ή φανταστικό.","ex":"Φτιάξτε σήμερα το «καταφύγιό» σας: γράψτε τρεις εικόνες, ήχους ή φράσεις που σας γαληνεύουν. Τρεις φορές μέσα στη μέρα, «πηγαίνετε» εκεί για ένα λεπτό, με κλειστά μάτια και ήρεμη ανάσα.","pm":"Πότε σήμερα βρήκα λίγη ησυχία μέσα μου;"},"en":{"t":"The retreat within","tr":"People seek retreats for themselves in the countryside, by the sea and in the mountains. But nowhere can a person retire more quietly or more free from trouble than into their own soul.","simple":"Marcus could not go on holiday; he was at war. But he discovered he could take a “holiday” inside, for a few minutes, whenever he wished.\n\nThis inner retreat is built with a little silence, a few good thoughts, a memory that calms us. The more often we go there, the more easily we find it.","life":"A young soldier feels anxious on guard duty. He closes his eyes for a minute and pictures the beach of his village: the sound of the waves, the smell of the sea. He opens his eyes calmer.","am":"Close your eyes for a minute and visit a place that calms you — real or imagined.","ex":"Build your “retreat” today: write three images, sounds or phrases that bring you peace. Three times during the day, “go” there for a minute, with eyes closed and calm breath.","pm":"When did I find a little quiet inside today?"}},{"tag":["🪨 Σταθερότητα","🪨 Steadiness"],"grc":"Ὅμοιον εἶναι τῇ ἄκρᾳ, ᾗ διηνεκῶς τὰ κύματα προσρήσσεται· ἡ δὲ ἕστηκε καὶ περὶ αὐτὴν κοιμίζεται τὰ φλεγμήναντα τοῦ ὕδατος.","src":["Τὰ εἰς ἑαυτόν Δ΄ 49","Meditations IV 49"],"el":{"t":"Σαν βράχος μέσα στα κύματα","tr":"Να είσαι σαν το ακρωτήρι, όπου σπάνε συνεχώς τα κύματα. Εκείνο στέκεται ακίνητο, και γύρω του ηρεμούν τα αγριεμένα νερά.","simple":"Τα κύματα δεν σταματούν ποτέ: προβλήματα, κακά νέα, άδικες κουβέντες. Ο βράχος δεν τα σταματά — απλώς δεν πέφτει. Και κάτι ακόμη: γύρω από έναν σταθερό βράχο, το νερό ηρεμεί.\n\nΤο ίδιο συμβαίνει και με τους ανθρώπους. Ένας ήρεμος άνθρωπος μέσα σε μια ταραγμένη οικογένεια ή ομάδα ηρεμεί και τους άλλους.","life":"Σε ένα νοσοκομείο, η οικογένεια ενός ασθενή είναι σε πανικό. Ο γιατρός μιλά αργά, ήρεμα, κοιτάζοντάς τους στα μάτια. Σε λίγα λεπτά όλοι ανασαίνουν πιο ήσυχα. Η ηρεμία του έγινε δική τους.","am":"Φανταστείτε τον εαυτό σας σαν βράχο στη θάλασσα. Πείτε: «Τα κύματα θα έρθουν. Εγώ θα στέκομαι.»","ex":"Όταν σήμερα έρθει ένα «κύμα» — ένα κακό νέο, ένας θυμωμένος άνθρωπος, μια αναποδιά — πριν αντιδράσετε, πείτε μέσα σας «βράχος», πάρτε μια ανάσα και χαλαρώστε τους ώμους. Μετά αποφασίστε τι θα κάνετε.","pm":"Ποιο κύμα με χτύπησε σήμερα; Έμεινα όρθιος;"},"en":{"t":"Like a rock in the waves","tr":"Be like the headland against which the waves break continually. It stands firm, and around it the raging waters fall asleep.","simple":"The waves never stop: problems, bad news, unfair words. The rock does not stop them — it simply does not fall. And one more thing: around a steady rock, the water calms.\n\nThe same is true of people. One calm person in a troubled family or team calms the others too.","life":"In a hospital, a patient’s family is in panic. The doctor speaks slowly and calmly, looking them in the eye. Within minutes everyone breathes more quietly. His calm became theirs.","am":"Picture yourself as a rock in the sea. Say: “The waves will come. I will stand.”","ex":"When a “wave” comes today — bad news, an angry person, a setback — before reacting, say inwardly “rock”, take a breath and relax your shoulders. Then decide what to do.","pm":"Which wave hit me today? Did I stay standing?"}},{"tag":["⏱️ Το τώρα","⏱️ The present"],"grc":"Μόνον ζῇ ἕκαστος τὸ παρὸν τοῦτο, τὸ ἀκαριαῖον· τὰ δὲ ἄλλα ἢ βεβίωται ἢ ἔστιν ἐν ἀδήλῳ.","src":["Τὰ εἰς ἑαυτόν Γ΄ 10","Meditations III 10"],"el":{"t":"Ζούμε μόνο τη στιγμή","tr":"Ο καθένας ζει μόνο αυτή την παρούσα στιγμή, που περνά σαν αστραπή. Όλα τα άλλα, ή τα έχουμε ήδη ζήσει, ή είναι άγνωστα.","simple":"Το χθες δεν υπάρχει πια. Το αύριο δεν ήρθε ακόμη. Η μόνη στιγμή που μπορούμε πραγματικά να ζήσουμε, να αγαπήσουμε, να διορθώσουμε κάτι, είναι αυτή εδώ.\n\nΠολλοί περνάμε τη μισή μέρα στο παρελθόν (μετάνιωμα) και την άλλη μισή στο μέλλον (άγχος). Ο Μάρκος μάς φέρνει πίσω στο μόνο μέρος όπου υπάρχει η ζωή: στο τώρα.","life":"Ένας παππούς παίζει με την εγγονή του, αλλά ο νους του τρέχει στους λογαριασμούς. Η μικρή τον τραβά από το μανίκι: «Παππού, δεν με βλέπεις!» Εκείνος αφήνει τις σκέψεις και γελά μαζί της. Αργότερα θυμάται εκείνο το απόγευμα ως ένα από τα πιο όμορφα του χρόνου.","am":"Πριν πιάσετε οτιδήποτε, νιώστε για 30 δευτερόλεπτα: τα πόδια στο πάτωμα, την ανάσα, τους ήχους γύρω σας. «Είμαι εδώ.»","ex":"Διαλέξτε σήμερα μια συνηθισμένη δραστηριότητα (το πλύσιμο των πιάτων, το περπάτημα, ένα φαγητό) και κάντε την με όλη σας την προσοχή, χωρίς κινητό και χωρίς να «φεύγει» ο νους. Όταν φύγει, φέρτε τον πίσω απαλά.","pm":"Πόση από τη σημερινή μέρα την έζησα πραγματικά, εδώ και τώρα;"},"en":{"t":"We live only this moment","tr":"Each of us lives only this present moment, which passes like lightning. All the rest has either been lived already or is unknown.","simple":"Yesterday no longer exists. Tomorrow has not come yet. The only moment in which we can truly live, love or fix something is this one.\n\nMany of us spend half the day in the past (regret) and the other half in the future (anxiety). Marcus brings us back to the only place where life exists: now.","life":"A grandfather plays with his granddaughter, but his mind runs to the bills. The little girl tugs his sleeve: “Grandpa, you’re not looking at me!” He lets go of his thoughts and laughs with her. Later he remembers that afternoon as one of the loveliest of the year.","am":"Before reaching for anything, feel for 30 seconds: your feet on the floor, your breath, the sounds around you. “I am here.”","ex":"Choose an ordinary activity today (washing dishes, walking, a meal) and do it with full attention, without a phone and without letting the mind “drift”. When it drifts, bring it back gently.","pm":"How much of today did I truly live, here and now?"}},{"tag":["🕊️ Χωρίς εκδίκηση","🕊️ No revenge"],"grc":"Ἄριστος τρόπος τοῦ ἀμύνεσθαι τὸ μὴ ἐξομοιοῦσθαι.","src":["Τὰ εἰς ἑαυτόν ΣΤ΄ 6","Meditations VI 6"],"el":{"t":"Η καλύτερη εκδίκηση","tr":"Ο καλύτερος τρόπος να αμυνθείς είναι να μη γίνεις σαν αυτόν που σε έβλαψε.","simple":"Όταν κάποιος μας φέρεται άσχημα, η πρώτη μας τάση είναι να του κάνουμε το ίδιο. Τότε όμως αυτός κέρδισε δύο φορές: μας πλήγωσε και μας έκανε σαν εκείνον.\n\nΟ Μάρκος λέει: η πραγματική νίκη είναι να μείνεις ο εαυτός σου. Δεν σημαίνει ότι δεν προστατεύεσαι ή ότι δέχεσαι την αδικία. Σημαίνει ότι δεν αφήνεις την κακία του άλλου να αλλάξει τον χαρακτήρα σου.","life":"Μια νέα δέχεται άσχημα σχόλια στο διαδίκτυο. Θέλει να απαντήσει με ακόμη χειρότερα. Αντί γι’ αυτό, γράφει ήρεμα μία φορά «Λυπάμαι που το βλέπεις έτσι», μπλοκάρει όποιον συνεχίζει να βρίζει, και συνεχίζει να ανεβάζει τα όμορφα έργα της.","am":"Πείτε: «Ό,τι κι αν μου κάνουν σήμερα, θα μείνω ο εαυτός μου.»","ex":"Θυμηθείτε κάποιον που σας πλήγωσε και θέλετε να τον «εκδικηθείτε». Γράψτε: «Τι θα έκανε ένας καλός, ήρεμος άνθρωπος στη θέση μου;» Αν η αδικία συνεχίζεται, ζητήστε βοήθεια ή προστατέψτε τον εαυτό σας — χωρίς να γίνετε σαν εκείνον.","pm":"Πού σήμερα δεν αντέγραψα την κακία κάποιου άλλου;"},"en":{"t":"The best revenge","tr":"The best way to defend yourself is not to become like the one who wronged you.","simple":"When someone treats us badly, our first urge is to do the same to them. But then they have won twice: they hurt us and made us like them.\n\nMarcus says: the real victory is to remain yourself. It does not mean failing to protect yourself or accepting injustice. It means not letting another’s malice change your character.","life":"A young woman receives nasty comments online. She wants to answer with worse. Instead, she writes calmly once “I’m sorry you see it that way”, blocks anyone who keeps insulting, and goes on posting her lovely work.","am":"Say: “Whatever is done to me today, I will remain myself.”","ex":"Recall someone who hurt you whom you want to “get back at”. Write: “What would a good, calm person do in my place?” If the injustice continues, seek help or protect yourself — without becoming like them.","pm":"Where today did I refuse to copy someone else’s unkindness?"}},{"tag":["🙏 Ευγνωμοσύνη","🙏 Gratitude"],"grc":"Παρὰ τοῦ πάππου Οὐήρου τὸ καλόηθες καὶ ἀόργητον.","src":["Τὰ εἰς ἑαυτόν Α΄ 1","Meditations I 1"],"el":{"t":"Τι έμαθα από τον καθένα","tr":"Από τον παππού μου τον Βήρο έμαθα την καλοσύνη και το να μη θυμώνω.","simple":"Ολόκληρο το πρώτο βιβλίο του ο Μάρκος το αφιερώνει σε έναν κατάλογο ευγνωμοσύνης: από τον παππού έμαθε την καλοσύνη, από τη μητέρα του την απλότητα, από τον δάσκαλό του την υπομονή, από έναν φίλο τη συγχώρεση... Σε κάθε πρόσωπο της ζωής του βρήκε ένα δώρο.\n\nΗ ευγνωμοσύνη μάς θυμίζει ότι δεν φτιάξαμε μόνοι τον εαυτό μας. Και μας κάνει πιο χαρούμενους, γιατί κοιτάμε αυτό που έχουμε και όχι αυτό που μας λείπει.","life":"Ένας πενηντάρης, μετά από μια δύσκολη χρονιά, γράφει τα ονόματα δέκα ανθρώπων που τον βοήθησαν στη ζωή — από τη δασκάλα του δημοτικού μέχρι έναν παλιό συνάδελφο. Στέλνει μήνυμα σε τρεις. Ένας του απαντά: «Δεν ξέρεις τι σημαίνει αυτό για μένα σήμερα.»","am":"Σκεφτείτε ένα πρόσωπο της ζωής σας και πείτε: «Από εσένα έμαθα…»","ex":"Γράψτε τον δικό σας «κατάλογο του Μάρκου»: πέντε ανθρώπους και τι έμαθε ο καθένας σας (ακόμη κι ένας δύσκολος άνθρωπος μπορεί να σας έμαθε υπομονή). Στείλτε σε έναν από αυτούς ένα μήνυμα ευχαριστίας.","pm":"Ποιον ευχαρίστησα σήμερα — δυνατά ή μέσα μου;"},"en":{"t":"What I learned from each","tr":"From my grandfather Verus I learned kindness and freedom from anger.","simple":"Marcus devotes the whole first book to a list of gratitude: from his grandfather he learned kindness, from his mother simplicity, from his teacher patience, from a friend forgiveness... In every person in his life he found a gift.\n\nGratitude reminds us that we did not make ourselves alone. And it makes us happier, because we look at what we have and not at what we lack.","life":"A man of fifty, after a hard year, writes the names of ten people who helped him in life — from his primary school teacher to an old colleague. He messages three of them. One replies: “You don’t know what this means to me today.”","am":"Think of someone in your life and say: “From you I learned…”","ex":"Write your own “Marcus list”: five people and what each taught you (even a difficult person may have taught you patience). Send one of them a thank-you message.","pm":"Whom did I thank today — aloud or inwardly?"}}]},
{"id":"bu","emoji":"☸️","cls":"c-bu","origLbl":["Το αρχαίο κείμενο στα πάλι:","The original Pali:"],"name":["Βούδας","The Buddha"],"withName":["με τον Βούδα","with the Buddha"],"years":["Περίπου 5ος αι. π.Χ. · Ο Αφυπνισμένος","c. 5th century BC · The Awakened One"],"bio":["<p>Ο <b>Σιντάρτα Γκαουτάμα</b> γεννήθηκε πρίγκιπας στη βόρεια Ινδία (στο σημερινό Νεπάλ). Μεγάλωσε μέσα στη χλιδή, προστατευμένος από κάθε θέαμα πόνου. Όταν όμως βγήκε από το παλάτι και είδε έναν γέρο, έναν άρρωστο και έναν νεκρό, συγκλονίστηκε: γιατί υποφέρει ο άνθρωπος;</p><p>Άφησε τα πάντα και έψαξε χρόνια την απάντηση. Κάτω από ένα δέντρο, μετά από βαθύ διαλογισμό, λένε ότι «αφυπνίστηκε» — γι’ αυτό τον είπαν <b>Βούδα</b>, «τον Αφυπνισμένο». Δίδαξε για 45 χρόνια έναν «μέσο δρόμο»: ούτε χλιδή ούτε σκληρή στέρηση, αλλά προσοχή, καλοσύνη και σοφία.</p><p>Τα λόγια του μαζεύτηκαν στη <b>Ντχαμαπάντα</b>, «Ο δρόμος της αλήθειας», ένα μικρό βιβλίο με 423 στίχους στην αρχαία ινδική γλώσσα πάλι. Εδώ δεν μιλάμε για θρησκεία, αλλά για πρακτική σοφία που βοηθά κάθε άνθρωπο.</p>","<p><b>Siddhartha Gautama</b> was born a prince in northern India (in today’s Nepal). He grew up in luxury, shielded from every sight of suffering. But when he left the palace and saw an old man, a sick man and a dead man, he was shaken: why do people suffer?</p><p>He left everything and searched for years for the answer. Beneath a tree, after deep meditation, it is said he “awoke” — so he was called the <b>Buddha</b>, “the Awakened One”. For 45 years he taught a “middle way”: neither luxury nor harsh deprivation, but attention, kindness and wisdom.</p><p>His words were gathered in the <b>Dhammapada</b>, “The Path of Truth”, a small book of 423 verses in the ancient Indian language Pali. Here we speak not of religion but of practical wisdom that helps anyone.</p>"],"cheer":["Η Ντχαμαπάντα λέει ότι σταγόνα-σταγόνα γεμίζει η στάμνα. Κάθε μέρα που ασκείστε είναι μια σταγόνα.","The Dhammapada says the jar fills drop by drop. Each day of practice is one drop."],"fare":{"grc":"Tumhehi kiccaṃ ātappaṃ, akkhātāro tathāgatā.","src":["Ντχαμαπάντα 276","Dhammapada 276"],"tr":["Εσείς οι ίδιοι πρέπει να κάνετε την προσπάθεια. Οι σοφοί μόνο δείχνουν τον δρόμο.","You yourselves must make the effort. The wise only point the way."]},"days":[{"tag":["🧠 Ο νους","🧠 The mind"],"grc":"Manopubbaṅgamā dhammā, manoseṭṭhā manomayā; manasā ce paduṭṭhena, bhāsati vā karoti vā, tato naṃ dukkhamanveti, cakkaṃva vahato padaṃ.","src":["Ντχαμαπάντα 1","Dhammapada 1"],"el":{"t":"Όλα ξεκινούν από τον νου","tr":"Ο νους προηγείται απ’ όλα. Ο νους είναι ο αρχηγός· όλα είναι φτιαγμένα από τον νου. Αν μιλάς ή πράττεις με μολυσμένο νου, ο πόνος σε ακολουθεί, όπως η ρόδα ακολουθεί το πόδι του βοδιού που τραβά το κάρο.","simple":"Αυτός είναι ο πρώτος στίχος του βιβλίου, και ο πιο σημαντικός. Πριν από κάθε λέξη και κάθε πράξη, υπάρχει μια σκέψη. Αν η σκέψη είναι θυμωμένη ή ζηλιάρα, και τα λόγια και οι πράξεις μας θα φέρουν πόνο — σε μας και στους άλλους.\n\nΟ επόμενος στίχος λέει το αντίθετο: αν ο νους είναι καθαρός, η χαρά σε ακολουθεί «σαν σκιά που δεν φεύγει ποτέ».","life":"Ένας πατέρας γυρίζει κουρασμένος και νευριασμένος από τη δουλειά. Πριν μπει στο σπίτι, κάθεται ένα λεπτό στο αυτοκίνητο και αφήνει τη μέρα να «κατακάτσει». Μπαίνει με χαμόγελο. Το βράδυ περνά ήρεμα, χωρίς φωνές.","am":"Πριν σηκωθείτε, ρωτήστε: «Με τι νου ξεκινώ τη μέρα μου;» Αν είναι βαρύς, πάρτε τρεις αργές ανάσες.","ex":"Πριν από τρεις σημαντικές κουβέντες ή πράξεις σήμερα, σταθείτε για μια ανάσα και ρωτήστε: «Με τι νου το κάνω αυτό;» Αν ο νους είναι θυμωμένος, περιμένετε λίγο.","pm":"Ποια σκέψη μου σήμερα έφερε πόνο και ποια έφερε χαρά;"},"en":{"t":"Everything begins in the mind","tr":"Mind comes before all things. Mind is chief; all things are made by mind. If one speaks or acts with a corrupted mind, suffering follows, as the wheel follows the foot of the ox that draws the cart.","simple":"This is the first verse of the book, and the most important. Before every word and act there is a thought. If the thought is angry or jealous, our words and acts will bring suffering — to us and to others.\n\nThe next verse says the opposite: if the mind is pure, happiness follows you “like a shadow that never leaves”.","life":"A father comes home tired and irritated from work. Before going in, he sits one minute in the car and lets the day “settle”. He walks in smiling. The evening passes peacefully, without shouting.","am":"Before getting up, ask: “With what mind am I starting my day?” If it is heavy, take three slow breaths.","ex":"Before three important conversations or actions today, pause for one breath and ask: “With what mind am I doing this?” If the mind is angry, wait a little.","pm":"Which thought of mine today brought pain, and which brought joy?"}},{"tag":["💗 Χωρίς μίσος","💗 Beyond hatred"],"grc":"Na hi verena verāni, sammantīdha kudācanaṃ; averena ca sammanti, esa dhammo sanantano.","src":["Ντχαμαπάντα 5","Dhammapada 5"],"el":{"t":"Το μίσος δεν σβήνει με μίσος","tr":"Ποτέ σε αυτόν τον κόσμο το μίσος δεν σβήνει με μίσος. Μόνο με τη μη-εχθρότητα σβήνει. Αυτός είναι ο αιώνιος νόμος.","simple":"Αν ρίξεις λάδι στη φωτιά, η φωτιά δυναμώνει. Αν απαντήσεις στο μίσος με μίσος, ο καβγάς δεν τελειώνει ποτέ — περνά από γενιά σε γενιά. Το μόνο που σβήνει τη φωτιά είναι το νερό: η καλοσύνη, η συγχώρεση, ή τουλάχιστον το να μην ανταποδώσεις.\n\nΑυτό δεν σημαίνει ότι δεχόμαστε την αδικία. Σημαίνει ότι δεν αφήνουμε το μίσος να ζήσει μέσα μας.","life":"Δύο οικογένειες σε ένα χωριό δεν μιλιούνται εδώ και τριάντα χρόνια για ένα χωράφι. Όταν πεθαίνει ο γέρος της μιας, ο γιος της άλλης πηγαίνει στην κηδεία και σφίγγει το χέρι της χήρας. Τα παιδιά τους σήμερα είναι φίλοι.","am":"Πείτε: «Σήμερα δεν θα ρίξω λάδι σε καμία φωτιά.»","ex":"Σκεφτείτε κάποιον για τον οποίο νιώθετε πικρία. Γράψτε τρία πράγματα: τι σας έκανε, τι σας κοστίζει που κρατάτε την πικρία, και μια μικρή πράξη ειρήνης (ακόμη κι αν είναι απλώς να μην τον κακολογήσετε σήμερα). Αν σας απειλεί, προστατέψτε τον εαυτό σας και ζητήστε βοήθεια.","pm":"Πού σήμερα έριξα νερό αντί για λάδι;"},"en":{"t":"Hatred never ends by hatred","tr":"Never in this world is hatred calmed by hatred. By non-hatred alone is it calmed. This is the eternal law.","simple":"Pour oil on a fire and the fire grows. Answer hatred with hatred, and the quarrel never ends — it passes from generation to generation. Only water puts out fire: kindness, forgiveness, or at least not paying back.\n\nThis does not mean accepting injustice. It means not letting hatred live inside us.","life":"Two families in a village have not spoken for thirty years over a field. When the old man of one dies, the son of the other goes to the funeral and shakes the widow’s hand. Their children today are friends.","am":"Say: “Today I will not pour oil on any fire.”","ex":"Think of someone you feel bitter towards. Write three things: what they did, what it costs you to keep the bitterness, and one small act of peace (even if it is just not speaking ill of them today). If they threaten you, protect yourself and seek help.","pm":"Where today did I pour water instead of oil?"}},{"tag":["🌸 Καλοσύνη","🌸 Kindness"],"grc":"Akkodhena jine kodhaṃ, asādhuṃ sādhunā jine; jine kadariyaṃ dānena, saccenālikavādinaṃ.","src":["Ντχαμαπάντα 223","Dhammapada 223"],"el":{"t":"Νίκα τον θυμό με ηρεμία","tr":"Νίκα τον θυμό με την ηρεμία, το κακό με το καλό, την τσιγκουνιά με τη γενναιοδωρία, και τον ψεύτη με την αλήθεια.","simple":"Ο στίχος αυτός είναι σαν μια μικρή «συνταγή» για κάθε δύσκολη συνάντηση. Όταν κάποιος θυμώνει, η δική μας ηρεμία τον αφοπλίζει. Όταν κάποιος είναι τσιγκούνης, η γενναιοδωρία μας τον ξαφνιάζει. Όταν κάποιος λέει ψέματα, η αλήθεια μας είναι πιο δυνατή.\n\nΝίκη εδώ δεν σημαίνει να ταπεινώσουμε τον άλλον, αλλά να μην αφήσουμε το αρνητικό να μας κυριέψει.","life":"Ένας πελάτης φωνάζει σε μια υπάλληλο για ένα λάθος που δεν έκανε εκείνη. Εκείνη απαντά ήρεμα: «Καταλαβαίνω ότι είστε αναστατωμένος· ας το λύσουμε μαζί.» Ο πελάτης χαμηλώνει τη φωνή. Στο τέλος ζητά συγγνώμη.","am":"Διαλέξτε ποια από τις τέσσερις «νίκες» χρειάζεστε περισσότερο σήμερα: ηρεμία, καλοσύνη, γενναιοδωρία ή αλήθεια.","ex":"Κάντε σήμερα μία πράξη γενναιοδωρίας χωρίς να περιμένετε τίποτα: κεράστε έναν καφέ, αφήστε κάποιον να περάσει πρώτος, δώστε κάτι που δεν χρειάζεστε. Αν κάποιος σας θυμώσει, απαντήστε με χαμηλότερη φωνή από τη δική του.","pm":"Ποια «νίκη» κέρδισα σήμερα;"},"en":{"t":"Conquer anger with calm","tr":"Conquer anger with calm, evil with good, meanness with generosity, and the liar with truth.","simple":"This verse is like a little “recipe” for any difficult encounter. When someone is angry, our calm disarms them. When someone is mean, our generosity surprises them. When someone lies, our truth is stronger.\n\nVictory here does not mean humiliating the other, but not letting the negative take hold of us.","life":"A customer shouts at a clerk over a mistake she did not make. She replies calmly: “I understand you’re upset; let’s solve it together.” The customer lowers his voice. In the end he apologises.","am":"Choose which of the four “victories” you need most today: calm, goodness, generosity or truth.","ex":"Do one act of generosity today expecting nothing back: buy someone a coffee, let someone go first, give away something you don’t need. If someone is angry with you, reply in a lower voice than theirs.","pm":"Which “victory” did I win today?"}},{"tag":["🪨 Έπαινος και κατηγορία","🪨 Praise and blame"],"grc":"Selo yathā ekaghano, vātena na samīrati; evaṃ nindāpasaṃsāsu, na samiñjanti paṇḍitā.","src":["Ντχαμαπάντα 81","Dhammapada 81"],"el":{"t":"Σαν βράχος στον άνεμο","tr":"Όπως ένας συμπαγής βράχος δεν κουνιέται από τον άνεμο, έτσι και οι σοφοί δεν ταράζονται ούτε από την κατηγορία ούτε από τον έπαινο.","simple":"Σήμερα ζούμε με «likes» και σχόλια. Ένα καλό σχόλιο μάς ανεβάζει στα ύψη, ένα κακό μάς ρίχνει στα τάρταρα. Έτσι η διάθεσή μας βρίσκεται στα χέρια αγνώστων.\n\nΟ Βούδας λέει: ο έπαινος και η κατηγορία είναι άνεμος. Έρχεται και φεύγει. Ο σοφός ακούει — μπορεί να μάθει κάτι — αλλά δεν αφήνει τον άνεμο να τον ξεριζώσει.","life":"Ένας νέος τραγουδιστής ανεβάζει ένα τραγούδι. Παίρνει εκατό καλά σχόλια και ένα πολύ άσχημο. Όλη τη νύχτα σκέφτεται μόνο το άσχημο. Το πρωί λέει: «Ένας άνεμος ήταν.» Γράφει το επόμενο τραγούδι.","am":"Πείτε: «Ο έπαινος και η κατηγορία είναι άνεμος. Εγώ είμαι ο βράχος.»","ex":"Σήμερα, πριν κοιτάξετε likes ή σχόλια, ρωτήστε: «Τι πιστεύω εγώ για αυτό που έκανα;» Αν δεχτείτε έπαινο ή κριτική, πείτε απλώς «ευχαριστώ» και κρατήστε μόνο ό,τι σας βοηθά να γίνετε καλύτεροι.","pm":"Πόσο με κούνησε σήμερα ο άνεμος των άλλων;"},"en":{"t":"Like a rock in the wind","tr":"As a solid rock is not shaken by the wind, so the wise are not moved by blame or praise.","simple":"Today we live by “likes” and comments. A good comment lifts us sky-high; a bad one throws us down. So our mood lies in the hands of strangers.\n\nThe Buddha says: praise and blame are wind. They come and go. The wise listen — they may learn something — but do not let the wind uproot them.","life":"A young singer posts a song. He gets a hundred kind comments and one very nasty one. All night he thinks only of the nasty one. In the morning he says: “It was just a wind.” He writes the next song.","am":"Say: “Praise and blame are wind. I am the rock.”","ex":"Today, before checking likes or comments, ask: “What do I think of what I did?” If you receive praise or criticism, simply say “thank you” and keep only what helps you grow.","pm":"How much did others’ wind shake me today?"}},{"tag":["💬 Λόγια με νόημα","💬 Words that matter"],"grc":"Sahassamapi ce vācā, anatthapadasaṃhitā; ekaṃ atthapadaṃ seyyo, yaṃ sutvā upasammati.","src":["Ντχαμαπάντα 100","Dhammapada 100"],"el":{"t":"Μία λέξη που φέρνει ειρήνη","tr":"Καλύτερη από χίλια λόγια χωρίς νόημα είναι μία λέξη με νόημα, που όταν την ακούσεις ηρεμείς.","simple":"Κάθε μέρα ακούμε και διαβάζουμε χιλιάδες λέξεις: ειδήσεις, διαφημίσεις, μηνύματα, βίντεο. Πόσες από αυτές μάς αφήνουν πιο ήρεμους και πιο σοφούς; Ο Βούδας λέει: μία καλή λέξη αξίζει περισσότερο από χίλιες άδειες.\n\nΑυτό ισχύει και για όσα λέμε εμείς. Δεν χρειάζεται να μιλάμε πολύ. Χρειάζεται να λέμε λόγια που βοηθούν.","life":"Μια φοιτήτρια περνά δύο ώρες κάθε βράδυ βλέποντας μικρά βίντεο και πέφτει για ύπνο ανήσυχη. Αντικαθιστά τη μισή ώρα με ένα κεφάλαιο από ένα καλό βιβλίο. Κοιμάται καλύτερα και ξυπνά με μια φράση στο μυαλό που της δίνει κουράγιο.","am":"Πριν ανοίξετε ειδήσεις ή social media, διαβάστε μία φράση σοφίας — ίσως το σημερινό λόγιο.","ex":"Σήμερα, πριν πείτε κάτι σε μια συζήτηση, ρωτήστε μέσα σας: «Είναι αληθινό; Είναι χρήσιμο; Είναι καλό;» Και μειώστε για μία μέρα κατά το ήμισυ τον χρόνο σας σε άσκοπο «σκρολάρισμα».","pm":"Ποια μία λέξη ή φράση με ηρέμησε σήμερα;"},"en":{"t":"One word that brings peace","tr":"Better than a thousand meaningless words is one meaningful word, which brings peace to the one who hears it.","simple":"Each day we hear and read thousands of words: news, adverts, messages, videos. How many leave us calmer and wiser? The Buddha says: one good word is worth more than a thousand empty ones.\n\nThe same holds for what we say. We need not talk a lot. We need to say words that help.","life":"A student spends two hours every night watching short videos and goes to sleep restless. She replaces half an hour with a chapter of a good book. She sleeps better and wakes with a phrase in her mind that gives her courage.","am":"Before opening news or social media, read one sentence of wisdom — perhaps today’s saying.","ex":"Today, before speaking in a conversation, ask inwardly: “Is it true? Is it useful? Is it kind?” And for one day cut your time on pointless scrolling by half.","pm":"Which one word or phrase calmed me today?"}},{"tag":["🍃 Υγεία και αρκετό","🍃 Health and enough"],"grc":"Ārogyaparamā lābhā, santuṭṭhiparamaṃ dhanaṃ; vissāsaparamā ñātī, nibbānaparamaṃ sukhaṃ.","src":["Ντχαμαπάντα 204","Dhammapada 204"],"el":{"t":"Ο μεγαλύτερος πλούτος","tr":"Η υγεία είναι το μεγαλύτερο κέρδος. Το να είσαι ευχαριστημένος είναι ο μεγαλύτερος πλούτος. Ο άνθρωπος που εμπιστεύεσαι είναι ο καλύτερος συγγενής. Και η εσωτερική γαλήνη είναι η μεγαλύτερη ευτυχία.","simple":"Τέσσερις θησαυροί σε έναν στίχο. Κανένας τους δεν αγοράζεται στο κατάστημα. Η υγεία χτίζεται με φροντίδα. Η ικανοποίηση με την ευγνωμοσύνη για ό,τι έχουμε. Η εμπιστοσύνη με την ειλικρίνεια. Και η γαλήνη με την εσωτερική άσκηση.\n\nΠολλοί κυνηγούν χρήματα και θυσιάζουν την υγεία τους· μετά ξοδεύουν τα χρήματα για να ξαναβρούν την υγεία.","life":"Ένας επιχειρηματίας δουλεύει 14 ώρες τη μέρα για να «ζήσει καλά αργότερα». Ένα πρωί παθαίνει κρίση άγχους. Αρχίζει να σταματά στις έξι, να περπατά με τη γυναίκα του και να τρώει με τα παιδιά του. Τα κέρδη μειώνονται λίγο· η ζωή του γίνεται πλουσιότερη.","am":"Πείτε: «Είμαι πλούσιος σε…» και ονομάστε τρία πράγματα που δεν αγοράζονται.","ex":"Κάντε σήμερα κάτι για κάθε θησαυρό: για την υγεία (ένας περίπατος ή ένα φρούτο), για την ικανοποίηση (γράψτε τρία «ευχαριστώ»), για την εμπιστοσύνη (κρατήστε μια υπόσχεση), για τη γαλήνη (πέντε λεπτά σιωπής).","pm":"Ποιον από τους τέσσερις θησαυρούς φρόντισα σήμερα περισσότερο;"},"en":{"t":"The greatest wealth","tr":"Health is the greatest gain. Contentment is the greatest wealth. A trusted friend is the best kinsman. And inner peace is the highest happiness.","simple":"Four treasures in one verse. None of them can be bought in a shop. Health is built with care. Contentment with gratitude for what we have. Trust with honesty. And peace with inner practice.\n\nMany chase money and sacrifice their health; then they spend the money trying to get their health back.","life":"A businessman works 14 hours a day to “live well later”. One morning he has an anxiety attack. He starts stopping at six, walking with his wife and eating with his children. Profits fall a little; his life becomes richer.","am":"Say: “I am rich in…” and name three things that cannot be bought.","ex":"Do something today for each treasure: for health (a walk or a piece of fruit), for contentment (write three “thank you”s), for trust (keep a promise), for peace (five minutes of silence).","pm":"Which of the four treasures did I care for most today?"}},{"tag":["🧘 Ο εαυτός μας στήριγμα","🧘 Our own refuge"],"grc":"Attā hi attano nātho, ko hi nātho paro siyā; attanā hi sudantena, nāthaṃ labhati dullabhaṃ.","src":["Ντχαμαπάντα 160","Dhammapada 160"],"el":{"t":"Εσύ είσαι το στήριγμα του εαυτού σου","tr":"Ο καθένας είναι το στήριγμα του εαυτού του· ποιος άλλος θα μπορούσε να είναι στήριγμα; Με έναν εαυτό καλά εκπαιδευμένο, βρίσκει κανείς ένα στήριγμα που σπάνια βρίσκεται.","simple":"Πολλές φορές περιμένουμε κάποιος άλλος να μας σώσει: ένας σύντροφος, ένα θαύμα, μια καλύτερη δουλειά. Ο Βούδας λέει: οι άλλοι μπορούν να βοηθήσουν — και καλό είναι να ζητάμε βοήθεια — αλλά κανείς δεν μπορεί να περπατήσει τον δρόμο για εμάς.\n\nΌταν εκπαιδεύουμε τον νου μας, με υπομονή, γινόμαστε για τον εαυτό μας ένας φίλος που δεν μας εγκαταλείπει ποτέ.","life":"Μια γυναίκα περίμενε χρόνια να αλλάξει ο άντρας της για να είναι ευτυχισμένη. Μια μέρα αρχίζει να φροντίζει τον εαυτό της: μαθήματα χορού, φίλες, ένα βιβλίο κάθε μήνα. Νιώθει πιο δυνατή — και, απρόσμενα, η σχέση τους βελτιώνεται κι αυτή.","am":"Βάλτε το χέρι στην καρδιά και πείτε: «Θα είμαι σήμερα καλός φίλος για τον εαυτό μου.»","ex":"Γράψτε: «Τι περιμένω από άλλους να κάνουν για μένα, που θα μπορούσα να ξεκινήσω μόνος μου;» Κάντε σήμερα ένα μικρό βήμα. Και αν χρειάζεστε βοήθεια, ζητήστε την — αυτό είναι επίσης φροντίδα του εαυτού.","pm":"Πώς στάθηκα σήμερα δίπλα στον εαυτό μου;"},"en":{"t":"You are your own refuge","tr":"One is one’s own refuge; who else could be the refuge? With a self well trained, one finds a refuge that is hard to find.","simple":"We often wait for someone else to save us: a partner, a miracle, a better job. The Buddha says: others can help — and it is good to ask for help — but no one can walk the path for us.\n\nWhen we train our mind with patience, we become for ourselves a friend who never abandons us.","life":"A woman waited for years for her husband to change so she could be happy. One day she starts caring for herself: dance classes, friends, a book every month. She feels stronger — and, unexpectedly, their relationship improves too.","am":"Put your hand on your heart and say: “Today I will be a good friend to myself.”","ex":"Write: “What am I waiting for others to do for me that I could begin myself?” Take one small step today. And if you need help, ask for it — that too is caring for yourself.","pm":"How did I stand by myself today?"}}],"who":["Ποιος ήταν ο Βούδας","Who was the Buddha"]},
{"id":"la","emoji":"☯️","cls":"c-la","origLbl":["Το αρχαίο κινεζικό κείμενο:","The original Chinese:"],"name":["Λάο Τσε","Lao Tzu"],"withName":["με τον Λάο Τσε","with Lao Tzu"],"years":["Περίπου 6ος αι. π.Χ. · Ο σοφός του νερού","c. 6th century BC · The sage of water"],"bio":["<p>Ο Λάο Τσε σημαίνει «ο Γέρος Δάσκαλος». Σύμφωνα με την παράδοση, ήταν φύλακας της βιβλιοθήκης στην αυλή των αυτοκρατόρων της Κίνας. Όταν γέρασε και κουράστηκε από τη διαφθορά, έφυγε καβάλα σε ένα βόδι προς τα δυτικά βουνά.</p><p>Στο τελευταίο πέρασμα των συνόρων, ο φύλακας τον παρακάλεσε: «Πριν φύγεις, γράψε μας τη σοφία σου.» Ο Λάο Τσε έγραψε ένα μικρό βιβλίο με 81 σύντομα κεφάλαια, το <b>Τάο Τε Τσινγκ</b> — «Το βιβλίο του Δρόμου και της Αρετής» — και χάθηκε για πάντα.</p><p>Είναι από τα βιβλία που έχουν μεταφραστεί περισσότερο στον κόσμο. Διδάσκει απλότητα, ηρεμία, ταπεινότητα και την ήπια δύναμη του νερού: να μην πιέζουμε τη ζωή, αλλά να ρέουμε μαζί της.</p>","<p>Lao Tzu means “the Old Master”. According to tradition, he was keeper of the library at the court of the Chinese emperors. Grown old and weary of corruption, he left riding an ox towards the western mountains.</p><p>At the last border pass, the guard begged him: “Before you go, write down your wisdom for us.” Lao Tzu wrote a small book of 81 short chapters, the <b>Tao Te Ching</b> — “The Book of the Way and of Virtue” — and vanished forever.</p><p>It is one of the most translated books in the world. It teaches simplicity, calm, humility and the gentle strength of water: not to force life, but to flow with it.</p>"],"cheer":["Ο Λάο Τσε έλεγε ότι το ψηλότερο δέντρο φύτρωσε από έναν μικρό σπόρο. Σήμερα φυτέψατε έναν.","Lao Tzu said the tallest tree grew from a tiny seed. Today you planted one."],"fare":{"grc":"圖難於其易，為大於其細。天下難事，必作於易；天下大事，必作於細。","src":["Τάο Τε Τσινγκ 63","Tao Te Ching 63"],"tr":["Αντιμετώπισε το δύσκολο όσο είναι ακόμη εύκολο· κάνε το μεγάλο ξεκινώντας από το μικρό. Τα δύσκολα του κόσμου γίνονται πάντα από τα εύκολα· τα μεγάλα του κόσμου γίνονται πάντα από τα μικρά.","Tackle the difficult while it is still easy; do the great by starting with the small. The world’s hard things are always done through easy ones; the world’s great things are always done through small ones."]},"days":[{"tag":["👣 Το πρώτο βήμα","👣 The first step"],"grc":"千里之行，始於足下。","src":["Τάο Τε Τσινγκ 64","Tao Te Ching 64"],"el":{"t":"Το ταξίδι των χιλίων μιλίων","tr":"Ένα ταξίδι χιλίων μιλίων ξεκινά από το σημείο κάτω από τα πόδια σου.","simple":"Πολλές φορές δεν ξεκινάμε, γιατί ο στόχος φαίνεται τεράστιος: να χάσω είκοσι κιλά, να γράψω ένα βιβλίο, να μάθω μια γλώσσα. Ο Λάο Τσε μάς θυμίζει ότι κάθε μεγάλο ταξίδι αποτελείται από μικρά βήματα. Και το μόνο βήμα που μπορούμε να κάνουμε είναι αυτό που βρίσκεται κάτω από τα πόδια μας, τώρα.\n\nΔεν χρειάζεται να βλέπουμε ολόκληρο τον δρόμο. Αρκεί να βλέπουμε το επόμενο βήμα.","life":"Μια γυναίκα 60 ετών θέλει να μάθει αγγλικά για να μιλά με τα εγγόνια της στο εξωτερικό. Της φαίνεται βουνό. Αποφασίζει: πέντε λέξεις τη μέρα. Σε έναν χρόνο ξέρει πάνω από χίλιες και κάνει την πρώτη της βιντεοκλήση στα αγγλικά.","am":"Πείτε: «Σήμερα δεν χρειάζεται να φτάσω. Χρειάζεται μόνο να κάνω ένα βήμα.»","ex":"Γράψτε ένα μεγάλο όνειρο ή στόχο. Χωρίστε τον σε πολύ μικρά βήματα, τόσο μικρά που να φαίνονται σχεδόν αστεία. Κάντε το πρώτο σήμερα.","pm":"Ποιο μικρό βήμα έκανα σήμερα σε ένα μεγάλο ταξίδι;"},"en":{"t":"The journey of a thousand miles","tr":"A journey of a thousand miles begins beneath your feet.","simple":"Often we do not start because the goal seems huge: to lose twenty kilos, write a book, learn a language. Lao Tzu reminds us that every great journey is made of small steps. And the only step we can take is the one beneath our feet, now.\n\nWe need not see the whole road. It is enough to see the next step.","life":"A 60-year-old woman wants to learn English to talk with her grandchildren abroad. It looks like a mountain. She decides: five words a day. In a year she knows over a thousand and makes her first video call in English.","am":"Say: “Today I don’t need to arrive. I only need to take one step.”","ex":"Write a big dream or goal. Break it into very small steps, so small they seem almost funny. Take the first one today.","pm":"What small step did I take today on a long journey?"}},{"tag":["💧 Σαν το νερό","💧 Like water"],"grc":"上善若水。水善利萬物而不爭，處眾人之所惡，故幾於道。","src":["Τάο Τε Τσινγκ 8","Tao Te Ching 8"],"el":{"t":"Το ανώτερο καλό είναι σαν το νερό","tr":"Το ανώτερο καλό είναι σαν το νερό. Το νερό ωφελεί όλα τα πλάσματα χωρίς να μαλώνει, και πηγαίνει στα χαμηλά μέρη που οι άνθρωποι περιφρονούν. Γι’ αυτό βρίσκεται κοντά στον Δρόμο.","simple":"Το νερό δίνει ζωή σε όλα, χωρίς να ζητά ευχαριστώ. Δεν σπρώχνει, δεν φωνάζει· βρίσκει τον δρόμο του γύρω από τα εμπόδια. Και όμως, με τον καιρό, σκάβει ακόμη και τους βράχους.\n\nΟ Λάο Τσε μάς προτείνει να μοιάσουμε στο νερό: να βοηθάμε χωρίς να το διαλαλούμε, να είμαστε ταπεινοί, να προσαρμοζόμαστε στις δυσκολίες αντί να σπάμε.","life":"Σε μια ομάδα εργασίας, όλοι θέλουν να φαίνονται. Μια συνάδελφος, ήσυχα, βοηθά τους νεότερους, φτιάχνει τον καφέ, λύνει τα μικρά προβλήματα. Όταν εκείνη λείπει μια εβδομάδα, όλοι καταλαβαίνουν ότι αυτή κρατούσε την ομάδα ενωμένη.","am":"Πιείτε ένα ποτήρι νερό αργά και πείτε: «Σήμερα θα είμαι σαν το νερό: ήπιος, χρήσιμος, ευέλικτος.»","ex":"Κάντε σήμερα μία χρήσιμη πράξη για κάποιον χωρίς να το πείτε σε κανέναν και χωρίς να το ανεβάσετε πουθενά. Και όταν συναντήσετε ένα εμπόδιο, ψάξτε έναν άλλο δρόμο γύρω του, αντί να το «χτυπάτε» με θυμό.","pm":"Πού σήμερα ήμουν σαν το νερό; Και πού σαν πέτρα;"},"en":{"t":"The highest good is like water","tr":"The highest good is like water. Water benefits all things without contending, and goes to the low places people despise. Therefore it is close to the Way.","simple":"Water gives life to everything without asking for thanks. It does not push or shout; it finds its way around obstacles. And yet, with time, it wears away even rocks.\n\nLao Tzu suggests we resemble water: to help without announcing it, to be humble, to adapt to difficulties instead of breaking.","life":"In a work team, everyone wants to be seen. One colleague quietly helps the younger ones, makes the coffee, solves the little problems. When she is away for a week, everyone realises she was what held the team together.","am":"Drink a glass of water slowly and say: “Today I will be like water: gentle, useful, flexible.”","ex":"Do one useful act for someone today without telling anyone and without posting it anywhere. And when you meet an obstacle, look for another way around it instead of “hitting” it in anger.","pm":"Where was I like water today? And where like stone?"}},{"tag":["🪞 Γνωρίζω τον εαυτό μου","🪞 Knowing myself"],"grc":"知人者智，自知者明。勝人者有力，自勝者強。知足者富。","src":["Τάο Τε Τσινγκ 33","Tao Te Ching 33"],"el":{"t":"Όποιος νικά τον εαυτό του είναι δυνατός","tr":"Όποιος γνωρίζει τους άλλους είναι έξυπνος· όποιος γνωρίζει τον εαυτό του είναι φωτισμένος. Όποιος νικά τους άλλους έχει δύναμη· όποιος νικά τον εαυτό του είναι πραγματικά δυνατός. Όποιος ξέρει ότι έχει αρκετά είναι πλούσιος.","simple":"Είναι εύκολο να κρίνουμε τους άλλους· πολύ πιο δύσκολο να δούμε καθαρά τον εαυτό μας. Είναι εύκολο να θέλουμε να κερδίσουμε έναν καβγά· πολύ πιο δύσκολο να νικήσουμε τη δική μας τεμπελιά, τον θυμό ή τον φόβο.\n\nΚαι ο πλούτος; Ο Λάο Τσε λέει ότι δεν μετριέται με το πόσα έχουμε, αλλά με το αν νιώθουμε ότι έχουμε αρκετά.","life":"Ένας νέος κερδίζει όλες τις διαφωνίες στο διαδίκτυο, αλλά δεν μπορεί να σταματήσει να ξενυχτά με τα παιχνίδια. Μια μέρα αποφασίζει να «νικήσει» αυτό το κομμάτι του εαυτού του. Κλείνει την οθόνη στις έντεκα. Αυτή η νίκη τον κάνει πιο περήφανο από όλες τις άλλες.","am":"Πείτε: «Σήμερα η μόνη νίκη που με ενδιαφέρει είναι η νίκη πάνω στον εαυτό μου.»","ex":"Διαλέξτε μία μικρή συνήθεια που θέλετε να νικήσετε (π.χ. το κινητό στο κρεβάτι, το γλυκό μετά το φαγητό, η γκρίνια). Σήμερα νικήστε τη μία φορά. Γράψτε πώς νιώσατε.","pm":"Ποιο κομμάτι του εαυτού μου νίκησα σήμερα;"},"en":{"t":"Who conquers himself is strong","tr":"Whoever knows others is clever; whoever knows himself is enlightened. Whoever conquers others has force; whoever conquers himself is truly strong. Whoever knows he has enough is rich.","simple":"It is easy to judge others; much harder to see ourselves clearly. It is easy to want to win an argument; much harder to defeat our own laziness, anger or fear.\n\nAnd wealth? Lao Tzu says it is not measured by how much we have, but by whether we feel we have enough.","life":"A young man wins every online argument but cannot stop staying up late gaming. One day he decides to “conquer” that part of himself. He switches off the screen at eleven. That victory makes him prouder than all the others.","am":"Say: “Today the only victory that interests me is the victory over myself.”","ex":"Choose one small habit you want to overcome (e.g. phone in bed, dessert after meals, complaining). Today overcome it once. Write how it felt.","pm":"Which part of myself did I conquer today?"}},{"tag":["🍵 Αρκετό","🍵 Enough"],"grc":"知足不辱，知止不殆，可以長久。","src":["Τάο Τε Τσινγκ 44","Tao Te Ching 44"],"el":{"t":"Να ξέρεις πότε φτάνει","tr":"Όποιος ξέρει ότι έχει αρκετά, δεν ντροπιάζεται. Όποιος ξέρει πότε να σταματήσει, δεν κινδυνεύει. Έτσι μπορεί να κρατήσει πολύ.","simple":"Ένα ποτήρι που το γεμίζουμε συνέχεια, ξεχειλίζει. Ένα τόξο που το τεντώνουμε πολύ, σπάει. Ο Λάο Τσε μάς μαθαίνει την τέχνη του «φτάνει»: στο φαγητό, στη δουλειά, στα ψώνια, στην οθόνη, ακόμη και στα λόγια.\n\nΌποιος ξέρει πότε φτάνει, ζει πιο ήρεμα και πιο πολύ. Όποιος θέλει πάντα «λίγο ακόμη», δεν ησυχάζει ποτέ.","life":"Ένας παίκτης στοιχημάτων κερδίζει ένα καλό ποσό και θέλει «άλλη μια φορά». Τα χάνει όλα. Την επόμενη φορά που κερδίζει κάτι, σταματά και αγοράζει δώρα για την οικογένειά του. Αργότερα ζητά βοήθεια για να σταματήσει εντελώς — αυτό ήταν το μεγαλύτερο «φτάνει» της ζωής του.","am":"Πείτε: «Σήμερα θα προσέξω πότε είναι αρκετό.»","ex":"Διαλέξτε σήμερα ένα πράγμα και σταματήστε το λίγο νωρίτερα από ό,τι συνήθως: φάτε μέχρι να χορτάσετε, όχι μέχρι να «σκάσετε»· κλείστε το κινητό πριν «ένα βίντεο ακόμη»· φύγετε από τη δουλειά στην ώρα σας. Αν νιώθετε ότι δεν μπορείτε να σταματήσετε κάτι (τζόγο, ποτό, οθόνη), μιλήστε με τον γιατρό σας.","pm":"Πού σήμερα είπα «φτάνει» την κατάλληλη στιγμή;"},"en":{"t":"Know when it is enough","tr":"Whoever knows he has enough suffers no disgrace. Whoever knows when to stop is in no danger. Thus he can endure long.","simple":"A glass we keep filling overflows. A bow drawn too far breaks. Lao Tzu teaches us the art of “enough”: in food, work, shopping, screens, even words.\n\nWhoever knows when it is enough lives more calmly and longer. Whoever always wants “a little more” never finds rest.","life":"A gambler wins a good sum and wants “one more time”. He loses it all. The next time he wins something, he stops and buys gifts for his family. Later he seeks help to stop completely — that was the greatest “enough” of his life.","am":"Say: “Today I will notice when it is enough.”","ex":"Choose one thing today and stop it a little earlier than usual: eat until satisfied, not stuffed; close the phone before “one more video”; leave work on time. If you feel you cannot stop something (gambling, drink, screens), speak with your doctor.","pm":"Where today did I say “enough” at the right moment?"}},{"tag":["🐢 Χωρίς βιασύνη","🐢 Without hurry"],"grc":"企者不立，跨者不行。","src":["Τάο Τε Τσινγκ 24","Tao Te Ching 24"],"el":{"t":"Όποιος στέκεται στις μύτες δεν στέκεται","tr":"Όποιος στέκεται στις μύτες των ποδιών δεν στέκεται σταθερά. Όποιος κάνει πολύ μεγάλα βήματα δεν μπορεί να περπατήσει πολύ.","simple":"Δοκιμάστε να σταθείτε στις μύτες των ποδιών: σε λίγο θα χάσετε την ισορροπία σας. Δοκιμάστε να περπατήσετε με τεράστιες δρασκελιές: σε λίγο θα κουραστείτε. Έτσι είναι και η ζωή όταν βιαζόμαστε υπερβολικά ή θέλουμε να φαινόμαστε κάτι παραπάνω από αυτό που είμαστε.\n\nΤο σταθερό, φυσικό βήμα πάει πιο μακριά.","life":"Ένας νέος ξεκινά τη γυμναστική με δύο ώρες κάθε μέρα. Σε μία εβδομάδα τραυματίζεται και τα παρατά. Την επόμενη χρονιά ξεκινά με είκοσι λεπτά, τρεις φορές την εβδομάδα. Έναν χρόνο μετά συνεχίζει — και είναι πιο δυνατός από ποτέ.","am":"Περπατήστε τα πρώτα δέκα βήματα της ημέρας αργά, νιώθοντας κάθε πατούσα στο πάτωμα.","ex":"Παρατηρήστε σήμερα πότε βιάζεστε χωρίς λόγο (στο φαγητό, στο αυτοκίνητο, στις κουβέντες). Κάθε φορά, κόψτε ταχύτητα κατά το ήμισυ για ένα λεπτό. Και αν έχετε έναν στόχο, μικρύνετε το βήμα ώστε να μπορείτε να το κάνετε κάθε μέρα.","pm":"Πού σήμερα με έβγαλε εκτός ισορροπίας η βιασύνη;"},"en":{"t":"Who stands on tiptoe does not stand firm","tr":"Whoever stands on tiptoe does not stand firm. Whoever takes the longest strides does not walk far.","simple":"Try standing on tiptoe: soon you will lose your balance. Try walking with huge strides: soon you will tire. So it is with life when we hurry too much or want to seem more than we are.\n\nThe steady, natural step goes further.","life":"A young man starts exercising two hours every day. Within a week he is injured and gives up. The next year he starts with twenty minutes, three times a week. A year later he is still going — and stronger than ever.","am":"Walk your first ten steps of the day slowly, feeling each sole on the floor.","ex":"Notice today when you hurry for no reason (eating, driving, talking). Each time, halve your speed for a minute. And if you have a goal, shorten the step so you can take it every day.","pm":"Where did hurry throw me off balance today?"}},{"tag":["⭕ Το κενό","⭕ Emptiness"],"grc":"三十輻共一轂，當其無，有車之用。埏埴以為器，當其無，有器之用。","src":["Τάο Τε Τσινγκ 11","Tao Te Ching 11"],"el":{"t":"Το άδειο κομμάτι είναι το χρήσιμο","tr":"Τριάντα ακτίνες ενώνονται σε μια πλήμνη· όμως το άδειο κέντρο της κάνει τη ρόδα χρήσιμη. Πλάθουμε πηλό για να φτιάξουμε ένα δοχείο· όμως το άδειο μέσα του το κάνει χρήσιμο.","simple":"Ένα φλιτζάνι αξίζει για το κενό του: εκεί μπαίνει το τσάι. Ένα σπίτι αξίζει για τους άδειους χώρους του: εκεί ζούμε. Έτσι και η μέρα μας χρειάζεται κενά — στιγμές χωρίς πρόγραμμα, χωρίς οθόνη, χωρίς θόρυβο.\n\nΌταν γεμίζουμε κάθε λεπτό, δεν μένει χώρος για να ξεκουραστούμε, να σκεφτούμε, να χαρούμε. Η ανάπαυση δεν είναι χαμένος χρόνος· είναι το «άδειο» που κάνει τη ζωή χρήσιμη.","life":"Μια μητέρα γεμίζει το πρόγραμμα των παιδιών της με αγγλικά, πιάνο, κολύμβηση και φροντιστήρια. Τα παιδιά είναι νευρικά και κουρασμένα. Αφήνει ένα απόγευμα την εβδομάδα «άδειο». Τα παιδιά παίζουν, φτιάχνουν ιστορίες, ζωγραφίζουν — και γελούν όπως δεν είχαν γελάσει καιρό.","am":"Μείνετε ένα λεπτό απλώς καθισμένοι, χωρίς να κάνετε τίποτα. Αφήστε το κενό να υπάρξει.","ex":"Αφήστε σήμερα μισή ώρα εντελώς «άδεια» στο πρόγραμμά σας: χωρίς οθόνη, χωρίς υποχρέωση. Κοιτάξτε από το παράθυρο, περπατήστε χωρίς στόχο, ξαπλώστε. Αν σας φανεί δύσκολο, είναι σημάδι ότι το χρειάζεστε.","pm":"Πόσο «άδειο» χώρο είχε σήμερα η μέρα μου;"},"en":{"t":"The empty part is the useful part","tr":"Thirty spokes join in one hub; but its empty centre makes the wheel useful. We shape clay into a vessel; but the emptiness within makes it useful.","simple":"A cup is valuable for its emptiness: that is where the tea goes. A house is valuable for its empty spaces: that is where we live. So our day needs empty spaces too — moments with no schedule, no screen, no noise.\n\nWhen we fill every minute, there is no room left to rest, think or rejoice. Rest is not wasted time; it is the “emptiness” that makes life useful.","life":"A mother fills her children’s schedule with English, piano, swimming and tutoring. The children are tense and tired. She leaves one afternoon a week “empty”. The children play, make up stories, draw — and laugh as they had not for a long time.","am":"Sit for one minute doing nothing at all. Let the emptiness be.","ex":"Leave half an hour completely “empty” in your schedule today: no screen, no obligation. Look out of the window, walk without a goal, lie down. If it feels hard, that is a sign you need it.","pm":"How much “empty” space did my day have today?"}},{"tag":["🌙 Ησυχία","🌙 Stillness"],"grc":"致虛極，守靜篤。萬物並作，吾以觀復。","src":["Τάο Τε Τσινγκ 16","Tao Te Ching 16"],"el":{"t":"Φτάσε στη βαθιά ησυχία","tr":"Φτάσε στο απόλυτο άδειασμα· κράτα σταθερά τη βαθιά ησυχία. Όλα τα πλάσματα αναδύονται μαζί, κι εγώ παρατηρώ πώς επιστρέφουν.","simple":"Όταν ταράζουμε το νερό μιας λίμνης, θολώνει και δεν βλέπουμε τον βυθό. Όταν το αφήνουμε ήσυχο, η λάσπη κατακάθεται και το νερό γίνεται διάφανο. Έτσι και ο νους μας.\n\nΟ Λάο Τσε μάς καλεί να βρίσκουμε κάθε μέρα λίγη βαθιά ησυχία. Από εκεί βλέπουμε καθαρά: ότι όλα έρχονται και φεύγουν, όπως οι εποχές, και επιστρέφουν στη ρίζα τους.","life":"Ένας μάνατζερ πρέπει να πάρει μια δύσκολη απόφαση και σκέφτεται χωρίς σταματημό για μέρες. Ένα πρωί κάθεται δέκα λεπτά στη σιωπή του κήπου, απλώς ακούγοντας τα πουλιά. Όταν σηκώνεται, η απάντηση του φαίνεται ξαφνικά απλή.","am":"Καθίστε τρία λεπτά σε σιωπή, με τα μάτια κλειστά. Αφήστε τις σκέψεις να «κατακαθίσουν» σαν τη λάσπη σε ένα ποτήρι νερό.","ex":"Βρείτε σήμερα δέκα λεπτά βαθιάς ησυχίας: σε ένα πάρκο, σε μια εκκλησία, σε ένα δωμάτιο με κλειστή πόρτα. Χωρίς μουσική και χωρίς κινητό. Απλώς καθίστε, ανασαίνετε και παρατηρείτε.","pm":"Τι είδα πιο καθαρά όταν ησύχασα;"},"en":{"t":"Reach deep stillness","tr":"Attain utmost emptiness; hold firmly to deep stillness. All things arise together, and I watch their return.","simple":"When we stir the water of a lake, it clouds and we cannot see the bottom. When we leave it still, the mud settles and the water becomes clear. So it is with our mind.\n\nLao Tzu invites us to find a little deep stillness every day. From there we see clearly: that everything comes and goes, like the seasons, and returns to its root.","life":"A manager must make a hard decision and thinks about it non-stop for days. One morning he sits ten minutes in the silence of the garden, just listening to the birds. When he gets up, the answer suddenly seems simple.","am":"Sit for three minutes in silence, eyes closed. Let your thoughts “settle” like mud in a glass of water.","ex":"Find ten minutes of deep stillness today: in a park, a church, a room with the door shut. No music, no phone. Just sit, breathe and observe.","pm":"What did I see more clearly when I became still?"}}]},
{"id":"ko","emoji":"🏮","cls":"c-ko","origLbl":["Το αρχαίο κινεζικό κείμενο:","The original Chinese:"],"name":["Κομφούκιος","Confucius"],"withName":["με τον Κομφούκιο","with Confucius"],"years":["551–479 π.Χ. · Ο δάσκαλος των σχέσεων","551–479 BC · The teacher of relationships"],"bio":["<p>Ο Κομφούκιος (Κονγκ Φουτζί, «ο Δάσκαλος Κονγκ») γεννήθηκε στο κράτος <b>Λου</b> της αρχαίας Κίνας. Ο πατέρας του πέθανε όταν ήταν τριών ετών και μεγάλωσε φτωχικά με τη μητέρα του. Δούλεψε ως λογιστής σε αποθήκες σιτηρών και φύλακας κοπαδιών, αλλά πάντα μελετούσε.</p><p>Έγινε ο πρώτος μεγάλος <b>δάσκαλος</b> της Κίνας, που δεχόταν μαθητές από κάθε τάξη, φτωχούς και πλούσιους. Ταξίδεψε χρόνια ψάχνοντας έναν ηγεμόνα να εφαρμόσει τις ιδέες του για δίκαιη κυβέρνηση, χωρίς επιτυχία. Γύρισε στο σπίτι και δίδαξε μέχρι τον θάνατό του.</p><p>Οι μαθητές του μάζεψαν τα λόγια του στις <b>«Συνομιλίες»</b>. Για 2.500 χρόνια διαμόρφωσαν την Κίνα, την Κορέα και την Ιαπωνία. Μας μαθαίνει για τον σεβασμό στην οικογένεια, τη φιλία, τη μάθηση και τον καθημερινό αυτοέλεγχο.</p>","<p>Confucius (Kong Fuzi, “Master Kong”) was born in the state of <b>Lu</b> in ancient China. His father died when he was three, and he grew up poor with his mother. He worked as a granary clerk and a keeper of herds, but he always studied.</p><p>He became China’s first great <b>teacher</b>, accepting students of every class, poor and rich. He travelled for years seeking a ruler who would apply his ideas of just government, without success. He returned home and taught until his death.</p><p>His students gathered his words in the <b>“Analects”</b>. For 2,500 years they shaped China, Korea and Japan. He teaches us about respect in the family, friendship, learning and daily self-examination.</p>"],"cheer":["Ο Κομφούκιος έλεγε ότι η μάθηση μοιάζει με το χτίσιμο ενός βουνού, καλάθι-καλάθι (Συνομιλίες 9.19). Σήμερα προσθέσατε ένα καλάθι.","Confucius said learning is like building a mountain, basket by basket (Analects 9.19). Today you added a basket."],"fare":{"grc":"歲寒，然後知松柏之後彫也。","src":["Συνομιλίες 9.28","Analects 9.28"],"tr":["Μόνο όταν έρθει ο βαρύς χειμώνας καταλαβαίνουμε ότι το πεύκο και το κυπαρίσσι είναι τα τελευταία που μαραίνονται.","Only when the cold of winter comes do we know that the pine and cypress are the last to wither."]},"days":[{"tag":["📖 Χαρά της μάθησης","📖 Joy of learning"],"grc":"學而時習之，不亦說乎？有朋自遠方來，不亦樂乎？人不知而不慍，不亦君子乎？","src":["Συνομιλίες 1.1","Analects 1.1"],"el":{"t":"Τρεις απλές χαρές","tr":"Να μαθαίνεις κάτι και να το εξασκείς τακτικά — δεν είναι χαρά; Να έρχεται ένας φίλος από μακριά — δεν είναι ευτυχία; Να μη σε αναγνωρίζουν οι άλλοι και να μη θυμώνεις — δεν είναι αυτό ευγένεια ψυχής;","simple":"Με αυτά τα λόγια ανοίγει το βιβλίο του Κομφούκιου. Τρεις χαρές που δεν κοστίζουν τίποτα: η μάθηση που γίνεται κομμάτι μας, η φιλία, και η εσωτερική ησυχία όταν οι άλλοι δεν μας προσέχουν.\n\nΗ τρίτη είναι η πιο δύσκολη σήμερα: κάνουμε κάτι καλό και περιμένουμε αναγνώριση, likes, έπαινο. Ο Κομφούκιος λέει: κάνε το καλό επειδή είναι καλό, όχι για να το δουν.","life":"Ένας νέος μάγειρας δουλεύει σκληρά, αλλά ο σεφ δεν τον επαινεί ποτέ. Στην αρχή πικραίνεται. Μετά αρχίζει να χαίρεται το ίδιο το μαγείρεμα: κάθε μέρα μαθαίνει κάτι, κάθε πιάτο είναι λίγο καλύτερο. Χρόνια αργότερα ανοίγει το δικό του εστιατόριο.","am":"Πείτε: «Σήμερα θα χαρώ αυτό που μαθαίνω και αυτό που κάνω, ακόμη κι αν δεν το δει κανείς.»","ex":"Μάθετε σήμερα κάτι μικρό και εξασκήστε το μία φορά (μια λέξη σε ξένη γλώσσα, μια συνταγή, μια λειτουργία του κινητού). Και στείλτε μήνυμα σε έναν φίλο που έχετε καιρό να δείτε.","pm":"Ποια από τις τρεις χαρές έζησα σήμερα;"},"en":{"t":"Three simple joys","tr":"To learn something and practise it regularly — is that not a joy? To have a friend come from afar — is that not happiness? To go unrecognised by others and not be resentful — is that not nobility of soul?","simple":"With these words Confucius’ book begins. Three joys that cost nothing: learning that becomes part of us, friendship, and inner calm when others do not notice us.\n\nThe third is hardest today: we do something good and expect recognition, likes, praise. Confucius says: do good because it is good, not to be seen.","life":"A young cook works hard, but the chef never praises him. At first he feels bitter. Then he begins to enjoy the cooking itself: each day he learns something, each dish is a little better. Years later he opens his own restaurant.","am":"Say: “Today I will enjoy what I learn and what I do, even if no one sees it.”","ex":"Learn something small today and practise it once (a word in a foreign language, a recipe, a phone feature). And message a friend you have not seen for a while.","pm":"Which of the three joys did I live today?"}},{"tag":["🤲 Ο χρυσός κανόνας","🤲 The golden rule"],"grc":"子貢問曰：「有一言而可以終身行之者乎？」子曰：「其恕乎！己所不欲，勿施於人。」","src":["Συνομιλίες 15.24","Analects 15.24"],"el":{"t":"Ό,τι δεν θέλεις για σένα","tr":"Ένας μαθητής ρώτησε: «Υπάρχει μία λέξη που μπορεί κανείς να την ακολουθεί σε όλη του τη ζωή;» Ο Δάσκαλος είπε: «Ίσως η κατανόηση. Ό,τι δεν θέλεις να σου κάνουν, μην το κάνεις στους άλλους.»","simple":"Αν έπρεπε να κρατήσουμε μόνο έναν κανόνα για όλη τη ζωή, ο Κομφούκιος θα διάλεγε αυτόν. Τον βρίσκουμε σχεδόν σε κάθε πολιτισμό και θρησκεία του κόσμου — γι’ αυτό τον λένε «χρυσό κανόνα».\n\nΕίναι απλός: πριν κάνω ή πω κάτι, φαντάζομαι ότι το κάνουν σε μένα. Θα μου άρεσε;","life":"Μια έφηβη ετοιμάζεται να προωθήσει σε όλη την τάξη μια αστεία φωτογραφία μιας συμμαθήτριάς της. Σκέφτεται: «Αν ήταν δική μου φωτογραφία;» Τη σβήνει. Ένα μήνυμα που δεν στάλθηκε έσωσε κάποιον από πολύ πόνο.","am":"Πείτε: «Σήμερα, πριν μιλήσω ή πράξω, θα βάλω τον εαυτό μου στη θέση του άλλου.»","ex":"Τρεις φορές σήμερα, πριν στείλετε ένα μήνυμα, πείτε μια κριτική ή πάρετε μια απόφαση που αφορά άλλους, ρωτήστε: «Θα ήθελα να μου το κάνουν;» Αν όχι, αλλάξτε το.","pm":"Πού σήμερα με βοήθησε ο χρυσός κανόνας;"},"en":{"t":"What you do not want for yourself","tr":"A student asked: “Is there one word one can follow all one’s life?” The Master said: “Perhaps ‘understanding’. What you do not want done to you, do not do to others.”","simple":"If we had to keep only one rule for life, Confucius would choose this one. We find it in almost every culture and religion of the world — that is why it is called the “golden rule”.\n\nIt is simple: before I do or say something, I imagine it being done to me. Would I like it?","life":"A teenage girl is about to forward to the whole class a funny photo of a classmate. She thinks: “What if it were my photo?” She deletes it. A message never sent saved someone a lot of pain.","am":"Say: “Today, before I speak or act, I will put myself in the other person’s place.”","ex":"Three times today, before sending a message, making a criticism or taking a decision that affects others, ask: “Would I want this done to me?” If not, change it.","pm":"Where did the golden rule help me today?"}},{"tag":["👵 Γονείς","👵 Parents"],"grc":"子游問孝。子曰：「今之孝者，是謂能養。至於犬馬，皆能有養；不敬，何以別乎？」","src":["Συνομιλίες 2.7","Analects 2.7"],"el":{"t":"Δεν φτάνει να τους ταΐζεις","tr":"Ένας μαθητής ρώτησε τι σημαίνει να τιμάς τους γονείς σου. Ο Δάσκαλος είπε: «Σήμερα λένε ότι τιμά τους γονείς του όποιος τους εξασφαλίζει τροφή. Μα και τα σκυλιά και τα άλογα τα ταΐζουμε. Αν λείπει ο σεβασμός, ποια η διαφορά;»","simple":"Ο Κομφούκιος λέει κάτι πολύ τρυφερό και αυστηρό μαζί: η φροντίδα των γονιών δεν είναι μόνο υλική. Μπορεί να τους πληρώνουμε τους λογαριασμούς ή να τους πηγαίνουμε φαγητό, αλλά αν τους μιλάμε απότομα, βιαστικά, χωρίς υπομονή, κάτι σημαντικό λείπει.\n\nΣεβασμός σημαίνει να τους ακούμε, να τους ρωτάμε, να έχουμε υπομονή όταν γερνούν, να τους δείχνουμε ότι η ζωή τους μετρά.","life":"Ένας γιος πηγαίνει κάθε Κυριακή ψώνια στη μητέρα του, αλλά φεύγει σε δέκα λεπτά κοιτάζοντας το ρολόι. Μια Κυριακή κάθεται για καφέ και τη ρωτά για τα νιάτα της. Εκείνη λάμπει. «Αυτό ήταν το καλύτερο δώρο σου», του λέει.","am":"Σκεφτείτε τους γονείς σας (ή όποιον σας μεγάλωσε) και πείτε μέσα σας ένα «ευχαριστώ» για κάτι συγκεκριμένο.","ex":"Τηλεφωνήστε σήμερα στους γονείς σας ή σε έναν ηλικιωμένο συγγενή, χωρίς βιασύνη, και κάντε μια ερώτηση για τη ζωή του που δεν έχετε κάνει ποτέ. Αν οι γονείς σας δεν ζουν, γράψτε μια όμορφη ανάμνηση ή πείτε την σε κάποιον. Αν η σχέση σας ήταν πολύ δύσκολη, φροντίστε πρώτα τον εαυτό σας.","pm":"Πώς έδειξα σήμερα σεβασμό, και όχι μόνο φροντίδα;"},"en":{"t":"Feeding them is not enough","tr":"A student asked what it means to honour one’s parents. The Master said: “Nowadays it means being able to feed them. But even dogs and horses are fed. Without respect, what is the difference?”","simple":"Confucius says something both tender and strict: caring for parents is not only material. We may pay their bills or bring them food, but if we speak to them curtly, hurriedly, without patience, something important is missing.\n\nRespect means listening to them, asking them, being patient as they age, showing them that their life matters.","life":"A son does his mother’s shopping every Sunday but leaves after ten minutes, checking his watch. One Sunday he sits for coffee and asks about her youth. She glows. “That was your best gift,” she tells him.","am":"Think of your parents (or whoever raised you) and inwardly say “thank you” for something specific.","ex":"Call your parents or an elderly relative today, unhurried, and ask a question about their life you have never asked. If your parents are no longer living, write down a beautiful memory or tell it to someone. If your relationship was very difficult, look after yourself first.","pm":"How did I show respect today, and not just care?"}},{"tag":["🤔 Ειλικρίνεια","🤔 Honesty"],"grc":"知之為知之，不知為不知，是知也。","src":["Συνομιλίες 2.17","Analects 2.17"],"el":{"t":"Να ξέρεις τι δεν ξέρεις","tr":"Όταν ξέρεις κάτι, να λες ότι το ξέρεις· όταν δεν το ξέρεις, να λες ότι δεν το ξέρεις. Αυτό είναι γνώση.","simple":"Πολλοί προσποιούνται ότι ξέρουν, από ντροπή ή εγωισμό. Στο σχολείο, στη δ
