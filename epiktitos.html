<style>

@media(max-width:380px){body{font-size:18px}.hero h1{font-size:29px}.dayhead h1{font-size:25px}.quote .tr{font-size:21px}.course b{font-size:21px}.course .em{font-size:40px}}

<body>

<script>
/* =====================================================================
   7 ΗΜΕΡΕΣ ΜΕ ΤΟΥΣ ΣΟΦΟΥΣ — Christos S Magides — 26-10-2026
   23 σοφοί: Επίκτητος · Σωκράτης · Ζήνων · Πυθαγόρας · Αριστοτέλης · Σενέκας · Επίκουρος · Καντ
   · Διογένης · Πρωταγόρας · Ηράκλειτος · Πλάτων · Μάρκος Αυρήλιος · Βούδας · Λάο Τσε · Κομφούκιος
   · Σπινόζα · Βιβεκανάντα · Ραματσαράκα · Γκιμπράν · Κρισναμούρτι · Φρανκλ · Βιβλίο της Ουράντια
   Το ίδιο αρχείο δουλεύει ως index.html (sofoi-4all) και ως epiktitos.html (InnerLife).
   Αυτόνομη σελίδα: δεν αγγίζει τίποτα άλλο στον ιστότοπο.
   Οι σημειώσεις μένουν μόνο στη συσκευή του επισκέπτη (localStorage).
   Για νέο σοφό: προσθέστε ένα ακόμη αντικείμενο στον πίνακα COURSES.
   ===================================================================== */
(function(){
'use strict';
var LANG=(function(){try{var l=localStorage.getItem('sofoi7-lang')||localStorage.getItem('ep7-lang');if(l)return l}catch(e){}return /^el/i.test(navigator.language||'el')?'el':'en'})();
function L(el,en){return LANG==='el'?el:en}
function T(pair){return pair[LANG==='el'?0:1]}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(id){return document.getElementById(id)}
/* Αυτόνομη εφαρμογή (sofoi-4all) ή σελίδα μέσα στο InnerLife (epiktitos.html); */
var STANDALONE=!/epiktitos(\.html)?$/i.test(location.pathname);
if(STANDALONE){try{var ml=document.createElement('link');ml.rel='manifest';ml.href='manifest.webmanifest';document.head.appendChild(ml)}catch(e){}
  if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;try{if(route().v==='home')render()}catch(x){}});
function isInstalled(){try{return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}}
function installBtn(){return STANDALONE&&!isInstalled()?'<button class="big blue" onclick="EP.install()">📲 '+L('Βάλτε το στην αρχική οθόνη του κινητού','Add it to your phone’s home screen')+'</button>':''}
function origBox(c,g){if(!g||(c.origEn&&LANG==='en'))return '';return '<div class="orig"><div class="k">'+(c.origLbl?esc(T(c.origLbl)):L('Το αρχαίο κείμενο:','The ancient Greek text:'))+'</div><p class="grc">«'+esc(g)+'»</p></div>'}
function srcOf(c,d){var s=T(d.src);if(!d.grc&&!/απόδοση|rendering/i.test(s))s+=L(' · ελεύθερη απόδοση',' · free rendering');return s}

/* ---------------- ΤΑ ΤΡΙΑ ΠΕΔΙΑ ΤΟΥ ΕΠΙΚΤΗΤΟΥ ---------------- */
var DES=['🌿 Πεδίο των επιθυμιών','🌿 The discipline of desire'],
    ACT=['🤝 Πεδίο των πράξεων','🤝 The discipline of action'],
    JUD=['⚖️ Πεδίο των κρίσεων','⚖️ The discipline of judgement'];

/* =====================================================================
   ΤΑ ΜΑΘΗΜΑΤΑ
   Κάθε ημέρα: grc (αρχαίο), src (πηγή), και για κάθε γλώσσα:
   t = τίτλος, tr = απόδοση σε απλά νέα, simple = εξήγηση,
   life = παράδειγμα από τη ζωή, am = πρωί, ex = άσκηση, pm = βράδυ
   ===================================================================== */
var COURSES=[
/* ============================ ΕΠΙΚΤΗΤΟΣ ============================ */
{id:'ep',emoji:'🏛️',cls:'c-ep',name:['Επίκτητος','Epictetus'],withName:['με τον Επίκτητο','with Epictetus'],
 years:['Περίπου 50–135 μ.Χ. · Ο δούλος που έγινε ελεύθερος','c. 50–135 AD · The slave who became free'],
 bio:['<p>Ο Επίκτητος γεννήθηκε στην Ιεράπολη της Φρυγίας και έζησε τα νιάτα του <b>δούλος</b> στη Ρώμη — ακόμη και το όνομά του σημαίνει «αποκτημένος». Ήταν κουτσός, φτωχός και χωρίς δικαιώματα. Κι όμως, άκουσε μαθήματα από τον Στωικό φιλόσοφο Μουσώνιο Ρούφο και έγινε ένας από τους πιο ελεύθερους ανθρώπους που έζησαν ποτέ.</p><p>Όταν απελευθερώθηκε, δίδαξε φιλοσοφία· και όταν ο αυτοκράτορας Δομιτιανός έδιωξε τους φιλοσόφους από τη Ρώμη, ίδρυσε σχολή στη <b>Νικόπολη της Ηπείρου</b>. Δεν έγραψε τίποτα. Ο μαθητής του Αρριανός κατέγραψε τα λόγια του στις «Διατριβές» και στο μικρό «Εγχειρίδιο» — που σημαίνει «αυτό που κρατάς στο χέρι».</p><p>Ο Επίκτητος έλεγε ότι ο άνθρωπος ασκείται σε τρία πεδία: στις <b>επιθυμίες</b>, στις <b>πράξεις</b> προς τους άλλους και στις <b>κρίσεις</b> του (Διατριβές Γ΄ 2). Οι 7 ημέρες περνούν και από τα τρία.</p>',
      '<p>Epictetus was born in Hierapolis in Phrygia and spent his youth as a <b>slave</b> in Rome — even his name means “acquired”. He was lame, poor and without rights. Yet he studied with the Stoic philosopher Musonius Rufus and became one of the freest people who ever lived.</p><p>Once freed, he taught philosophy; when Emperor Domitian banished the philosophers from Rome, he founded a school at <b>Nicopolis in Epirus</b>, Greece. He wrote nothing. His student Arrian recorded his words in the “Discourses” and the little “Enchiridion” — “what you hold in your hand”.</p><p>Epictetus said we train in three fields: <b>desire</b>, <b>action</b> towards others, and <b>judgement</b> (Discourses III 2). The 7 days pass through all three.</p>'],
 cheer:['Ο Επίκτητος έλεγε ότι τίποτα μεγάλο δεν γίνεται ξαφνικά — ούτε το σταφύλι ούτε το σύκο (Διατριβές Α΄ 15).','Epictetus said nothing great comes suddenly — not even a grape or a fig (Discourses I 15).'],
 fare:{grc:'Εἰς ποῖον ἔτι χρόνον ἀναβάλλῃ τὸ τῶν βελτίστων ἀξιοῦν σεαυτόν;',src:['Επίκτητος, Εγχειρίδιο 51','Epictetus, Enchiridion 51'],
  tr:['Μέχρι πότε θα αναβάλλεις να θεωρήσεις τον εαυτό σου άξιο για τα καλύτερα; Ο Σωκράτης έγινε αυτό που έγινε επειδή σε όλα άκουγε μόνο τη φωνή της λογικής. Κι εσύ, ακόμη κι αν δεν είσαι Σωκράτης, να ζεις σαν άνθρωπος που θέλει να του μοιάσει.','How long will you put off thinking yourself worthy of the best? Socrates became who he was by listening to nothing but reason. And you, even if you are not yet Socrates, should live as one who wishes to become like him.']},
 days:[
{tag:DES,grc:'Τῶν ὄντων τὰ μέν ἐστιν ἐφ᾽ ἡμῖν, τὰ δὲ οὐκ ἐφ᾽ ἡμῖν.',src:['Εγχειρίδιο 1','Enchiridion 1'],
 el:{t:'Τι εξαρτάται από εμάς',
  tr:'Κάποια πράγματα εξαρτώνται από εμάς και κάποια όχι. Από εμάς εξαρτώνται οι σκέψεις μας, οι επιλογές μας, οι επιθυμίες μας και όσα αποφεύγουμε — με λίγα λόγια, ό,τι κάνουμε εμείς οι ίδιοι. Δεν εξαρτώνται από εμάς το σώμα μας, τα χρήματα, η γνώμη των άλλων για εμάς και οι θέσεις — με λίγα λόγια, ό,τι δεν το κάνουμε εμείς.',
  simple:'Ο Επίκτητος χωρίζει τη ζωή σε δύο κουτιά. Στο πρώτο μπαίνει ό,τι ελέγχουμε πραγματικά: πώς σκεφτόμαστε, τι αποφασίζουμε, πώς αντιδρούμε. Στο δεύτερο ό,τι δεν ελέγχουμε: τον καιρό, τους άλλους ανθρώπους, τα χρήματα, το τι λένε για εμάς, ακόμη και πολλά από όσα συμβαίνουν στο σώμα μας.\n\nΤο μεγάλο μυστικό είναι ότι τα περισσότερα βάσανα έρχονται όταν προσπαθούμε να ελέγξουμε το δεύτερο κουτί. Όταν βάζουμε τη δύναμή μας στο πρώτο, ηρεμούμε — και γινόμαστε και πιο αποτελεσματικοί. Ο ίδιος ήταν δούλος και δεν όριζε σχεδόν τίποτα. Κι όμως ένιωθε ελεύθερος, γιατί τις σκέψεις και τις επιλογές του κανείς δεν μπορούσε να του τις πάρει.',
  life:'Πηγαίνετε σε μια συνέντευξη για δουλειά. Το αν θα σας προσλάβουν δεν εξαρτάται από εσάς — το αποφασίζουν άλλοι. Εξαρτάται όμως από εσάς να προετοιμαστείτε καλά, να φτάσετε στην ώρα σας και να μιλήσετε ειλικρινά. Αν βάλετε όλη σας την ενέργεια εκεί, έχετε κάνει ό,τι καλύτερο μπορούσατε — κι όποιο κι αν είναι το αποτέλεσμα, μένετε ήσυχοι.',
  am:'Πριν σηκωθείτε από το κρεβάτι, πείτε αργά: «Σήμερα θα φροντίσω ό,τι εξαρτάται από μένα, και θα αφήσω με ηρεμία ό,τι δεν εξαρτάται.»',
  ex:'Πάρτε ένα χαρτί και χωρίστε το σε δύο στήλες: «Εξαρτάται από μένα» και «Δεν εξαρτάται από μένα». Γράψτε τρεις ανησυχίες σας. Θα δείτε ότι σχεδόν κάθε ανησυχία έχει ένα κομμάτι σε κάθε στήλη — το αποτέλεσμα μιας εξέτασης υγείας δεν το ορίζω· τον περίπατο, το φαγητό και το ραντεβού με τον γιατρό, ναι. Για το κομμάτι που είναι δικό σας, κάντε ένα βήμα σήμερα.',
  pm:'Πόση από τη σημερινή μου ενέργεια ξόδεψα σε πράγματα που δεν εξαρτώνταν από μένα; Και τι έκανα για όσα εξαρτώνταν;'},
 en:{t:'What is up to us',
  tr:'Some things are up to us and some are not. Up to us are our thoughts, our choices, our desires and what we avoid — in short, whatever we ourselves do. Not up to us are our body, money, what others think of us, and positions — in short, whatever we do not do ourselves.',
  simple:'Epictetus divides life into two boxes. In the first goes what we truly control: how we think, what we decide, how we react. In the second, what we do not: the weather, other people, money, what people say about us, even much of what happens to our body.\n\nThe great secret is that most suffering comes from trying to control the second box. When we put our strength into the first, we calm down — and become more effective too. He himself was a slave and controlled almost nothing. Yet he felt free, because no one could take his thoughts and choices from him.',
  life:'You go to a job interview. Whether they hire you is not up to you — others decide. But it is up to you to prepare well, arrive on time and speak honestly. If you put all your energy there, you have done your best — and whatever the result, you can be at peace.',
  am:'Before you get out of bed, say slowly: “Today I will care for what is up to me, and calmly let go of what is not.”',
  ex:'Take a sheet of paper and divide it into two columns: “Up to me” and “Not up to me”. Write three of your worries. Almost every worry has a part in each column — the result of a medical test is not up to me; the walk, the food and the doctor’s appointment are. For the part that is yours, take one step today.',
  pm:'How much of today’s energy did I spend on things that were not up to me? And what did I do about the things that were?'}},

{tag:JUD,grc:'Ταράσσει τοὺς ἀνθρώπους οὐ τὰ πράγματα, ἀλλὰ τὰ περὶ τῶν πραγμάτων δόγματα.',src:['Εγχειρίδιο 5','Enchiridion 5'],
 el:{t:'Δεν μας ταράζουν τα γεγονότα, αλλά οι σκέψεις μας',
  tr:'Τους ανθρώπους δεν τους αναστατώνουν τα ίδια τα γεγονότα, αλλά οι σκέψεις που κάνουν γι’ αυτά.',
  simple:'Ανάμεσα σε αυτό που συμβαίνει και σε αυτό που νιώθουμε, υπάρχει πάντα κάτι στη μέση: η σκέψη μας. Το ίδιο γεγονός μπορεί να θυμώσει τον έναν και να αφήσει ήρεμο τον άλλον — γιατί ο καθένας λέει διαφορετική «ιστορία» στον εαυτό του.\n\nΟ Επίκτητος συμβουλεύει: όταν μια σκέψη σάς ταράζει, πείτε της «Είσαι μόνο μια εντύπωση, όχι οπωσδήποτε η αλήθεια» — και ελέγξτε την πριν την πιστέψετε. Αυτό δεν σημαίνει ότι ο πόνος δεν είναι αληθινός. Σημαίνει ότι εμείς διαλέγουμε τι λέμε στον εαυτό μας γι’ αυτόν.',
  life:'Στέλνετε μήνυμα σε έναν φίλο και δεν απαντά όλη μέρα. Το γεγονός: «δεν απάντησε ακόμη». Η σκέψη που πληγώνει: «με αγνοεί, δεν με υπολογίζει». Μια άλλη, εξίσου πιθανή σκέψη: «ίσως είναι απασχολημένος ή δεν είδε το μήνυμα». Το γεγονός είναι ίδιο — αυτό που νιώθουμε αλλάζει ολόκληρο.',
  am:'Ετοιμάστε τη «φράση-ασπίδα» της ημέρας: «Είσαι μόνο μια εντύπωση, όχι οπωσδήποτε η αλήθεια.»',
  ex:'Όταν κάτι σας ταράξει σήμερα, σταματήστε και γράψτε τρεις γραμμές: 1) Τι έγινε — μόνο τα γεγονότα, σαν να το κατέγραφε μια κάμερα. 2) Τι είπα στον εαυτό μου γι’ αυτό. 3) Μια πιο δίκαιη και ήρεμη σκέψη. Παρατηρήστε πόσο από το βάρος βρισκόταν στη δεύτερη γραμμή.',
  pm:'Ποια σκέψη με τάραξε σήμερα περισσότερο από το ίδιο το γεγονός;'},
 en:{t:'Not events, but our thoughts, disturb us',
  tr:'People are not disturbed by events themselves, but by the thoughts they have about them.',
  simple:'Between what happens and what we feel, there is always something in the middle: our thought. The same event can anger one person and leave another calm — because each tells himself a different “story”.\n\nEpictetus advises: when a thought upsets you, say to it, “You are only an impression, not necessarily the truth” — and check it before you believe it. This does not mean pain is not real. It means we choose what we tell ourselves about it.',
  life:'You send a message to a friend and they do not reply all day. The fact: “they have not replied yet”. The thought that hurts: “they are ignoring me”. Another, equally likely thought: “maybe they are busy or have not seen it”. The fact is the same — what we feel changes completely.',
  am:'Prepare today’s “shield sentence”: “You are only an impression, not necessarily the truth.”',
  ex:'When something upsets you today, stop and write three lines: 1) What happened — only the facts, as a camera would record them. 2) What I told myself about it. 3) A fairer, calmer thought. Notice how much of the weight was in the second line.',
  pm:'Which thought disturbed me today more than the event itself?'}},

{tag:DES,grc:'Μὴ ζήτει τὰ γινόμενα γίνεσθαι ὡς θέλεις, ἀλλὰ θέλε τὰ γινόμενα ὡς γίνεται, καὶ εὐροήσεις.',src:['Εγχειρίδιο 8','Enchiridion 8'],
 el:{t:'Να θέλεις ό,τι γίνεται',
  tr:'Μη ζητάς να γίνονται τα πράγματα όπως τα θέλεις εσύ. Να θέλεις να γίνονται όπως πράγματι γίνονται — και η ζωή σου θα κυλά ήρεμα.',
  simple:'Πολλές φορές παλεύουμε με κάτι που έχει ήδη γίνει: «Γιατί να βρέξει σήμερα;», «Γιατί να συμβεί σε μένα;». Αυτή η πάλη δεν αλλάζει τίποτα — απλώς μας κουράζει.\n\nΟ Επίκτητος δεν λέει να τα παρατήσουμε, ούτε να ανεχόμαστε την αδικία. Λέει: δέξου ήρεμα ό,τι έχει ήδη γίνει, και βάλε όλη σου τη δύναμη σε αυτό που μπορείς να κάνεις από εδώ και πέρα. Έλεγε επίσης ότι οι δυσκολίες είναι σαν δυνατός αντίπαλος στην προπόνηση: μας κάνουν πιο δυνατούς (Διατριβές Α΄ 24).',
  life:'Ετοιμάζεστε για εκδρομή και το πρωί βρέχει καταρρακτωδώς. Μπορείτε να περάσετε όλη τη μέρα θυμωμένοι με τον καιρό. Ή να πείτε «εντάξει, βρέχει» και να σκεφτείτε τι ωραίο μπορεί να γίνει μέσα στο σπίτι — ένα φαγητό με την οικογένεια, ένα βιβλίο, ένα τηλεφώνημα σε κάποιον που αγαπάτε. Η βροχή είναι ίδια· η μέρα σας όχι.',
  am:'Πείτε: «Ό,τι κι αν φέρει η σημερινή μέρα, θα το δεχτώ ως ευκαιρία να γίνω πιο δυνατός.»',
  ex:'Διαλέξτε σήμερα μια μικρή, αναπόφευκτη ενόχληση: μια ουρά, μια καθυστέρηση, τη βροχή, έναν θόρυβο. Αντί για γκρίνια, πείτε μέσα σας: «Αυτός είναι ο σημερινός μου αντίπαλος στην προπόνηση» — και πάρτε τρεις αργές ανάσες. Αν η ενόχληση αφορά αδικία ή κίνδυνο, η άσκηση δεν είναι να την ανεχτείτε, αλλά να ενεργήσετε ήρεμα.',
  pm:'Σε ποια στιγμή σήμερα πάλεψα με κάτι που είχε ήδη συμβεί; Τι θα άλλαζε αν το είχα δεχτεί;'},
 en:{t:'Wish things to happen as they do',
  tr:'Do not ask for things to happen as you wish. Wish them to happen as they actually happen — and your life will flow calmly.',
  simple:'We often fight with something that has already happened: “Why did it have to rain today?”, “Why me?”. This fight changes nothing — it only tires us.\n\nEpictetus does not say we should give up, nor tolerate injustice. He says: calmly accept what has already happened, and put all your strength into what you can do from here on. He also said that difficulties are like a strong opponent in training: they make us stronger (Discourses I 24).',
  life:'You are ready for a day trip and in the morning it pours with rain. You can spend the whole day angry at the weather. Or you can say “fine, it is raining” and think what could be lovely at home — a meal with the family, a book, a call to someone you love. The rain is the same; your day is not.',
  am:'Say: “Whatever today brings, I will accept it as a chance to grow stronger.”',
  ex:'Choose one small, unavoidable annoyance today: a queue, a delay, the rain, a noise. Instead of complaining, say inwardly: “This is today’s opponent in my training” — and take three slow breaths. If it involves injustice or danger, the exercise is not to put up with it, but to act calmly.',
  pm:'At what moment today did I fight with something that had already happened? What would have changed if I had accepted it?'}},

{tag:ACT,grc:'Πᾶν πρᾶγμα δύο ἔχει λαβάς, τὴν μὲν φορητήν, τὴν δὲ ἀφόρητον.',src:['Εγχειρίδιο 43','Enchiridion 43'],
 el:{t:'Τα δύο χερούλια',
  tr:'Κάθε πράγμα έχει δύο χερούλια: από το ένα σηκώνεται, από το άλλο όχι. Αν ο αδελφός σου σε αδικεί, μην το πιάσεις από το χερούλι «με αδίκησε» — από εκεί δεν σηκώνεται. Πιάσ’ το από το άλλο: «είναι αδελφός μου, μεγαλώσαμε μαζί». Από εκεί θα μπορέσεις να το σηκώσεις.',
  simple:'Φανταστείτε μια βαριά κανάτα με δύο χερούλια, το ένα ραγισμένο. Αν την πιάσετε από το ραγισμένο, θα σας πέσει. Έτσι και κάθε δυσκολία με έναν άνθρωπο: έχει μια πλευρά που πονά και μια πλευρά που μπορούμε να κρατήσουμε.\n\nΟ Επίκτητος δεν λέει ότι η αδικία δεν έγινε. Λέει ότι, αν κρατάμε μόνο αυτό που πόνεσε, το βάρος θα μας λυγίσει. Αν θυμηθούμε και τον δεσμό που μας ενώνει με τον άλλον, βρίσκουμε τη δύναμη να το σηκώσουμε.',
  life:'Η κόρη σας ξέχασε να σας πάρει τηλέφωνο στη γιορτή σας. Το χερούλι που δεν σηκώνεται: «δεν με σκέφτεται». Το χερούλι που σηκώνεται: «είναι παιδί μου, με αγαπά, και τρέχει όλη μέρα με δουλειά και υποχρεώσεις». Με το πρώτο, κλείνεστε στη στενοχώρια. Με το δεύτερο, της τηλεφωνείτε εσείς — και η μέρα τελειώνει με χαμόγελο.',
  am:'Πείτε: «Σήμερα, σε κάθε δυσκολία, θα ψάξω το χερούλι που σηκώνεται.»',
  ex:'Σκεφτείτε έναν άνθρωπο που σας πίκρανε. Γράψτε δύο γραμμές: «Το χερούλι που δεν σηκώνεται» (π.χ. «μου είπε άσχημα λόγια») και «Το χερούλι που σηκώνεται» — κάτι άλλο, εξίσου αληθινό («είναι αδελφός μου», «κι αυτός παλεύει με τα δικά του», «μου έχει δώσει και πολλά καλά»). Αν μπορείτε, πείτε του σήμερα μια καλή κουβέντα — χωρίς να ξεχάσετε τα όριά σας.',
  pm:'Από ποιο χερούλι έπιασα σήμερα τις δυσκολίες μου; Ποια σχέση μου θα ελάφρυνε αν άλλαζα χερούλι;'},
 en:{t:'The two handles',
  tr:'Everything has two handles: by one it can be lifted, by the other it cannot. If your brother wrongs you, do not take it by the handle “he wronged me” — it cannot be lifted that way. Take it by the other: “he is my brother, we grew up together”. That way you will be able to lift it.',
  simple:'Imagine a heavy jug with two handles, one of them cracked. If you grab the cracked one, it will fall. So it is with every difficulty with a person: it has a side that hurts and a side we can hold on to.\n\nEpictetus does not say the wrong did not happen. He says that if we hold only what hurt, the weight will bend us. If we also remember the bond that unites us with the other, we find the strength to lift it.',
  life:'Your daughter forgot to call you on your name day. The handle that cannot be lifted: “she does not think of me”. The handle that can: “she is my child, she loves me, and she runs around all day with work and duties”. With the first, you sink into sadness. With the second, you call her yourself — and the day ends with a smile.',
  am:'Say: “Today, in every difficulty, I will look for the handle that can be lifted.”',
  ex:'Think of someone who has hurt you. Write two lines: “The handle that cannot be lifted” (e.g. “they said harsh words”) and “The handle that can” — something else, just as true (“he is my brother”, “they are struggling too”, “they have also given me much good”). If you can, say a kind word to them today — without forgetting your boundaries.',
  pm:'By which handle did I take my difficulties today? Which relationship would feel lighter if I changed handles?'}},

{tag:JUD,grc:'Λούεταί τις ταχέως· μὴ εἴπῃς ὅτι κακῶς, ἀλλ᾽ ὅτι ταχέως.',src:['Εγχειρίδιο 45','Enchiridion 45'],
 el:{t:'Μην κρίνεις βιαστικά',
  tr:'Κάποιος πλένεται βιαστικά; Μην πεις ότι πλένεται άσχημα — πες μόνο ότι πλένεται γρήγορα. Κάποιος πίνει πολύ κρασί; Μην πεις ότι κάνει κακό — πες μόνο ότι πίνει πολύ. Πριν μάθεις τον λόγο του, πώς ξέρεις ότι κάνει κακό;',
  simple:'Όταν βλέπουμε κάτι, συνήθως κάνουμε δύο πράγματα μαζί χωρίς να το καταλάβουμε: το περιγράφουμε και το κρίνουμε. Το «βιαστικά» το βλέπουμε· το «άσχημα» το προσθέτουμε εμείς.\n\nΣχεδόν ποτέ δεν ξέρουμε τι κουβαλά ο άλλος. Όποιος μαθαίνει να περιγράφει πριν κρίνει, γίνεται πιο δίκαιος με τους άλλους και πιο ήρεμος ο ίδιος. Και συχνά ανακαλύπτει ότι κρίνει και τον εαυτό του το ίδιο αυστηρά — άρα μπορεί να του δείξει την ίδια επιείκεια.',
  life:'Στην ουρά του σούπερ μάρκετ, κάποιος περνά μπροστά σας χωρίς να ρωτήσει. Η πρώτη σκέψη: «αγενής!». Η απλή περιγραφή: «πέρασε μπροστά μου». Λίγο μετά ακούτε ότι η γυναίκα του περιμένει στο αυτοκίνητο και δεν αισθάνεται καλά. Το γεγονός δεν άλλαξε — μόνο η κρίση μας, που ήταν βιαστική.',
  am:'Πείτε: «Σήμερα θα περιγράφω, πριν κρίνω.»',
  ex:'Τρεις φορές σήμερα, τη στιγμή που πάτε να πείτε «κακό», «άσχημο», «λάθος» ή «ανόητο», σταματήστε και πείτε μόνο αυτό που βλέπετε. Για παράδειγμα, όχι «οδηγεί σαν τρελός», αλλά «οδηγεί γρήγορα — ίσως βιάζεται για κάτι». Κάντε το ίδιο και για τον εαυτό σας: όχι «είμαι άχρηστος», αλλά «σήμερα ξέχασα κάτι».',
  pm:'Ποια κρίση μου σήμερα αποδείχθηκε βιαστική; Μήπως κρίνω και τον εαυτό μου το ίδιο αυστηρά;'},
 en:{t:'Do not judge in haste',
  tr:'Someone washes in a hurry? Do not say he washes badly — say only that he washes quickly. Someone drinks a lot of wine? Do not say he does wrong — say only that he drinks a lot. Until you know his reason, how do you know he does wrong?',
  simple:'When we see something, we usually do two things at once without noticing: we describe it and we judge it. “Quickly” is what we see; “badly” is what we add.\n\nWe almost never know what the other person carries. Whoever learns to describe before judging becomes fairer to others and calmer within. And often discovers that they judge themselves just as harshly — so they can show themselves the same kindness.',
  life:'In the supermarket queue, someone steps in front of you without asking. First thought: “how rude!”. The plain description: “he stepped in front of me”. A moment later you hear that his wife is waiting in the car and is unwell. The fact did not change — only our judgement, which was hasty.',
  am:'Say: “Today I will describe before I judge.”',
  ex:'Three times today, at the moment you are about to say “bad”, “ugly”, “wrong” or “stupid”, stop and say only what you see. Not “he drives like a madman” but “he drives fast — perhaps he is hurrying for something”. Do the same for yourself: not “I am useless” but “today I forgot something”.',
  pm:'Which of my judgements today proved hasty? Do I judge myself just as harshly?'}},

{tag:ACT,grc:'Πᾶσα ἕξις καὶ δύναμις ὑπὸ τῶν καταλλήλων ἔργων συνέχεται καὶ αὔξεται.',src:['Διατριβές Β΄ 18','Discourses II 18'],
 el:{t:'Η συνήθεια τρέφεται με πράξεις',
  tr:'Κάθε συνήθεια και κάθε ικανότητα δυναμώνει με τις αντίστοιχες πράξεις: το περπάτημα με το περπάτημα, το τρέξιμο με το τρέξιμο. Θέλεις να μη θυμώνεις; Μην τρέφεις τον θυμό. Μέτρα τις μέρες: «Θύμωνα κάθε μέρα· τώρα μέρα παρά μέρα· μετά κάθε τρεις, κάθε τέσσερις…»',
  simple:'Οι συνήθειες είναι σαν φυτά: μεγαλώνει εκείνο που ποτίζουμε. Κάθε φορά που υποχωρούμε σε μια παρόρμηση, την ποτίζουμε· κάθε φορά που λέμε «όχι τώρα», την αφήνουμε να μαραθεί λίγο.\n\nΔεν χρειάζεται ηρωισμός· χρειάζεται υπομονή, μέτρημα και μια καλή συνήθεια που μπαίνει στη θέση της παλιάς. Κι αν κάποια μέρα ξεφύγουμε, δεν χάθηκαν όλα — ο Επίκτητος μάς θέλει να ξαναρχίζουμε, όχι να τιμωρούμε τον εαυτό μας.',
  life:'Κάθε βράδυ, μόλις κάθεστε στον καναπέ, πιάνετε το κινητό «για πέντε λεπτά» — και περνά μία ώρα. Την πρώτη μέρα που θα το αφήσετε σε άλλο δωμάτιο θα είναι δύσκολο. Τη δέκατη, θα σας φαίνεται φυσικό. Δεν αλλάξατε με μια μεγάλη απόφαση· αλλάξατε με δέκα μικρά «όχι τώρα».',
  am:'Διαλέξτε μια μικρή συνήθεια που θέλετε να αδυνατίσει (γκρίνια, θυμός, κινητό, γλυκό, τσιγάρο) και μία καλή που θα μπει στη θέση της.',
  ex:'Όταν έρθει η παρόρμηση, μην την ταΐσετε: πείτε «όχι τώρα» και κάντε την καλή πράξη που διαλέξατε (π.χ. αντί για το κινητό, τρεις ανάσες στο παράθυρο). Βάλτε ένα ✓ σε ένα χαρτί κάθε φορά που αντέξατε. Αν ξεφύγετε, χωρίς τύψεις — απλώς ξαναρχίστε.',
  pm:'Πόσα ✓ μάζεψα σήμερα; Ποια συνήθεια έθρεψα — την παλιά ή τη νέα;'},
 en:{t:'Habits are fed by actions',
  tr:'Every habit and ability grows stronger through the matching actions: walking by walking, running by running. Do you wish not to be angry? Do not feed your anger. Count the days: “I used to be angry every day; now every other day; then every third, every fourth…”',
  simple:'Habits are like plants: the one we water is the one that grows. Each time we give in to an urge, we water it; each time we say “not now”, we let it wither a little.\n\nNo heroism is needed; we need patience, counting, and a good habit to take the place of the old one. And if one day we slip, all is not lost — Epictetus wants us to begin again, not to punish ourselves.',
  life:'Every evening, as soon as you sit on the sofa, you pick up the phone “for five minutes” — and an hour goes by. The first day you leave it in another room will be hard. By the tenth, it will feel natural. You did not change with one big decision; you changed with ten small “not now”s.',
  am:'Choose one small habit you want to weaken (complaining, anger, the phone, sweets, smoking) and one good habit to put in its place.',
  ex:'When the urge comes, do not feed it: say “not now” and do the good action you chose (e.g. instead of the phone, three breaths at the window). Put a ✓ on a piece of paper each time you held out. If you slip, no guilt — just begin again.',
  pm:'How many ✓ did I collect today? Which habit did I feed — the old or the new?'}},

{tag:ACT,grc:'Μηδαμοῦ σεαυτὸν εἴπῃς φιλόσοφον, μηδὲ λάλει τὸ πλέον ἐν ἰδιώταις περὶ τῶν θεωρημάτων, ἀλλὰ ποίει τὸ ἀπὸ τῶν θεωρημάτων.',src:['Εγχειρίδιο 46','Enchiridion 46'],
 el:{t:'Μη λες ότι είσαι φιλόσοφος — ζήσε το',
  tr:'Μη λες πουθενά ότι είσαι φιλόσοφος, και μη μιλάς πολύ για θεωρίες· κάνε αυτό που διδάσκουν. Ούτε τα πρόβατα φέρνουν το χορτάρι πίσω στον βοσκό για να δείξουν πόσο έφαγαν. Το χωνεύουν μέσα τους, και δίνουν μαλλί και γάλα.',
  simple:'Το πρόβατο δεν αποδεικνύει ότι έφαγε καλά δείχνοντας το χορτάρι· το δείχνει με όσα δίνει. Έτσι κι εμείς: η αξία όσων μάθαμε δεν φαίνεται από το πόσα ρητά θυμόμαστε, αλλά από το πώς ζούμε.\n\nΓια τους αρχαίους, η φιλοσοφία δεν ήταν βιβλία αλλά τρόπος ζωής. Ο Σωκράτης δεν έγραψε ούτε μία γραμμή, ούτε ο Επίκτητος. Το σημάδι ότι αυτές οι 7 μέρες έπιασαν τόπο είναι αν άλλαξε κάτι στον τρόπο που αντιδρούμε, κρίνουμε και φερόμαστε. Αυτοί είναι οι αληθινοί καρποί τους.',
  life:'Δύο φίλοι διαβάζουν το ίδιο βιβλίο για την υπομονή. Ο ένας λέει σε όλους πόσο σπουδαίο είναι. Ο άλλος δεν λέει τίποτα — αλλά την επόμενη φορά που ο εγγονός του ρίχνει κάτω το ποτήρι, δεν φωνάζει· σκύβει ήρεμα και το μαζεύουν μαζί. Ποιος από τους δύο έμαθε πραγματικά;',
  am:'Πείτε: «Σήμερα δεν θα μιλήσω για όσα έμαθα· θα τα ζήσω.»',
  ex:'Κάντε σήμερα μια καλή πράξη χωρίς να την πείτε σε κανέναν. Και διαλέξτε μία από τις έξι προηγούμενες ασκήσεις — αυτή που σας βοήθησε περισσότερο — για να τη συνεχίσετε μόνοι σας από αύριο, για έναν μήνα.',
  pm:'Ποιους καρπούς έδωσαν μέσα μου αυτές οι 7 μέρες; Τι κρατώ για τη ζωή μου;'},
 en:{t:'Do not call yourself a philosopher — live it',
  tr:'Never say you are a philosopher, and do not talk much about theories; do what they teach. Sheep do not bring the grass back to the shepherd to show how much they have eaten. They digest it within, and give wool and milk.',
  simple:'A sheep does not prove it ate well by showing the grass; it shows it by what it gives. So with us: the value of what we learned is not seen in how many sayings we remember, but in how we live.\n\nFor the ancients, philosophy was not books but a way of life. Socrates never wrote a single line, nor did Epictetus. The sign that these 7 days took root is whether something changed in how we react, judge and behave. Those are their true fruits.',
  life:'Two friends read the same book about patience. One tells everyone how wonderful it is. The other says nothing — but the next time his grandchild knocks over a glass, he does not shout; he bends down calmly and they pick it up together. Which of the two really learned?',
  am:'Say: “Today I will not talk about what I have learned; I will live it.”',
  ex:'Do one good deed today without telling anyone. And choose one of the six earlier exercises — the one that helped you most — to continue on your own from tomorrow, for a month.',
  pm:'What fruits have these 7 days borne in me? What do I keep for my life?'}}
 ]},

/* ============================ ΣΩΚΡΑΤΗΣ ============================ */
{id:'so',emoji:'🦉',cls:'c-so',name:['Σωκράτης','Socrates'],withName:['με τον Σωκράτη','with Socrates'],
 years:['470–399 π.Χ. · Ο άνθρωπος που ρωτούσε','470–399 BC · The man who asked questions'],
 bio:['<p>Ο Σωκράτης γεννήθηκε στην Αθήνα. Ο πατέρας του, ο Σωφρονίσκος, ήταν λιθοξόος και η μητέρα του, η Φαιναρέτη, μαμή. Ο ίδιος έλεγε ότι κάνει την ίδια δουλειά με τη μητέρα του: βοηθά τους ανθρώπους να «γεννήσουν» την αλήθεια που ήδη κουβαλούν μέσα τους — με ερωτήσεις. Γι’ αυτό ο τρόπος του λέγεται «μαιευτική μέθοδος».</p><p>Πολέμησε γενναία ως στρατιώτης, έζησε φτωχικά και περνούσε τις μέρες του στην αγορά συζητώντας με νέους και γέρους. Δεν έγραψε τίποτα· τα λόγια του τα γνωρίζουμε από τους μαθητές του, τον <b>Πλάτωνα</b> και τον <b>Ξενοφώντα</b>. Το 399 π.Χ. καταδικάστηκε άδικα σε θάνατο και ήπιε το κώνειο με γαλήνη, μένοντας πιστός σε όσα δίδασκε.</p>',
      '<p>Socrates was born in Athens. His father, Sophroniscus, was a stonemason and his mother, Phaenarete, a midwife. He said he did the same work as his mother: he helped people “give birth” to the truth they already carried within — through questions. That is why his way is called the “midwife method”.</p><p>He fought bravely as a soldier, lived simply and spent his days in the marketplace talking with young and old. He wrote nothing; we know his words from his students <b>Plato</b> and <b>Xenophon</b>. In 399 BC he was unjustly condemned to death and drank the hemlock calmly, faithful to what he taught.</p>'],
 cheer:['Ο Σωκράτης είπε στους δικαστές του: «Όσο ανασαίνω, δεν θα πάψω να αναζητώ τη σοφία» (Απολογία 29d).','Socrates told his judges: “As long as I draw breath, I will not stop seeking wisdom” (Apology 29d).'],
 fare:{grc:'οὐκ ἔστιν ἀνδρὶ ἀγαθῷ κακὸν οὐδὲν οὔτε ζῶντι οὔτε τελευτήσαντι.',src:['Πλάτων, Απολογία Σωκράτους 41d','Plato, Apology 41d'],
  tr:['Στον καλό άνθρωπο δεν μπορεί να συμβεί κανένα αληθινό κακό — ούτε όσο ζει, ούτε όταν πεθάνει.','No real harm can come to a good person — neither in life nor in death.']},
 days:[
{tag:['🔍 Αυτογνωσία','🔍 Self-knowledge'],grc:'Γνῶθι σαυτόν.',src:['Επιγραφή του μαντείου των Δελφών · Πλάτων, Φαίδρος 229e','Inscription at Delphi · Plato, Phaedrus 229e'],
 el:{t:'Γνώρισε τον εαυτό σου',
  tr:'Γνώρισε τον εαυτό σου.',
  simple:'Αυτή η φράση ήταν χαραγμένη στο μαντείο των Δελφών, και ο Σωκράτης την έκανε σκοπό της ζωής του. Έλεγε ότι δεν είχε χρόνο να ασχολείται με περίεργους μύθους, αφού ακόμη δεν είχε καταφέρει να γνωρίσει τον εαυτό του.\n\nΝα γνωρίσω τον εαυτό μου σημαίνει να ξέρω τι πραγματικά θέλω, τι με φοβίζει, πού είμαι δυνατός και πού αδύναμος, και ποιες είναι οι αξίες μου. Χωρίς αυτή τη γνώση ζούμε σαν να οδηγούμε χωρίς χάρτη: τρέχουμε, αλλά δεν ξέρουμε πού πάμε.',
  life:'Κάποιος θυμώνει κάθε φορά που του κάνουν μια παρατήρηση στη δουλειά, και πιστεύει ότι φταίνε οι άλλοι. Όταν σταματά και αναρωτιέται «γιατί με πειράζει τόσο;», ανακαλύπτει ότι από παιδί φοβόταν μήπως δεν είναι αρκετά καλός. Μόλις το καταλάβει, η επόμενη παρατήρηση δεν τον πληγώνει το ίδιο — γιατί τώρα ξέρει από πού έρχεται ο πόνος.',
  am:'Πείτε: «Σήμερα θα παρατηρώ τον εαυτό μου σαν να τον γνωρίζω για πρώτη φορά.»',
  ex:'Γράψτε σε ένα χαρτί τις απαντήσεις σε τρεις ερωτήσεις: 1) Τι με κάνει πραγματικά χαρούμενο; 2) Τι με θυμώνει πιο εύκολα; 3) Ποια αξία δεν θα πρόδιδα ποτέ; Μη βιαστείτε — η πρώτη απάντηση δεν είναι πάντα η αληθινή.',
  pm:'Τι έμαθα σήμερα για τον εαυτό μου που δεν το ήξερα;'},
 en:{t:'Know yourself',
  tr:'Know yourself.',
  simple:'This phrase was carved at the oracle of Delphi, and Socrates made it the purpose of his life. He said he had no time for curious myths, since he had not yet managed to know himself.\n\nTo know myself means to know what I truly want, what frightens me, where I am strong and where weak, and what my values are. Without this knowledge we live as if driving without a map: we rush, but we do not know where we are going.',
  life:'Someone gets angry every time he is corrected at work, and believes others are to blame. When he stops and asks himself “why does it bother me so much?”, he discovers that since childhood he has feared he is not good enough. Once he understands this, the next remark does not hurt in the same way — because now he knows where the pain comes from.',
  am:'Say: “Today I will observe myself as if meeting myself for the first time.”',
  ex:'Write on a piece of paper your answers to three questions: 1) What truly makes me happy? 2) What angers me most easily? 3) Which value would I never betray? Do not rush — the first answer is not always the true one.',
  pm:'What did I learn today about myself that I did not know?'}},

{tag:['🌾 Ταπεινότητα','🌾 Humility'],grc:'ἃ μὴ οἶδα οὐδὲ οἴομαι εἰδέναι.',src:['Πλάτων, Απολογία Σωκράτους 21d','Plato, Apology 21d'],
 el:{t:'Η σοφία του «δεν ξέρω»',
  tr:'Ό,τι δεν ξέρω, δεν νομίζω κιόλας ότι το ξέρω.',
  simple:'Το μαντείο των Δελφών είπε ότι κανείς δεν είναι σοφότερος από τον Σωκράτη. Εκείνος παραξενεύτηκε και πήγε να βρει ανθρώπους φημισμένους για τη σοφία τους. Ανακάλυψε ότι πολλοί νόμιζαν πως ξέρουν πράγματα που δεν ήξεραν. Η μόνη του διαφορά ήταν ότι εκείνος το παραδεχόταν.\n\nΑπό εδώ γεννήθηκε η γνωστή φράση «Ένα ξέρω, ότι δεν ξέρω τίποτα». Το «δεν ξέρω» δεν είναι ντροπή· είναι η πόρτα για να μάθουμε. Όποιος νομίζει ότι τα ξέρει όλα, έχει κλείσει αυτή την πόρτα.',
  life:'Σε μια οικογενειακή συζήτηση για ένα θέμα υγείας, όλοι λένε με σιγουριά τη γνώμη τους. Ένας μόνο λέει: «Δεν το ξέρω καλά — ας ρωτήσουμε τον γιατρό». Οι άλλοι ίσως τον θεωρήσουν λιγότερο έξυπνο. Στην πραγματικότητα είναι ο μόνος που προστάτεψε την οικογένεια από ένα λάθος.',
  am:'Πείτε: «Σήμερα δεν θα ντραπώ να πω “δεν ξέρω”.»',
  ex:'Σήμερα, τουλάχιστον μία φορά, όταν θα έχετε γνώμη για κάτι που δεν γνωρίζετε καλά, πείτε «δεν είμαι σίγουρος» και κάντε μια ερώτηση αντί να δώσετε απάντηση. Ακούστε προσεκτικά τι θα μάθετε.',
  pm:'Πού νόμισα σήμερα ότι ξέρω κάτι, ενώ δεν το ήξερα; Τι έμαθα όταν ρώτησα;'},
 en:{t:'The wisdom of “I do not know”',
  tr:'What I do not know, I do not think I know either.',
  simple:'The oracle of Delphi said that no one was wiser than Socrates. Puzzled, he went looking for people famous for their wisdom. He found that many thought they knew things they did not. His only difference was that he admitted it.\n\nFrom this came the famous phrase “I know one thing: that I know nothing”. “I do not know” is no shame; it is the door to learning. Whoever thinks they know everything has closed that door.',
  life:'In a family discussion about a health matter, everyone states their opinion with certainty. Only one says: “I do not know this well — let us ask the doctor”. The others may think him less clever. In reality he is the only one who protected the family from a mistake.',
  am:'Say: “Today I will not be ashamed to say ‘I do not know’.”',
  ex:'Today, at least once, when you have an opinion about something you do not know well, say “I am not sure” and ask a question instead of giving an answer. Listen carefully to what you learn.',
  pm:'Where did I think today that I knew something I did not? What did I learn when I asked?'}},

{tag:['🪞 Αυτοεξέταση','🪞 Self-examination'],grc:'ὁ δὲ ἀνεξέταστος βίος οὐ βιωτὸς ἀνθρώπῳ.',src:['Πλάτων, Απολογία Σωκράτους 38a','Plato, Apology 38a'],
 el:{t:'Η ζωή που αξίζει',
  tr:'Μια ζωή που δεν την εξετάζουμε, δεν αξίζει να τη ζει ο άνθρωπος.',
  simple:'Ο Σωκράτης το είπε στο δικαστήριο, όταν του έδιναν τη δυνατότητα να σωθεί αν σταματούσε να συζητά και να ρωτά. Προτίμησε να μείνει πιστός στον τρόπο που ζούσε.\n\nΤι σημαίνει «να εξετάζω τη ζωή μου»; Να σταματώ πού και πού και να ρωτώ: Γιατί το κάνω αυτό; Είναι σωστό; Με κάνει καλύτερο άνθρωπο; Χωρίς αυτές τις ερωτήσεις, οι μέρες περνούν σαν με αυτόματο πιλότο — και μια μέρα αναρωτιόμαστε πού πήγαν τα χρόνια.',
  life:'Κάποιος δουλεύει χρόνια ως τα μεσάνυχτα «για την οικογένεια». Ένα βράδυ σταματά και ρωτά τον εαυτό του: «Τι θέλει πραγματικά η οικογένειά μου από μένα;» Η απάντηση δεν είναι περισσότερα χρήματα — είναι ο ίδιος, στο τραπέζι, την ώρα του φαγητού. Μία ερώτηση άλλαξε τη ζωή όλου του σπιτιού.',
  am:'Πείτε: «Σήμερα θα ζήσω με τα μάτια ανοιχτά.»',
  ex:'Διαλέξτε μια συνηθισμένη σας δραστηριότητα (δουλειά, τηλεόραση, κινητό, μια συζήτηση) και ρωτήστε: «Γιατί το κάνω; Με κάνει καλύτερο; Θα το διάλεγα αν το σκεφτόμουν από την αρχή;»',
  pm:'Ποια πράξη μου σήμερα άξιζε, και ποια την έκανα από απλή συνήθεια;'},
 en:{t:'The life worth living',
  tr:'A life we do not examine is not worth living for a human being.',
  simple:'Socrates said this in court, when he was offered the chance to save himself if he stopped discussing and questioning. He chose to stay faithful to the way he lived.\n\nWhat does it mean “to examine my life”? To stop now and then and ask: Why am I doing this? Is it right? Does it make me a better person? Without these questions, the days pass on autopilot — and one day we wonder where the years went.',
  life:'Someone works until midnight for years “for the family”. One evening he stops and asks himself: “What does my family really want from me?” The answer is not more money — it is him, at the table, at dinner time. One question changed the life of the whole household.',
  am:'Say: “Today I will live with my eyes open.”',
  ex:'Choose one of your usual activities (work, television, the phone, a conversation) and ask: “Why do I do this? Does it make me better? Would I choose it if I thought about it from the start?”',
  pm:'Which of my actions today was worthwhile, and which did I do out of mere habit?'}},

{tag:['💛 Η ψυχή','💛 The soul'],grc:'χρημάτων μὲν οὐκ αἰσχύνῃ ἐπιμελούμενος ὅπως σοι ἔσται ὡς πλεῖστα…, φρονήσεως δὲ καὶ ἀληθείας καὶ τῆς ψυχῆς ὅπως ὡς βελτίστη ἔσται οὐκ ἐπιμελῇ οὐδὲ φροντίζεις;',src:['Πλάτων, Απολογία Σωκράτους 29d–e','Plato, Apology 29d–e'],
 el:{t:'Φρόντισε την ψυχή σου',
  tr:'Δεν ντρέπεσαι να φροντίζεις πώς θα αποκτήσεις όσο περισσότερα χρήματα γίνεται, ενώ για τη φρόνηση, για την αλήθεια και για το πώς θα γίνει η ψυχή σου όσο καλύτερη γίνεται, δεν νοιάζεσαι καθόλου;',
  simple:'Αυτή την ερώτηση έκανε ο Σωκράτης σε κάθε Αθηναίο που συναντούσε. Δεν έλεγε ότι τα χρήματα είναι κακά. Έλεγε ότι βάζουμε τη σειρά ανάποδα: φροντίζουμε πρώτα όσα έχουμε, και τελευταίο αυτό που είμαστε.\n\nΤο σώμα το ταΐζουμε κάθε μέρα, το σπίτι το καθαρίζουμε, το αυτοκίνητο το πάμε για σέρβις. Την ψυχή μας — την καλοσύνη, την ειλικρίνεια, την ηρεμία μας — πόσο συχνά τη φροντίζουμε;',
  life:'Ένας νέος περνά τρεις ώρες τη μέρα στο γυμναστήριο και στο κινητό του κοιτάζει ρούχα και αυτοκίνητα. Όταν η γιαγιά του αρρωσταίνει, δεν «βρίσκει χρόνο» να την επισκεφτεί. Το σώμα του είναι γυμνασμένο· η καρδιά του όμως έμεινε αγύμναστη. Δέκα λεπτά δίπλα της θα τον έκαναν πιο πλούσιο από οτιδήποτε μπορεί να αγοράσει.',
  am:'Πείτε: «Σήμερα θα δώσω στην ψυχή μου τουλάχιστον όσο χρόνο δίνω στο κινητό μου.»',
  ex:'Αφιερώστε σήμερα 15 λεπτά μόνο στην ψυχή σας: ένα ήσυχο περπάτημα, μια προσευχή ή λίγη σιωπή, ένα καλό βιβλίο, μια συγγνώμη που χρωστάτε, ή ένα τηλεφώνημα σε κάποιον που είναι μόνος.',
  pm:'Τι έκανα σήμερα για την ψυχή μου; Τι θα ήθελα να κάνω αύριο;'},
 en:{t:'Care for your soul',
  tr:'Are you not ashamed to care about how to get as much money as possible, while for wisdom, for truth, and for how your soul may become as good as possible, you do not care at all?',
  simple:'Socrates asked this question of every Athenian he met. He did not say money is bad. He said we get the order backwards: we care first for what we have, and last for what we are.\n\nWe feed the body every day, clean the house, take the car for a service. Our soul — our kindness, honesty, calm — how often do we care for it?',
  life:'A young man spends three hours a day at the gym and browses clothes and cars on his phone. When his grandmother falls ill, he “cannot find time” to visit her. His body is fit; his heart has stayed untrained. Ten minutes at her side would make him richer than anything he could buy.',
  am:'Say: “Today I will give my soul at least as much time as I give my phone.”',
  ex:'Give 15 minutes today to your soul alone: a quiet walk, a prayer or some silence, a good book, an apology you owe, or a call to someone who is alone.',
  pm:'What did I do today for my soul? What would I like to do tomorrow?'}},

{tag:['⚖️ Δικαιοσύνη','⚖️ Justice'],grc:'οὔτε ἄρα ἀνταδικεῖν δεῖ οὔτε κακῶς ποιεῖν οὐδένα ἀνθρώπων, οὐδ’ ἂν ὁτιοῦν πάσχῃ ὑπ’ αὐτῶν.',src:['Πλάτων, Κρίτων 49c','Plato, Crito 49c'],
 el:{t:'Μην ανταποδίδεις το κακό',
  tr:'Δεν πρέπει να απαντάμε στην αδικία με αδικία, ούτε να κάνουμε κακό σε κανέναν άνθρωπο — ό,τι κι αν μας έχει κάνει.',
  simple:'Ο Σωκράτης το είπε στη φυλακή, λίγες μέρες πριν πεθάνει, άδικα καταδικασμένος. Ο φίλος του ο Κρίτων του πρότεινε να δραπετεύσει. Εκείνος αρνήθηκε: δεν ήθελε να απαντήσει στην αδικία με μια δική του αδικία.\n\nΤην εποχή του οι περισσότεροι πίστευαν ότι ο σωστός άνθρωπος κάνει καλό στους φίλους και κακό στους εχθρούς. Ο Σωκράτης είπε κάτι επαναστατικό: το κακό που κάνουμε βλάπτει πρώτα τη δική μας ψυχή. Η εκδίκηση δεν διορθώνει τίποτα· απλώς πολλαπλασιάζει το κακό. Αυτό δεν σημαίνει ότι δεν προστατεύουμε τον εαυτό μας — σημαίνει ότι δεν γινόμαστε κι εμείς σαν αυτόν που μας πλήγωσε.',
  life:'Ένας γείτονας παρκάρει συνεχώς μπροστά στην πόρτα σας. Ο πειρασμός είναι να του κλείσετε κι εσείς το αυτοκίνητο, «να δει πώς είναι». Μετά θα σας απαντήσει εκείνος, και ο πόλεμος δεν θα τελειώσει ποτέ. Μια ήρεμη, σταθερή κουβέντα — κι αν χρειαστεί, η αρμόδια αρχή — λύνει το πρόβλημα χωρίς να σας κάνει κι εσάς κακό γείτονα.',
  am:'Πείτε: «Σήμερα δεν θα απαντήσω στο κακό με κακό.»',
  ex:'Σκεφτείτε κάποιον με τον οποίο έχετε «ανοιχτούς λογαριασμούς». Αποφασίστε μία πράξη που θα σταματήσει τον κύκλο: μια ήρεμη κουβέντα, ένα «καλημέρα», ή απλώς να μην πείτε σήμερα κάτι άσχημο γι’ αυτόν. Αν υπάρχει κίνδυνος, προστατέψτε τον εαυτό σας — αυτό δεν είναι εκδίκηση.',
  pm:'Πότε ένιωσα σήμερα την επιθυμία να ανταποδώσω; Τι έκανα τελικά;'},
 en:{t:'Do not repay evil with evil',
  tr:'We must not answer injustice with injustice, nor do harm to any human being — whatever they may have done to us.',
  simple:'Socrates said this in prison, a few days before his death, unjustly condemned. His friend Crito urged him to escape. He refused: he would not answer injustice with an injustice of his own.\n\nIn his time most people believed the right thing was to help friends and harm enemies. Socrates said something revolutionary: the harm we do damages our own soul first. Revenge fixes nothing; it only multiplies the harm. This does not mean we do not protect ourselves — it means we do not become like the one who hurt us.',
  life:'A neighbour keeps parking in front of your door. The temptation is to block his car too, “so he sees how it feels”. Then he will retaliate, and the war will never end. A calm, firm conversation — and if needed, the proper authority — solves the problem without making you a bad neighbour too.',
  am:'Say: “Today I will not answer harm with harm.”',
  ex:'Think of someone with whom you have “unsettled accounts”. Decide on one act that will stop the cycle: a calm talk, a “good morning”, or simply not saying anything bad about them today. If there is danger, protect yourself — that is not revenge.',
  pm:'When did I feel the urge to retaliate today? What did I do in the end?'}},

{tag:['🌱 Λιτότητα','🌱 Simplicity'],grc:'ἐγὼ δὲ νομίζω τὸ μὲν μηδενὸς δεῖσθαι θεῖον εἶναι, τὸ δ’ ὡς ἐλαχίστων ἐγγυτάτω τοῦ θείου.',src:['Ξενοφών, Απομνημονεύματα Α΄ 6.10','Xenophon, Memorabilia I 6.10'],
 el:{t:'Ο πλούτος των λίγων αναγκών',
  tr:'Εγώ πιστεύω ότι το να μη χρειάζεσαι τίποτα είναι θεϊκό, και το να χρειάζεσαι όσο γίνεται λιγότερα είναι το πιο κοντινό στο θεϊκό.',
  simple:'Ο Σωκράτης περπατούσε συνήθως ξυπόλυτος, φορούσε το ίδιο απλό ρούχο χειμώνα-καλοκαίρι και έτρωγε λιτά — κι όμως ήταν από τους πιο ευδιάθετους ανθρώπους της Αθήνας. Λέγεται ότι, κοιτάζοντας την πλούσια πραμάτεια στην αγορά, είπε: «Πόσα πράγματα υπάρχουν που δεν τα χρειάζομαι!»\n\nΚάθε ανάγκη είναι και μια μικρή αλυσίδα: όσο περισσότερα «πρέπει να έχω», τόσο περισσότερο άγχος και τόσο λιγότερη ελευθερία. Όποιος χρειάζεται λίγα, δύσκολα φοβάται και δύσκολα εξαγοράζεται.',
  life:'Δύο φίλοι πηγαίνουν διακοπές. Ο ένας έχει τρεις βαλίτσες και αγχώνεται συνεχώς μήπως χαθεί κάτι. Ο άλλος έχει ένα σακίδιο και απολαμβάνει τη θάλασσα. Το ίδιο ισχύει και στη ζωή: λιγότερα πράγματα, λιγότερες έγνοιες, περισσότερος χρόνος για όσα αγαπάμε.',
  am:'Πείτε: «Σήμερα θα προσέξω πόσα πράγματα δεν χρειάζομαι.»',
  ex:'Πριν αγοράσετε σήμερα οτιδήποτε δεν είναι απαραίτητο, περιμένετε 24 ώρες. Και βρείτε στο σπίτι ένα πράγμα που δεν χρησιμοποιείτε και χαρίστε το σε κάποιον που το χρειάζεται.',
  pm:'Ποια «ανάγκη» μου αποδείχθηκε σήμερα απλή επιθυμία;'},
 en:{t:'The wealth of few needs',
  tr:'I believe that to need nothing is divine, and to need as little as possible is closest to the divine.',
  simple:'Socrates usually walked barefoot, wore the same simple cloak winter and summer, and ate plainly — yet he was one of the most cheerful people in Athens. It is said that, looking at the rich goods in the market, he remarked: “How many things there are that I do not need!”\n\nEvery need is also a small chain: the more things I “must have”, the more anxiety and the less freedom. Whoever needs little is hard to frighten and hard to buy.',
  life:'Two friends go on holiday. One has three suitcases and worries constantly about losing something. The other has one backpack and enjoys the sea. The same is true in life: fewer things, fewer worries, more time for what we love.',
  am:'Say: “Today I will notice how many things I do not need.”',
  ex:'Before buying anything today that is not essential, wait 24 hours. And find one thing at home you do not use and give it to someone who needs it.',
  pm:'Which of my “needs” turned out today to be just a wish?'}},

{tag:['🙏 Εσωτερική ομορφιά','🙏 Inner beauty'],grc:'δοίητέ μοι καλῷ γενέσθαι τἄνδοθεν· ἔξωθεν δὲ ὅσα ἔχω, τοῖς ἐντὸς εἶναί μοι φίλια.',src:['Πλάτων, Φαίδρος 279b–c','Plato, Phaedrus 279b–c'],
 el:{t:'Ομορφιά από μέσα',
  tr:'Δώστε μου να γίνω όμορφος μέσα μου· κι όσα έχω απ’ έξω, να είναι φίλοι με όσα έχω μέσα.',
  simple:'Αυτή είναι η προσευχή του Σωκράτη στο τέλος του «Φαίδρου». Δεν ζητά πλούτη, υγεία ή δόξα. Ζητά δύο πράγματα: να γίνει καλός και όμορφος μέσα του, και η εξωτερική του ζωή — τα πράγματα, τα λόγια, οι πράξεις — να ταιριάζει με την εσωτερική.\n\nΣυνεχίζει ζητώντας να θεωρεί πλούσιο τον σοφό, και να έχει τόσα χρήματα όσα μπορεί να διαχειριστεί ένας συνετός άνθρωπος. Αυτό είναι το νόημα όλων των ημερών με τον Σωκράτη: να είμαστε ίδιοι μέσα κι έξω — αληθινοί.',
  life:'Μια κυρία δεν είναι πια νέα και δεν φοράει ακριβά ρούχα. Όμως όταν μπαίνει σε ένα δωμάτιο, όλοι ηρεμούν· τα παιδιά τρέχουν κοντά της· οι φίλοι της τη ζητούν όταν δυσκολεύονται. Η ομορφιά της δεν είναι στο πρόσωπο αλλά στην καλοσύνη της. Αυτή η ομορφιά δεν γερνά ποτέ.',
  am:'Πείτε την προσευχή του Σωκράτη: «Να γίνω όμορφος μέσα μου, κι όσα έχω απ’ έξω να ταιριάζουν με όσα έχω μέσα.»',
  ex:'Κάντε σήμερα μια καλή πράξη χωρίς να τη μάθει κανείς. Και διαλέξτε μία από τις έξι προηγούμενες ασκήσεις — αυτή που σας βοήθησε περισσότερο — για να τη συνεχίσετε για έναν μήνα.',
  pm:'Τι κρατώ από τις 7 ημέρες με τον Σωκράτη; Πού ταιριάζει ήδη ο «έξω» εαυτός μου με τον «μέσα»;'},
 en:{t:'Beauty from within',
  tr:'Grant that I may become beautiful within; and that whatever I have outside may be friends with what is within.',
  simple:'This is Socrates’ prayer at the end of the “Phaedrus”. He does not ask for wealth, health or fame. He asks for two things: to become good and beautiful within, and for his outward life — things, words, deeds — to match the inner one.\n\nHe goes on to ask that he may count the wise man rich, and have only as much money as a sensible person can manage. This is the meaning of all the days with Socrates: to be the same inside and out — true.',
  life:'A lady is no longer young and does not wear expensive clothes. Yet when she enters a room, everyone calms down; children run to her; her friends seek her out when things are hard. Her beauty is not in her face but in her kindness. That beauty never grows old.',
  am:'Say Socrates’ prayer: “May I become beautiful within, and may what I have outside match what I have within.”',
  ex:'Do one good deed today without anyone knowing. And choose one of the six earlier exercises — the one that helped you most — to continue for a month.',
  pm:'What do I keep from the 7 days with Socrates? Where does my “outer” self already match my “inner” self?'}}
 ]},

/* ============================ ΖΗΝΩΝ Ο ΚΙΤΙΕΥΣ ============================ */
{id:'ze',emoji:'⚓',cls:'c-ze',name:['Ζήνων ο Κιτιεύς','Zeno of Citium'],withName:['με τον Ζήνωνα τον Κιτιέα','with Zeno of Citium'],
 years:['Περίπου 334–262 π.Χ. · Ο Κύπριος ιδρυτής της Στοάς','c. 334–262 BC · The Cypriot founder of Stoicism'],
 bio:['<p>Ο Ζήνων γεννήθηκε στο <b>Κίτιο της Κύπρου</b> — τη σημερινή Λάρνακα. Ήταν έμπορος, ώσπου ένα ναυάγιο τον έφερε στην Αθήνα χωρίς τίποτα. Εκεί ανακάλυψε τη φιλοσοφία, μαθήτευσε για χρόνια κοντά σε σπουδαίους δασκάλους και τελικά άρχισε να διδάσκει στην <b>Ποικίλη Στοά</b>, μια ζωγραφισμένη στοά της αρχαίας αγοράς.</p><p>Από τη «Στοά» πήραν το όνομά τους οι <b>Στωικοί</b> — η φιλοσοφική σχολή που αργότερα ενέπνευσε τον Επίκτητο, τον Σενέκα και τον αυτοκράτορα Μάρκο Αυρήλιο. Οι Αθηναίοι τον τίμησαν με χρυσό στεφάνι και δημόσιο τάφο στον Κεραμεικό, γιατί η ζωή του συμφωνούσε με όσα δίδασκε. Είναι ένας από τους πιο σπουδαίους φιλοσόφους που χάρισε η Κύπρος στον κόσμο.</p>',
      '<p>Zeno was born in <b>Citium (Kition), Cyprus</b> — today’s Larnaca. He was a merchant until a shipwreck brought him to Athens with nothing. There he discovered philosophy, studied for years with great teachers, and finally began teaching at the <b>Painted Stoa</b>, a decorated colonnade in the ancient marketplace.</p><p>From the “Stoa” the <b>Stoics</b> took their name — the school that later inspired Epictetus, Seneca and the emperor Marcus Aurelius. The Athenians honoured him with a golden crown and a public tomb in the Kerameikos, because his life matched what he taught. He is one of the greatest philosophers Cyprus has given the world.</p>'],
 cheer:['Ο Ζήνων έλεγε ότι το καλό χτίζεται λίγο-λίγο — αλλά δεν είναι καθόλου λίγο (Διογένης Λαέρτιος Ζ΄ 26).','Zeno said that goodness is built little by little — but it is no little thing (Diogenes Laertius VII 26).'],
 fare:{grc:'παράδειγμα τὸν ἴδιον βίον ἐκθεὶς ἅπασιν ἀκόλουθον ὄντα τοῖς λόγοις οἷς διελέγετο.',src:['Ψήφισμα των Αθηναίων για τον Ζήνωνα · Διογένης Λαέρτιος Ζ΄ 10','Decree of the Athenians for Zeno · Diogenes Laertius VII 10'],
  tr:['Έδωσε σε όλους ως παράδειγμα τη δική του ζωή, που συμφωνούσε με όσα δίδασκε.','He offered his own life to all as an example, in harmony with the words he taught.']},
 days:[
{tag:['⚓ Νέα αρχή','⚓ New beginnings'],grc:'νῦν εὐπλόηκα, ὅτε νεναυάγηκα.',src:['Διογένης Λαέρτιος, Βίοι Φιλοσόφων Ζ΄ 4','Diogenes Laertius, Lives of the Philosophers VII 4'],
 el:{t:'Το ναυάγιο που έγινε αρχή',
  tr:'Τώρα που ναυάγησα, έκανα το καλύτερο ταξίδι της ζωής μου.',
  simple:'Ο Ζήνων ήταν έμπορος από το Κίτιο. Το πλοίο του, φορτωμένο με πορφύρα, ναυάγησε κοντά στον Πειραιά και έχασε τα πάντα. Στην Αθήνα μπήκε σε ένα βιβλιοπωλείο και άκουσε κάποιον να διαβάζει για τον Σωκράτη. Ρώτησε πού βρίσκονται τέτοιοι άνθρωποι — και ο βιβλιοπώλης τού έδειξε τον φιλόσοφο Κράτη που περνούσε εκείνη τη στιγμή. Από εκείνη τη μέρα ο Ζήνων έγινε φιλόσοφος.\n\nΧρόνια αργότερα, κοιτάζοντας πίσω, είπε αυτή τη φράση. Η μεγαλύτερη καταστροφή του έγινε η πόρτα για τη ζωή που πραγματικά άξιζε. Δεν ξέρουμε πάντα από την πρώτη στιγμή αν κάτι είναι συμφορά ή αρχή.',
  life:'Κάποιος χάνει τη δουλειά του στα 50 και νιώθει ότι τελείωσαν όλα. Αναγκάζεται να ξαναβρεί τι αγαπά· ανοίγει ένα μικρό εργαστήρι με αυτό που πάντα ήθελε να κάνει. Δέκα χρόνια μετά λέει: «Αν δεν με είχαν απολύσει, δεν θα είχα ζήσει ποτέ τη ζωή που ήθελα».',
  am:'Πείτε: «Ό,τι κι αν μου συμβεί σήμερα, μπορεί να είναι η αρχή για κάτι καλό.»',
  ex:'Θυμηθείτε μια δυσκολία ή αποτυχία του παρελθόντος. Γράψτε τρία καλά πράγματα που ήρθαν στη ζωή σας εξαιτίας της — ένα μάθημα, έναν άνθρωπο, μια νέα δύναμη.',
  pm:'Υπάρχει σήμερα κάποιο «ναυάγιο» στη ζωή μου που μπορεί να γίνει καινούριο ξεκίνημα;'},
 en:{t:'The shipwreck that became a beginning',
  tr:'Now that I have been shipwrecked, I have made the best voyage of my life.',
  simple:'Zeno was a merchant from Citium. His ship, loaded with purple dye, was wrecked near Piraeus and he lost everything. In Athens he walked into a bookshop and heard someone reading about Socrates. He asked where such men could be found — and the bookseller pointed to the philosopher Crates, who happened to be passing by. From that day Zeno became a philosopher.\n\nYears later, looking back, he said this phrase. His greatest disaster became the door to the life truly worth living. We do not always know at first whether something is a misfortune or a beginning.',
  life:'Someone loses his job at 50 and feels everything is over. He is forced to rediscover what he loves; he opens a small workshop doing what he always wanted. Ten years later he says: “If they had not let me go, I would never have lived the life I wanted.”',
  am:'Say: “Whatever happens to me today may be the beginning of something good.”',
  ex:'Recall a difficulty or failure from the past. Write three good things that came into your life because of it — a lesson, a person, a new strength.',
  pm:'Is there a “shipwreck” in my life today that could become a new start?'}},

{tag:['👂 Ακρόαση','👂 Listening'],grc:'δύο ὦτα ἔχομεν, στόμα δὲ ἕν, ἵνα πλείω μὲν ἀκούωμεν, ἥττονα δὲ λέγωμεν.',src:['Διογένης Λαέρτιος Ζ΄ 23','Diogenes Laertius VII 23'],
 el:{t:'Δύο αυτιά και ένα στόμα',
  tr:'Έχουμε δύο αυτιά και ένα στόμα, για να ακούμε περισσότερα και να μιλάμε λιγότερα.',
  simple:'Ο Ζήνων το είπε σε έναν νέο που φλυαρούσε ασταμάτητα. Με χιούμορ τού έδειξε ότι η ίδια η φύση μάς διδάσκει την αναλογία: διπλάσιο άκουσμα από ομιλία.\n\nΌταν ακούμε πραγματικά, μαθαίνουμε, καταλαβαίνουμε τον άλλον και αποφεύγουμε παρεξηγήσεις. Οι περισσότεροι άνθρωποι δεν ακούνε για να καταλάβουν· ακούνε για να απαντήσουν. Το καλό άκουσμα είναι από τα πιο σπάνια και πολύτιμα δώρα που μπορούμε να δώσουμε.',
  life:'Ο έφηβος γιος γυρίζει στενοχωρημένος από το σχολείο. Ο πατέρας αμέσως αρχίζει τις συμβουλές: «Να κάνεις αυτό, να μην κάνεις εκείνο». Το παιδί κλείνεται στο δωμάτιο. Την επόμενη φορά ο πατέρας απλώς κάθεται δίπλα του και λέει: «Πες μου τι έγινε» — και ακούει. Το παιδί μιλά μισή ώρα. Και στο τέλος ρωτά μόνο του: «Εσύ τι θα έκανες;»',
  am:'Πείτε: «Σήμερα θα ακούω διπλάσια από όσα μιλώ.»',
  ex:'Σε μία συζήτηση σήμερα, μη διακόψετε καθόλου. Όταν ο άλλος τελειώσει, πείτε με δικά σας λόγια τι καταλάβατε («Δηλαδή εννοείς ότι…») πριν πείτε τη γνώμη σας.',
  pm:'Ποιον άκουσα σήμερα πραγματικά; Τι έμαθα που δεν θα μάθαινα αν μιλούσα εγώ;'},
 en:{t:'Two ears and one mouth',
  tr:'We have two ears and one mouth, so that we may listen more and speak less.',
  simple:'Zeno said this to a young man who chattered endlessly. With humour he showed him that nature itself teaches the ratio: twice as much listening as speaking.\n\nWhen we truly listen, we learn, understand the other and avoid misunderstandings. Most people do not listen to understand; they listen to reply. Good listening is one of the rarest and most precious gifts we can give.',
  life:'A teenage son comes home upset from school. His father immediately starts advising: “Do this, do not do that”. The boy shuts himself in his room. The next time the father simply sits beside him and says: “Tell me what happened” — and listens. The boy talks for half an hour. And at the end he asks on his own: “What would you have done?”',
  am:'Say: “Today I will listen twice as much as I speak.”',
  ex:'In one conversation today, do not interrupt at all. When the other person finishes, say in your own words what you understood (“So you mean that…”) before giving your opinion.',
  pm:'Whom did I truly listen to today? What did I learn that I would not have learned if I had been talking?'}},

{tag:['🌿 Αρμονία','🌿 Harmony'],grc:'τέλος εἶπε τὸ ὁμολογουμένως τῇ φύσει ζῆν.',src:['Διογένης Λαέρτιος Ζ΄ 87','Diogenes Laertius VII 87'],
 el:{t:'Ζωή σε αρμονία με τη φύση',
  tr:'Ο σκοπός της ζωής είναι να ζούμε σε αρμονία με τη φύση.',
  simple:'Αυτή ήταν η καρδιά της διδασκαλίας του Ζήνωνα. «Φύση» για τους Στωικούς σημαίνει δύο πράγματα: τον κόσμο γύρω μας, με τους νόμους και τους ρυθμούς του, και τη δική μας ανθρώπινη φύση — τη λογική και την καλοσύνη που έχουμε μέσα μας.\n\nΝα ζω «σε αρμονία» σημαίνει να μη ζω σαν να πολεμώ τη ζωή: να σέβομαι το σώμα μου, τους ρυθμούς της ημέρας, τους άλλους ανθρώπους, και να ακολουθώ τη λογική και όχι κάθε παρόρμηση. Όπως ένα δέντρο μεγαλώνει ήσυχα σύμφωνα με τη φύση του, έτσι κι ο άνθρωπος ανθίζει όταν ζει σύμφωνα με τη δική του.',
  life:'Κάποιος κοιμάται κάθε βράδυ στις 3 τα ξημερώματα μπροστά στην τηλεόραση, τρώει όρθιος και πίνει πέντε καφέδες για να αντέξει. Αναρωτιέται γιατί είναι πάντα κουρασμένος και νευρικός. Όταν αρχίζει να κοιμάται νωρίτερα και να βγαίνει λίγο στον ήλιο το πρωί, νιώθει διαφορά μέσα σε λίγες εβδομάδες. Απλώς σταμάτησε να πηγαίνει κόντρα στη φύση του.',
  am:'Βγείτε για λίγο έξω ή ανοίξτε το παράθυρο. Πάρτε τρεις ανάσες και πείτε: «Είμαι κι εγώ μέρος της φύσης.»',
  ex:'Κάντε σήμερα ένα πράγμα «σύμφωνα με τη φύση»: ένα περπάτημα στο φως της ημέρας, ένα φαγητό καθιστοί και χωρίς βιασύνη, ή ύπνο μία ώρα νωρίτερα. Παρατηρήστε πώς νιώθετε.',
  pm:'Πού πήγα σήμερα κόντρα στη φύση μου, και πού έζησα σε αρμονία μαζί της;'},
 en:{t:'Living in harmony with nature',
  tr:'The goal of life is to live in harmony with nature.',
  simple:'This was the heart of Zeno’s teaching. For the Stoics, “nature” means two things: the world around us, with its laws and rhythms, and our own human nature — the reason and kindness we carry within.\n\nTo live “in harmony” means not to live as if at war with life: to respect my body, the rhythms of the day, other people, and to follow reason rather than every impulse. As a tree grows quietly according to its nature, so a person flourishes when living according to theirs.',
  life:'Someone falls asleep every night at 3 a.m. in front of the television, eats standing up and drinks five coffees to keep going. He wonders why he is always tired and irritable. When he starts going to bed earlier and getting a little morning sun, he feels the difference within a few weeks. He simply stopped going against his own nature.',
  am:'Step outside for a moment or open the window. Take three breaths and say: “I too am part of nature.”',
  ex:'Do one thing today “according to nature”: a walk in daylight, a meal sitting down without hurry, or going to bed an hour earlier. Notice how you feel.',
  pm:'Where did I go against my nature today, and where did I live in harmony with it?'}},

{tag:['🤝 Φιλία','🤝 Friendship'],grc:'ἐρωτηθεὶς τίς ἐστι φίλος, «ἄλλος», ἔφη, «ἐγώ».',src:['Διογένης Λαέρτιος Ζ΄ 23','Diogenes Laertius VII 23'],
 el:{t:'Ο φίλος, ένας άλλος εαυτός',
  tr:'Όταν τον ρώτησαν τι είναι φίλος, απάντησε: «Ένας άλλος εαυτός μου».',
  simple:'Με δύο λέξεις ο Ζήνων είπε κάτι πολύ βαθύ. Ο αληθινός φίλος δεν είναι κάποιος που μας χρησιμεύει, αλλά κάποιος που τον αγαπάμε όπως τον εαυτό μας: χαιρόμαστε με τη χαρά του, πονάμε με τον πόνο του, θέλουμε το καλό του χωρίς να περιμένουμε αντάλλαγμα.\n\nΟι Στωικοί έλεγαν ότι η αληθινή φιλία στηρίζεται στην αρετή και όχι στο συμφέρον. Θέλει χρόνο, προσοχή και ειλικρίνεια — όπως ένας κήπος που θέλει πότισμα.',
  life:'Δύο φίλοι γνωρίζονται από το δημοτικό. Ο ένας μετακομίζει στο εξωτερικό και τα χρόνια περνούν. Όταν ο άλλος αρρωσταίνει, ο φίλος του παίρνει το πρώτο αεροπλάνο χωρίς να του το ζητήσει κανείς. «Γιατί ήρθες;» τον ρωτά. «Γιατί αν ήμουν εγώ στη θέση σου, εσύ θα είχες έρθει ήδη.» Αυτός είναι ο «άλλος εαυτός».',
  am:'Σκεφτείτε έναν φίλο σας και πείτε: «Σήμερα θα του φερθώ όπως θα ήθελα να μου φερθεί.»',
  ex:'Επικοινωνήστε σήμερα με έναν φίλο που έχετε καιρό να μιλήσετε — όχι για να ζητήσετε κάτι, αλλά μόνο για να ρωτήσετε «Πώς είσαι;» και να ακούσετε την απάντηση.',
  pm:'Τι φίλος ήμουν σήμερα; Ποιος είναι ο δικός μου «άλλος εαυτός»;'},
 en:{t:'A friend, another self',
  tr:'When asked what a friend is, he answered: “Another I.”',
  simple:'In two words Zeno said something very deep. A true friend is not someone useful to us, but someone we love as ourselves: we rejoice in their joy, hurt with their pain, wish them well without expecting anything back.\n\nThe Stoics said true friendship rests on virtue, not on interest. It needs time, attention and honesty — like a garden that needs watering.',
  life:'Two friends have known each other since primary school. One moves abroad and the years go by. When the other falls ill, his friend takes the first plane without being asked. “Why did you come?” he asks. “Because if I were in your place, you would already be here.” That is the “other self”.',
  am:'Think of a friend and say: “Today I will treat them as I would like to be treated.”',
  ex:'Contact a friend today you have not spoken to for a long time — not to ask for anything, only to ask “How are you?” and listen to the answer.',
  pm:'What kind of friend was I today? Who is my “other self”?'}},

{tag:['🗣️ Ο λόγος μας','🗣️ Our words'],grc:'κρεῖττον ἔλεγε τοῖς ποσὶν ὀλισθεῖν ἢ τῇ γλώττῃ.',src:['Διογένης Λαέρτιος Ζ΄ 26','Diogenes Laertius VII 26'],
 el:{t:'Πρόσεχε τη γλώσσα σου',
  tr:'Έλεγε ότι είναι καλύτερο να γλιστρήσεις με τα πόδια, παρά με τη γλώσσα.',
  simple:'Αν γλιστρήσουμε στον δρόμο, θα πονέσουμε λίγο και θα σηκωθούμε. Αν «γλιστρήσει» η γλώσσα μας — μια σκληρή κουβέντα, ένα κουτσομπολιό, ένα ψέμα — η πληγή μπορεί να μείνει για χρόνια, και η λέξη δεν γυρίζει πίσω.\n\nΟ Ζήνων δεν μας λέει να σωπαίνουμε πάντα. Μας λέει να σκεφτόμαστε πριν μιλήσουμε. Ένα απλό φίλτρο βοηθά: Είναι αληθινό; Είναι καλό; Είναι χρήσιμο; Αν όχι, ίσως είναι καλύτερα να μείνει ανείπωτο.',
  life:'Σε ένα οικογενειακό τραπέζι, μέσα στα νεύρα, κάποιος λέει στον αδελφό του: «Πάντα ήσουν αποτυχημένος». Του πήρε δέκα δευτερόλεπτα να το πει. Τα αδέλφια έκαναν τρία χρόνια να ξαναμιλήσουν. Αν είχε σταματήσει για τρία δευτερόλεπτα, πόσος πόνος θα είχε γλιτώσει.',
  am:'Πείτε: «Σήμερα θα σκέφτομαι πριν μιλήσω.»',
  ex:'Σήμερα, πριν πείτε κάτι για κάποιον που δεν είναι παρών, περάστε το από τα τρία φίλτρα: αληθινό; καλό; χρήσιμο; Κι αν σας ξεφύγει μια άσχημη κουβέντα, ζητήστε συγγνώμη την ίδια μέρα.',
  pm:'Ποια κουβέντα μου σήμερα θα ήθελα να την είχα πει διαφορετικά; Ποια μου βγήκε καλή;'},
 en:{t:'Mind your tongue',
  tr:'He used to say it is better to slip with the feet than with the tongue.',
  simple:'If we slip on the street, we hurt a little and get up. If our tongue “slips” — a harsh word, gossip, a lie — the wound may last for years, and the word cannot be taken back.\n\nZeno does not tell us to always stay silent. He tells us to think before we speak. A simple filter helps: Is it true? Is it kind? Is it useful? If not, perhaps it is better left unsaid.',
  life:'At a family dinner, in a moment of anger, someone tells his brother: “You have always been a failure.” It took ten seconds to say. The brothers did not speak for three years. Had he paused for three seconds, how much pain would have been spared.',
  am:'Say: “Today I will think before I speak.”',
  ex:'Today, before saying anything about someone who is not present, pass it through the three filters: true? kind? useful? And if a harsh word slips out, apologise the same day.',
  pm:'Which of my words today would I have liked to say differently? Which came out well?'}},

{tag:['🧱 Υπομονή','🧱 Patience'],grc:'ἔλεγε δὲ τὸ εὖ γίνεσθαι παρὰ μικρὸν μέν, οὐ μὴν μικρὸν εἶναι.',src:['Διογένης Λαέρτιος Ζ΄ 26','Diogenes Laertius VII 26'],
 el:{t:'Λίγο-λίγο, αλλά όχι λίγο',
  tr:'Έλεγε ότι το καλό χτίζεται λίγο-λίγο — αλλά δεν είναι καθόλου λίγο.',
  simple:'Με ένα λογοπαίγνιο ο Ζήνων μάς θυμίζει δύο πράγματα. Πρώτον, η καλή ζωή δεν έρχεται με μια μεγάλη απόφαση, αλλά με μικρά βήματα, μέρα με τη μέρα. Δεύτερον, αυτά τα μικρά βήματα, όταν μαζευτούν, κάνουν κάτι πολύ μεγάλο.\n\nΤο ίδιο έκανε κι ο ίδιος: μαθήτευσε πολλά χρόνια πριν ανοίξει δική του σχολή. Δεν βιάστηκε. Όπως η σταγόνα τρυπά την πέτρα όχι με τη δύναμη αλλά με την επιμονή, έτσι αλλάζει και ο χαρακτήρας μας.',
  life:'Κάποιος θέλει να μάθει κιθάρα. Τις πρώτες μέρες παίζει τρεις ώρες, απογοητεύεται και τα παρατά. Ένας άλλος παίζει μόνο δέκα λεπτά κάθε μέρα. Μετά από έναν χρόνο, ο δεύτερος παίζει τα αγαπημένα του τραγούδια — τα δέκα λεπτά έγιναν πάνω από εξήντα ώρες.',
  am:'Διαλέξτε ένα μικρό καλό βήμα που μπορείτε να κάνετε σε 10 λεπτά σήμερα.',
  ex:'Κάντε σήμερα το μικρό βήμα που διαλέξατε (10 λεπτά περπάτημα, διάβασμα, τακτοποίηση, μια προσευχή). Σημειώστε το σε ένα χαρτί. Αύριο, κάντε το ξανά.',
  pm:'Ποιο μικρό καλό έκανα σήμερα; Τι θα γίνει αν το κάνω κάθε μέρα για έναν χρόνο;'},
 en:{t:'Little by little — but no little thing',
  tr:'He used to say that goodness is built little by little — but it is no little thing.',
  simple:'With a play on words, Zeno reminds us of two things. First, a good life does not come from one big decision, but from small steps, day by day. Second, these small steps, added together, make something very great.\n\nHe did the same himself: he studied for many years before opening his own school. He did not hurry. As the drop wears away the stone not by force but by persistence, so our character changes.',
  life:'Someone wants to learn the guitar. In the first days he plays for three hours, gets discouraged and gives up. Another plays only ten minutes every day. After a year, the second plays his favourite songs — the ten minutes became more than sixty hours.',
  am:'Choose one small good step you can take in 10 minutes today.',
  ex:'Take the small step you chose today (a 10-minute walk, reading, tidying, a prayer). Note it on a piece of paper. Tomorrow, do it again.',
  pm:'What small good did I do today? What will happen if I do it every day for a year?'}},

{tag:['☀️ Ευδαιμονία','☀️ Happiness'],grc:'εὐδαιμονία δ’ ἐστὶν εὔροια βίου.',src:['Ζήνων, απόσπασμα · Στοβαίος, Ανθολόγιο Β΄ 7','Zeno, fragment · Stobaeus, Anthology II 7'],
 el:{t:'Η ευτυχία είναι ζωή που κυλά ομαλά',
  tr:'Η ευτυχία είναι μια ζωή που κυλά ομαλά — σαν ποτάμι.',
  simple:'Για τον Ζήνωνα η ευτυχία δεν είναι στιγμιαίος ενθουσιασμός, ούτε ζωή χωρίς προβλήματα. Είναι σαν ένα ποτάμι που κυλά ήρεμα: συναντά πέτρες, στροφές και καταρράκτες, αλλά συνεχίζει τον δρόμο του χωρίς να χάνει τον εαυτό του.\n\nΑυτή η «καλή ροή» έρχεται όταν δένουν μαζί όλα όσα είδαμε αυτές τις μέρες: όταν ακούμε, προσέχουμε τα λόγια μας, ζούμε σε αρμονία με τη φύση, έχουμε καλούς φίλους και χτίζουμε το καλό λίγο-λίγο. Τότε η ζωή δεν γίνεται εύκολη — γίνεται όμως ήρεμη και γεμάτη νόημα.',
  life:'Δύο άνθρωποι κερδίζουν το ίδιο ποσό σε ένα λαχείο. Ο ένας χαίρεται για λίγους μήνες και μετά γυρίζει στην παλιά του γκρίνια. Ο άλλος, που ήταν ήδη ήρεμος και ευγνώμων, συνεχίζει να είναι ευτυχισμένος — με ή χωρίς τα χρήματα. Η ευτυχία του δεν ερχόταν απ’ έξω· κυλούσε από μέσα.',
  am:'Πείτε: «Σήμερα θα αφήσω τη ζωή να κυλήσει, και θα κάνω το καλύτερο σε κάθε στροφή της.»',
  ex:'Κάντε σήμερα μια καλή πράξη χωρίς να τη μάθει κανείς. Και διαλέξτε μία από τις έξι προηγούμενες ασκήσεις — αυτή που σας βοήθησε περισσότερο — για να τη συνεχίσετε για έναν μήνα.',
  pm:'Πού «κύλησε» σήμερα ομαλά η ζωή μου; Τι κρατώ από τις 7 ημέρες με τον Ζήνωνα;'},
 en:{t:'Happiness is a life that flows smoothly',
  tr:'Happiness is a life that flows smoothly — like a river.',
  simple:'For Zeno, happiness is not a passing thrill, nor a life without problems. It is like a river flowing calmly: it meets stones, bends and waterfalls, but keeps on its way without losing itself.\n\nThis “good flow” comes when everything we saw these days comes together: when we listen, mind our words, live in harmony with nature, have good friends, and build goodness little by little. Then life does not become easy — but it becomes calm and full of meaning.',
  life:'Two people win the same amount in a lottery. One is happy for a few months and then returns to his old complaining. The other, who was already calm and grateful, stays happy — with or without the money. His happiness did not come from outside; it flowed from within.',
  am:'Say: “Today I will let life flow, and do my best at every bend.”',
  ex:'Do one good deed today without anyone knowing. And choose one of the six earlier exercises — the one that helped you most — to continue for a month.',
  pm:'Where did my life “flow” smoothly today? What do I keep from the 7 days with Zeno?'}}
 ]},
/* ===== 25-10-2026: Πυθαγόρας · Αριστοτέλης · Σενέκας · Επίκουρος · Καντ ===== */
{"id": "py", "emoji": "🔺", "cls": "c-py", "name": ["Πυθαγόρας", "Pythagoras"], "withName": ["με τον Πυθαγόρα", "with Pythagoras"], "years": ["Περίπου 570–495 π.Χ. · Ο πρώτος «φιλόσοφος»", "c. 570–495 BC · The first “philosopher”"], "bio": ["<p>Ο Πυθαγόρας γεννήθηκε στη <b>Σάμο</b>. Ταξίδεψε πολύ για να μάθει και τελικά εγκαταστάθηκε στον <b>Κρότωνα</b> της Νότιας Ιταλίας. Εκεί ίδρυσε μια κοινότητα όπου άντρες και γυναίκες ζούσαν απλά, μοιράζονταν τα αγαθά τους και ασκούνταν καθημερινά στη σιωπή, στη μουσική και στην αυτοεξέταση. Οι νέοι μαθητές, λέγεται, έμεναν στην αρχή χρόνια ολόκληρα σιωπηλοί, μόνο για να ακούν.</p><p>Λέγεται ότι πρώτος αυτός ονόμασε τον εαυτό του <b>«φιλόσοφο»</b>, δηλαδή φίλο της σοφίας, όχι σοφό. Τον θυμόμαστε για το θεώρημα των τριγώνων, αλλά για εκείνον οι αριθμοί και η μουσική έδειχναν κάτι βαθύτερο: ότι ο κόσμος είναι <b>αρμονία</b>, και ότι και η ψυχή μπορεί να «κουρδιστεί». Ο ίδιος δεν άφησε γραπτά. Τα λόγια αυτών των ημερών είναι κυρίως από τα <b>«Χρυσά Έπη»</b>, ένα ποίημα που έγραψαν αργότερα οι μαθητές του για να κρατήσουν ζωντανή τη διδασκαλία του.</p>", "<p>Pythagoras was born on <b>Samos</b>. He travelled widely to learn and finally settled in <b>Croton</b> in southern Italy. There he founded a community where men and women lived simply, shared their goods, and practised silence, music and self-examination every day. New students, it is said, first spent years in silence, only listening.</p><p>He is said to have been the first to call himself a <b>“philosopher”</b>, a friend of wisdom rather than a wise man. We remember him for the theorem about triangles, but for him numbers and music revealed something deeper: that the world is <b>harmony</b>, and that the soul too can be “tuned”. He left no writings himself. The sayings of these days come mostly from the <b>“Golden Verses”</b>, a poem written later by his followers to keep his teaching alive.</p>"], "cheer": ["Μια παλιά παροιμία, που οι αρχαίοι απέδιδαν στον Πυθαγόρα, λέει: «Η αρχή είναι το μισό του παντός.» Το πρώτο βήμα είναι το πιο δύσκολο, και το κάνατε ήδη.", "An old proverb, which the ancients attributed to Pythagoras, says: “The beginning is half of the whole.” The first step is the hardest, and you have already taken it."], "fare": {"grc": "ταῦτα πόνει, ταῦτ᾽ ἐκμελέτα, τούτων χρὴ ἐρᾶν σε· ταῦτά σε τῆς θείης ἀρετῆς εἰς ἴχνια θήσει.", "src": ["Χρυσά Έπη, στ. 45–46", "Golden Verses, lines 45–46"], "tr": ["Αυτά να δουλεύεις, αυτά να ασκείς, αυτά να αγαπήσεις. Αυτά θα σε βάλουν στα χνάρια της θεϊκής αρετής.", "Work at these things, practise them, learn to love them. They will set you on the path of divine virtue."]}, "days": [{"tag": ["🌙 Αυτοεξέταση", "🌙 Self-examination"], "grc": "Μηδ᾽ ὕπνον μαλακοῖσιν ἐπ᾽ ὄμμασι προσδέξασθαι, πρὶν τῶν ἡμερινῶν ἔργων τρὶς ἕκαστον ἐπελθεῖν· πῇ παρέβην; τί δ᾽ ἔρεξα; τί μοι δέον οὐκ ἐτελέσθη;", "src": ["Χρυσά Έπη, στ. 40–42", "Golden Verses, lines 40–42"], "el": {"t": "Οι τρεις ερωτήσεις του βραδιού", "tr": "Μην αφήσεις τον ύπνο να κλείσει τα μάτια σου πριν ξαναπεράσεις τρεις φορές από τον νου σου ό,τι έκανες τη μέρα: Πού έσφαλα; Τι καλό έκανα; Τι έπρεπε να κάνω και δεν το έκανα;", "simple": "Κάθε βράδυ οι Πυθαγόρειοι, πριν κοιμηθούν, έκαναν ένα μικρό «ταμείο» της ημέρας. Δεν το έκαναν για να τιμωρήσουν τον εαυτό τους. Το έκαναν για να μαθαίνουν. Όπως ο μουσικός κουρδίζει κάθε μέρα το όργανό του, έτσι κι αυτοί «κούρδιζαν» την ψυχή τους.\n\nΟι τρεις ερωτήσεις είναι απλές: Πού ξέφυγα; Τι πέτυχα; Τι ξέχασα; Η δεύτερη είναι το ίδιο σημαντική με την πρώτη. Χρειάζεται να βλέπουμε και το καλό που κάναμε, όχι μόνο τα λάθη. Αυτή η άσκηση είναι η καρδιά των επόμενων ημερών, γι’ αυτό την ξεκινάμε σήμερα.", "life": "Μια γιαγιά, πριν σβήσει το φως, σκέφτεται τη μέρα της. Λέει από μέσα της: «Μίλησα απότομα στον γείτονα. Βοήθησα την κόρη μου με το φαγητό. Ξέχασα να πάρω τηλέφωνο την αδελφή μου.» Το πρωί τηλεφωνεί στην αδελφή της και λέει μια καλημέρα στον γείτονα. Πέντε λεπτά το βράδυ έκαναν το επόμενο πρωί καλύτερο.", "am": "Πείτε: «Απόψε θα κοιτάξω τη μέρα μου με ειλικρίνεια και καλοσύνη.»", "ex": "Απόψε, στο κρεβάτι, απαντήστε στις τρεις ερωτήσεις: Πού έσφαλα; Τι καλό έκανα; Τι ξέχασα; Μία πρόταση για την καθεμιά, όχι περισσότερο.", "pm": "Πού έσφαλα σήμερα; Τι καλό έκανα; Τι ξέχασα να κάνω;"}, "en": {"t": "The three evening questions", "tr": "Do not let sleep close your eyes before you have gone over each deed of the day three times: Where did I go wrong? What good did I do? What should I have done that I left undone?", "simple": "Every evening, before sleep, the Pythagoreans took a small “inventory” of the day. They did not do it to punish themselves. They did it to learn. As a musician tunes the instrument every day, they “tuned” their souls.\n\nThe three questions are simple: Where did I slip? What did I do well? What did I forget? The second matters as much as the first. We need to see the good we did, not only the mistakes. This practice is the heart of the coming days, so we begin with it today.", "life": "Before turning off the light, a grandmother thinks over her day. She says to herself: “I spoke sharply to the neighbour. I helped my daughter with the cooking. I forgot to call my sister.” In the morning she calls her sister and greets the neighbour kindly. Five minutes in the evening made the next morning better.", "am": "Say: “Tonight I will look at my day with honesty and kindness.”", "ex": "Tonight, in bed, answer the three questions: Where did I go wrong? What good did I do? What did I forget? One sentence for each, no more.", "pm": "Where did I go wrong today? What good did I do? What did I forget to do?"}}, {"tag": ["🤝 Φιλία", "🤝 Friendship"], "grc": "κοινὰ τὰ φίλων εἶναι καὶ φιλίαν ἰσότητα.", "src": ["Διογένης Λαέρτιος, Βίοι Φιλοσόφων Η΄ 10", "Diogenes Laertius, Lives of the Philosophers VIII 10"], "el": {"t": "Των φίλων όλα είναι κοινά", "tr": "Των φίλων τα πράγματα είναι κοινά, και φιλία σημαίνει ισότητα.", "simple": "Στην κοινότητα του Πυθαγόρα οι φίλοι μοιράζονταν ό,τι είχαν. Η φράση έγινε τόσο γνωστή που την επαναλάμβαναν αιώνες μετά. Δεν σημαίνει ότι πρέπει να δίνουμε τα πάντα. Σημαίνει ότι στην αληθινή φιλία δεν μετράμε ποιος έδωσε περισσότερα.\n\nΤο δεύτερο μισό είναι εξίσου σοφό: «φιλία είναι ισότητα». Ανάμεσα σε φίλους δεν υπάρχει αφεντικό και υπάλληλος, πλούσιος και φτωχός, μορφωμένος και αμόρφωτος. Ο καθένας αξίζει όσο ο άλλος. Όπου ο ένας κοιτάζει τον άλλον από ψηλά, η φιλία μαραίνεται.", "life": "Δύο φίλοι γνωρίζονται πενήντα χρόνια. Ο ένας έγινε γιατρός, ο άλλος έμεινε στο χωριό με τα χωράφια. Όταν βρίσκονται, ο γιατρός ρωτά για τις ελιές και ο αγρότης για τα παιδιά του φίλου του. Κανείς δεν νιώθει μικρότερος. Μοιράζονται τον χρόνο τους, τα νέα τους και ένα πιάτο φαγητό. Αυτή είναι η «ισότητα» του Πυθαγόρα.", "am": "Πείτε: «Σήμερα θα μοιραστώ κάτι δικό μου με έναν φίλο.»", "ex": "Μοιραστείτε σήμερα κάτι με έναν φίλο ή γείτονα: ένα φρούτο, ένα βιβλίο, μια ώρα από τον χρόνο σας, μια καλή είδηση.", "pm": "Τι μοιράστηκα σήμερα; Υπάρχει φίλος που τον αντιμετωπίζω σαν μικρότερο ή μεγαλύτερο από μένα;"}, "en": {"t": "Among friends all things are shared", "tr": "Friends have all things in common, and friendship is equality.", "simple": "In Pythagoras’ community friends shared whatever they had. The phrase became so famous that people repeated it for centuries. It does not mean we must give everything away. It means that in true friendship we do not count who gave more.\n\nThe second half is just as wise: “friendship is equality”. Between friends there is no boss and employee, rich and poor, educated and uneducated. Each is worth as much as the other. Where one looks down on the other, friendship withers.", "life": "Two friends have known each other for fifty years. One became a doctor; the other stayed in the village with his fields. When they meet, the doctor asks about the olives and the farmer asks about his friend’s children. Neither feels smaller. They share their time, their news and a plate of food. This is Pythagoras’ “equality”.", "am": "Say: “Today I will share something of mine with a friend.”", "ex": "Share something today with a friend or neighbour: a piece of fruit, a book, an hour of your time, a piece of good news.", "pm": "What did I share today? Is there a friend I treat as smaller or greater than me?"}}, {"tag": ["🪞 Αυτοσεβασμός", "🪞 Self-respect"], "grc": "πάντων δὲ μάλιστ᾽ αἰσχύνεο σαυτόν.", "src": ["Χρυσά Έπη, στ. 12", "Golden Verses, line 12"], "el": {"t": "Ντροπή μπροστά στον εαυτό σου", "tr": "Πάνω απ’ όλους, να ντρέπεσαι τον εαυτό σου.", "simple": "Οι περισσότεροι προσέχουμε τι κάνουμε όταν μας βλέπουν οι άλλοι. Ο Πυθαγόρας λέει κάτι πιο βαθύ: ο πιο σημαντικός μάρτυρας της ζωής μας είμαστε εμείς οι ίδιοι. Αν κάνουμε κάτι άσχημο κρυφά, ο άνθρωπος που το ξέρει, ο εαυτός μας, είναι πάντα εκεί.\n\nΑυτή η «ντροπή» δεν είναι ενοχή που μας βαραίνει. Είναι σεβασμός προς τον εαυτό μας. Σαν να λέμε: «Αξίζω να ζω με τιμή, ακόμη κι όταν κανείς δεν κοιτάζει.» Όποιος σέβεται τον εαυτό του δεν χρειάζεται αστυνόμο για να είναι καλός.", "life": "Ένας ταμίας βρίσκει στο τέλος της μέρας είκοσι ευρώ παραπάνω στο ταμείο. Κανείς δεν θα το μάθαινε ποτέ. Τα επιστρέφει στον πελάτη που ξέρει ότι τα έχασε. Όταν τον ρωτούν γιατί, λέει: «Θέλω να κοιτάζω τον εαυτό μου στον καθρέφτη χωρίς να χαμηλώνω τα μάτια.»", "am": "Κοιτάξτε τον εαυτό σας στον καθρέφτη και πείτε: «Σήμερα θα ζήσω έτσι που να σε σέβομαι.»", "ex": "Κάντε σήμερα κάτι σωστό που δεν θα το δει κανείς: μαζέψτε ένα σκουπίδι από τον δρόμο, κρατήστε μια μικρή υπόσχεση, πείτε την αλήθεια σε κάτι μικρό.", "pm": "Έκανα σήμερα κάτι που θα ντρεπόμουν αν το έβλεπα σε άλλον; Τι έκανα που με κάνει να σέβομαι τον εαυτό μου;"}, "en": {"t": "Feel shame before yourself", "tr": "Above all, feel shame before yourself.", "simple": "Most of us are careful about what we do when others are watching. Pythagoras says something deeper: the most important witness of our life is ourselves. If we do something wrong in secret, the one person wh
