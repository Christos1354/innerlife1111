o knows, our own self, is always there.\n\nThis “shame” is not guilt that weighs us down. It is respect for ourselves. It is as if we say: “I deserve to live with honour, even when nobody is looking.” Whoever respects himself needs no policeman to be good.", "life": "At the end of the day a cashier finds twenty euros too much in the till. No one would ever know. He returns it to the customer he knows lost it. When asked why, he says: “I want to look at myself in the mirror without lowering my eyes.”", "am": "Look at yourself in the mirror and say: “Today I will live in a way that lets me respect you.”", "ex": "Do something right today that nobody will see: pick up litter from the street, keep a small promise, tell the truth about something small.", "pm": "Did I do anything today I would be ashamed to see in someone else? What did I do that makes me respect myself?"}}, {"tag": ["⚖️ Μέτρο", "⚖️ Measure"], "grc": "μέτρον δ᾽ ἐπὶ πᾶσιν ἄριστον.", "src": ["Χρυσά Έπη, στ. 38", "Golden Verses, line 38"], "el": {"t": "Το μέτρο είναι το καλύτερο", "tr": "Σε όλα, το μέτρο είναι το καλύτερο.", "simple": "Για τον Πυθαγόρα ο κόσμος είναι σαν μια μεγάλη χορδή. Αν την τεντώσεις πολύ, σπάει. Αν την αφήσεις χαλαρή, δεν βγάζει ήχο. Μόνο στο σωστό τέντωμα δίνει όμορφη μουσική. Το ίδιο ισχύει για τη ζωή μας: για τη δουλειά, το φαγητό, τον ύπνο, ακόμη και για την καλοσύνη.\n\nΜέτρο δεν σημαίνει μετριότητα ούτε φόβο. Σημαίνει να βρίσκουμε το «αρκετό». Ούτε τόσο λίγο ώστε να στερούμαστε, ούτε τόσο πολύ ώστε να κουραζόμαστε ή να βαριόμαστε. Ο άνθρωπος με μέτρο είναι σαν καλοκουρδισμένο όργανο.", "life": "Ένας συνταξιούχος, μόλις σταμάτησε τη δουλειά, άρχισε να βλέπει τηλεόραση οκτώ ώρες τη μέρα και ένιωθε όλο και πιο άδειος. Μετά βάλθηκε να κάνει τα πάντα: σύλλογοι, μαθήματα, εκδρομές, και εξαντλήθηκε. Τελικά βρήκε το μέτρο του: δύο δραστηριότητες την εβδομάδα, περίπατο το πρωί, ξεκούραση το απόγευμα. Τώρα λέει: «Επιτέλους η μέρα μου έχει μουσική.»", "am": "Πείτε: «Σήμερα θα ψάξω το “αρκετό” σε ό,τι κάνω.»", "ex": "Διαλέξτε ένα πράγμα που σήμερα το κάνετε «πολύ» ή «λίγο» (κινητό, φαγητό, ύπνος, δουλειά, περπάτημα) και φέρτε το λίγο πιο κοντά στο μέτρο.", "pm": "Πού ξεπέρασα σήμερα το μέτρο; Πού το βρήκα;"}, "en": {"t": "Measure is best", "tr": "In all things, measure is best.", "simple": "For Pythagoras the world is like a great string. Stretch it too far and it snaps. Leave it slack and it makes no sound. Only at the right tension does it give beautiful music. The same is true of our life: work, food, sleep, even kindness.\n\nMeasure does not mean mediocrity or fear. It means finding the “enough”. Not so little that we go without, not so much that we wear ourselves out or grow weary. A person with measure is like a well-tuned instrument.", "life": "When a man retired, he began watching television eight hours a day and felt emptier and emptier. Then he threw himself into everything (clubs, classes, trips) and became exhausted. In the end he found his measure: two activities a week, a walk in the morning, rest in the afternoon. Now he says: “At last my day has music.”", "am": "Say: “Today I will look for the ‘enough’ in everything I do.”", "ex": "Choose one thing you do “too much” or “too little” today (phone, food, sleep, work, walking) and bring it a little closer to measure.", "pm": "Where did I go beyond measure today? Where did I find it?"}}, {"tag": ["🍞 Φροντίδα του σώματος", "🍞 Care of the body"], "grc": "οὐδ᾽ ὑγιείης τῆς περὶ σῶμ᾽ ἀμέλειαν ἔχειν χρή, ἀλλὰ ποτοῦ τε μέτρον καὶ σίτου γυμνασίων τε ποιεῖσθαι.", "src": ["Χρυσά Έπη, στ. 32–34", "Golden Verses, lines 32–34"], "el": {"t": "Το σώμα είναι το σπίτι της ψυχής", "tr": "Μην αμελείς την υγεία του σώματός σου. Να έχεις μέτρο στο ποτό, στο φαγητό και στην άσκηση.", "simple": "Οι Πυθαγόρειοι δεν ήταν φιλόσοφοι μόνο του μυαλού. Πίστευαν ότι η ψυχή και το σώμα είναι σαν μουσικός και όργανο. Αν το όργανο είναι χαλασμένο, ακόμη και ο καλύτερος μουσικός δεν μπορεί να παίξει. Γι’ αυτό έτρωγαν απλά, περπατούσαν κάθε πρωί και πρόσεχαν τον ύπνο τους.\n\nΗ φροντίδα του σώματος δεν είναι ματαιοδοξία. Είναι ευγνωμοσύνη για το δώρο που μας δόθηκε. Και δεν χρειάζονται υπερβολές: λίγο νερό παραπάνω, ένα πιάτο πιο απλό, ένας περίπατος. Μικρά βήματα, κάθε μέρα.", "life": "Μια κυρία 70 χρονών άρχισε να περπατά μόνο δέκα λεπτά κάθε πρωί γύρω από το τετράγωνο. Μετά από δύο μήνες περπατούσε μισή ώρα, κοιμόταν καλύτερα και, όπως λέει, «σκεφτόταν πιο καθαρά». Το σώμα της ευχαρίστησε και την ψυχή της.", "am": "Πιείτε ένα ποτήρι νερό αργά και πείτε: «Σε ευχαριστώ, σώμα μου, που με κουβαλάς.»", "ex": "Κάντε σήμερα ένα μικρό καλό για το σώμα σας: έναν περίπατο 10 λεπτών, ένα γεύμα πιο απλό, ή να πέσετε για ύπνο μισή ώρα νωρίτερα. Αν έχετε θέμα υγείας, ακολουθήστε τις οδηγίες του γιατρού σας.", "pm": "Πώς φρόντισα σήμερα το σώμα μου; Τι μου ζήτησε και δεν του το έδωσα;"}, "en": {"t": "The body is the home of the soul", "tr": "Do not neglect the health of your body. Keep measure in drink, in food and in exercise.", "simple": "The Pythagoreans were not philosophers of the mind alone. They believed soul and body are like musician and instrument. If the instrument is broken, even the best musician cannot play. So they ate simply, walked every morning and took care of their sleep.\n\nCaring for the body is not vanity. It is gratitude for the gift we were given. And no excess is needed: a little more water, a simpler meal, a walk. Small steps, every day.", "life": "A 70-year-old woman began walking only ten minutes every morning around the block. Two months later she was walking half an hour, sleeping better and, as she says, “thinking more clearly”. Her body thanked her soul too.", "am": "Drink a glass of water slowly and say: “Thank you, my body, for carrying me.”", "ex": "Do one small good thing for your body today: a 10-minute walk, a simpler meal, or going to bed half an hour earlier. If you have a health condition, follow your doctor’s advice.", "pm": "How did I care for my body today? What did it ask of me that I did not give?"}}, {"tag": ["🧭 Σκέψη πριν την πράξη", "🧭 Think before acting"], "grc": "βουλεύου δὲ πρὸ ἔργου, ὅπως μὴ μωρὰ πέληται.", "src": ["Χρυσά Έπη, στ. 27", "Golden Verses, line 27"], "el": {"t": "Σκέψου πριν πράξεις", "tr": "Σκέψου πριν κάνεις κάτι, για να μη γίνει κάτι ανόητο.", "simple": "Πόσες φορές είπαμε μια κουβέντα και μετανιώσαμε αμέσως; Πόσες φορές αγοράσαμε κάτι βιαστικά, ή απαντήσαμε θυμωμένοι σε ένα μήνυμα; Ο Πυθαγόρας μάς δίνει μια απλή συμβουλή: ανάμεσα στο «θέλω» και στο «κάνω» να βάζουμε μια μικρή παύση.\n\nΑυτή η παύση δεν χρειάζεται να είναι μεγάλη. Μια ανάσα, μια νύχτα ύπνου, ένα ερώτημα: «Θα είμαι ευχαριστημένος με αυτό αύριο;» Οι περισσότερες ανοησίες γεννιούνται από τη βιασύνη. Οι περισσότερες σοφές πράξεις γεννιούνται από λίγη ησυχία.", "life": "Ένας άντρας λαμβάνει ένα προσβλητικό μήνυμα από έναν συγγενή. Γράφει μια σκληρή απάντηση, αλλά πριν την στείλει θυμάται τον κανόνα του: «Ποτέ θυμωμένος, ποτέ το βράδυ.» Το πρωί τη σβήνει και γράφει δύο ήρεμες γραμμές. Η σχέση τους σώθηκε χάρη σε μια νύχτα αναμονής.", "am": "Πείτε: «Σήμερα, πριν από κάθε σημαντική λέξη ή πράξη, θα πάρω μια ανάσα.»", "ex": "Σήμερα, πριν απαντήσετε σε κάτι που σας ενόχλησε ή πριν από μια αγορά, σταματήστε και μετρήστε αργά ως το δέκα. Αν μπορείτε, αφήστε το για αύριο.", "pm": "Πού βιάστηκα σήμερα; Πού με βοήθησε μια μικρή παύση;"}, "en": {"t": "Think before you act", "tr": "Think before you act, so that nothing foolish comes of it.", "simple": "How many times have we said something and regretted it at once? How often have we bought something in a hurry, or replied angrily to a message? Pythagoras gives simple advice: between “I want” and “I do”, put a small pause.\n\nThe pause need not be long. One breath, one night’s sleep, one question: “Will I be glad of this tomorrow?” Most foolish acts are born of haste. Most wise acts are born of a little stillness.", "life": "A man receives an insulting message from a relative. He writes a harsh reply, but before sending it he remembers his rule: “Never when angry, never at night.” In the morning he deletes it and writes two calm lines. Their relationship was saved by one night of waiting.", "am": "Say: “Today, before every important word or deed, I will take a breath.”", "ex": "Today, before you reply to something that annoyed you or before a purchase, stop and slowly count to ten. If you can, leave it until tomorrow.", "pm": "Where did I rush today? Where did a small pause help me?"}}, {"tag": ["🙏 Η αρχή με προσευχή", "🙏 Beginning with prayer"], "grc": "ἀλλ᾽ ἔρχευ ἐπ᾽ ἔργον θεοῖσιν ἐπευξάμενος τελέσαι.", "src": ["Χρυσά Έπη, στ. 48–49", "Golden Verses, lines 48–49"], "el": {"t": "Ξεκίνα κάθε έργο με μια ευχή", "tr": "Πήγαινε στη δουλειά σου αφού πρώτα προσευχηθείς στον Θεό να την τελειώσεις καλά.", "simple": "Ο Πυθαγόρας ζούσε σε άλλη εποχή και μιλούσε για «θεούς», όπως οι άνθρωποι του καιρού του. Η ιδέα του όμως αγγίζει κάθε άνθρωπο, όποια κι αν είναι η πίστη του: να ξεκινάμε ό,τι κάνουμε με ταπεινότητα και με μια καλή πρόθεση. Δεν είμαστε μόνοι μας ο κύριος του κόσμου.\n\nΗ προσευχή ή η ευχή πριν από ένα έργο δεν αντικαθιστά τον κόπο. Τον γεμίζει με νόημα. Μας θυμίζει γιατί κάνουμε αυτό που κάνουμε και μας δίνει ηρεμία για το αποτέλεσμα. Όποιος δεν πιστεύει μπορεί να πει απλά: «Ας γίνει αυτό με αγάπη και για καλό.»", "life": "Ένας φούρναρης, κάθε ξημέρωμα, πριν βάλει το πρώτο ψωμί στον φούρνο, κάνει ένα μικρό σημάδι πάνω στο ζυμάρι και λέει: «Να χορτάσει όποιος το φάει.» Η δουλειά του είναι ίδια με των άλλων φούρναρηδων, αλλά εκείνος την κάνει με χαρά. Οι πελάτες λένε ότι το ψωμί του «έχει ψυχή».", "am": "Πριν ξεκινήσετε την πρώτη δουλειά της ημέρας, πείτε μια σύντομη προσευχή ή ευχή, με τα δικά σας λόγια.", "ex": "Πριν από τρία πράγματα σήμερα (το φαγητό, μια δουλειά, μια συνάντηση) πείτε από μέσα σας μια ευχή. Και διαλέξτε από τις 7 ημέρες την άσκηση που σας βοήθησε περισσότερο, για να τη συνεχίσετε έναν μήνα.", "pm": "Πώς άλλαξε η μέρα μου όταν ξεκίνησα με μια ευχή; Τι κρατώ από τις 7 ημέρες με τον Πυθαγόρα;"}, "en": {"t": "Begin every task with a prayer", "tr": "Go to your work after first praying to God that you may complete it well.", "simple": "Pythagoras lived in another age and spoke of “gods”, as people did in his time. Yet his idea touches every person, whatever their faith: to begin whatever we do with humility and a good intention. We are not the sole masters of the world.\n\nA prayer or a wish before a task does not replace the effort. It fills it with meaning. It reminds us why we do what we do and gives us peace about the result. Someone who does not believe can simply say: “May this be done with love and for good.”", "life": "Every dawn, before putting the first loaf in the oven, a baker makes a small mark on the dough and says: “May whoever eats this be satisfied.” His work is the same as other bakers’, but he does it with joy. His customers say his bread “has a soul”.", "am": "Before starting the first task of the day, say a short prayer or wish in your own words.", "ex": "Before three things today (a meal, a task, a meeting) say a wish inwardly. And from the 7 days choose the exercise that helped you most, to continue for a month.", "pm": "How did my day change when I began with a wish? What do I keep from the 7 days with Pythagoras?"}}]},
{"id": "ar", "emoji": "📚", "cls": "c-ar", "name": ["Αριστοτέλης", "Aristotle"], "withName": ["με τον Αριστοτέλη", "with Aristotle"], "years": ["384–322 π.Χ. · Ο δάσκαλος της μεσότητας", "384–322 BC · The teacher of the golden mean"], "bio": ["<p>Ο Αριστοτέλης γεννήθηκε στα <b>Στάγειρα</b> της Χαλκιδικής. Ο πατέρας του ήταν γιατρός. Στα δεκαεπτά του πήγε στην Αθήνα και έμεινε είκοσι χρόνια μαθητής του <b>Πλάτωνα</b> στην Ακαδημία. Αργότερα έγινε δάσκαλος του νεαρού <b>Μεγάλου Αλεξάνδρου</b>.</p><p>Γυρίζοντας στην Αθήνα ίδρυσε δική του σχολή, το <b>Λύκειο</b>. Δίδασκε περπατώντας με τους μαθητές του στους κήπους, γι’ αυτό τους έλεγαν «Περιπατητικούς». Έγραψε για σχεδόν τα πάντα: φυσική, ζώα, ποίηση, πολιτική, λογική. Το πιο πρακτικό του βιβλίο όμως είναι τα <b>«Ηθικά Νικομάχεια»</b>, αφιερωμένα στον γιο του Νικόμαχο. Εκεί ρωτά: πώς ζει κανείς μια ευτυχισμένη ζωή; Τα περισσότερα λόγια αυτών των ημερών είναι από εκεί.</p>", "<p>Aristotle was born in <b>Stagira</b> in Chalcidice, northern Greece. His father was a doctor. At seventeen he went to Athens and spent twenty years as a student of <b>Plato</b> at the Academy. Later he became the teacher of the young <b>Alexander the Great</b>.</p><p>Back in Athens he founded his own school, the <b>Lyceum</b>. He taught while walking with his students in the gardens, so they were called the “Peripatetics” (the walkers). He wrote about almost everything: physics, animals, poetry, politics, logic. His most practical book, though, is the <b>“Nicomachean Ethics”</b>, dedicated to his son Nicomachus. There he asks: how does one live a happy life? Most of the sayings of these days come from it.</p>"], "cheer": ["Ο Αριστοτέλης έλεγε ότι οι ρίζες της παιδείας είναι πικρές, αλλά ο καρπός της γλυκός (Διογένης Λαέρτιος Ε΄ 18). Οι πρώτες μέρες θέλουν κόπο· ο καρπός έρχεται.", "Aristotle said that the roots of education are bitter, but its fruit is sweet (Diogenes Laertius V 18). The first days take effort; the fruit will come."], "fare": {"grc": "ἐφ᾽ ὅσον ἐνδέχεται ἀθανατίζειν καὶ πάντα ποιεῖν πρὸς τὸ ζῆν κατὰ τὸ κράτιστον τῶν ἐν αὑτῷ.", "src": ["Αριστοτέλης, Ηθικά Νικομάχεια Κ΄ 7, 1177b33", "Aristotle, Nicomachean Ethics X 7, 1177b33"], "tr": ["Όσο είναι δυνατόν, να υψωνόμαστε προς το αθάνατο και να κάνουμε τα πάντα για να ζούμε σύμφωνα με το καλύτερο που έχουμε μέσα μας.", "As far as we can, let us reach towards the immortal and do everything to live by the best that is in us."]}, "days": [{"tag": ["🔍 Περιέργεια", "🔍 Curiosity"], "grc": "Πάντες ἄνθρωποι τοῦ εἰδέναι ὀρέγονται φύσει.", "src": ["Μετά τα Φυσικά Α΄ 1, 980a21", "Metaphysics I 1, 980a21"], "el": {"t": "Όλοι διψάμε να μάθουμε", "tr": "Όλοι οι άνθρωποι, από τη φύση τους, επιθυμούν να μαθαίνουν.", "simple": "Με αυτή τη φράση ξεκινά ένα από τα μεγαλύτερα βιβλία του Αριστοτέλη. Το παιδί ρωτά «γιατί;» εκατό φορές τη μέρα, και ο Αριστοτέλης λέει ότι αυτό το «γιατί» δεν σβήνει ποτέ μέσα μας. Η μάθηση δεν είναι υποχρέωση του σχολείου. Είναι φυσική ανάγκη της ψυχής, όπως η πείνα για το σώμα.\n\nΚαι δεν έχει ηλικία. Όποιος συνεχίζει να μαθαίνει κρατά την ψυχή του νέα. Ένα καινούριο λουλούδι, μια λέξη σε άλλη γλώσσα, η ιστορία του χωριού μας: όλα είναι τροφή για την περιέργεια που μας χάρισε η φύση.", "life": "Ένας παππούς, στα 75 του, έμαθε από τον εγγονό του να βρίσκει στο κινητό τα ονόματα των αστεριών. Τώρα κάθε καθαρή νύχτα βγαίνει στην αυλή και ψάχνει ένα καινούριο. Λέει ότι νιώθει «σαν μαθητής ξανά» και ότι κοιμάται πιο ευτυχισμένος.", "am": "Πείτε: «Σήμερα θα μάθω κάτι καινούριο, όσο μικρό κι αν είναι.»", "ex": "Μάθετε σήμερα ένα καινούριο πράγμα: το όνομα ενός φυτού, μια λέξη σε άλλη γλώσσα, μια ιστορία από έναν ηλικιωμένο. Γράψτε το στις σημειώσεις σας.", "pm": "Τι καινούριο έμαθα σήμερα; Για τι θα ήθελα να μάθω περισσότερα;"}, "en": {"t": "We all long to know", "tr": "All human beings, by nature, desire to know.", "simple": "With this sentence one of Aristotle’s greatest books begins. A child asks “why?” a hundred times a day, and Aristotle says this “why” never dies within us. Learning is not a school duty. It is a natural need of the soul, like hunger for the body.\n\nAnd it has no age. Whoever keeps learning keeps the soul young. A new flower, a word in another language, the story of our village: all are food for the curiosity nature gave us.", "life": "At 75, a grandfather learned from his grandson how to find the names of the stars on his phone. Now every clear night he goes out into the yard and looks for a new one. He says he feels “like a student again” and that he sleeps happier.", "am": "Say: “Today I will learn something new, however small.”", "ex": "Learn one new thing today: the name of a plant, a word in another language, a story from an older person. Write it in your notes.", "pm": "What new thing did I learn today? What would I like to learn more about?"}}, {"tag": ["🔁 Συνήθεια", "🔁 Habit"], "grc": "τὰ μὲν δίκαια πράττοντες δίκαιοι γινόμεθα, τὰ δὲ σώφρονα σώφρονες, τὰ δ᾽ ἀνδρεῖα ἀνδρεῖοι.", "src": ["Ηθικά Νικομάχεια Β΄ 1, 1103a34–b2", "Nicomachean Ethics II 1, 1103a34–b2"], "el": {"t": "Γινόμαστε αυτό που κάνουμε", "tr": "Κάνοντας δίκαιες πράξεις γινόμαστε δίκαιοι, κάνοντας συνετές πράξεις γινόμαστε συνετοί, κάνοντας γενναίες πράξεις γινόμαστε γενναίοι.", "simple": "Ο Αριστοτέλης λέει κάτι πολύ ελπιδοφόρο: κανείς δεν γεννιέται έτοιμος καλός ή κακός. Η αρετή μαθαίνεται όπως η κιθάρα ή η κολύμβηση: με εξάσκηση. Δεν περιμένουμε πρώτα να «νιώσουμε» γενναίοι για να κάνουμε κάτι γενναίο. Κάνουμε το μικρό γενναίο βήμα, και σιγά-σιγά γινόμαστε γενναίοι.\n\nΑυτό σημαίνει ότι κάθε μέρα χτίζουμε τον χαρακτήρα μας με μικρές επιλογές. Μια ευγενική λέξη σήμερα, μια αύριο, και σε έναν χρόνο είμαστε ευγενικοί άνθρωποι χωρίς προσπάθεια. Ο χαρακτήρας είναι το άθροισμα των συνηθειών μας.", "life": "Μια κυρία ήταν πολύ ντροπαλή και δεν μιλούσε ποτέ στις συναντήσεις του συλλόγου. Αποφάσισε να λέει μία μόνο φράση σε κάθε συνάντηση, ακόμη κι αν έτρεμε η φωνή της. Μετά από έναν χρόνο την εξέλεξαν πρόεδρο. «Δεν έγινα θαρραλέα και μετά μίλησα», λέει. «Μίλησα, και έγινα θαρραλέα.»", "am": "Ρωτήστε τον εαυτό σας: «Τι άνθρωπος θέλω να γίνω;» Διαλέξτε μία αρετή για σήμερα (υπομονή, καλοσύνη, θάρρος).", "ex": "Κάντε σήμερα τρεις μικρές πράξεις της αρετής που διαλέξατε. Αν διαλέξατε την υπομονή, για παράδειγμα: περιμένετε στην ουρά χωρίς γκρίνια, ακούστε κάποιον μέχρι το τέλος, μην κορνάρετε.", "pm": "Ποια αρετή άσκησα σήμερα; Πόσο πιο εύκολη ήταν την τρίτη φορά από την πρώτη;"}, "en": {"t": "We become what we do", "tr": "By doing just acts we become just, by doing temperate acts temperate, by doing brave acts brave.", "simple": "Aristotle says something full of hope: no one is born ready-made good or bad. Virtue is learned like the guitar or swimming: by practice. We do not wait first to “feel” brave in order to do something brave. We take the small brave step, and little by little we become brave.\n\nThis means that every day we build our character through small choices. A kind word today, another tomorrow, and in a year we are kind people without effort. Character is the sum of our habits.", "life": "A woman was very shy and never spoke at her club’s meetings. She decided to say just one sentence at every meeting, even if her voice trembled. A year later they elected her president. “I didn’t become brave and then speak,” she says. “I spoke, and became brave.”", "am": "Ask yourself: “What kind of person do I want to become?” Choose one virtue for today (patience, kindness, courage).", "ex": "Do three small acts of the virtue you chose today. If you chose patience, for example: wait in the queue without complaining, listen to someone to the end, do not honk the horn.", "pm": "Which virtue did I practise today? How much easier was it the third time than the first?"}}, {"tag": ["⚖️ Η χρυσή μεσότητα", "⚖️ The golden mean"], "grc": "μεσότης δὲ δύο κακιῶν, τῆς μὲν καθ᾽ ὑπερβολὴν τῆς δὲ κατ᾽ ἔλλειψιν.", "src": ["Ηθικά Νικομάχεια Β΄ 6, 1107a2–3", "Nicomachean Ethics II 6, 1107a2–3"], "el": {"t": "Η αρετή είναι στη μέση", "tr": "Η αρετή είναι μια μέση θέση ανάμεσα σε δύο κακά: το ένα από υπερβολή και το άλλο από έλλειψη.", "simple": "Το πιο γνωστό δίδαγμα του Αριστοτέλη είναι η «μεσότητα». Πάρτε το θάρρος: αν έχουμε πολύ λίγο, γινόμαστε δειλοί. Αν έχουμε υπερβολικά πολύ, γινόμαστε απερίσκεπτοι και ριψοκίνδυνοι. Το αληθινό θάρρος είναι κάπου ανάμεσα. Το ίδιο και η γενναιοδωρία: ανάμεσα στην τσιγκουνιά και στη σπατάλη.\n\nΗ «μέση» όμως δεν είναι ίδια για όλους, ούτε είναι πάντα ακριβώς στο κέντρο. Είναι το σωστό για εμάς, στη σωστή στιγμή. Γι’ αυτό χρειάζεται φρόνηση: να κοιτάμε κάθε κατάσταση και να ρωτάμε «τι είναι εδώ το σωστό μέτρο;».", "life": "Ένας πατέρας ήταν πολύ αυστηρός με τον μεγάλο του γιο, και ο γιος απομακρύνθηκε. Με τον μικρό έγινε υπερβολικά επιεικής, και ο μικρός δεν σεβόταν κανέναν. Με τα εγγόνια βρήκε τη μέση: αγάπη και όρια μαζί. «Χρειάστηκα δύο λάθη για να βρω τον δρόμο», λέει χαμογελώντας.", "am": "Πείτε: «Σήμερα θα ψάξω τη χρυσή μέση σε ό,τι κάνω.»", "ex": "Σκεφτείτε μία δική σας αδυναμία. Ποια είναι η «υπερβολή» της και ποια η «έλλειψή» της; (π.χ. πολυλογία – σιωπή, ανησυχία – αδιαφορία). Κάντε σήμερα ένα βήμα προς τη μέση.", "pm": "Πού έγειρα σήμερα προς την υπερβολή ή την έλλειψη; Πού βρήκα τη μέση;"}, "en": {"t": "Virtue lies in the middle", "tr": "Virtue is a mean between two vices, one of excess and one of deficiency.", "simple": "Aristotle’s best-known teaching is the “mean”. Take courage: with too little we become cowards; with far too much we become reckless and rash. True courage lies somewhere between. Generosity likewise: between stinginess and wastefulness.\n\nBut the “middle” is not the same for everyone, nor always exactly at the centre. It is what is right for us, at the right moment. That is why we need practical wisdom: to look at each situation and ask “what is the right measure here?”.", "life": "A father was very strict with his elder son, and the son drifted away. With the younger he became far too lenient, and the younger respected no one. With his grandchildren he found the middle: love and limits together. “It took me two mistakes to find the way,” he says with a smile.", "am": "Say: “Today I will look for the golden mean in everything I do.”", "ex": "Think of one weakness of yours. What is its “excess” and what its “deficiency”? (e.g. talking too much – silence, worry – indifference). Take one step towards the middle today.", "pm": "Where did I lean today towards excess or deficiency? Where did I find the middle?"}}, {"tag": ["🔥 Ο σωστός θυμός", "🔥 The right anger"], "grc": "τὸ μὲν ὀργισθῆναι παντὸς καὶ ῥᾴδιον… τὸ δ᾽ ᾧ καὶ ὅσον καὶ ὅτε καὶ οὗ ἕνεκα καὶ ὥς, οὐκέτι παντὸς οὐδὲ ῥᾴδιον.", "src": ["Ηθικά Νικομάχεια Β΄ 9, 1109a26–28", "Nicomachean Ethics II 9, 1109a26–28"], "el": {"t": "Θυμός με μέτρο", "tr": "Το να θυμώσεις είναι εύκολο και το μπορεί ο καθένας. Το να θυμώσεις με τον σωστό άνθρωπο, όσο πρέπει, την κατάλληλη ώρα, για τον σωστό λόγο και με τον σωστό τρόπο, αυτό δεν το μπορεί ο καθένας και δεν είναι εύκολο.", "simple": "Ο Αριστοτέλης δεν λέει ότι ο θυμός είναι πάντα κακός. Μπροστά σε μια αδικία, ο άνθρωπος που δεν θυμώνει καθόλου δεν είναι άγιος. Μάλλον αδιαφορεί. Ο θυμός μάς δίνει δύναμη να υπερασπιστούμε το σωστό. Το πρόβλημα είναι όταν ξεσπά σε λάθος άνθρωπο, την λάθος ώρα, με υπερβολή.\n\nΟι πέντε ερωτήσεις του είναι ένα θαυμάσιο φίλτρο: Με ποιον θυμώνω; Πόσο; Πότε; Γιατί; Πώς; Αν περάσουμε τον θυμό μας από αυτό το φίλτρο, συνήθως κρατάμε τη δύναμή του και πετάμε την καταστροφή του.", "life": "Μια μητέρα γυρίζει κουρασμένη από τη δουλειά, όπου το αφεντικό την πρόσβαλε. Στο σπίτι φωνάζει στα παιδιά για ένα ποτήρι που έσπασε. Το βράδυ καταλαβαίνει: ο θυμός ήταν για το αφεντικό, όχι για τα παιδιά. Ζητά συγγνώμη από τα παιδιά και την επόμενη μέρα μιλά ήρεμα και σταθερά στο αφεντικό της. Ο θυμός της πήγε επιτέλους εκεί που έπρεπε.", "am": "Πείτε: «Αν θυμώσω σήμερα, θα κάνω πρώτα τις πέντε ερωτήσεις.»", "ex": "Αν θυμώσετε σήμερα, σταματήστε και ρωτήστε: Με ποιον είμαι πραγματικά θυμωμένος; Πόσο σοβαρό είναι; Είναι η σωστή ώρα; Γιατί; Πώς μπορώ να το πω ήρεμα;", "pm": "Θύμωσα σήμερα; Ο θυμός μου πήγε στον σωστό άνθρωπο, με το σωστό μέτρο;"}, "en": {"t": "Anger with measure", "tr": "Anyone can become angry; that is easy. But to be angry with the right person, to the right degree, at the right time, for the right reason and in the right way, that is not for everyone, nor is it easy.", "simple": "Aristotle does not say anger is always bad. Faced with injustice, the person who never gets angry is not a saint. More likely he does not care. Anger gives us strength to defend what is right. The problem is when it bursts out at the wrong person, at the wrong time, too much.\n\nHis five questions are a wonderful filter: With whom am I angry? How much? When? Why? How? If we pass our anger through this filter, we usually keep its strength and throw away its destruction.", "life": "A mother comes home tired from work, where her boss insulted her. At home she shouts at the children over a broken glass. In the evening she realises: the anger was for the boss, not the children. She apologises to the children and the next day speaks calmly and firmly to her boss. Her anger finally went where it belonged.", "am": "Say: “If I get angry today, I will first ask the five questions.”", "ex": "If you get angry today, stop and ask: Who am I really angry with? How serious is it? Is this the right time? Why? How can I say it calmly?", "pm": "Did I get angry today? Did my anger go to the right person, in the right measure?"}}, {"tag": ["💛 Ο φίλος", "💛 The friend"], "grc": "ἔστι γὰρ ὁ φίλος ἄλλος αὐτός.", "src": ["Ηθικά Νικομάχεια Θ΄ 4, 1166a31–32", "Nicomachean Ethics IX 4, 1166a31–32"], "el": {"t": "Ο φίλος είναι ένας άλλος εαυτός", "tr": "Ο φίλος είναι ένας άλλος εαυτός μας.", "simple": "Ο Αριστοτέλης αφιέρωσε δύο ολόκληρα βιβλία στη φιλία. Έλεγε ότι κανείς δεν θα διάλεγε να ζει χωρίς φίλους, ακόμη κι αν είχε όλα τα άλλα αγαθά. Διέκρινε τρία είδη φιλίας: για το συμφέρον, για την ευχαρίστηση και για το καλό. Οι δύο πρώτες τελειώνουν όταν τελειώσει το συμφέρον ή η διασκέδαση. Η τρίτη κρατά μια ζωή.\n\nΣτην αληθινή φιλία θέλουμε το καλό του φίλου για χάρη του ίδιου, όχι για χάρη μας. Γι’ αυτό ο φίλος γίνεται «άλλος εαυτός»: χαιρόμαστε με τη χαρά του και πονάμε με τον πόνο του σαν να ήταν δικά μας.", "life": "Δύο φίλες από το σχολείο έζησαν σε διαφορετικές χώρες για σαράντα χρόνια. Κάθε Κυριακή μιλούν στο τηλέφωνο. Όταν η μία αρρώστησε, η άλλη πέταξε αμέσως κοντά της χωρίς να το σκεφτεί. «Δεν το έκανα για εκείνη», είπε. «Το έκανα για μένα. Είναι κομμάτι μου.»", "am": "Σκεφτείτε έναν αληθινό φίλο σας και πείτε από μέσα σας: «Σε ευχαριστώ που υπάρχεις.»", "ex": "Επικοινωνήστε σήμερα με έναν φίλο χωρίς κανένα συμφέρον: μόνο για να ρωτήσετε πώς είναι και να του πείτε κάτι καλό.", "pm": "Ποιοι είναι οι φίλοι «του καλού» στη ζωή μου; Είμαι κι εγώ τέτοιος φίλος για κάποιον;"}, "en": {"t": "A friend is another self", "tr": "A friend is another self.", "simple": "Aristotle devoted two whole books to friendship. He said that no one would choose to live without friends, even if he had all other goods. He distinguished three kinds of friendship: for usefulness, for pleasure, and for the good. The first two end when the usefulness or the fun ends. The third lasts a lifetime.\n\nIn true friendship we want our friend’s good for the friend’s own sake, not ours. That is why a friend becomes “another self”: we rejoice in their joy and ache with their pain as if they were our own.", "life": "Two school friends lived in different countries for forty years. Every Sunday they speak on the phone. When one fell ill, the other flew to her side at once, without a second thought. “I didn’t do it for her,” she said. “I did it for me. She is part of me.”", "am": "Think of a true friend and say inwardly: “Thank you for existing.”", "ex": "Contact a friend today with no motive at all: only to ask how they are and to tell them something good.", "pm": "Who are the friends “of the good” in my life? Am I such a friend to someone?"}}, {"tag": ["🐦 Υπομονή", "🐦 Patience"], "grc": "μία γὰρ χελιδὼν ἔαρ οὐ ποιεῖ, οὐδὲ μία ἡμέρα· οὕτω δὲ οὐδὲ μακάριον καὶ εὐδαίμονα μία ἡμέρα οὐδ᾽ ὀλίγος χρόνος.", "src": ["Ηθικά Νικομάχεια Α΄ 7, 1098a18–20", "Nicomachean Ethics I 7, 1098a18–20"], "el": {"t": "Ένα χελιδόνι δεν φέρνει την άνοιξη", "tr": "Ένα χελιδόνι δεν φέρνει την άνοιξη, ούτε μία μέρα. Έτσι και μία μέρα ή λίγος χρόνος δεν κάνουν τον άνθρωπο ευτυχισμένο.", "simple": "Από εδώ βγήκε η γνωστή παροιμία. Ο Αριστοτέλης λέει ότι η ευτυχία δεν είναι μια όμορφη στιγμή. Είναι ολόκληρη η πορεία μιας ζωής. Μια καλή μέρα δεν μας κάνει ευτυχισμένους για πάντα, και μια κακή μέρα δεν μας κάνει δυστυχισμένους για πάντα.\n\nΑυτό μας δίνει δύο δώρα. Πρώτον, υπομονή: η αλλαγή χρειάζεται χρόνο, όπως η άνοιξη χρειάζεται πολλά χελιδόνια. Δεύτερον, παρηγοριά: όταν μια μέρα πάει στραβά, δεν χάθηκαν όλα. Αύριο είναι μια νέα σελίδα στο ίδιο βιβλίο.", "life": "Ένας κύριος αποφάσισε να κόψει το κάπνισμα. Τη δέκατη μέρα έκανε ένα τσιγάρο και ήθελε να τα παρατήσει όλα: «Απέτυχα!» Η γυναίκα του τού θύμισε: «Εννιά μέρες χωρίς τσιγάρο και μία με ένα. Δεν απέτυχες, προχωράς.» Σήμερα, τρία χρόνια μετά, δεν καπνίζει πια.", "am": "Πείτε: «Δεν θα κρίνω τη ζωή μου από μία μέρα. Θα συνεχίσω να βάζω χελιδόνια.»", "ex": "Θυμηθείτε μια προσπάθεια που σταματήσατε γιατί «δεν βλέπατε αποτέλεσμα». Ξεκινήστε την ξανά σήμερα, με ένα πολύ μικρό βήμα.", "pm": "Έκρινα σήμερα τη ζωή μου από μία μόνο στιγμή; Ποιο μικρό «χελιδόνι» έφερα σήμερα;"}, "en": {"t": "One swallow does not make a spring", "tr": "One swallow does not make a spring, nor does one day. So too, one day or a short time does not make a person blessed and happy.", "simple": "The famous proverb comes from here. Aristotle says that happiness is not a beautiful moment. It is the whole course of a life. One good day does not make us happy forever, and one bad day does not make us unhappy forever.\n\nThis gives us two gifts. First, patience: change takes time, as spring needs many swallows. Second, comfort: when a day goes wrong, all is not lost. Tomorrow is a new page in the same book.", "life": "A man decided to quit smoking. On the tenth day he had a cigarette and wanted to give up everything: “I failed!” His wife reminded him: “Nine days without a cigarette and one with one. You didn’t fail, you’re moving forward.” Today, three years later, he no longer smokes.", "am": "Say: “I will not judge my life by one day. I will keep bringing swallows.”", "ex": "Remember an effort you stopped because you “saw no results”. Start it again today, with a very small step.", "pm": "Did I judge my life today by a single moment? What small “swallow” did I bring today?"}}, {"tag": ["☀️ Ευδαιμονία", "☀️ Flourishing"], "grc": "ἔστιν ἡ εὐδαιμονία ψυχῆς ἐνέργειά τις κατ᾽ ἀρετὴν τελείαν.", "src": ["Ηθικά Νικομάχεια Α΄ 13, 1102a5–6", "Nicomachean Ethics I 13, 1102a5–6"], "el": {"t": "Ευτυχία είναι να ζεις με αρετή", "tr": "Η ευτυχία είναι μια ενέργεια της ψυχής σύμφωνα με την τέλεια αρετή.", "simple": "Για τον Αριστοτέλη η ευτυχία δεν είναι συναίσθημα που μας έρχεται. Είναι κάτι που κάνουμε. Είναι να ζούμε ενεργά, αξιοποιώντας τα καλύτερα που έχουμε μέσα μας: τη σκέψη, την καλοσύνη, τη φιλία, το θάρρος. Όπως ένα μαχαίρι είναι «καλό» όταν κόβει καλά, έτσι κι ο άνθρωπος είναι ευτυχισμένος όταν ζει σαν αληθινός άνθρωπος.\n\nΓι’ αυτό όλα όσα είδαμε αυτές τις μέρες δένουν μαζί: η περιέργεια, οι καλές συνήθειες, η μεσότητα, ο σωστός θυμός, η φιλία, η υπομονή. Δεν είναι κανόνες. Είναι τα «υλικά» μιας ζωής που ανθίζει.", "life": "Ένας συνταξιούχος δάσκαλος θα μπορούσε να μείνει όλη μέρα στον καναπέ. Αντί γι’ αυτό, δύο απογεύματα την εβδομάδα βοηθά δωρεάν παιδιά μεταναστών στα μαθήματά τους. Λέει: «Δεν ήμουν ποτέ πιο ευτυχισμένος, ούτε όταν δούλευα.» Η ευτυχία του δεν είναι ξεκούραση. Είναι αυτό που κάνει με αγάπη.", "am": "Πείτε: «Σήμερα θα χρησιμοποιήσω το καλύτερο που έχω μέσα μου.»", "ex": "Κάντε σήμερα κάτι όπου χρησιμοποιείτε ένα ταλέντο σας για το καλό κάποιου άλλου. Και διαλέξτε από τις 7 ημέρες την άσκηση που σας βοήθησε περισσότερο, για να τη συνεχίσετε έναν μήνα.", "pm": "Πότε ένιωσα σήμερα ότι ζω «με όλη μου την ψυχή»; Τι κρατώ από τις 7 ημέρες με τον Αριστοτέλη;"}, "en": {"t": "Happiness is living with virtue", "tr": "Happiness is an activity of the soul in accordance with complete virtue.", "simple": "For Aristotle happiness is not a feeling that comes to us. It is something we do. It means living actively, using the best within us: thought, kindness, friendship, courage. As a knife is “good” when it cuts well, so a person is happy when living as a true human being.\n\nThat is why everything we saw these days fits together: curiosity, good habits, the mean, right anger, friendship, patience. They are not rules. They are the “ingredients” of a flourishing life.", "life": "A retired teacher could spend all day on the sofa. Instead, two afternoons a week he helps migrant children with their homework for free. He says: “I have never been happier, not even when I was working.” His happiness is not rest. It is what he does with love.", "am": "Say: “Today I will use the best that is in me.”", "ex": "Do something today where you use one of your talents for someone else’s good. And from the 7 days choose the exercise that helped you most, to continue for a month.", "pm": "When today did I feel I was living “with all my soul”? What do I keep from the 7 days with Aristotle?"}}]},
{"id": "se", "emoji": "✒️", "cls": "c-se", "name": ["Σενέκας", "Seneca"], "withName": ["με τον Σενέκα", "with Seneca"], "years": ["Περίπου 4 π.Χ.–65 μ.Χ. · Ο Ρωμαίος που έγραφε γράμματα σοφίας", "c. 4 BC–65 AD · The Roman who wrote letters of wisdom"], "origLbl": ["Το λατινικό κείμενο:", "The original Latin:"], "bio": ["<p>Ο Λούκιος Άνναιος Σενέκας γεννήθηκε στην <b>Κόρδοβα</b> της Ισπανίας και μεγάλωσε στη Ρώμη. Ήταν άρρωστος από νέος, με προβλήματα στο αναπνευστικό, κι όμως έγινε ένας από τους πιο γνωστούς ρήτορες και συγγραφείς της εποχής του. Εξορίστηκε για οκτώ χρόνια στην Κορσική, και όταν γύρισε έγινε δάσκαλος και σύμβουλος του νεαρού αυτοκράτορα <b>Νέρωνα</b>.</p><p>Ήταν Στωικός, όπως ο Ζήνων και ο Επίκτητος. Τα τελευταία του χρόνια τα αφιέρωσε στη φιλοσοφία και έγραψε τις περίφημες <b>«Επιστολές στον Λουκίλιο»</b>, 124 γράμματα σε έναν νεότερο φίλο, γεμάτα πρακτικές συμβουλές για τον χρόνο, τον φόβο, τον θυμό και τη φιλία. Όταν ο Νέρων τον καταδίκασε σε θάνατο, το 65 μ.Χ., τον αντιμετώπισε με ηρεμία, παρηγορώντας τους φίλους του. Τα λόγια του είναι γραμμένα στα <b>λατινικά</b>, και τα δίνουμε εδώ σε απλή απόδοση.</p>", "<p>Lucius Annaeus Seneca was born in <b>Córdoba</b> in Spain and grew up in Rome. He was sickly from youth, with breathing problems, yet he became one of the best-known orators and writers of his time. He was exiled for eight years to Corsica, and on his return became tutor and adviser to the young emperor <b>Nero</b>.</p><p>He was a Stoic, like Zeno and Epictetus. He devoted his last years to philosophy and wrote the famous <b>“Letters to Lucilius”</b>, 124 letters to a younger friend, full of practical advice about time, fear, anger and friendship. When Nero condemned him to death in 65 AD, he faced it calmly, comforting his friends. His words are written in <b>Latin</b>, and we give them here in plain translation.</p>"], "cheer": ["Ο Σενέκας έγραφε: «Δεν είναι επειδή τα πράγματα είναι δύσκολα που δεν τολμάμε· είναι επειδή δεν τολμάμε που είναι δύσκολα» (Επιστολές 104, 26).", "Seneca wrote: “It is not because things are difficult that we do not dare; it is because we do not dare that they are difficult” (Letters 104.26)."], "fare": {"grc": "Vivere tota vita discendum est.", "src": ["Σενέκας, Για τη συντομία της ζωής 7, 3", "Seneca, On the Shortness of Life 7.3"], "tr": ["Να ζούμε, αυτό το μαθαίνουμε σε όλη μας τη ζωή.", "Learning how to live takes a whole lifetime."]}, "days": [{"tag": ["⏳ Ο χρόνος", "⏳ Time"], "grc": "Omnia, Lucili, aliena sunt, tempus tantum nostrum est.", "src": ["Επιστολές στον Λουκίλιο 1, 3", "Letters to Lucilius 1.3"], "el": {"t": "Μόνο ο χρόνος είναι δικός μας", "tr": "Όλα, Λουκίλιε, μας είναι ξένα. Μόνο ο χρόνος είναι δικός μας.", "simple": "Με αυτά τα λόγια ξεκινά το πρώτο γράμμα του Σενέκα. Τα χρήματα, τα σπίτια, ακόμη και η υγεία μπορεί να χαθούν ή να μας τα πάρουν. Τον χρόνο όμως μας τον έδωσε η φύση για να τον ζήσουμε εμείς. Κι όμως, λέει ο Σενέκας, είναι το μόνο πράγμα που χαρίζουμε σε όλους χωρίς δεύτερη σκέψη.\n\nΔεν θα δανείζαμε ποτέ τα χρήματά μας σε κάθε περαστικό. Τον χρόνο μας όμως τον αφήνουμε να φεύγει σε κουτσομπολιά, σε άσκοπη τηλεόραση, σε στενοχώριες για πράγματα που δεν αλλάζουν. Η πρώτη άσκηση της σοφίας είναι να προσέχουμε πού πηγαίνουν οι ώρες μας.", "life": "Ένας κύριος μέτρησε μια εβδομάδα πόσο χρόνο περνούσε στο κινητό: τρεις ώρες τη μέρα. Τρόμαξε. Κράτησε τη μισή ώρα για τα νέα και τα μηνύματα, και με τον υπόλοιπο χρόνο άρχισε να γράφει τις αναμνήσεις του για τα εγγόνια του. Λέει ότι «βρήκε» δύο ώρες τη μέρα που νόμιζε πως δεν είχε.", "am": "Πείτε: «Ο χρόνος μου είναι ο πιο πολύτιμος θησαυρός μου. Σήμερα θα τον ξοδέψω με σύνεση.»", "ex": "Σημειώστε σήμερα, πρόχειρα, πού πήγαν οι ώρες σας. Βρείτε μισή ώρα που «χάθηκε» και αποφασίστε πώς θα τη χρησιμοποιήσετε αύριο.", "pm": "Πού ξόδεψα σήμερα τον χρόνο μου; Ποια ώρα της ημέρας άξιζε πραγματικά;"}, "en": {"t": "Only time is ours", "tr": "Everything, Lucilius, belongs to others; only time is ours.", "simple": "Seneca’s first letter begins with these words. Money, houses, even health can be lost or taken from us. But time was given to us by nature for us to live. And yet, says Seneca, it is the one thing we give away to everyone without a second thought.\n\nWe would never lend our money to every passer-by. Yet we let our time slip away in gossip, aimless television, and worry about things that will not change. The first exercise of wisdom is to notice where our hours go.", "life": "A man measured for a week how much time he spent on his phone: three hours a day. He was shocked. He kept half an hour for news and messages, and with the rest he began writing his memories for his grandchildren. He says he “found” two hours a day he thought he did not have.", "am": "Say: “My time is my most precious treasure. Today I will spend it wisely.”", "ex": "Jot down today, roughly, where your hours went. Find half an hour that was “lost” and decide how you will use it tomorrow.", "pm": "Where did I spend my time today? Which hour of the day was truly worthwhile?"}}, {"tag": ["🌱 Η ζωή δεν είναι σύντομη", "🌱 Life is not short"], "grc": "Non exiguum temporis habemus, sed multum perdidimus.", "src": ["Για τη συντομία της ζωής 1, 3", "On the Shortness of Life 1.3"], "el": {"t": "Δεν έχουμε λίγο χρόνο. Χάνουμε πολύ.", "tr": "Δεν έχουμε λίγο χρόνο· χάνουμε πολύ.", "simple": "Όλοι παραπονιόμαστε ότι η ζωή είναι σύντομη. Ο Σενέκας απαντά: η ζωή είναι αρκετά μεγάλη, αν ξέρεις να τη ζεις. Το πρόβλημα δεν είναι πόσα χρόνια έχουμε. Είναι πόσα από αυτά τα ζούμε πραγματικά, και πόσα τα περνάμε αναβάλλοντας τη ζωή για «αργότερα».\n\n«Όταν βγω στη σύνταξη θα ταξιδέψω.» «Όταν μεγαλώσουν τα παιδιά θα διαβάσω.» Ο Σενέκας λέει ότι η αναβολή κλέβει τη μέρα που έχουμε, για χάρη μιας μέρας που δεν ξέρουμε αν θα έρθει. Το «τώρα» είναι το μόνο που πραγματικά κρατάμε στα χέρια μας.", "life": "Μια κυρία ήθελε χρόνια να μάθει ζωγραφική, αλλά πάντα έλεγε «δεν είναι η ώρα». Στα 68 της αγόρασε ένα κουτί με νερομπογιές και ζωγραφίζει μισή ώρα κάθε πρωί. «Αν περίμενα την “κατάλληλη ώρα”», λέει, «θα περίμενα για πάντα.»", "am": "Πείτε: «Δεν θα αναβάλω τη ζωή μου. Θα αρχίσω κάτι σήμερα.»", "ex": "Διαλέξτε κάτι καλό που αναβάλλετε εδώ και καιρό (ένα τηλεφώνημα, ένα βιβλίο, μια επίσκεψη, ένα χόμπι) και κάντε σήμερα το πρώτο του βήμα, έστω για 10 λεπτά.", "pm": "Τι ανέβαλα σήμερα; Τι έκανα επιτέλους, αντί να το αναβάλω;"}, "en": {"t": "We do not have little time; we waste much", "tr": "It is not that we have a short time, but that we waste much of it.", "simple": "We all complain that life is short. Seneca answers: life is long enough, if you know how to live it. The problem is not how many years we have. It is how many of them we truly live, and how many we spend putting life off until “later”.\n\n“When I retire, I will travel.” “When the children grow up, I will read.” Seneca says that postponing steals the day we have, for the sake of a day we do not know will come. The “now” is the only thing we really hold in our hands.", "life": "For years a woman wanted to learn painting, but always said “it’s not the right time”. At 68 she bought a box of watercolours and paints for half an hour every morning. “If I had waited for the ‘right time’,” she says, “I would have waited forever.”", "am": "Say: “I will not postpone my life. I will begin something today.”", "ex": "Choose something good you have been putting off (a phone call, a book, a visit, a hobby) and take its first step today, even for 10 minutes.", "pm": "What did I put off today? What did I finally do instead of postponing it?"}}, {"tag": ["🌫️ Ο φόβος", "🌫️ Fear"], "grc": "Plura sunt, Lucili, quae nos terrent quam quae premunt, et saepius opinione quam re laboramus.", "src": ["Επιστολές στον Λουκίλιο 13, 4", "Letters to Lucilius 13.4"], "el": {"t": "Υποφέρουμε περισσότερο στη φαντασία", "tr": "Περισσότερα είναι, Λουκίλιε, όσα μας τρομάζουν παρά όσα μας πιέζουν πραγματικά. Και πιο συχνά υποφέρουμε από τη φαντασία μας παρά από την πραγματικότητα.", "simple": "Πόσες νύχτες χάσαμε ανησυχώντας για κάτι που τελικά δεν έγινε ποτέ; Ο Σενέκας παρατηρεί ότι ο νους μας είναι μια μηχανή που κατασκευάζει καταστροφές. Μια καθυστέρηση στο τηλέφωνο γίνεται ατύχημα, ένας πόνος γίνεται σοβαρή αρρώστια, μια σιωπή γίνεται θυμός.\n\nΗ συμβουλή του είναι απλή: να ξεχωρίζουμε τι συμβαίνει τώρα από αυτό που φοβόμαστε ότι θα συμβεί. Και να ρωτάμε: «Έχω απόδειξη γι’ αυτό, ή είναι μόνο σκέψη;» Αν το κακό έρθει, θα το αντιμετωπίσουμε τότε. Γιατί να υποφέρουμε δύο φορές;", "life": "Μια μητέρα δεν μπορούσε να κοιμηθεί γιατί ο γιος της δεν απαντούσε στο τηλέφωνο. Φανταζόταν τα χειρότερα. Το πρωί εκείνος της έστειλε μήνυμα: «Μου τελείωσε η μπαταρία, όλα καλά!» Από τότε, όταν ανησυχεί, λέει στον εαυτό της: «Αυτό είναι φαντασία. Θα περιμένω τα γεγονότα.»", "am": "Πείτε: «Σήμερα θα ξεχωρίσω ό,τι συμβαίνει από ό,τι φοβάμαι.»", "ex": "Γράψτε σε ένα χαρτί κάτι που σας ανησυχεί. Δίπλα γράψτε: «Τι ξέρω σίγουρα;» και «Τι φαντάζομαι;». Αν υπάρχει κάτι που μπορείτε να κάνετε, κάντε το. Αν όχι, αφήστε το για όταν έρθει η ώρα του.", "pm": "Ποιος φόβος με βασάνισε σήμερα; Ήταν πραγματικός ή φανταστικός;"}, "en": {"t": "We suffer more in imagination", "tr": "There are more things, Lucilius, that frighten us than that actually crush us; we suffer more often in imagination than in reality.", "simple": "How many nights have we lost worrying about something that never happened? Seneca observes that our mind is a machine that manufactures disasters. A late phone call becomes an accident, a pain becomes a serious illness, a silence becomes anger.\n\nHis advice is simple: separate what is happening now from what we fear will happen. And ask: “Do I have proof of this, or is it only a thought?” If the misfortune comes, we will face it then. Why suffer twice?", "life": "A mother could not sleep because her son was not answering the phone. She imagined the worst. In the morning he texted her: “My battery died, all fine!” Since then, when she worries, she tells herself: “This is imagination. I will wait for the facts.”", "am": "Say: “Today I will separate what is happening from what I fear.”", "ex": "Write down something that worries you. Next to it write: “What do I know for sure?” and “What am I imagining?”. If there is something you can do, do it. If not, leave it until its time comes.", "pm": "Which fear troubled me today? Was it real or imagined?"}}, {"tag": ["⏸️ Ο θυμός", "⏸️ Anger"], "grc": "Maximum remedium irae mora est.", "src": ["Περί οργής Β΄ 29, 1", "On Anger II 29.1"], "el": {"t": "Το καλύτερο φάρμακο για τον θυμό", "tr": "Το μεγαλύτερο φάρμακο για τον θυμό είναι η αναμονή.", "simple": "Ο Σενέκας έγραψε ένα ολόκληρο βιβλίο για τον θυμό, γιατί είχε δει στη Ρώμη τι καταστροφές προκαλεί, ακόμη και στους αυτοκράτορες. Λέει ότι ο θυμός είναι σαν «σύντομη τρέλα»: όσο κρατά, δεν βλέπουμε καθαρά. Γι’ αυτό το πρώτο φάρμακο δεν είναι η λογική. Είναι ο χρόνος.\n\nΟ θυμός είναι σαν φωτιά σε άχυρα: φουντώνει γρήγορα και σβήνει γρήγορα, αν δεν της ρίξουμε κι άλλα ξύλα. Αν περιμένουμε λίγο πριν μιλήσουμε ή πράξουμε, η πρώτη φλόγα πέφτει. Τότε μπορούμε να αποφασίσουμε ήρεμα τι αξίζει να πούμε.", "life": "Ένας οδηγός είδε έναν άλλον να του κόβει τον δρόμο απότομα. Ένιωσε το αίμα να ανεβαίνει και ήθελε να τον κυνηγήσει. Θυμήθηκε τη συμβουλή «περίμενε ένα λεπτό». Άνοιξε το ραδιόφωνο, πήρε τρεις ανάσες, και σε ένα λεπτό γελούσε με τον εαυτό του. Έφτασε στο σπίτι ήρεμος, αντί για τσακωμένος.", "am": "Πείτε: «Αν θυμώσω σήμερα, θα δώσω στον θυμό μου λίγο χρόνο πριν απαντήσω.»", "ex": "Αν θυμώσετε σήμερα, μη μιλήσετε αμέσως. Πιείτε ένα ποτήρι νερό, βγείτε για λίγο έξω ή μετρήστε ως το είκοσι. Μετά αποφασίστε τι θα πείτε.", "pm": "Πότε με βοήθησε σήμερα η αναμονή; Πότε μίλησα πολύ γρήγορα;"}, "en": {"t": "The best remedy for anger", "tr": "The greatest remedy for anger is delay.", "simple": "Seneca wrote a whole book on anger, because in Rome he had seen the destruction it causes, even among emperors. He says anger is like “brief madness”: while it lasts, we do not see clearly. So the first remedy is not reason. It is time.\n\nAnger is like fire in straw: it flares up fast and dies down fast, if we do not throw more wood on it. If we wait a little before speaking or acting, the first flame falls. Then we can decide calmly what is worth saying.", "life": "A driver saw another car cut sharply in front of him. He felt his blood rise and wanted to chase it. He remembered the advice “wait one minute”. He turned on the radio, took three breaths, and within a minute he was laughing at himself. He arrived home calm instead of quarrelling.", "am": "Say: “If I get angry today, I will give my anger a little time before I answer.”", "ex": "If you get angry today, do not speak at once. Drink a glass of water, step outside for a moment or count to twenty. Then decide what to say.", "pm": "When did waiting help me today? When did I speak too quickly?"}}, {"tag": ["🤲 Καλοσύνη", "🤲 Kindness"], "grc": "Ubicumque homo est, ibi beneficii locus est.", "src": ["Για την ευτυχισμένη ζωή 24, 3", "On the Happy Life 24.3"], "el": {"t": "Όπου υπάρχει άνθρωπος, υπάρχει θέση για καλοσύνη", "tr": "Όπου υπάρχει ένας άνθρωπος, εκεί υπάρχει ευκαιρία για ένα καλό.", "simple": "Ο Σενέκας ζούσε σε μια κοινωνία με δούλους, ξένους και φτωχούς που οι πολλοί δεν τους λογάριαζαν. Κι όμως έγραφε ότι κάθε άνθρωπος, όποιος κι αν είναι, είναι μια ευκαιρία να κάνουμε καλό. Δεν χρειάζεται να είναι συγγενής μας, φίλος μας ή «άξιος». Φτάνει να είναι άνθρωπος.\n\nΗ καλοσύνη δεν θέλει μεγάλα χρήματα ούτε μεγάλες πράξεις. Ένα χαμόγελο στον ταμία, μια πόρτα που κρατάμε ανοιχτή, ένα «ευχαριστώ» στον οδοκαθαριστή. Κάθε μέρα περνάμε δίπλα από δεκάδες τέτοιες ευκαιρίες.", "life": "Μια κυρία κάθε πρωί έλεγε μια καλημέρα στον άνθρωπο που καθάριζε τον δρόμο της. Μια μέρα εκείνος τής είπε: «Είστε η μόνη που με βλέπει. Για τους άλλους είμαι αόρατος.» Από τότε του πηγαίνει και έναν καφέ τις κρύες μέρες. Μια λέξη άλλαξε τη μέρα και των δύο.", "am": "Πείτε: «Κάθε άνθρωπος που θα συναντήσω σήμερα είναι μια ευκαιρία για καλό.»", "ex": "Κάντε σήμερα τρεις μικρές καλοσύνες σε ανθρώπους που δεν ξέρετε καλά ή που συνήθως δεν προσέχετε: έναν πωλητή, έναν οδηγό, έναν γείτονα.", "pm": "Ποιον «είδα» σήμερα, που συνήθως περνά απαρατήρητος; Ποια ευκαιρία για καλό άφησα να χαθεί;"}, "en": {"t": "Wherever there is a human being, there is room for kindness", "tr": "Wherever there is a human being, there is an opportunity for a kindness.", "simple": "Seneca lived in a society of slaves, foreigners and poor people whom most did not count. Yet he wrote that every human being, whoever they are, is a chance to do good. They need not be our relative, our friend or “deserving”. It is enough that they are human.\n\nKindness needs neither much money nor great deeds. A smile at the cashier, a door held open, a “thank you” to the street sweeper. Every day we pass by dozens of such chances.", "life": "Every morning a woman said good morning to the man who swept her street. One day he told her: “You are the only one who sees me. To the others I am invisible.” Since then she also brings him a coffee on cold days. One word changed the day for both of them.", "am": "Say: “Every person I meet today is a chance for good.”", "ex": "Do three small kindnesses today to people you do not know well or usually do not notice: a shop assistant, a driver, a neighbour.", "pm": "Whom did I “see” today who usually goes unnoticed? Which chance for good did I let slip?"}}, {"tag": ["📖 Μαθαίνουμε διδάσκοντας", "📖 We learn by teaching"], "grc": "Homines dum docent discunt.", "src": ["Επιστολές στον Λουκίλιο 7, 8", "Letters to Lucilius 7.8"], "el": {"t": "Όταν διδάσκουμε, μαθαίνουμε", "tr": "Οι άνθρωποι, όσο διδάσκουν, μαθαίνουν.", "simple": "Ο Σενέκας έγραφε τα γράμματά του για να βοηθήσει τον φίλο του Λουκίλιο. Παραδεχόταν όμως ότι ο πρώτος που ωφελούνταν ήταν ο ίδιος. Όταν εξηγούμε κάτι σε άλλον, αναγκαζόμαστε να το καταλάβουμε βαθύτερα. Και όταν συμβουλεύουμε, ακούμε τη συμβουλή και εμείς.\n\nΑυτό σημαίνει ότι κανείς δεν είναι πολύ «μικρός» για να διδάξει. Ο καθένας ξέρει κάτι: μια συνταγή, ένα τραγούδι, πώς να φυτέψεις ντομάτες, πώς να ξεπεράσεις μια δυσκολία. Μοιράζοντας αυτό που ξέρουμε, το κάνουμε πιο δικό μας.", "life": "Ένας παππούς δίδαξε στην εγγονή του να παίζει τάβλι. Για να της εξηγήσει τις κινήσεις, άρχισε να σκέφτεται τη στρατηγική με τρόπο που δεν είχε σκεφτεί ποτέ σε πενήντα χρόνια παιχνιδιού. «Τελικά», λέει, «εκείνη μου έμαθε να παίζω καλύτερα.»", "am": "Πείτε: «Σήμερα θα μοιραστώ κάτι που ξέρω.»", "ex": "Μάθετε σήμερα σε κάποιον κάτι που ξέρετε καλά: μια συνταγή, μια λέξη, μια συμβουλή από τη ζωή σας, ένα παιχνίδι. Ή μοιραστείτε με έναν φίλο ένα λόγιο από αυτές τις μέρες.", "pm": "Τι δίδαξα σήμερα, και τι έμαθα εγώ διδάσκοντας;"}, "en": {"t": "While we teach, we learn", "tr": "People learn while they teach.", "simple": "Seneca wrote his letters to help his friend Lucilius. Yet he admitted that the first to benefit was himself. When we explain something to another, we are forced to understand it more deeply. And when we give advice, we hear it ourselves too.\n\nThis means no one is too “small” to teach. Everyone knows something: a recipe, a song, how to plant tomatoes, how to get through a hardship. By sharing what we know, we make it more truly ours.", "life": "A grandfather taught his granddaughter to play backgammon. To explain the moves to her, he began to think about strategy in a way he never had in fifty years of playing. “In the end,” he says, “she taught me to play better.”", "am": "Say: “Today I will share something I know.”", "ex": "Teach someone something you know well today: a recipe, a word, a piece of life advice, a game. Or share a saying from these days with a friend.", "pm": "What did I teach today, and what did I learn by teaching?"}}, {"tag": ["🛠️ Πράξη, όχι λόγια", "🛠️ Deeds, not words"], "grc": "Non in verbis sed in rebus est.", "src": ["Επιστολές στον Λουκίλιο 16, 3", "Letters to Lucilius 16.3"], "el": {"t": "Η φιλοσοφία είναι στις πράξεις", "tr": "Η φιλοσοφία δεν βρίσκεται στα λόγια αλλά στις πράξεις.", "simple": "Ο Σενέκας λέει ότι η φιλοσοφία δεν είναι τέχνη για να κάνουμε εντύπωση ούτε για να περνά η ώρα. Είναι σαν τιμόνι σε πλοίο που περνά φουρτούνα: μας δείχνει τι να κάνουμε και τι να αποφύγουμε. Ένα όμορφο λόγιο που μένει μόνο στο χαρτί είναι σαν φάρμακο που δεν το πήραμε ποτέ.\n\nΓι’ αυτό σε κάθε μέρα υπήρχε μια μικρή άσκηση. Η σοφία φαίνεται στον τρόπο που μιλάμε στους δικούς μας, που αντιμετωπίζουμε μια δυσκολία, που ξοδεύουμε τον χρόνο μας. Όχι σε όσα ξέρουμε, αλλά σε όσα κάνουμε.", "life": "Δύο φίλοι διάβασαν το ίδιο βιβλίο για την υπομονή. Ο ένας μπορούσε να απαγγείλει ολόκληρες σελίδες, αλλά συνέχιζε να θυμώνει στην ουρά του σούπερ μάρκετ. Ο άλλος θυμόταν μόνο μία φράση, αλλά την εφάρμοζε κάθε μέρα. Μετά από έναν χρόνο, όλοι έλεγαν ότι ο δεύτερος «άλλαξε». Κανείς δεν παρατήρησε τίποτα στον πρώτο.", "am": "Πείτε: «Σήμερα δεν θα σκεφτώ μόνο σωστά. Θα πράξω σωστά.»", "ex": "Διαλέξτε από τις 6 προηγούμενες ημέρες το λόγιο που σας άγγιξε περισσότερο και κάντε σήμερα μια συγκεκριμένη πράξη που το εφαρμόζει. Συνεχίστε αυτή την άσκηση για έναν μήνα.", "pm": "Πού έγιναν σήμερα τα λόγια πράξη; Τι κρατώ από τις 7 ημέρες με τον Σενέκα;"}, "en": {"t": "Philosophy lies in deeds", "tr": "Philosophy lies not in words but in deeds.", "simple": "Seneca says philosophy is not an art for showing off or for passing the time. It is like the rudder of a ship in a storm: it shows us what to do and what to avoid. A beautiful saying that stays on paper is like a medicine we never took.\n\nThat is why each day had a small exercise. Wisdom shows in the way we speak to our loved ones, face a difficulty, spend our time. Not in what we know, but in what we do.", "life": "Two friends read the same book on patience. One could recite whole pages, but still got angry in the supermarket queue. The other remembered only one sentence, but practised it every day. A year later, everyone said the second had “changed”. No one noticed anything about the first.", "am": "Say: “Today I will not only think rightly. I will act rightly.”", "ex": "From the 6 earlier days choose the saying that touched you most and do one concrete deed today that puts it into practice. Continue this exercise for a month.", "pm": "Where did words become deeds today? What do I keep from the 7 days with Seneca?"}}]},
{"id": "epk", "emoji": "🌿", "cls": "c-epk", "name": ["Επίκουρος", "Epicurus"], "withName": ["με τον Επίκουρο", "with Epicurus"], "years": ["341–270 π.Χ. · Ο φιλόσοφος του Κήπου", "341–270 BC · The philosopher of the Garden"], "bio": ["<p>Ο Επίκουρος γεννήθηκε στη <b>Σάμο</b> από Αθηναίους γονείς. Στα 35 του αγόρασε ένα σπίτι με κήπο έξω από την Αθήνα και ίδρυσε εκεί τη σχολή του, τον <b>«Κήπο»</b>. Ήταν η πρώτη φιλοσοφική σχολή που δεχόταν ελεύθερα <b>γυναίκες και δούλους</b>, ως ίσους φίλους. Ζούσαν πολύ απλά: ψωμί, νερό, λίγο τυρί για τις γιορτές, και πολλή συζήτηση.</p><p>Πολλοί παρεξήγησαν τον Επίκουρο. Η λέξη «επικούρειος» κατέληξε να σημαίνει καλοφαγάς, ενώ εκείνος δίδασκε το αντίθετο. Η «ηδονή» για εκείνον ήταν η <b>γαλήνη</b>: σώμα χωρίς πόνο και ψυχή χωρίς ταραχή. Τα μέσα για να τη φτάσουμε είναι η φιλία, η απλότητα, η ευγνωμοσύνη και η απελευθέρωση από τους περιττούς φόβους. Τα λόγια αυτών των ημερών είναι από τις επιστολές του και τα σύντομα αποφθέγματά του.</p>", "<p>Epicurus was born on <b>Samos</b> to Athenian parents. At 35 he bought a house with a garden outside Athens and founded his school there, the <b>“Garden”</b>. It was the first school of philosophy to welcome <b>women and slaves</b> freely, as equal friends. They lived very simply: bread, water, a little cheese for feast days, and much conversation.</p><p>Many misunderstood Epicurus. The word “epicurean” came to mean a lover of fine food, while he taught the opposite. “Pleasure” for him meant <b>tranquillity</b>: a body free of pain and a soul free of turmoil. The ways to reach it are friendship, simplicity, gratitude, and freedom from needless fears. The sayings of these days come from his letters and his short maxims.</p>"], "cheer": ["Ο Επίκουρος έλεγε: «Πρέπει να γελάμε και ταυτόχρονα να φιλοσοφούμε» (Βατικανά Αποφθέγματα 41). Η σοφία δεν είναι βαριά υπόθεση.", "Epicurus said: “We must laugh and do philosophy at the same time” (Vatican Sayings 41). Wisdom is not a heavy business."], "fare": {"grc": "Ἡ φιλία περιχορεύει τὴν οἰκουμένην κηρύττουσα δὴ πᾶσιν ἡμῖν ἐγείρεσθαι ἐπὶ τὸν μακαρισμόν.", "src": ["Επίκουρος, Βατικανά Αποφθέγματα 52", "Epicurus, Vatican Sayings 52"], "tr": ["Η φιλία χορεύει γύρω από όλη τη γη και φωνάζει σε όλους μας: ξυπνήστε για την ευτυχία!", "Friendship dances around the whole world, calling to each of us: wake up to happiness!"]}, "days": [{"tag": ["🕊️ Γαλήνη", "🕊️ Tranquillity"], "grc": "τὸ μήτε ἀλγεῖν κατὰ σῶμα μήτε ταράττεσθαι κατὰ ψυχήν.", "src": ["Επιστολή προς Μενοικέα 131", "Letter to Menoeceus 131"], "el": {"t": "Η αληθινή ηδονή είναι η γαλήνη", "tr": "Η ηδονή που επιδιώκουμε είναι να μην πονά το σώμα και να μην ταράζεται η ψυχή.", "simple": "Ο Επίκουρος γράφει στον μαθητή του Μενοικέα ότι η ευτυχία δεν είναι τα πλούσια τραπέζια, τα γλέντια ή οι πολυτέλειες. Αυτά συχνά φέρνουν περισσότερη ταραχή: φόβο μήπως τα χάσουμε, κούραση, ζήλια. Η αληθινή ηδονή είναι πιο ήσυχη. Είναι η κατάσταση όπου τίποτα δεν μας πονά και τίποτα δεν μας ταράζει.\n\nΣκεφτείτε μια θάλασσα χωρίς κύματα. Δεν «συμβαίνει» τίποτα, κι όμως είναι υπέροχη. Ο Επίκουρος μάς καλεί να εκτιμήσουμε αυτές τις ήσυχες στιγμές: έναν καφέ στο μπαλκόνι, ένα βράδυ χωρίς έγνοιες, μια ανάσα καθαρού αέρα.", "life": "Ένας επιχειρηματίας κυνηγούσε για χρόνια όλο και μεγαλύτερο σπίτι, ακριβότερο αυτοκίνητο, περισσότερα ταξίδια, και ήταν πάντα αγχωμένος. Μετά από ένα πρόβλημα υγείας κάθισε για πρώτη φορά ένα πρωί στην αυλή του, χωρίς κινητό, μόνο με τον καφέ του και τα πουλιά. Είπε στη γυναίκα του: «Νομίζω ότι αυτό ήταν που έψαχνα όλα αυτά τα χρόνια.»", "am": "Καθίστε ένα λεπτό ήσυχα, με κλειστά μάτια, και πείτε: «Αυτή τη στιγμή, τίποτα δεν μου λείπει.»", "ex": "Βρείτε σήμερα δέκα λεπτά για να μην κάνετε τίποτα: χωρίς κινητό, χωρίς τηλεόραση. Μόνο καθίστε, κοιτάξτε τον ουρανό ή ένα δέντρο, και αναπνεύστε.", "pm": "Πότε ένιωσα σήμερα γαλήνη; Τι με ταράζει χωρίς πραγματικό λόγο;"}, "en": {"t": "True pleasure is tranquillity", "tr": "The pleasure we seek is freedom from pain in the body and from turmoil in the soul.", "simple": "Epicurus writes to his student Menoeceus that happiness is not lavish tables, parties or luxuries. These often bring more turmoil: fear of losing them, tiredness, envy. True pleasure is quieter. It is the state in which nothing hurts us and nothing troubles us.\n\nThink of a sea without waves. Nothing “happens”, and yet it is wonderful. Epicurus invites us to treasure these quiet moments: a coffee on the balcony, an evening without worries, a breath of clean air.", "life": "For years a businessman chased an ever bigger house, a more expensive car, more trips, and was always anxious. After a health scare he sat in his yard one morning for the first time, without his phone, just with his coffee and the birds. He told his wife: “I think this is what I was looking for all these years.”", "am": "Sit quietly for a minute with your eyes closed and say: “At this moment, I lack nothing.”", "ex": "Find ten minutes today to do nothing: no phone, no television. Just sit, look at the sky or a tree, and breathe.", "pm": "When did I feel tranquillity today? What troubles me without real reason?"}}, {"tag": ["🤝 Φιλία", "🤝 Friendship"], "grc": "Ὧν ἡ σοφία παρασκευάζεται εἰς τὴν τοῦ ὅλου βίου μακαριότητα, πολὺ μέγιστόν ἐστιν ἡ τῆς φιλίας κτῆσις.", "src": ["Κύριαι Δόξαι 27", "Principal Doctrines 27"], "el": {"t": "Ο μεγαλύτερος θησαυρός", "tr": "Από όλα όσα μας δίνει η σοφία για να είναι ευτυχισμένη όλη μας η ζωή, το πιο μεγάλο απ’ όλα είναι να έχουμε φίλους.", "simple": "Για τον Επίκουρο η φιλία δεν ήταν πολυτέλεια. Ήταν το θεμέλιο της ευτυχίας. Γι’ αυτό ο «Κήπος» του ήταν πρώτα απ’ όλα μια κοινότητα φίλων. Έλεγε ότι πριν κοιτάξουμε τι θα φάμε, πρέπει να κοιτάξουμε με ποιον θα το φάμε, γιατί όποιος τρώει μόνος ζει σαν λιοντάρι ή λύκος.\n\nΟι φίλοι μάς δίνουν κάτι πολύτιμο: τη βεβαιότητα ότι, αν χρειαστούμε βοήθεια, δεν θα είμαστε μόνοι. Ακόμη κι αν δεν τη χρειαστούμε ποτέ, αυτή η σιγουριά φέρνει γαλήνη στην ψυχή.", "life": "Τρεις χήρες σε ένα χωριό έμεναν η καθεμιά μόνη της και ένιωθαν μοναξιά. Αποφάσισαν να τρώνε μαζί κάθε Τετάρτη, κάθε φορά σε άλλο σπίτι. Σιγά-σιγά πρόσθεσαν και την Κυριακή, και μετά και άλλες γειτόνισσες. Λένε ότι αυτά τα γεύματα τις κράτησαν «ζωντανές».", "am": "Πείτε: «Οι φίλοι μου είναι ο μεγαλύτερος θησαυρός μου. Σήμερα θα τους φροντίσω.»", "ex": "Καλέστε σήμερα έναν φίλο για καφέ ή φαγητό, ή κανονίστε μια συνάντηση για αυτή την εβδομάδα.", "pm": "Με ποιον μοιράστηκα σήμερα μια στιγμή; Ποιον φίλο έχω παραμελήσει;"}, "en": {"t": "The greatest treasure", "tr": "Of all the things wisdom provides for the happiness of a whole life, by far the greatest is the possession of friendship.", "simple": "For Epicurus friendship was not a luxury. It was the foundation of happiness. That is why his “Garden” was above all a community of friends. He said that before looking at what we will eat, we should look at whom we will eat it with, for whoever eats alone lives like a lion or a wolf.\n\nFriends give us something precious: the assurance that, if we need help, we will not be alone. Even if we never need it, that certainty brings peace to the soul.", "life": "Three widows in a village each lived alone and felt lonely. They decided to eat together every Wednesday, each time in a different house. Little by little they added Sunday, then other neighbours too. They say these meals kept them “alive”.", "am": "Say: “My friends are my greatest treasure. Today I will take care of them.”", "ex": "Invite a friend for coffee or a meal today, or arrange a meeting for this week.", "pm": "With whom did I share a moment today? Which friend have I neglected?"}}, {"tag": ["🍞 Το αρκετό", "🍞 Enough"], "grc": "Οὐδὲν ἱκανὸν ᾧ ὀλίγον τὸ ἱκανόν.", "src": ["Βατικανά Αποφθέγματα 68", "Vatican Sayings 68"], "el": {"t": "Όποιος δεν αρκείται στο λίγο", "tr": "Τίποτα δεν είναι αρκετό γι’ αυτόν που το αρκετό του φαίνεται λίγο.", "simple": "Ο Επίκουρος ζούσε με ψωμί και νερό και έλεγε ότι ένιωθε ευτυχισμένος σαν τον Δία. Δεν ήταν τσιγκούνης. Είχε απλώς καταλάβει κάτι σημαντικό: οι επιθυμίες μας είναι σαν τρύπιο πιθάρι. Όσο κι αν ρίξουμε, δεν γεμίζει, αν δεν μάθουμε να λέμε «φτάνει».\n\nΧώριζε τις επιθυμίες σε τρία είδη. Οι φυσικές και αναγκαίες (φαγητό, στέγη, φίλοι) ικανοποιούνται εύκολα. Οι φυσικές αλλά όχι αναγκαίες (ένα ωραίο γλυκό) είναι ευχάριστες, αν δεν τις κάνουμε υποχρέωση. Οι κενές (δόξα, πλούτος χωρίς τέλος) δεν χορταίνουν ποτέ.", "life": "Μια οικογένεια άλλαζε κινητά και τηλεοράσεις κάθε φορά που έβγαινε καινούριο μοντέλο, και πάντα κάτι τους έλειπε. Μια χρονιά αποφάσισαν να μην αγοράσουν τίποτα καινούριο που δεν ήταν απαραίτητο. Με τα χρήματα που περίσσεψαν πήγαν όλοι μαζί ένα ταξίδι στα βουνά. «Ήταν η πιο πλούσια χρονιά μας», λένε.", "am": "Κοιτάξτε γύρω σας και πείτε: «Έχω αρκετά. Ευχαριστώ.»", "ex": "Πριν αγοράσετε κάτι σήμερα, ρωτήστε: «Είναι αναγκαίο, απλώς ευχάριστο, ή κενό;» Και βρείτε στο σπίτι ένα πράγμα που δεν χρειάζεστε για να το χαρίσετε.", "pm": "Τι επιθυμούσα σήμερα που στην πραγματικότητα δεν χρειάζομαι; Για ποια απλά πράγματα είμαι ευγνώμων;"}, "en": {"t": "Whoever is not content with little", "tr": "Nothing is enough for the one to whom enough seems little.", "simple": "Epicurus lived on bread and water and said he felt as happy as Zeus. He was not a miser. He had simply understood something important: our desires are like a leaking jar. However much we pour in, it never fills, unless we learn to say “enough”.\n\nHe divided desires into three kinds. The natural and necessary ones (food, shelter, friends) are easily satisfied. The natural but unnecessary ones (a nice dessert) are pleasant, if we do not make them obligations. The empty ones (fame, endless wealth) are never satisfied.", "life": "A family changed phones and televisions every time a new model came out, and something was always missing. One year they decided to buy nothing new that was not necessary. With the money left over they all went on a trip to the mountains together. “It was our richest year,” they say.", "am": "Look around you and say: “I have enough. Thank you.”", "ex": "Before buying something today, ask: “Is it necessary, merely pleasant, or empty?” And find one thing at home you do not need, to give away.", "pm": "What did I want today that I do not really need? For which simple things am I grateful?"}}, {"tag": ["🎁 Όσα ήδη έχεις", "🎁 What you already have"], "grc": "Οὐ δεῖ λυμαίνεσθαι τὰ παρόντα τῶν ἀπόντων ἐπιθυμίᾳ, ἀλλ᾽ ἐπιλογίζεσθαι ὅτι καὶ ταῦτα τῶν εὐκταίων ἦν.", "src": ["Βατικανά Αποφθέγματα 35", "Vatican Sayings 35"], "el": {"t": "Μη χαλάς ό,τι έχεις", "tr": "Μη χαλάς όσα έχεις επιθυμώντας όσα δεν έχεις. Θυμήσου ότι και αυτά που έχεις τώρα, κάποτε απλώς τα ευχόσουν.", "simple": "Αυτό είναι ένα από τα πιο σοφά λόγια του Επίκουρου. Ο νους μας έχει την παράξενη συνήθεια να κοιτάζει πάντα αυτό που λείπει. Έχουμε σπίτι και θέλουμε μεγαλύτερο. Έχουμε υγεία και ανησυχούμε για τις ρυτίδες. Έτσι, χάνουμε τη χαρά από όσα ήδη κρατάμε.\n\nΗ συμβουλή του: να θυμόμαστε τον καιρό που ευχόμασταν όσα έχουμε τώρα. Τη δουλειά που κάποτε ονειρευόμασταν, το παιδί που περιμέναμε, το σπίτι που μαζεύαμε λεφτά για να αγοράσουμε. Όλα αυτά ήταν κάποτε όνειρα. Τώρα είναι πραγματικότητα.", "life": "Μια κυρία παραπονιόταν συνέχεια για το μικρό της διαμέρισμα. Μια μέρα βρήκε ένα παλιό ημερολόγιο από τα φοιτητικά της χρόνια, όπου είχε γράψει: «Ένα μικρό δικό μου σπιτάκι με ένα μπαλκόνι γεμάτο λουλούδια. Μόνο αυτό ζητώ.» Βγήκε στο μπαλκόνι της με τα γεράνια και, για πρώτη φορά μετά από χρόνια, χαμογέλασε.", "am": "Πείτε: «Σήμερα θα δω όσα έχω, όχι όσα μου λείπουν.»", "ex": "Γράψτε πέντε πράγματα που έχετε σήμερα και κάποτε απλώς τα ευχόσασταν. Διαβάστε τη λίστα αργά.", "pm": "Ποιο «όνειρο του παρελθόντος» έζησα σήμερα χωρίς να το προσέξω;"}, "en": {"t": "Do not spoil what you have", "tr": "Do not spoil what you have by desiring what you do not have; remember that what you now have was once among the things you only hoped for.", "simple": "This is one of Epicurus’ wisest sayings. Our mind has the strange habit of always looking at what is missing. We have a home and want a bigger one. We have health and worry about wrinkles. So we lose the joy of what we already hold.\n\nHis advice: remember the time when we wished for what we now have. The job we once dreamed of, the child we longed for, the house we saved up to buy. All these were once dreams. Now they are reality.", "life": "A woman constantly complained about her small flat. One day she found an old diary from her student years, where she had written: “A little home of my own with a balcony full of flowers. That is all I ask.” She went out onto her balcony with its geraniums and, for the first time in years, smiled.", "am": "Say: “Today I will see what I have, not what I lack.”", "ex": "Write down five things you have today that you once only wished for. Read the list slowly.", "pm": "Which “dream of the past” did I live today without noticing?"}}, {"tag": ["💐 Ευγνωμοσύνη για το παρελθόν", "💐 Gratitude for the past"], "grc": "Θεραπευτέον τὰς συμφορὰς τῇ τῶν ἀπολλυμένων χάριτι καὶ τῷ γινώσκειν ὅτι οὐκ ἔστιν ἄπρακτον ποιῆσαι τὸ γεγονός.", "src": ["Βατικανά Αποφθέγματα 55", "Vatican Sayings 55"], "el": {"t": "Η γλυκιά ανάμνηση γιατρεύει", "tr": "Τις δυστυχίες να τις γιατρεύεις με την ευγνώμων ανάμνηση των καλών που πέρασαν, και με τη γνώση ότι ό,τι έγινε δεν μπορεί να ξεγίνει.", "simple": "Ο Επίκουρος έγραψε στην τελευταία του μέρα, ενώ πονούσε πολύ από αρρώστια, ότι ένιωθε χαρά θυμούμενος τις συζητήσεις με τους φίλους του. Για εκείνον το παρελθόν δεν ήταν μόνο πληγές. Ήταν και ένα αμπάρι γεμάτο θησαυρούς: τις καλές μέρες, τους ανθρώπους που αγαπήσαμε, τα γέλια.\n\nΚαι αυτά που ζήσαμε κανείς δεν μπορεί να μας τα πάρει. Ένα όμορφο καλοκαίρι, ένας γάμος, μια αγκαλιά από έναν γονιό που έφυγε: έγιναν, και θα είναι για πάντα δικά μας. Όταν πονάμε, μπορούμε να ανοίξουμε αυτό το αμπάρι.", "life": "Μια κυρία έχασε τον άντρα της μετά από πενήντα χρόνια γάμου. Τους πρώτους μήνες έκλαιγε μόνο για όσα έχασε. Μια μέρα άνοιξε τα παλιά άλμπουμ και άρχισε να γράφει κάτω από κάθε φωτογραφία μια ιστορία για τα εγγόνια. Λέει: «Τώρα, όταν τον σκέφτομαι, πότε κλαίω και πότε χαμογελάω. Είμαι ευγνώμων για όσα ζήσαμε.»", "am": "Κλείστε τα μάτια και θυμηθείτε μια πολύ όμορφη μέρα της ζωής σας, με όλες τις λεπτομέρειες.", "ex": "Διαλέξτε μια όμορφη ανάμνηση και μοιραστείτε την σήμερα με κάποιον: πείτε την, γράψτε την ή δείξτε μια φωτογραφία της. Αν η λύπη σας είναι πολύ βαριά, μιλήστε και με έναν άνθρωπο που εμπιστεύεστε.", "pm": "Ποια ανάμνηση με ζέστανε σήμερα; Για ποιον άνθρωπο του παρελθόντος είμαι ευγνώμων;"}, "en": {"t": "Sweet memory heals", "tr": "Heal misfortunes with the grateful remembrance of the good things that are gone, and with the knowledge that what has happened cannot be undone.", "simple": "On his last day, while in great pain from illness, Epicurus wrote that he felt joy remembering his conversations with his friends. For him the past was not only wounds. It was also a storehouse full of treasures: the good days, the people we loved, the laughter.\n\nAnd what we have lived no one can take from us. A beautiful summer, a wedding, an embrace from a parent who is gone: these happened, and will be ours forever. When we are hurting, we can open this storehouse.", "life": "A woman lost her husband after fifty years of marriage. In the first months she wept only for what she had lost. One day she opened the old albums and began writing a story under each photo for her grandchildren. She says: “Now, when I think of him, sometimes I cry and sometimes I smile. I am grateful for what we lived.”", "am": "Close your eyes and remember a very beautiful day of your life, in every detail.", "ex": "Choose a beautiful memory and share it with someone today: tell it, write it down or show a photo of it. If your sorrow is very heavy, talk to someone you trust too.", "pm": "Which memory warmed me today? Which person from the past am I grateful for?"}}, {"tag": ["🌅 Ποτέ δεν είναι αργά", "🌅 It is never too late"], "grc": "Μήτε νέος τις ὢν μελλέτω φιλοσοφεῖν, μήτε γέρων ὑπάρχων κοπιάτω φιλοσοφῶν.", "src": ["Επιστολή προς Μενοικέα 122", "Letter to Menoeceus 122"], "el": {"t": "Καμία ηλικία δεν είναι λάθος", "tr": "Ούτε ο νέος να αναβάλλει να φιλοσοφεί, ούτε ο γέρος να κουράζεται να φιλοσοφεί.", "simple": "Με αυτά τα λόγια ξεκινά η πιο γνωστή επιστολή του Επίκουρου. Λέει ότι κανείς δεν είναι πολύ νέος ούτε πολύ γέρος για να φροντίσει την ψυχή του. Όποιος λέει ότι «δεν ήρθε ακόμη η ώρα» ή ότι «πέρασε η ώρα», είναι σαν να λέει ότι δεν είναι ακόμη ή δεν είναι πια ώρα για ευτυχία.\n\nΟ νέος χρειάζεται τη σοφία για να μη φοβάται το μέλλον. Ο ηλικιωμένος τη χρειάζεται για να μένει νέος στην καρδιά, με ευγνωμοσύνη για όσα έζησε. Κάθε μέρα είναι η σωστή μέρα για να αρχίσουμε.", "life": "Ένας κύριος 80 χρονών γράφτηκε σε ένα μάθημα φιλοσοφίας για ενήλικες. Οι νεότεροι συμμαθητές του στην αρχή απορούσαν. Στο τέλος της χρονιάς εκείνος έκανε τις πιο βαθιές ερωτήσεις, και όλοι ήθελαν να κάθονται δίπλα του στο διάλειμμα. «Τώρα έχω επιτέλους χρόνο να σκεφτώ», έλεγε.", "am": "Πείτε: «Δεν είναι ούτε νωρίς ούτε αργά. Είναι η ώρα μου.»", "ex": "Κάντε σήμερα κάτι που λέγατε ότι «δεν είναι πια για την ηλικία σας», ή που λέγατε ότι «θα το κάνετε όταν μεγαλώσετε». Ένα μικρό βήμα αρκεί.", "pm": "Πού είπα σήμερα «είναι αργά» ή «είναι νωρίς»; Τι θα έκανα αν η ηλικία δεν μετρούσε;"}, "en": {"t": "No age is the wrong age", "tr": "Let no one delay the study of philosophy while young, nor grow weary of it when old.", "simple": "Epicurus’ most famous letter begins with these words. He says no one is too young or too old to care for the soul. Whoever says “the time has not yet come” or “the time has passed” is like someone saying it is not yet, or no longer, time for happiness.\n\nThe young need wisdom so as not to fear the future. The old need it to stay young at heart, grateful for what they have lived. Every day is the right day to begin.", "life": "At 80, a man enrolled in a philosophy course for adults. His younger classmates were puzzled at first. By the end of the year he was asking the deepest questions, and everyone wanted to sit next to him at the break. “Now at last I have time to think,” he used to say.", "am": "Say: “It is neither early nor late. It is my time.”", "ex": "Do something today that you said was “no longer for your age”, or that you said you would do “when you were older”. A small step is enough.", "pm": "Where did I say “it is too late” or “it is too early” today? What would I do if age did not count?"}}, {"tag": ["⚖️ Γαλήνη με δικαιοσύνη", "⚖️ Peace through justice"], "grc": "Οὐκ ἔστιν ἡδέως ζῆν ἄνευ τοῦ φρονίμως καὶ καλῶς καὶ δικαίως, οὐδὲ φρονίμως καὶ καλῶς καὶ δικαίως ἄνευ τοῦ ἡδέως.", "src": ["Κύριαι Δόξαι 5", "Principal Doctrines 5"], "el": {"t": "Η ευχάριστη ζωή είναι η καλή ζωή", "tr": "Δεν μπορείς να ζεις ευχάριστα αν δεν ζεις με φρόνηση, με ομορφιά και με δικαιοσύνη. Και δεν μπορείς να ζεις με φρόνηση, ομορφιά και δικαιοσύνη χωρίς να ζεις ευχάριστα.", "simple": "Εδώ ο Επίκουρος απαντά σε όσους τον παρεξήγησαν. Η ηδονή του δεν είναι «κάνε ό,τι θέλεις». Ο άνθρωπος που ψεύδεται, εκμεταλλεύεται ή αδικεί δεν μπορεί να έχει γαλήνη: πάντα θα φοβάται μήπως αποκαλυφθεί, πάντα θα έχει ένα βάρος μέσα του. Η καθαρή συνείδηση είναι το πιο αναπαυτικό μαξιλάρι.\n\nΚαι το αντίστροφο: όποιος ζει με σύνεση και δικαιοσύνη, ζει πιο ήσυχα. Η αρετή και η ευτυχία δεν είναι δύο δρόμοι. Είναι ο ίδιος δρόμος. Αυτό δένει όλα όσα είδαμε: γαλήνη, φιλία, το αρκετό, ευγνωμοσύνη.", "life": "Ένας μάστορας μπορούσε να χρεώσει μια ηλικιωμένη κυρία τα διπλά για μια επισκευή. Δεν θα το καταλάβαινε. Της χρέωσε το σωστό. Εκείνη τον σύστησε σε όλη τη γειτονιά, και σήμερα έχει τόση δουλειά που δεν προλαβαίνει. «Κοιμάμαι ήσυχος κάθε βράδυ», λέει, «και αυτό δεν αγοράζεται.»", "am": "Πείτε: «Σήμερα θα ζήσω έτσι που να κοιμηθώ ήσυχος απόψε.»", "ex": "Κάντε σήμερα μια πράξη δικαιοσύνης: επιστρέψτε κάτι δανεικό, ζητήστε συγγνώμη για ένα παλιό λάθος, ή πληρώστε κάτι που χρωστάτε. Και διαλέξτε από τις 7 ημέρες την άσκηση που σας βοήθησε περισσότερο, για να τη συνεχίσετε έναν μήνα.", "pm": "Είναι ήσυχη η συνείδησή μου απόψε; Τι κρατώ από τις 7 ημέρες με τον Επίκουρο;"}, "en": {"t": "The pleasant life is the good life", "tr": "It is impossible to live pleasantly without living wisely, well and justly, and impossible to live wisely, well and justly without living pleasantly.", "simple": "Here Epicurus answers those who misunderstood him. His pleasure is not “do as you like”. A person who lies, exploits or wrongs others cannot have peace: they will always fear being found out, always carry a weight inside. A clear conscience is the softest pillow.\n\nAnd the reverse: whoever lives with prudence and justice lives more peacefully. Virtue and happiness are not two roads. They are the same road. This ties together all we have seen: tranquillity, friendship, enough, gratitude.", "life": "A repairman could have charged an elderly lady double for a repair. She would never have known. He charged her the right price. She recommended him to the whole neighbourhood, and today he has so much work he can hardly keep up. “I sleep peacefully every night,” he says, “and that cannot be bought.”", "am": "Say: “Today I will live in a way that lets me sleep peacefully tonight.”", "ex": "Do an act of justice today: return something borrowed, apologise for an old mistake, or pay something you owe. And from the 7 days choose the exercise that helped you most, to continue for a month.", "pm": "Is my conscience at peace tonight? What do I keep from the 7 days with Epicurus?"}}]},
{"id": "ka", "emoji": "✨", "cls": "c-ka", "name": ["Ιμμάνουελ Καντ", "Immanuel Kant"], "withName": ["με τον Καντ", "with Kant"], "years": ["1724–1804 · Ο φιλόσοφος του έναστρου ουρανού", "1724–1804 · The philosopher of the starry sky"], "origLbl": ["Το γερμανικό κείμενο:", "The original German:"], "bio": ["<p>Ο Ιμμάνουελ Καντ γεννήθηκε στο <b>Καίνιξμπεργκ</b> της Πρωσίας, σε μια φτωχή και ευσεβή οικογένεια· ο πατέρας του έφτιαχνε σέλες και χάμουρα για άλογα. Ήταν μικρόσωμος και φιλάσθενος, και σε όλη του τη ζωή σχεδόν δεν έφυγε από την πόλη του. Κι όμως, από εκεί άλλαξε τον τρόπο που ο κόσμος σκέφτεται για τη γνώση, την ηθική και την ελευθερία.</p><p>Ζούσε με τόσο σταθερό πρόγραμμα που, όπως λέγεται, οι γείτονες ρύθμιζαν τα ρολόγια τους με τον απογευματινό του περίπατο. Ήταν όμως και φιλικός, με χιούμορ, και του άρεσε να τρώει κάθε μέρα με φίλους. Πίστευε ότι κάθε άνθρωπος έχει <b>αξιοπρέπεια</b> που δεν αγοράζεται, και ότι όλοι μπορούμε να σκεφτόμαστε με το δικό μας μυαλό. Τα λόγια του είναι γραμμένα στα <b>γερμανικά</b>, και τα δίνουμε εδώ σε απλή απόδοση.</p>", "<p>Immanuel Kant was born in <b>Königsberg</b>, Prussia, into a poor and devout family of harness-makers. He was small and sickly, and for almost his whole life he never left his city. Yet from there he changed the way the world thinks about knowledge, morality and freedom.</p><p>He lived by such a regular timetable that, it is said, his neighbours set their clocks by his afternoon walk. Yet he was also friendly and witty, and loved to dine with friends every day. He believed that every person has a <b>dignity</b> that cannot be bought, and that we can all think with our own minds. His words are written in <b>German</b>, and we give them here in plain translation.</p>"], "cheer": ["Ο Καντ έγραψε: «Από τόσο στραβό ξύλο, όσο αυτό από το οποίο είναι φτιαγμένος ο άνθρωπος, δεν μπορεί να φτιαχτεί τίποτα εντελώς ίσιο» (Ιδέα για μια γενική ιστορία, 1784). Δεν χρειάζεται να είμαστε τέλειοι· φτάνει να προσπαθούμε.", "Kant wrote: “Out of the crooked timber of humanity no straight thing was ever made” (Idea for a Universal History, 1784). We need not be perfect; it is enough to keep trying."], "fare": {"grc": "Was kann ich wissen? Was soll ich tun? Was darf ich hoffen?", "src": ["Καντ, Κριτική του καθαρού λόγου, A 805 / B 833", "Kant, Critique of Pure Reason, A 805 / B 833"], "tr": ["Τι μπορώ να γνωρίζω; Τι οφείλω να κάνω; Τι μου επιτρέπεται να ελπίζω;", "What can I know? What ought I to do? What may I hope?"]}, "days": [{"tag": ["💡 Τόλμα να σκεφτείς", "💡 Dare to think"], "grc": "Habe Mut, dich deines eigenen Verstandes zu bedienen!", "src": ["Απάντηση στο ερώτημα: Τι είναι Διαφωτισμός; (1784)", "An Answer to the Question: What is Enlightenment? (1784)"], "el": {"t": "Έχε το θάρρος να σκέφτεσαι", "tr": "Να έχεις το θάρρος να χρησιμοποιείς το δικό σου μυαλό!", "simple": "Ο Καντ έγραψε αυτή τη φράση σε ένα σύντομο άρθρο για το τι σημαίνει «διαφωτισμός». Έλεγε ότι πολλοί άνθρωποι μένουν σαν παιδιά όλη τους τη ζωή, όχι επειδή δεν έχουν μυαλό, αλλά επειδή είναι πιο βολικό να σκέφτονται άλλοι γι’ αυτούς. Ένα βιβλίο αποφασίζει τι πιστεύουμε, η τηλεόραση τι φοβόμαστε, ο γείτονας τι είναι σωστό.\n\nΤο να σκεφτόμαστε μόνοι μας θέλει θάρρος, γιατί μπορεί να κάνουμε λάθος ή να διαφωνήσουμε με τους πολλούς. Δεν σημαίνει να μην ακούμε κανέναν. Σημαίνει να ακούμε, να ρωτάμε «γιατί;» και να αποφασίζουμε με τη δική μας κρίση.", "life": "Μια κυρία λάμβανε συνέχεια μηνύματα στο κινητό με «θαυματουργές» θεραπείες και τρομακτικές ειδήσεις, και τα προωθούσε σε όλους. Ο εγγονός της τής έμαθε να ρωτά: «Ποιος το λέει; Πού είναι η απόδειξη;» Τώρα σταματά πριν προωθήσει κάτι, και συχνά ανακαλύπτει ότι ήταν ψέμα. «Νιώθω πιο ελεύθερη», λέει.", "am": "Πείτε: «Σήμερα θα σκεφτώ με το δικό μου μυαλό, ήρεμα και με θάρρος.»", "ex": "Όταν ακούσετε ή διαβάσετε σήμερα κάτι που σας εντυπωσιάζει, σταματήστε και ρωτήστε: «Ποιος το λέει; Είναι αλήθεια; Τι πιστεύω εγώ;»", "pm": "Πού σκέφτηκα σήμερα μόνος μου; Πού άφησα
