<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Αναβάθμιση σελίδας</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }

  body {
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 24px;
    color: #f2e9d8;
  }

  .bg {
    position: fixed;
    inset: 0;
    background: url('./Πύλη.jpg') center center / cover no-repeat;
    z-index: -2;
  }

  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(10, 8, 6, 0.55);
    z-index: -1;
  }

  .box {
    max-width: 460px;
  }

  h1 {
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 400;
    letter-spacing: 0.3px;
    margin-bottom: 18px;
    text-shadow: 0 2px 12px rgba(0,0,0,.7);
  }

  p {
    font-size: 1.05rem;
    line-height: 1.7;
    opacity: .92;
    text-shadow: 0 2px 10px rgba(0,0,0,.7);
  }

  .divider {
    width: 40px;
    height: 1px;
    background: rgba(242, 233, 216, 0.35);
    margin: 26px auto;
  }

  p.en {
    font-style: italic;
    opacity: .8;
  }

  .flame {
    width: 10px;
    height: 16px;
    margin: 30px auto 0;
    background: radial-gradient(ellipse at bottom, #ffd98a 0%, #e8a33d 55%, transparent 80%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: flicker 1.8s infinite ease-in-out;
  }

  @keyframes flicker {
    0%, 100% { transform: scale(1) translateY(0); opacity: .85; }
    50% { transform: scale(1.08, 1.15) translateY(-1px); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .flame { animation: none; }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="box">
    <h1>Η σελίδα αναβαθμίζεται</h1>
    <p>Κάνουμε μερικές αλλαγές για να γίνει ακόμα καλύτερη.<br>
    Θα είμαστε ξανά κοντά σας σε λίγο — ευχαριστούμε για την υπομονή σας.</p>

    <div class="divider"></div>

    <p class="en">We're making a few improvements.<br>
    We'll be back with you shortly — thank you for your patience.</p>

    <div class="flame"></div>
  </div>
</body>
</html>
