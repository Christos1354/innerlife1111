<!-- ================= STYLE ================= -->
<style>

/* ====== BACKGROUND ====== */
body{
  margin:0;
  font-family:Arial;
  background-image:url('COSMOS.jpg');
  /* ⬇️ ΑΛΛΑΓΗ: από contain σε cover για να γεμίζει όλη την οθόνη */
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  /* ⬇️ ΠΡΟΣΘΗΚΗ: να μην επαναλαμβάνεται */
  background-repeat:no-repeat;
  color:#FFD700;
  /* ⬇️ ΠΡΟΣΘΗΚΗ: ελάχιστο ύψος για να καλύπτει όλη την οθόνη */
  min-height:100vh;
}

/* overlay */
body::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.2);
  z-index:-1;
}

/* SEARCH */
.search-wrapper{
  position:relative;
  width:90%;
  max-width:400px;
  margin:20px auto;
}

#search{
  width:100%;
  padding:12px 45px 12px 15px;
  border-radius:12px;
  border:none;
  font-size:16px;
  box-sizing:border-box;
}

#clearSearch{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  font-size:18px;
  color:#555;
  user-select:none;
}

#clearSearch:hover{
  color:black;
}

.highlight{
  background:yellow !important;
  color:black !important;
  padding:2px 4px;
  border-radius:4px;
  font-weight:bold;
}

/* ====== TRANSLATE WRAPPER ====== */
.translate-wrapper {
  width: 90%;
  max-width: 400px;
  margin: 0 auto 20px auto;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  background: rgba(0, 0, 0, 0.5);
  border-radius: 12px;
  padding: 10px 0;
  border: 1px solid rgba(255, 215, 0, 0.3);
}

.translate-wrapper select {

  color: #FFD700;
  border: 1px solid rgba(255, 215, 0, 0.4);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  cursor: pointer;
  max-width: 200px;
}

.translate-wrapper select option {

}

.translate-wrapper button {

/* ΚΟΥΜΠΙ ΔΙΑΛΟΓΙΣΜΟΥ */

  border-radius:12px;

  width:100%;
  height:100%;

#meditation button {

  body {

    background-repeat:no-repeat;
    background-position:top center;
    background-attachment:scroll;
    background-color:#05010f;
  }

}

<script>

/* ==================================================
   TRANSLATE FUNCTIONS
================================================== */

let originalHTML = '';
let isTranslated = false;

function translatePage() {
  const lang = document.getElementById('translateLang').value;
  
  if (lang === 'el') {
    resetTranslation();
    return;
  }
  
  if (!originalHTML) {
    const container = document.getElementById('content');
    originalHTML = container.innerHTML;
  }
  
  const elementsToTranslate = [];
  
  document.querySelectorAll('.box h3, .box .answer, .box p, .box li, .box ul, #content h2').forEach(el => {
    elementsToTranslate.push(el);
  });
  
  const backBtn = document.querySelector('.back-btn');
  if (backBtn) elementsToTranslate.push(backBtn);
  
  document.querySelectorAll('#meditation .translate-me').forEach(el => {
    elementsToTranslate.push(el);
  });
  
  let translatedCount = 0;
  const totalElements = elementsToTranslate.length;
  
  elementsToTranslate.forEach((el, index) => {
    const text = el.innerText;
    if (text && text.trim().length > 0 && !el.querySelector('ul, li, p, strong, em')) {
      translateText(text, lang, function(translated) {
        if (translated) {
          el.innerHTML = translated;
        }
        translatedCount++;
        if (translatedCount === totalElements) {
          isTranslated = true;
          const searchInput = document.getElementById('search');
          if (searchInput && searchInput.value.trim() !== '') {
            doErotimataSearch(searchInput.value.trim());
          }
        }
      });
    } else if (el.querySelector('ul, li, p, strong, em')) {
      translateComplexElement(el, lang, function() {
        translatedCount++;
        if (translatedCount === totalElements) {
          isTranslated = true;
          const searchInput = document.getElementById('search');
          if (searchInput && searchInput.value.trim() !== '') {
            doErotimataSearch(searchInput.value.trim());
          }
        }
      });
    } else {
      translatedCount++;
      if (translatedCount === totalElements) {
        isTranslated = true;
      }
    }
  });
}

function translateComplexElement(element, targetLang, callback) {
  const walker = document.createTreeWalker(
    element,
    NodeFilter.SHOW_TEXT,
    {
      acceptNode: function(node) {
        if (node.textContent.trim() === '') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    }
  );
  
  const textNodes = [];
  let node = walker.nextNode();
  while (node) {
    textNodes.push(node);
    node = walker.nextNode();
  }
  
  if (textNodes.length === 0) {
    callback();
    return;
  }
  
  let completed = 0;
  
  textNodes.forEach((textNode, index) => {
    const text = textNode.textContent;
    if (text && text.trim().length > 0) {
      translateText(text, targetLang, function(translated) {
        if (translated) {
          textNode.textContent = translated;
        }
        completed++;
        if (completed === textNodes.length) {
          callback();
        }
      });
    } else {
      completed++;
      if (completed === textNodes.length) {
        callback();
      }
    }
  });
}

function translateText(text, targetLang, callback) {
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=el&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
  
  fetch(url)
    .then(response => response.json())
    .then(data => {
      if (data && data[0]) {
        let translated = '';
        data[0].forEach(item => {
          translated += item[0];
        });
        callback(translated);
      } else {
        callback(null);
      }
    })
    .catch(error => {
      console.error('Translation error:', error);
      callback(null);
    });
}
function resetTranslation() {
  if (originalHTML) {
    document.getElementById('content').innerHTML = originalHTML;
    document.querySelector('.back-btn').innerHTML = '⬅ Πίσω στις Πύλες';
    document.querySelector('#meditation h2').innerHTML = 
      'Πάρε 3 βαθιές αναπνοές...<br>Μείνε ακίνητος...<br>Άφησε τα όλα να ηρεμήσουν.<br>«Η πιο βαθιά ηρεμία κρύβεται σε μια βαθιά ανάσα.»';
    document.querySelector('#meditation button').innerHTML = 'Έξοδος';
    isTranslated = false;
    
    // ⬇️ ΠΡΟΣΘΗΚΗ: Επαναφορά της γλώσσας στα Ελληνικά
    document.getElementById('translateLang').value = 'el';
    
    const searchInput = document.getElementById('search');
    if (searchInput && searchInput.value.trim() !== '') {
      doErotimataSearch(searchInput.value.trim());
    }
  }
}

/* ==================================================
   SEARCH - ΤΕΛΙΚΗ ΕΚΔΟΣΗ (με υποστήριξη αναζήτησης χωρίς τόνους)
================================================== */

/* ==================================================
   SEARCH — dropdown λίστα αποτελεσμάτων, ίδια λογική με το index.html:
   καθώς πληκτρολογείς εμφανίζεται λίστα με προεπισκόπηση, και όταν πατάς
   πάνω σε ένα αποτέλεσμα σε πάει ΚΑΤΕΥΘΕΙΑΝ εκεί με highlight.
================================================== */

function _stripAccents(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function _stripHtml(s){
  return (s||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
}

function setupSearch() {
  const searchInput = document.getElementById('search');
  const clearBtn = document.getElementById('clearSearch');
  let searchTimeout = null;

  searchInput.addEventListener('input', function() {
    clearTimeout(searchTimeout);
    const value = this.value.trim();
    searchTimeout = setTimeout(() => { doErotimataSearch(value); }, 250);
  });

  clearBtn.addEventListener('click', function() {
    searchInput.value = '';
    doErotimataSearch('');
    searchInput.focus();
  });

  document.addEventListener('click', function(e){
    const resultsEl = document.getElementById('search-results');
    if(resultsEl && !searchInput.contains(e.target) && !resultsEl.contains(e.target)){
      resultsEl.style.display = 'none';
    }
  });
}

function doErotimataSearch(query){
  const resultsEl = document.getElementById('search-results');
  const term = _stripAccents((query||'').trim());

  if (term.length < 2) { resultsEl.style.display='none'; resultsEl.innerHTML=''; return; }

  const results = [];
  data.forEach((item, idx) => {
    const qText = _stripAccents(item.q||'');
    const aText = _stripAccents(_stripHtml(item.a||''));
    const catText = _stripAccents(item.category||'');
    if (qText.includes(term) || aText.includes(term) || catText.includes(term)) {
      const fullA = _stripHtml(item.a||'');
      let preview = '';
      const pos = aText.indexOf(term);
      if (pos >= 0) {
        const s = Math.max(0, pos-30), e = Math.min(fullA.length, pos+70);
        preview = (s>0?'…':'') + fullA.substring(s,e) + (e<fullA.length?'…':'');
      } else {
        preview = fullA.substring(0,70) + (fullA.length>70?'…':'');
      }
      results.push({ idx, category:item.category, q:item.q, preview });
    }
  });

  if (results.length === 0) {
    resultsEl.innerHTML = '<div style="padding:14px;color:#e0c060;text-align:center;font-size:13px;">🔍 Δεν βρέθηκε αποτέλεσμα</div>';
    resultsEl.style.display = 'block';
    return;
  }

  const re = new RegExp('(' + query.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  let h = '';
  results.forEach(r => {
    h += '<div onclick="eroOpenResult(' + r.idx + ')" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(255,215,0,0.15);" '
      + 'onmouseover="this.style.background=\'rgba(255,215,0,0.12)\'" onmouseout="this.style.background=\'transparent\'">'
      + '<div style="color:#FFD700;font-size:11px;letter-spacing:0.06em;margin-bottom:2px;">' + r.category + '</div>'
      + '<div style="color:#fffbe0;font-size:13px;font-weight:600;">' + r.q + '</div>';
    if (r.preview) {
      h += '<div style="color:#c9b783;font-size:11px;margin-top:3px;">'
        + r.preview.replace(re, '<mark style="background:#FFD700;color:#000;border-radius:2px;padding:0 2px;">$1</mark>')
        + '</div>';
    }
    h += '</div>';
  });
  resultsEl.innerHTML = h;
  resultsEl.style.display = 'block';
}

function eroOpenResult(idx){
  document.getElementById('search-results').style.display = 'none';
  document.getElementById('search').value = '';

  const box = document.querySelector('.box[data-index="' + idx + '"]');
  if (!box) return;

  document.querySelectorAll('.box.search-match').forEach(b => {
    b.classList.remove('search-match');
    b.style.border = 'none';
    b.style.boxShadow = 'none';
  });

  box.classList.add('search-match');
  box.style.border = '3px solid #FFD700';
  box.style.boxShadow = '0 0 40px rgba(255, 215, 0, 0.4)';

  box.scrollIntoView({ behavior:'smooth', block:'start' });

  setTimeout(() => {
    box.classList.remove('search-match');
    box.style.border = 'none';
    box.style.boxShadow = 'none';
  }, 4000);
}

/* ==================================================
   ΕΡΩΤΗΜΑΤΑ (data - πλήρης)
================================================== */

const data = [

{
  "category": "Γνώση",
  "q": "Η Σιωπή – 7 Απλά Βήματα προς τον Θεό",

ω τι να κάνω στη ζωή μου. Δείξε μου τον δρόμο.»</li><li>«Έχω πρόβλημα με… [όνομα ανθρώπου, χρήματα, υγεία]. Βοήθησέ με.»</li><li>«Αν δεν ξέρω τι ακριβώς να ζητήσω, πες μου τι χρειάζομαι για να μεγαλώσω πνευματικά.»</li></ul><p>Μπορείς επίσης να προσευχηθείς για άλλους:</p><ul><li>«Θεέ μου, προσεύχομαι για τον… που δεν ξέρει πώς να ζητήσει βοήθεια.»</li><li>«Δώσε του την ηρεμία, τη δύναμη και την αγάπη Σου.»</li><li>«Δώσε μου την υπομονή να τον στηρίξω.»</li></ul><p><em><strong>Γιατί; Όταν ζητάς βοήθεια, ανοίγεις την πόρτα για λύσεις που δεν έβλεπες πριν</strong></em></p><p><strong>Βήμα 5: Ευχαρίστησε για Όσα Έχεις</strong></p><p>Στρέψε την προσοχή σου στα καλά και πες ευχαριστώ για:</p><ul><li>τη ζωή, τον αέρα, το φως, την υγεία.</li><li>την οικογένειά σου και τους φίλους σου.</li><li>την τροφή, το σπίτι και την ασφάλεια.</li><li>την αγάπη που έχεις δεχθεί ή έχεις δώσει.</li></ul><p>Μπορείς να πεις:</p><ul><li>«Ευχαριστώ Θεέ μου για τη ζωή μου, ακόμα και όταν είναι δύσκολη.»</li><li>«Ευχαριστώ που έχω οικογένεια που με στηρίζει.»</li><li>«Ευχαριστώ που έχω τη δύναμη να ζω και να αγαπώ.»</li><li>«Ευχαριστώ για την ησυχία που έχω τώρα.»</li><li>«Ευχαριστώ για… [όνομα ανθρώπου], για τη βοήθειά του.»</li><li>«Ευχαριστώ που έχω έναν Θεό που με ξέρει και με αγαπά.»</li></ul><p><em><strong>Γιατί; Η ευγνωμοσύνη σε μεταφέρει από την έλλειψη στην αφθονία.</strong></em></p><p><strong>Βήμα 6: Άκου Σιωπηλά</strong></p><p>Τώρα κλείνεις το στόμα και ανοίγεις την καρδιά. Αφιέρωσε 2–3 λεπτά για να ακούς μέσα σου. Μην περιμένεις μια δυνατή φωνή, αλλά μια ήσυχη, εσωτερική ένδειξη.</p><ul><li>«Θεέ μου, τώρα άκουσέ με… και άσε με να ακούσω Εσένα.»</li><li>«Μίλησέ μου μέσα από την ησυχία.»</li></ul><p>Η απάντηση συχνά έρχεται αργότερα, ξαφνικά, ή μέσα από μια λέξη της ημέρας σου ή από ένα βιβλίο.</p><p><em><strong>Γιατί; Ο Θεός συχνά μιλάει μέσα από την ησυχία, όχι τη φασαρία.</em></strong></p><p><strong>Βήμα 7: Δέξου την Αγκαλιά</strong></p><p>Φαντάσου την πιο όμορφη, ζεστή αγκαλιά που /* ==================================================
   RENDER
================================================== */

function render(){

  const container = document.getElementById("content");

  container.innerHTML = "";

  const categories = {};

  data.forEach((item, origIdx)=>{

    if(!categories[item.category]){
      categories[item.category] = [];
    }

    categories[item.category].push({ item, origIdx });

  });

  for(let cat in categories){

    container.innerHTML += `
      <h2 style="text-align:center;" class="translate-me">
        ${cat}
      </h2>
    `;

    categories[cat].forEach(entry=>{
      const item = entry.item;

      container.innerHTML += `
        <div class="box" data-index="${entry.origIdx}">
          <h3 class="translate-me">${item.q}</h3>
          <div class="answer translate-me">
            ${item.a}
          </div>
          <button class="meditate-btn">
            🧘 Διαλογισμός
          </button>
        </div>
      `;

    });

  }

  const containerEl = document.getElementById('content');
  if (!originalHTML) {
    originalHTML = containerEl.innerHTML;
  }

}

document.addEventListener("click",function(e){

  if(e.target.classList.contains("meditate-btn")){

    document.getElementById("meditation").style.display="flex";

  }

});

function closeMeditation(){

  document.getElementById("meditation").style.display="none";

}


/* ==================================================
   START

render();
